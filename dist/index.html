<title>Master Bostadsfilm</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Master Bostadsfilm Editor — dark neutral pro editing UI */
:root{
  --accent:#6d7266;
  --accent-hi:#8b9080;
  --accent-dim:#3d413a;
  --bg-0:#0e0f10;
  --bg-1:#141618;
  --bg-2:#1a1d1f;
  --bg-3:#212528;
  --bg-4:#2a2f33;
  --line:#31363a;
  --line-soft:#262b2e;
  --fg-0:#e8eaea;
  --fg-1:#b6bbbc;
  --fg-2:#7e8587;
  --fg-3:#575d60;
  --warn:#c2903f;
  --danger:#b4574f;
  --ok:#6d8f68;
  --track-h:64px;
  --radius:3px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg-0);color:var(--fg-0);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:#33383c;border:2px solid var(--bg-1);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#464c50}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);
}
#mid{flex:1;display:flex;min-height:0}
#leftpanel{width:356px;flex:0 0 356px;display:flex;background:var(--bg-1);border-right:1px solid var(--line);min-height:0}
#tabrail{width:68px;flex:0 0 68px;background:var(--bg-2);border-right:1px solid var(--line);padding:6px 0;overflow-y:auto}
#panelbody{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-0)}
#inspector{width:296px;flex:0 0 296px;background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
#timelinewrap{flex:0 0 258px;background:var(--bg-1);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:120px}
#tlresizer{height:5px;cursor:ns-resize;background:var(--bg-2);border-bottom:1px solid var(--line)}
#tlresizer:hover{background:var(--accent-dim)}

/* ---------- generic controls ---------- */
.btn{
  height:26px;padding:0 9px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--fg-1);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{background:var(--bg-4);color:var(--fg-0);border-color:#3d4348}
.btn:active{background:#191c1e}
.btn:focus-visible,.tab:focus-visible,.seg>button:focus-visible,.mitem:focus-visible,.preset-card:focus-visible{
  outline:2px solid var(--accent-hi);outline-offset:1px;color:var(--fg-0);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#10120f;font-weight:600}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.on{background:var(--accent-dim);border-color:var(--accent);color:#dfe4d8}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.btn.icon{width:26px;padding:0;justify-content:center}
.btn.icon.sm{width:22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger:hover{background:#43302e;border-color:var(--danger);color:#e5b7b3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg-3)}
.seg>button{height:24px;padding:0 8px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--fg-2);cursor:pointer;font-size:11px}
.seg>button:last-child{border-right:0}
.seg>button.on{background:var(--accent-dim);color:#dfe4d8}
.seg>button:hover:not(.on){background:var(--bg-4);color:var(--fg-0)}
select,input[type=text],input[type=number]{
  height:24px;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--fg-0);padding:0 6px;min-width:0;
}
select:focus,input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
label{color:var(--fg-1)}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.spacer{flex:1}
.tag{
  display:inline-block;padding:1px 5px;border-radius:2px;background:var(--bg-4);
  color:var(--fg-2);font-size:10px;letter-spacing:.02em;
}
.tag.accent{background:var(--accent-dim);color:#cfd6c6}
.tag.warn{background:#3a2f1c;color:#d8b273}
.tag.danger{background:#3a2523;color:#dda49e}
.tag.ok{background:#233022;color:#a2c69c}
.hint{color:var(--fg-3);font-size:11px;line-height:1.5}
.mono{font-family:var(--mono);font-size:11px}
h3.sectitle{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);
  font-weight:600;padding:11px 12px 5px;
}
.panelhead{
  flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:6px;
}
.panelhead .title{font-size:12px;font-weight:600;letter-spacing:.02em}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.row{display:flex;align-items:center;gap:6px;padding:4px 12px}
.row.wrap{flex-wrap:wrap}
.row>label.lbl{flex:0 0 96px;color:var(--fg-2);font-size:11px}
.divider{height:1px;background:var(--line-soft);margin:8px 0}
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:36px 20px;text-align:center;color:var(--fg-3);
}

/* ---------- tab rail ---------- */
.tab{
  width:100%;padding:9px 4px;background:transparent;border:0;border-left:2px solid transparent;
  color:var(--fg-2);cursor:pointer;display:block;text-align:center;font-size:11px;letter-spacing:.01em;
}
.tab:hover{background:var(--bg-3);color:var(--fg-0)}
.tab.on{background:var(--bg-1);border-left-color:var(--accent);color:#e6ebe0}
.tab .dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto -2px}

/* ---------- sliders ---------- */
.sl{display:flex;align-items:center;gap:8px;padding:3px 12px}
.sl .name{flex:0 0 112px;color:var(--fg-1);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl input[type=range]{flex:1;min-width:40px;-webkit-appearance:none;background:transparent;height:16px;cursor:pointer}
.sl input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--bg-4);border-radius:2px}
.sl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;
  background:var(--fg-1);border:1px solid #0c0d0e;
}
.sl input[type=range]:hover::-webkit-slider-thumb{background:var(--accent-hi)}
.sl input[type=range]::-moz-range-track{height:3px;background:var(--bg-4);border-radius:2px}
.sl input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg-1);border:1px solid #0c0d0e}
.sl .val{flex:0 0 46px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--fg-2)}
.sl.mod .name{color:var(--accent-hi)}
.sl .reset{opacity:0;flex:0 0 12px;cursor:pointer;color:var(--fg-3);font-size:12px;line-height:1;background:none;border:0}
.sl:hover .reset{opacity:1}
.sl .reset:hover{color:var(--fg-0)}

/* ---------- media library ---------- */
#dropzone{border:1px dashed var(--line);margin:8px 12px;border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;color:var(--fg-2)}
#dropzone:hover{border-color:var(--accent);color:var(--fg-0);background:var(--bg-2)}
body.dragging #dropzone{border-color:var(--accent);background:var(--accent-dim)}
#dragveil{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(14,15,16,.86);border:2px dashed var(--accent);font-size:16px;color:var(--fg-0);
}
body.dragging #dragveil{display:flex}
.mediagrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px 12px}
.mediagrid.list{grid-template-columns:1fr;gap:3px}
.mitem{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative}
.mitem:hover{border-color:#41474b}
.mitem.sel{border-color:var(--accent);background:var(--bg-3)}
.mitem .thumb{width:100%;aspect-ratio:16/9;background:#0a0b0c;object-fit:cover;display:block}
.mitem .meta{padding:4px 6px}
.mitem .nm{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-0)}
.mitem .sub{font-size:10px;color:var(--fg-3);font-family:var(--mono);display:flex;gap:6px;flex-wrap:wrap}
.mitem .badges{position:absolute;top:3px;left:3px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 6px)}
.mitem .dur{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.72);padding:1px 4px;border-radius:2px;font-family:var(--mono);font-size:10px;color:#dfe2e2}
.mitem .acts{position:absolute;bottom:3px;right:3px;display:none;gap:3px}
.mitem:hover .acts{display:flex}
.mitem.list-mode{display:flex;align-items:center;gap:7px;padding:4px}
.mitem.list-mode .thumb{width:66px;flex:0 0 66px;aspect-ratio:16/9}
.mitem.list-mode .dur,.mitem.list-mode .badges{position:static}
.mitem.list-mode .meta{flex:1;min-width:0;padding:0}
.mitem.audio .thumb{display:flex;align-items:center;justify-content:center;color:var(--fg-3)}

/* ---------- preview ---------- */
#previewarea{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 10px 0}
#stage{
  flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;
  background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
#stageinner{position:relative;background:#000;box-shadow:0 0 0 1px #000}
#outcanvas{display:block;width:100%;height:100%}
#stageoverlay{position:absolute;inset:0;pointer-events:none}
#emptyprev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg-3);background:var(--bg-0)}
#splitbar{position:absolute;top:0;bottom:0;width:11px;margin-left:-5px;cursor:ew-resize;display:none;z-index:5}
#splitbar::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#fff;opacity:.85}
#splitbar .h{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.6)}
body.cmp #splitbar{display:block}
.cmplabel{position:absolute;top:6px;padding:2px 6px;background:rgba(0,0,0,.6);font-size:10px;letter-spacing:.06em;color:#e8eaea;border-radius:2px}
#transportbar{flex:0 0 38px;display:flex;align-items:center;gap:6px;padding:0 4px}
#timecode{font-family:var(--mono);font-size:12px;color:var(--fg-0)}
#timecode .tot{color:var(--fg-3)}
#scrub{flex:1;-webkit-appearance:none;background:transparent;height:16px;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:3px;background:var(--bg-4);border-radius:2px}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-3.5px;border-radius:50%;background:var(--accent-hi)}

/* ---------- timeline ---------- */
#tltoolbar{flex:0 0 30px;display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid var(--line-soft);background:var(--bg-2)}
#tlmain{flex:1;display:flex;min-height:0}
#tlgutter{width:66px;flex:0 0 66px;background:var(--bg-2);border-right:1px solid var(--line);overflow:hidden}
#tlgutter .gspacer{height:22px;border-bottom:1px solid var(--line)}
#tlgutter .glabel{
  border-bottom:1px solid var(--line-soft);font-size:10px;color:var(--fg-3);
  padding:5px 7px;letter-spacing:.06em;text-transform:uppercase;
}
#tlgutter .glabel.video{height:var(--track-h)}
#tlgutter .glabel.music{height:44px}
#tlgutter .glabel.text{height:30px}
#tlscroll{flex:1;overflow:auto;position:relative}
#tlcontent{position:relative;min-width:100%}
#ruler{height:22px;position:relative;z-index:12;background:var(--bg-2);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
#ruler .tick{position:absolute;top:0;bottom:0;border-left:1px solid #33393d}
#ruler .tick span{position:absolute;left:3px;top:4px;font-size:9.5px;color:var(--fg-3);font-family:var(--mono)}
#ruler .tick.minor{border-left-color:#262b2e}
.tltrack{position:relative;border-bottom:1px solid var(--line-soft);background:var(--bg-1)}
.tltrack.video{height:var(--track-h)}
.tltrack.music{height:44px;background:#131618}
.tltrack.text{height:30px;background:#131618}
.clip{
  position:absolute;top:2px;bottom:2px;background:var(--bg-3);border:1px solid #3a4045;border-radius:2px;
  overflow:hidden;cursor:grab;min-width:6px;
}
.clip:hover{border-color:#4d5459}
.clip.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.clip.dragging{opacity:.55;cursor:grabbing;z-index:20}
.clip .cthumb{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.5}
.clip .cbody{position:relative;padding:3px 5px;height:100%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.clip .cname{font-size:10.5px;color:#eceeee;text-shadow:0 1px 2px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .cbadges{display:flex;gap:3px;flex-wrap:wrap}
.clip .cdur{font-family:var(--mono);font-size:10px;color:#cdd1d1;text-shadow:0 1px 2px #000}
.clip .grip{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(0,0,0,.35);z-index:3}
.clip .grip:hover{background:var(--accent)}
.clip .grip.l{left:0}.clip .grip.r{right:0}
.clip.music{background:#1c2320;border-color:#2f3a34}
.clip.music canvas{position:absolute;inset:0;width:100%;height:100%}
.clip.text{background:#22201c;border-color:#3a352d}
.clip.offbeat{outline:1px dashed var(--warn);outline-offset:-3px}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:#e0574f;z-index:30;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-5px;border-left:5.5px solid transparent;border-right:5.5px solid transparent;border-top:8px solid #e0574f}
.snapline{position:absolute;top:0;bottom:0;width:1px;background:var(--accent-hi);z-index:29;pointer-events:none;display:none}
.beatmark{position:absolute;top:0;bottom:0;width:1px;background:rgba(160,180,150,.5);z-index:4;pointer-events:none}
.trans{
  position:absolute;top:3px;transform:translateX(-50%);height:17px;padding:0 5px;z-index:9;
  background:#2b3033;border:1px solid #454b50;border-radius:11px;font-size:9.5px;color:#c9cecf;
  display:flex;align-items:center;cursor:pointer;white-space:nowrap;
}
.trans:hover{border-color:var(--accent);color:#fff}
.trans.cut{opacity:.5;padding:0 3px}
.clip .grip{z-index:12}

/* ---------- stabilization ---------- */
.report{padding:2px 12px 8px}
.rrow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.rrow .k{flex:0 0 100px;color:var(--fg-2);font-size:11px;line-height:1.35}
.rrow .v{flex:1;font-size:11px;color:var(--fg-0)}
.meter{flex:1;height:4px;background:var(--bg-4);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent-hi)}
.meter i.warn{background:var(--warn)}
.meter i.danger{background:var(--danger)}
.preset-card{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:3px 12px;border-radius:var(--radius);
  background:var(--bg-2);border:1px solid var(--line-soft);cursor:pointer;
}
.preset-card:hover{border-color:#41474b;background:var(--bg-3)}
.preset-card.on{border-color:var(--accent);background:var(--bg-3)}
.preset-card .pn{font-size:11.5px;color:var(--fg-0)}
.preset-card .pd{font-size:10px;color:var(--fg-3);line-height:1.35}
.progress{height:3px;background:var(--bg-4);border-radius:2px;overflow:hidden;margin:6px 12px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .12s linear}

/* filter swatches */
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px 12px}
.fsw{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:2px;padding:4px;cursor:pointer;text-align:center}
.fsw:hover{border-color:#41474b}
.fsw.on{border-color:var(--accent);background:var(--bg-3)}
.fsw canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:1px;background:#000}
.fsw span{display:block;font-size:9.5px;color:var(--fg-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsw.on span{color:var(--fg-0)}

/* ---------- modal / toast ---------- */
#modalwrap{position:fixed;inset:0;background:rgba(8,9,10,.72);z-index:300;display:none;align-items:center;justify-content:center}
#modalwrap.on{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--line);border-radius:4px;min-width:380px;max-width:640px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.modal header{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
.modal .body{padding:12px 14px;overflow-y:auto}
.modal footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end}
#toasts{position:fixed;right:12px;bottom:12px;z-index:400;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--bg-3);border:1px solid var(--line);border-left:2px solid var(--accent);padding:7px 11px;border-radius:2px;font-size:11.5px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast .t2{color:var(--fg-2);font-size:10.5px;margin-top:2px;line-height:1.45}

/* tooltips */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  background:#0a0b0c;border:1px solid var(--line);color:var(--fg-0);font-size:10.5px;padding:4px 7px;
  border-radius:2px;white-space:pre-line;z-index:500;pointer-events:none;
  max-width:260px;width:max-content;box-shadow:0 6px 18px rgba(0,0,0,.55);
}
.scroll [data-tip]:hover::after,#panelbody [data-tip]:hover::after,#inspector [data-tip]:hover::after{
  left:0;transform:none;max-width:236px;
}
[data-tip].tipup:hover::after{top:auto;bottom:calc(100% + 5px)}
.busy{position:relative;pointer-events:none;opacity:.6}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important}
}

/* ---------- Motion ---------- */
#motionview{
  position:fixed;inset:0;z-index:150;display:none;flex-direction:column;align-items:center;
  background:var(--bg-0);overflow-y:auto;padding:34px 20px 60px;
}
.mo-close{
  position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;
  background:var(--bg-3);border:1px solid var(--line);color:var(--fg-1);cursor:pointer;font-size:13px;
}
.mo-close:hover{background:var(--bg-4);color:var(--fg-0)}
.mo-shell{width:100%;max-width:760px;display:flex;flex-direction:column;gap:16px}
.mo-steps{display:flex;gap:6px;justify-content:center;margin-bottom:2px}
.mo-step{
  display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:14px;
  background:var(--bg-2);border:1px solid var(--line-soft);color:var(--fg-3);font-size:11.5px;
}
.mo-step .n{
  width:17px;height:17px;border-radius:50%;background:var(--bg-4);color:var(--fg-2);
  display:flex;align-items:center;justify-content:center;font-size:10px;
}
.mo-step.on{border-color:var(--accent);color:var(--fg-0)}
.mo-step.on .n{background:var(--accent);color:#10120f;font-weight:700}
.mo-step.past{color:var(--fg-2)}
.mo-step.past .n{background:var(--accent-dim);color:#cfd6c6}
.mo-card{background:var(--bg-1);border:1px solid var(--line);border-radius:6px;padding:22px 24px}

<script>
/* ===== 00-utils.js ===== */
/* ============================================================
   00 — Utilities
   ============================================================ */
const U = (() => {
  const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const round = (v, d = 2) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };

  function tc(sec, withFrames = true, fps = 30) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    if (!withFrames) return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const f = Math.floor((sec % 1) * fps);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
  }
  const dur = s => (!isFinite(s) ? '–' : s < 60 ? s.toFixed(1) + 's' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`);
  const bytes = b => {
    if (b == null || !isFinite(b)) return '–';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
  };

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  }
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
  const clone = o => JSON.parse(JSON.stringify(o));

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  const raf = () => new Promise(r => requestAnimationFrame(r));
  const idle = () => new Promise(r => (window.requestIdleCallback || setTimeout)(r, 1));

  /* --- tiny emitter --- */
  class Emitter {
    constructor() { this.m = new Map(); }
    on(e, f) { (this.m.get(e) || this.m.set(e, []).get(e)).push(f); return () => this.off(e, f); }
    off(e, f) { const a = this.m.get(e); if (a) a.splice(a.indexOf(f) >>> 0, 1); }
    emit(e, ...d) { (this.m.get(e) || []).forEach(f => { try { f(...d); } catch (err) { console.error('[' + e + ']', err); } }); }
  }

  /* --- toasts --- */
  function toast(title, detail, kind) {
    const host = $('#toasts');
    const n = el('div', { class: 'toast' + (kind ? ' ' + kind : '') }, el('div', { text: title }), detail ? el('div', { class: 't2', text: detail }) : null);
    host.append(n);
    setTimeout(() => { n.style.transition = 'opacity .3s'; n.style.opacity = '0'; setTimeout(() => n.remove(), 320); }, kind === 'err' ? 8000 : 4200);
    return n;
  }
  const errToast = (ctx, e) => { console.error(ctx, e); toast(ctx, (e && (e.message || e.name)) || String(e), 'err'); };

  /* --- modal --- */
  function modal({ title, body, actions, wide }) {
    const wrap = $('#modalwrap'), m = $('#modal');
    clear(m);
    if (wide) m.style.minWidth = '620px'; else m.style.minWidth = '380px';
    m.append(el('header', {}, title));
    const b = el('div', { class: 'body' }); if (body) b.append(body); m.append(b);
    const close = () => { wrap.classList.remove('on'); clear(m); };
    const f = el('footer');
    (actions || [{ label: 'Stäng' }]).forEach(a => {
      f.append(el('button', {
        class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''),
        onclick: () => { const r = a.onclick && a.onclick(); if (r !== false) close(); }
      }, a.label));
    });
    m.append(f);
    wrap.classList.add('on');
    wrap.onclick = e => { if (e.target === wrap) close(); };
    return { close, body: b };
  }

  /* --- controls --- */
  function slider(name, value, min, max, step, onInput, opts = {}) {
    const fmt = opts.fmt || (v => (step >= 1 ? v.toFixed(0) : v.toFixed(2)));
    const def = opts.def != null ? opts.def : 0;
    const val = el('span', { class: 'val', text: fmt(value) });
    const inp = el('input', { type: 'range', min, max, step, value });
    const wrap = el('div', { class: 'sl' + (Math.abs(value - def) > 1e-6 ? ' mod' : '') },
      el('span', { class: 'name', text: name, title: name }), inp, val,
      el('button', { class: 'reset', title: 'Återställ', onclick: () => { inp.value = def; inp.dispatchEvent(new Event('input')); } }, '⨯'));
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      val.textContent = fmt(v);
      wrap.classList.toggle('mod', Math.abs(v - def) > 1e-6);
      onInput(v);
    });
    wrap.setValue = v => { inp.value = v; val.textContent = fmt(v); wrap.classList.toggle('mod', Math.abs(v - def) > 1e-6); };
    if (opts.tip) { wrap.setAttribute('data-tip', opts.tip); wrap.classList.add('tipup'); }
    return wrap;
  }
  function check(label, value, onChange, tip) {
    const inp = el('input', { type: 'checkbox', onchange: () => onChange(inp.checked) });
    inp.checked = !!value;
    const r = el('label', { class: 'row', style: { cursor: 'pointer', padding: '3px 12px' } }, inp, el('span', { text: label, style: { fontSize: '11px' } }));
    if (tip) { r.setAttribute('data-tip', tip); r.classList.add('tipup'); }
    r.setValue = v => { inp.checked = !!v; };
    return r;
  }
  function select(options, value, onChange, tip) {
    const s = el('select', { onchange: () => onChange(s.value) });
    options.forEach(o => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      s.append(el('option', { value: v, selected: String(v) === String(value) }, l));
    });
    s.value = value;
    if (tip) s.setAttribute('data-tip', tip);
    return s;
  }
  function num(value, onChange, opts = {}) {
    const i = el('input', { type: 'number', value, step: opts.step || 0.1, min: opts.min, max: opts.max, style: { width: (opts.w || 66) + 'px' } });
    i.addEventListener('change', () => { let v = parseFloat(i.value); if (!isFinite(v)) v = 0; if (opts.min != null) v = Math.max(opts.min, v); if (opts.max != null) v = Math.min(opts.max, v); i.value = round(v, 3); onChange(v); });
    return i;
  }
  const section = t => el('h3', { class: 'sectitle', text: t });
  const row = (...k) => el('div', { class: 'row' }, ...k);
  const lrow = (label, ...k) => el('div', { class: 'row' }, el('label', { class: 'lbl', text: label }), ...k);

  /* --- pointer drag helper --- */
  function drag(startEvt, { onMove, onEnd, cursor }) {
    startEvt.preventDefault();
    const x0 = startEvt.clientX, y0 = startEvt.clientY;
    const prevCursor = document.body.style.cursor;
    if (cursor) document.body.style.cursor = cursor;
    let moved = false;
    const mv = e => { moved = moved || Math.abs(e.clientX - x0) > 2 || Math.abs(e.clientY - y0) > 2; onMove && onMove(e.clientX - x0, e.clientY - y0, e, moved); };
    const up = e => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      document.body.style.cursor = prevCursor; onEnd && onEnd(moved, e);
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  }

  const ASPECTS = { '16:9': 16 / 9, '9:16': 9 / 16, '4:5': 4 / 5, '1:1': 1 };
  function frameSize(aspect, height) {
    const r = ASPECTS[aspect] || 16 / 9;
    let h = height, w = Math.round(h * r);
    if (w % 2) w++; if (h % 2) h++;
    return { w, h };
  }

  return {
    uid, clamp, lerp, round, tc, dur, bytes, el, $, $$, clear, clone, debounce, raf, idle,
    Emitter, toast, errToast, modal, slider, check, select, num, section, row, lrow, drag, ASPECTS, frameSize
  };
})();


/* ===== 10-model.js ===== */
/* ============================================================
   10 — Data model, defaults and presets
   ============================================================ */
const M = (() => {

  /* ---------- grade (bildjustering) ---------- */
  const GRADE_DEFS = [
    ['exposure', 'Exposure', -2, 2, 0.01, 0],
    ['contrast', 'Contrast', -100, 100, 1, 0],
    ['highlights', 'Highlights', -100, 100, 1, 0],
    ['shadows', 'Shadows', -100, 100, 1, 0],
    ['whites', 'Whites', -100, 100, 1, 0],
    ['blacks', 'Blacks', -100, 100, 1, 0],
    ['temperature', 'Temperature', -100, 100, 1, 0],
    ['tint', 'Tint', -100, 100, 1, 0],
    ['saturation', 'Saturation', -100, 100, 1, 0],
    ['vibrance', 'Vibrance', -100, 100, 1, 0],
    ['clarity', 'Clarity', -100, 100, 1, 0],
    ['dehaze', 'Dehaze', -100, 100, 1, 0],
    ['sharpen', 'Sharpening', 0, 100, 1, 0],
    ['denoise', 'Noise reduction', 0, 100, 1, 0],
    ['highlightRecovery', 'Highlight recovery', 0, 100, 1, 0],
    ['shadowRecovery', 'Shadow recovery', 0, 100, 1, 0],
    ['windowProtect', 'Window protection', 0, 100, 1, 0],
    ['verticalCorrection', 'Vertical correction', -50, 50, 0.5, 0],
    ['vignette', 'Vignette', -100, 100, 1, 0],

      timelineDuration: U.round(o.timelineOut - o.timelineIn, 3),

      sourceIn: o.sourceIn, sourceOut: o.sourceOut,
      role: o.role || 'support', roomType: o.roomType || 'other',
      roomLabel: o.roomLabel || null, clusterId: o.clusterId || null,
      movementLocked: !!o.movementLocked, durationLocked: !!o.durationLocked,
      motivation: o.motivation || '',
      status: 'planned', jobId: null, outputAssetId: null, qc: null, attempts: 0,
    };
  }
  function newJob(shot, provider, aspect) {
    const p = providerById(provider);
    return {
      id: U.uid('job'), shotId: shot.id, provider: p.id, model: p.model,
      params: {
        prompt: shot.prompt, duration: shot.generatedDuration,
        mode: 'std', sound: 'off', aspect_ratio: aspect,   // ljud av: musiken läggs på i editorn
      },
      status: 'pending', attempts: 0, cost: shotCost(provider, shot.generatedDuration),
      requestId: null, outputUrl: null, error: null, log: [],
      createdAt: Date.now(),
    };
  }

  /** Genereringslängd: modellen tar heltalssekunder. Vi lägger på marginal så
   *  att klippets in-/utpunkt kan flyttas utan att hamna utanför materialet,
   *  och trimmar sedan i timelinen. Klippningen styr — aldrig tvärtom. */
  function planDurations(timelineDuration, provider) {
    const p = providerById(provider);
    // Kling tar heltalssekunder och 3 s är standard: bostadsfilm klipper i
    // 2,5–4 s, så längre generering är bortkastade credits. Marginalen räcker
    // för att kunna flytta in-/utpunkten något i editorn.
    let gen = Math.max(p.minDuration, Math.ceil(timelineDuration + 0.4));
    gen = U.clamp(gen, p.minDuration, p.maxDuration);
    const slack = Math.max(0, gen - timelineDuration);
    const sourceIn = U.round(Math.min(slack * 0.5, 0.6), 2);
    return { generatedDuration: gen, sourceIn, sourceOut: U.round(sourceIn + timelineDuration, 3) };
  }

  return {
    MOVES, moveById, ROOMS, roomName, TOUR_ORDER,
    PROVIDERS, providerById, shotCost, planCost, planDurations,
    PROJECT_STATUS, SHOT_STATUS, JOB_STATUS,
    newMotionProject, newShot, newJob,
  };
})();


/* ===== 20-store.js ===== */
/* ============================================================
   20 — Project state, selection, undo/redo
   ============================================================ */
const S = (() => {
  const bus = new U.Emitter();
  const HEAVY = ['url', 'thumb', 'strip', 'wave', 'file'];   // hålls utanför historiken
  const RUNTIME = ['url', 'file'];                           // går inte att serialisera alls

  const st = {
    project: M.newProject(),
    sel: { clips: [], media: [] },
    playhead: 0,
    playing: false,
    dirty: false,
    past: [], future: [],
    _last: null, _lastLabel: '', _lastTime: 0,
  };

  /** Lätt ögonblicksbild för ångra/gör om — thumbnails och waveforms utelämnas. */
  function snapshot(p = st.project) {
    const media = p.media.map(m => { const o = {}; for (const k in m) if (!HEAVY.includes(k)) o[k] = m[k]; return o; });
    return JSON.stringify({ ...p, media });
  }
  /** Fullständig serialisering för lagring och projektfil — behåller thumbnails,
   *  filmstrip och waveform så att biblioteket ser likadant ut efter omladdning. */
  function serialize(p = st.project) {
    const media = p.media.map(m => { const o = {}; for (const k in m) if (!RUNTIME.includes(k)) o[k] = m[k]; return o; });
    return JSON.parse(JSON.stringify({ ...p, media }));
  }
  function restore(json) {
    const data = JSON.parse(json);
    const byId = new Map(st.project.media.map(m => [m.id, m]));
    data.media = data.media.map(m => {
      const live = byId.get(m.id);
      if (live) HEAVY.forEach(k => { if (live[k] !== undefined) m[k] = live[k]; });
      return m;
    });
    st.project = data;
    fixSelection();
    bus.emit('project', st.project);
    bus.emit('change');
  }
  function fixSelection() {
    const ids = new Set(M.allClips(st.project).map(c => c.id));
    st.sel.clips = st.sel.clips.filter(id => ids.has(id));
    const mids = new Set(st.project.media.map(m => m.id));
    st.sel.media = st.sel.media.filter(id => mids.has(id));
  }

  /** Muterar projektet och lägger en post i historiken.
   *  coalesce: slår ihop snabba upprepade ändringar med samma label (t.ex. sliderdrag). */
  function update(fn, label = 'edit', coalesce = false) {
    if (st._last == null) st._last = snapshot();
    const before = st._last;
    fn(st.project);
    st.project.updatedAt = Date.now();
    const now = performance.now();
    const merge = coalesce && label === st._lastLabel && (now - st._lastTime) < 800;
    if (!merge) { st.past.push(before); if (st.past.length > 60) st.past.shift(); st.future.length = 0; }
    st._last = snapshot();
    st._lastLabel = label; st._lastTime = now;
    st.dirty = true;
    bus.emit('change', label);
    return st.project;
  }
  /** Ändring utan historik (t.ex. uppspelningsläge, media-status). */
  function touch(fn, label = 'touch') {
    if (fn) fn(st.project);
    st._last = snapshot();
    st.dirty = true;
    bus.emit('change', label);
  }
  function undo() {
    if (!st.past.length) return false;
    st.future.push(snapshot());
    restore(st.past.pop());
    st._last = snapshot(); st._lastLabel = ''; st.dirty = true;
    return true;
  }
  function redo() {
    if (!st.future.length) return false;
    st.past.push(snapshot());
    restore(st.future.pop());
    st._last = snapshot(); st._lastLabel = ''; st.dirty = true;
    return true;
  }
  function setProject(p, { resetHistory = true } = {}) {
    st.project = p;
    if (resetHistory) { st.past.length = 0; st.future.length = 0; }
    st._last = snapshot(); st._lastLabel = '';
    st.sel = { clips: [], media: [] };
    st.playhead = 0;
    bus.emit('project', p);
    bus.emit('change', 'load');
  }

  /* ---------- selection ---------- */
  function selectClips(ids, additive = false) {
    ids = [].concat(ids).filter(Boolean);
    st.sel.clips = additive ? [...new Set([...st.sel.clips, ...ids])] : ids;
    bus.emit('selection', st.sel);
  }
  function toggleClip(id) {
    const i = st.sel.clips.indexOf(id);
    if (i >= 0) st.sel.clips.splice(i, 1); else st.sel.clips.push(id);
    bus.emit('selection', st.sel);
  }
  function selectMedia(ids, additive = false) {
    ids = [].concat(ids).filter(Boolean);
    st.sel.media = additive ? [...new Set([...st.sel.media, ...ids])] : ids;
    bus.emit('selection', st.sel);
  }
  const selectedClips = () => st.sel.clips.map(id => M.findClip(st.project, id)).filter(Boolean);
  const primaryClip = () => selectedClips().find(c => c.kind === 'video') || selectedClips()[0] || null;
  const selectedMedia = () => st.sel.media.map(id => M.mediaById(st.project, id)).filter(Boolean);
  const primaryMedia = () => {
    const m = selectedMedia()[0];
    if (m) return m;
    const c = primaryClip();
    return c && c.mediaId ? M.mediaById(st.project, c.mediaId) : null;
  };

  function seek(t, emit = true) {
    st.playhead = Math.max(0, t);
    if (emit) bus.emit('seek', st.playhead);
  }

  return {
    bus, st,
    get project() { return st.project; },
    get sel() { return st.sel; },
    update, touch, undo, redo, setProject, snapshot, serialize,
    selectClips, toggleClip, selectMedia, selectedClips, selectedMedia, primaryClip, primaryMedia, seek,
    canUndo: () => st.past.length > 0, canRedo: () => st.future.length > 0,
  };
})();


/* ===== 30-persist.js ===== */
/* ============================================================
   30 — Lokal persistens: IndexedDB (filer + projekt), autosave
   ============================================================ */
const DB = (() => {
  const NAME = 'bostadsfilm-editor', VER = 1;
  let db = null, available = null, lastError = '';

  function open() {
    if (db) return Promise.resolve(db);
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(NAME, VER); }
      catch (e) { available = false; lastError = e.message; return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
      };
      req.onsuccess = () => { db = req.result; available = true; res(db); };
      req.onerror = () => { available = false; lastError = (req.error && req.error.message) || 'IndexedDB blockerad'; rej(req.error); };
      req.onblocked = () => { lastError = 'IndexedDB blockerad av annan flik'; };
    });
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transaktion avbruten'));
    });
  }
  const putFile = (id, blob, name, type) => tx('files', 'readwrite', s => s.put({ id, blob, name, type }));
  const getFile = id => tx('files', 'readonly', s => s.get(id));
  const delFile = id => tx('files', 'readwrite', s => s.delete(id));
  const putProject = p => tx('projects', 'readwrite', s => s.put(S.serialize(p)));
  const getProject = id => tx('projects', 'readonly', s => s.get(id));
  const allProjects = () => tx('projects', 'readonly', s => s.getAll());
  const delProject = id => tx('projects', 'readwrite', s => s.delete(id));
  const setMeta = (k, v) => tx('meta', 'readwrite', s => s.put({ k, v }));
  const getMeta = async k => { const r = await tx('meta', 'readonly', s => s.get(k)); return r && r.v; };

  async function estimate() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        return { usage: e.usage || 0, quota: e.quota || 0 };
      }
    } catch (e) { /* ignore */ }
    return null;
  }
  return { open, putFile, getFile, delFile, putProject, getProject, allProjects, delProject, setMeta, getMeta, estimate, get available() { return available; }, get error() { return lastError; } };
})();

const Autosave = (() => {
  let enabled = true, timer = null, statusEl = null, saving = false;
  const setStatus = (txt, cls) => {
    if (!statusEl) statusEl = U.$('#autosave');
    if (!statusEl) return;
    statusEl.textContent = txt;
    statusEl.className = 'tag' + (cls ? ' ' + cls : '');
  };
  async function saveNow(silent) {
    if (saving) return;
    saving = true;
    try {
      setStatus('Sparar…');
      await DB.putProject(S.project);
      await DB.setMeta('lastProject', S.project.id);
      S.st.dirty = false;
      setStatus('Sparad ' + U.tc((Date.now() % 86400000) / 1000, false), 'ok');
      if (!silent) U.toast('Projektet sparat', S.project.name);
    } catch (e) {
      setStatus('Autosave av', 'danger');
      if (!silent) U.errToast('Kunde inte spara projektet', e);
      else console.warn('autosave', e);
    } finally { saving = false; refreshStorage(); }
  }
  const schedule = U.debounce(() => { if (enabled) saveNow(true); }, 1600);
  function init() {
    S.bus.on('change', () => { setStatus('Osparade ändringar', 'warn'); schedule(); });
    window.addEventListener('beforeunload', e => {
      if (S.st.dirty) { e.preventDefault(); e.returnValue = 'Du har osparade ändringar.'; return e.returnValue; }
    });
    refreshStorage();
    setInterval(refreshStorage, 20000);
  }
  async function refreshStorage() {
    const e = U.$('#storagestat'); if (!e) return;
    const est = await DB.estimate();
    if (DB.available === false) { e.textContent = 'Lagring: ej tillgänglig'; e.className = 'tag danger'; e.setAttribute('data-tip', DB.error || 'IndexedDB blockerat i denna miljö — projektet lever bara i minnet'); return; }
    if (!est) { e.textContent = 'Lagring: lokal'; e.className = 'tag'; return; }
    const pct = est.quota ? (est.usage / est.quota * 100) : 0;
    e.textContent = `Lagring ${U.bytes(est.usage)}`;
    e.className = 'tag' + (pct > 85 ? ' danger' : pct > 60 ? ' warn' : '');
    e.setAttribute('data-tip', `Använt ${U.bytes(est.usage)} av ${U.bytes(est.quota)} (${pct.toFixed(1)} %)\nIndexedDB i denna webbläsare`);
  }
  function markClean(txt) { S.st.dirty = false; setStatus(txt || 'Sparad', 'ok'); }
  return { init, saveNow, refreshStorage, markClean, set enabled(v) { enabled = v; }, get enabled() { return enabled; } };
})();


/* ===== 40-media.js ===== */
/* ============================================================
   40 — Media ingestion: metadata, thumbnails, filmstrip, waveform
   ============================================================ */
const Media = (() => {
  const STD_FPS = [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60, 120];
  let audioCtx = null;
  const getAudioCtx = () => audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());

  function loadVideoEl(url, { muted = true } = {}) {
    return new Promise((res, rej) => {
      const v = document.createElement('video');
      v.preload = 'auto'; v.muted = muted; v.playsInline = true; v.crossOrigin = 'anonymous';
      v.src = url;
      const to = setTimeout(() => rej(new Error('Tidsgränsen gick ut när videon lästes in')), 25000);
      v.onloadedmetadata = () => { clearTimeout(to); res(v); };
      v.onerror = () => { clearTimeout(to); rej(new Error('Webbläsaren kan inte avkoda den här videofilen (' + (v.error && v.error.code) + ')')); };
    });
  }
  function seekTo(v, t) {
    return new Promise(res => {
      let done = false;
      const ok = () => { if (done) return; done = true; v.removeEventListener('seeked', ok); res(); };
      v.addEventListener('seeked', ok);
      setTimeout(ok, 2500);
      try { v.currentTime = Math.max(0, Math.min(t, (v.duration || 1) - 0.02)); } catch (e) { ok(); }
    });
  }
  async function estimateFps(v) {
    if (!v.requestVideoFrameCallback) return null;
    return new Promise(res => {
      const times = []; const t0 = performance.now(); let stopped = false;
      const finish = () => {
        if (stopped) return; stopped = true;
        try { v.pause(); v.currentTime = 0; } catch (e) { }
        if (times.length < 4) return res(null);
        const d = []; for (let i = 1; i < times.length; i++) { const dt = times[i] - times[i - 1]; if (dt > 0.001) d.push(dt); }
        if (!d.length) return res(null);
        d.sort((a, b) => a - b);
        const med = d[Math.floor(d.length / 2)];
        let fps = 1 / med;
        const near = STD_FPS.find(f => Math.abs(f - fps) < Math.max(0.8, f * 0.04));
        res(near || Math.round(fps * 100) / 100);
      };
      const step = (now, meta) => {
        times.push(meta.mediaTime);
        if (times.length >= 14 || performance.now() - t0 > 1800) return finish();
        v.requestVideoFrameCallback(step);
      };
      v.requestVideoFrameCallback(step);
      v.play().catch(() => finish());
      setTimeout(finish, 2500);
    });
  }

  async function makeThumb(v, t, w = 320) {
    await seekTo(v, t);
    const h = Math.max(1, Math.round(w * (v.videoHeight / Math.max(1, v.videoWidth))));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(v, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.72);
  }
  async function makeStrip(v, duration, frames = 10, fh = 54) {
    const fw = Math.max(1, Math.round(fh * (v.videoWidth / Math.max(1, v.videoHeight))));
    const c = document.createElement('canvas'); c.width = fw * frames; c.height = fh;
    const g = c.getContext('2d');
    for (let i = 0; i < frames; i++) {
      await seekTo(v, (i + .5) / frames * duration);
      g.drawImage(v, i * fw, 0, fw, fh);
    }
    return c.toDataURL('image/jpeg', 0.6);
  }

  /* ---------- audio ---------- */
  async function analyzeAudio(file) {
    const buf = await file.arrayBuffer();
    const ctx = getAudioCtx();
    const audio = await ctx.decodeAudioData(buf.slice(0));
    const ch = audio.getChannelData(0);
    const N = 1600, block = Math.max(1, Math.floor(ch.length / N));
    const peaks = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      let mx = 0; const s = i * block, e = Math.min(ch.length, s + block);
      for (let j = s; j < e; j += 2) { const a = Math.abs(ch[j]); if (a > mx) mx = a; }
      peaks[i] = mx;
    }
    return { duration: audio.duration, peaks: Array.from(peaks, p => Math.round(p * 255)), sampleRate: audio.sampleRate, channels: audio.numberOfChannels, beats: detectBeats(ch, audio.sampleRate, audio.duration) };
  }
  /** Transientdetektering: spektral-energiflöde i korta fönster + adaptiv tröskel. */
  function detectBeats(ch, sr, duration) {
    const hop = Math.floor(sr / 90);
    const n = Math.floor(ch.length / hop);
    const env = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let sum = 0; const s = i * hop, e = Math.min(ch.length, s + hop);
      for (let j = s; j < e; j++) sum += ch[j] * ch[j];
      env[i] = Math.sqrt(sum / Math.max(1, e - s));
    }
    const flux = new Float32Array(n);
    for (let i = 1; i < n; i++) flux[i] = Math.max(0, env[i] - env[i - 1]);
    const W = 40, beats = [];
    let last = -1;
    for (let i = 1; i < n; i++) {
      let m = 0, cnt = 0;
      for (let j = Math.max(0, i - W); j < Math.min(n, i + W); j++) { m += flux[j]; cnt++; }
      m /= Math.max(1, cnt);
      if (flux[i] > m * 1.9 && flux[i] > 0.006 && (i - last) > 12) {
        beats.push(U.round(i * hop / sr, 3)); last = i;
      }
    }
    // uppskatta BPM från medianintervall
    let bpm = null;
    if (beats.length > 5) {
      const d = []; for (let i = 1; i < beats.length; i++) d.push(beats[i] - beats[i - 1]);
      d.sort((a, b) => a - b);
      const med = d[Math.floor(d.length / 2)];
      if (med > 0.2) { bpm = Math.round(60 / med); while (bpm < 70) bpm *= 2; while (bpm > 180) bpm /= 2; bpm = Math.round(bpm); }
    }
    return { times: beats, bpm };
  }

  /* ---------- ingestion ---------- */
  async function ingestFiles(files, onProgress) {
    const out = [];
    const list = [...files].filter(f => f.type.startsWith('video/') || f.type.startsWith('audio/') || f.type.startsWith('image/')
      || /\.(mp4|mov|webm|m4v|mkv|mp3|wav|m4a|aac|ogg|jpe?g|png|webp|avif|heic)$/i.test(f.name));
    if (!list.length) { U.toast('Inga giltiga filer', 'Ladda upp video, bilder eller ljud.', 'warn'); return out; }
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      onProgress && onProgress(i / list.length, f.name);
      try { out.push(await ingestOne(f)); }
      catch (e) { U.errToast('Kunde inte importera ' + f.name, e); }
    }
    onProgress && onProgress(1, '');
    return out;
  }

  async function ingestOne(file) {
    const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|m4a|aac|ogg)$/i.test(file.name);
    const isImage = !isAudio && (file.type.startsWith('image/') || /\.(jpe?g|png|webp|avif|heic)$/i.test(file.name));
    if (isImage) return ingestImage(file);
    const id = U.uid(isAudio ? 'aud' : 'vid');
    const url = URL.createObjectURL(file);
    const m = {
      id, name: file.name, size: file.size, mime: file.type || (isAudio ? 'audio/*' : 'video/*'),
      type: isAudio ? 'audio' : 'video', addedAt: Date.now(), folder: 'Alla',
      duration: 0, width: 0, height: 0, fps: null, url, file,
      stab: { status: 'none' },
    };
    if (isAudio) {
      const a = await analyzeAudio(file);
      m.duration = a.duration; m.wave = a.peaks; m.beats = a.beats.times; m.bpm = a.beats.bpm;
      m.sampleRate = a.sampleRate; m.channels = a.channels;
    } else {
      const v = await loadVideoEl(url);
      m.duration = isFinite(v.duration) ? v.duration : 0;
      m.width = v.videoWidth; m.height = v.videoHeight;
      if (!m.width || !m.height) throw new Error('Videon saknar bildström eller stöds inte av webbläsaren');
      m.fps = await estimateFps(v);
      m.thumb = await makeThumb(v, Math.min(m.duration * .12, 2));
      m.strip = await makeStrip(v, m.duration, m.duration > 6 ? 12 : 6);
      v.src = ''; v.load();
      // har klippet ljudspår?
      m.hasAudio = !!(v.mozHasAudio || (v.webkitAudioDecodedByteCount > 0) || (v.audioTracks && v.audioTracks.length));
    }
    try { await DB.putFile(id, file, file.name, file.type); } catch (e) { console.warn('IDB put misslyckades', e); }
    return m;
  }

  /** Stillbilder: Motion-flödets råmaterial. Lagras som media av typen 'image'
   *  med samma livscykel som video — thumbnail, IndexedDB, object URL. */
  async function ingestImage(file) {
    const id = U.uid('img');
    const url = URL.createObjectURL(file);
    const im = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Bildformatet stöds inte av webbläsaren'));
      i.src = url;
    });
    const w = 320, h = Math.max(1, Math.round(w * (im.naturalHeight / Math.max(1, im.naturalWidth))));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    const m = {
      id, name: file.name, size: file.size, mime: file.type || 'image/*',
      type: 'image', addedAt: Date.now(), folder: 'Alla',
      duration: 0, width: im.naturalWidth, height: im.naturalHeight, fps: null,
      url, file, thumb: c.toDataURL('image/jpeg', 0.75),
    };
    try { await DB.putFile(id, file, file.name, file.type); } catch (e) { console.warn('IDB put misslyckades', e); }
    return m;
  }

  /** Återknyt blobbar från IndexedDB efter omladdning. */
  async function rehydrate(project, onMissing) {
    for (const m of project.media) {
      if (!m.url) {
        try {
          const rec = await DB.getFile(m.id);
          if (rec && rec.blob) { m.file = rec.blob; m.url = URL.createObjectURL(rec.blob); m.missing = false; }
          else { m.missing = true; onMissing && onMissing(m); continue; }
        } catch (e) { m.missing = true; onMissing && onMissing(m); continue; }
      }
      // saknade förhandsbilder byggs om från filen (t.ex. äldre projektfiler)
      try {
        if (m.type === 'video' && (!m.thumb || !m.strip)) {
          const v = await loadVideoEl(m.url);
          if (!m.thumb) m.thumb = await makeThumb(v, Math.min(m.duration * .12, 2));
          if (!m.strip) m.strip = await makeStrip(v, m.duration, m.duration > 6 ? 12 : 6);
          v.src = ''; v.load();
        } else if (m.type === 'audio' && !m.wave && m.file) {
          const a = await analyzeAudio(m.file);
          m.wave = a.peaks;
          // En låt som appen komponerat vet redan sitt exakta tempo och sitt
          // taktrutnät — mätvärdena får inte skriva över dem.
          if (!m.composed) { m.beats = a.beats.times; m.bpm = a.beats.bpm; }
        }
      } catch (e) { console.warn('kunde inte bygga om förhandsbilder för', m.name, e); }
    }
  }
  async function removeMedia(project, id) {
    const i = project.media.findIndex(m => m.id === id);
    if (i < 0) return;
    const m = project.media[i];
    if (m.url) URL.revokeObjectURL(m.url);
    project.media.splice(i, 1);
    project.tracks.video = project.tracks.video.filter(c => c.mediaId !== id);
    project.tracks.music = project.tracks.music.filter(c => c.mediaId !== id);
    try { await DB.delFile(id); } catch (e) { }
  }
  const usedCount = (project, id) => project.tracks.video.filter(c => c.mediaId === id).length + project.tracks.music.filter(c => c.mediaId === id).length;

  return { ingestFiles, ingestOne, ingestImage, rehydrate, removeMedia, usedCount, loadVideoEl, seekTo, makeThumb, analyzeAudio, getAudioCtx };
})();


/* ===== 44-image-analyze.js ===== */
/* ============================================================
   44 — Bildanalys

   Regissören måste veta vad varje bild faktiskt visar innan den kan
   bestämma ordning, längd och kamerarörelse. Här mäts bilden: ljus,
   färg, kanter, symmetri, djup, horisont, himmel och grönska. Utifrån
   måtten poängsätts rumstyp, hero-värde och risk för dubbletter.

   VAD SOM ÄR TILLFÖRLITLIGT: ute mot inne, detalj mot rum, hero-poäng,
   symmetri, djup, dubblettdetektering — och vilka bilder som visar SAMMA rum.

   VAD SOM INTE ÄR DET: vad rummet HETER. Ett kök och ett sovrum skiljer sig
   inte tillräckligt i ljus-, kant- och färgstatistik för att en handskriven
   heuristik ska sätta rätt namn; den gissade tidigare ändå, och kunde kalla
   samma rum "entré" i en bild och "kök" i nästa.

   Därför gissas inget namn längre. Bilderna grupperas i stället efter
   färgvärld — se sameRoomScore och clusterRooms — vilket är en fråga som
   pixlarna FAKTISKT kan svara på, och som är den regissören behöver:
   rundturen ska ta ett rum i taget. Namnet sätter användaren, en gång per
   rum. Vill man ha automatiska namn krävs en vision-modell; den kopplas in
   där classify() nu sitter, utan att något annat behöver ändras.
   ============================================================ */
const ImageAnalyze = (() => {
  const W = 256;

  function loadImage(url) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('Bilden kunde inte läsas'));
      im.src = url;
    });
  }

  async function analyze(asset) {
    if (!asset.url) throw new Error('Bilden är inte tillgänglig');
    const im = await loadImage(asset.url);
    const h = Math.max(8, Math.round(W * (im.naturalHeight / Math.max(1, im.naturalWidth)) / 2) * 2);
    const c = document.createElement('canvas'); c.width = W; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(im, 0, 0, W, h);
    const d = g.getImageData(0, 0, W, h).data;
    const n = W * h;

    const lum = new Float32Array(n);
    let sr = 0, sg = 0, sb = 0, sl = 0, sky = 0, topSky = 0, green = 0, warm = 0, sat = 0, bright = 0, dark = 0;
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const r = d[p] / 255, gg = d[p + 1] / 255, b = d[p + 2] / 255;
      const l = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
      lum[i] = l;
      sr += r; sg += gg; sb += b; sl += l;
      const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
      const s = mx > 0.01 ? (mx - mn) / mx : 0;
      sat += s;
      if (l > 0.86) bright++;
      if (l < 0.10) dark++;
      const y = (i / W) | 0;
      // himmel: ljus, blådominant, i övre tredjedelen
      if (y < h / 3 && b > r + 0.045 && l > 0.55) sky++;
      // ...men ett fönster inomhus ser också ut så. Äkta himmel fyller den
      // allra översta remsan; ett fönster gör det nästan aldrig.
      if (y < h * 0.12 && b > r + 0.03 && l > 0.5) topSky++;
      // grönska: grön kanal dominerar tydligt
      if (gg > r + 0.035 && gg > b + 0.045) green++;
      // varma ytor (trä, kök)
      if (r > b + 0.06 && l > 0.25 && l < 0.85) warm++;
    }
    const meanL = sl / n;
    let varSum = 0;
    for (let i = 0; i < n; i++) { const dd = lum[i] - meanL; varSum += dd * dd; }

    /* --- kanter och linjeorientering --- */
    let edge = 0, vert = 0, horiz = 0, longV = 0, longH = 0;
    const rowH = new Float32Array(h), colV = new Float32Array(W);
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        const gx = lum[i + 1] - lum[i - 1], gy = lum[i + W] - lum[i - W];
        const m = Math.hypot(gx, gy);
        edge += m;
        if (m > 0.08) {
          if (Math.abs(gx) > Math.abs(gy) * 2) { vert++; colV[x] += m; }
          else if (Math.abs(gy) > Math.abs(gx) * 2) { horiz++; rowH[y] += m; }
        }
      }
    }
    const px = (W - 2) * (h - 2);
    // långa sammanhängande linjer = arkitektur
    const colMax = Math.max(...colV), rowMax = Math.max(...rowH);
    for (let x = 0; x < W; x++) if (colV[x] > colMax * 0.45) longV++;
    for (let y = 0; y < h; y++) if (rowH[y] > rowMax * 0.45) longH++;

    /* --- horisont: raden med starkast horisontell kantenergi --- */
    let hy = 0, hyv = 0;
    for (let y = Math.floor(h * 0.15); y < h * 0.85; y++) if (rowH[y] > hyv) { hyv = rowH[y]; hy = y; }
    const horizonY = hy / h;

    /* --- ljusbalans vänster/höger ---
       Ger kamerarörelsen en riktning som motiveras av bilden i stället för
       av slumpen: en slide åt det ljusare hållet avslöjar fönstret, vilket
       är den rörelse en riktig fotograf väljer. */
    let lumL = 0, lumR = 0, lumN = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < (W >> 2); x++) { lumL += lum[y * W + x]; lumR += lum[y * W + (W - 1 - x)]; lumN++; }
    }
    const lumBalance = lumN ? (lumR - lumL) / lumN : 0;

    /* --- symmetri: vänster halva mot speglad höger halva --- */
    let symErr = 0, symN = 0;
    const half = W >> 1;
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < half; x += 2) {
        symErr += Math.abs(lum[y * W + x] - lum[y * W + (W - 1 - x)]);
        symN++;
      }
    }
    const symmetry = U.clamp(1 - (symErr / Math.max(1, symN)) * 4.5, 0, 1);

    /* --- djup: konvergerar de nära-horisontella linjerna mot mitten? ---
       I ett rum med djup lutar tak- och golvlinjer mot en flyktpunkt. Vi mäter
       lutningen på nära-horisontella kanter i vänster respektive höger halva;
       motsatt tecken betyder konvergens, alltså djup. */
    let lSlope = 0, lN = 0, rSlope = 0, rN = 0;
    for (let y = 2; y < h - 2; y += 2) {
      for (let x = 2; x < W - 2; x += 2) {
        const i = y * W + x;
        const gx = lum[i + 1] - lum[i - 1], gy = lum[i + W] - lum[i - W];
        if (Math.abs(gy) > 0.05 && Math.abs(gy) > Math.abs(gx) * 1.8) {
          const slope = gx / gy;
          if (x < half) { lSlope += slope; lN++; } else { rSlope += slope; rN++; }
        }
      }
    }
    const conv = (lN > 10 && rN > 10) ? (lSlope / lN - rSlope / rN) : 0;
    const depthScore = U.clamp(Math.abs(conv) * 1.8, 0, 1);

    /* --- skärpa: laplace-energi (används för hero och detaljbedömning) --- */
    let lap = 0, lapPeriph = 0, lapCenter = 0, cN = 0, pN = 0;
    for (let y = 2; y < h - 2; y++) {
      for (let x = 2; x < W - 2; x++) {
        const i = y * W + x;
        const v = Math.abs(4 * lum[i] - lum[i - 1] - lum[i + 1] - lum[i - W] - lum[i + W]);
        lap += v;
        const cx = (x / W - 0.5), cy = (y / h - 0.5);
        if (Math.hypot(cx, cy) < 0.25) { lapCenter += v; cN++; } else { lapPeriph += v; pN++; }
      }
    }
    const sharp = lap / px;
    const centerBias = (cN && pN) ? (lapCenter / cN) / Math.max(1e-6, lapPeriph / pN) : 1;

    /* --- färg- och layoutsignatur: 4x4 rutor med medelfärg ---
       Det här är nyckeln till att känna igen SAMMA RUM från en annan vinkel.
       Väggfärg, golvton och ljusfördelning ändras knappt när man flyttar
       kameran några meter — men de skiljer sig tydligt mellan olika rum. */
    const colorSig = [];
    for (let by = 0; by < 4; by++) for (let bx = 0; bx < 4; bx++) {
      let r = 0, gg = 0, b = 0, cnt = 0;
      const y0 = Math.floor(by * h / 4), y1 = Math.floor((by + 1) * h / 4);
      const x0 = Math.floor(bx * W / 4), x1 = Math.floor((bx + 1) * W / 4);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const q = (y * W + x) * 4;
        r += d[q]; gg += d[q + 1]; b += d[q + 2]; cnt++;
      }
      colorSig.push(U.round(r / cnt / 255, 3), U.round(gg / cnt / 255, 3), U.round(b / cnt / 255, 3));
    }

    /* --- färghistogram: rummets färgvärld oberoende av var sakerna står ---
       Det spatiala rutnätet ovan ändras när kameran flyttas. Ett histogram
       gör det inte: väggfärg, golvton och materialpalett är desamma oavsett
       vinkel, men skiljer sig mellan ett kaklat badrum och ett kök i trä.
       chroma-histogrammet räknar bort ljusstyrkan, så samma rum känns igen
       även när man fotograferar mot respektive från fönstret. */
    const hist = new Float32Array(64), chroma = new Float32Array(36);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const r = d[p], gg = d[p + 1], b = d[p + 2];
      hist[((r >> 6) << 4) + ((gg >> 6) << 2) + (b >> 6)]++;
      const s = r + gg + b || 1;
      const cr = Math.min(5, (r / s * 9) | 0), cg = Math.min(5, (gg / s * 9) | 0);
      chroma[cr * 6 + cg]++;
    }
    for (let i = 0; i < hist.length; i++) hist[i] /= n;
    for (let i = 0; i < chroma.length; i++) chroma[i] /= n;

    /* --- perceptuell signatur (8x8 average hash) för dubblettdetektering --- */
    const sig = [];
    let sigMean = 0;
    for (let by = 0; by < 8; by++) for (let bx = 0; bx < 8; bx++) {
      let s = 0, cnt = 0;
      for (let y = Math.floor(by * h / 8); y < (by + 1) * h / 8; y++)
        for (let x = Math.floor(bx * W / 8); x < (bx + 1) * W / 8; x++) { s += lum[y * W + x]; cnt++; }
      const v = s / Math.max(1, cnt); sig.push(v); sigMean += v;
    }
    sigMean /= 64;
    const signature = sig.map(v => v > sigMean ? 1 : 0);

    const f = {
      w: im.naturalWidth, h: im.naturalHeight, aspect: im.naturalWidth / im.naturalHeight,
      meanL: U.round(meanL, 4), contrast: U.round(Math.sqrt(varSum / n), 4),
      saturation: U.round(sat / n, 4),
      warmth: U.round((sr - sb) / n, 4),
      skyFrac: U.round(sky / n, 4), topSkyFrac: U.round(topSky / Math.max(1, W * Math.floor(h * 0.12)), 4),
      greenFrac: U.round(green / n, 4), warmFrac: U.round(warm / n, 4),
      brightFrac: U.round(bright / n, 4), darkFrac: U.round(dark / n, 4),
      edgeDensity: U.round(edge / px, 4), sharpness: U.round(sharp, 4),
      vertLines: U.round(vert / px, 4), horizLines: U.round(horiz / px, 4),
      longVertical: longV, longHorizontal: longH,
      horizonY: U.round(horizonY, 3), symmetry: U.round(symmetry, 3),
      lumBalance: U.round(lumBalance, 4),
      depthScore: U.round(depthScore, 3), centerBias: U.round(centerBias, 3),
      signature, colorSig,
      hist: Array.from(hist, v => U.round(v, 5)), chroma: Array.from(chroma, v => U.round(v, 5)),
    };
    const cls = classify(f);
    return {
      id: U.uid('ia'), assetId: asset.id, at: Date.now(),
      ...f, ...cls,
      heroScore: heroScore(f, cls),
    };
  }

  /** Vad som faktiskt går att avgöra ur pixlarna med rimlig säkerhet:
   *  ute eller inne, och om det är en närbild eller ett helt rum.
   *
   *  Vad som INTE går: att sätta rätt namn på ett rum. Ett kök och ett
   *  vardagsrum skiljer sig inte tillräckligt i ljus-, kant- och färgstatistik.
   *  Tidigare gissades namnet ändå, vilket gjorde att samma rum fotograferat
   *  från två håll kunde bli "entré" i ena bilden och "kök" i den andra.
   *  Nu gissas inget namn — bilderna grupperas i stället efter hur lika de är,
   *  så att samma rum hamnar ihop oavsett vad rummet heter. */
  function classify(f) {
    // himmel räknas bara om den fyller den översta remsan — annars är det ett fönster
    const realSky = f.topSkyFrac > 0.35 ? f.skyFrac : f.skyFrac * 0.15;
    const outdoor = realSky * 3.2 + f.greenFrac * 2.2;
    const isExterior = outdoor > 0.35;
    /* Drönare: marken fyller bilden, horisonten ligger högt och det finns
       nästan inga stående linjer — uppifrån ser man tak, inte fasader. Bara
       hög horisont räcker inte: en fasadbild med taknock högt upp får också
       det. Marktäckningen är det som skiljer. Gissningen är ändå just en
       gissning, och användaren kan flytta bilden till Exteriör i planen. */
    const vBands = U.clamp(f.longVertical / 14, 0, 2);
    const isDrone = isExterior && f.greenFrac > 0.5 && vBands < 0.5 && f.horizonY < 0.35;
    /* Närbild: motivet sitter i mitten och periferin är tom. Tröskeln ligger
       högt med flit — ett rum med ett starkt centralmotiv ska inte bli
       "detalj" och därmed berövas alla rörelser utom push. */
    const isDetail = !isExterior && f.centerBias > 2.2 && f.depthScore < 0.3
      && vBands < 0.6 && U.clamp(f.longHorizontal / 14, 0, 2) < 0.6;
    const scene = isDrone ? 'drone' : isExterior ? 'exterior' : isDetail ? 'detail' : 'interior';
    return {
      scene, isExterior, isDrone, isDetail,
      roomType: scene,            // fylls med klusternamn av regissören
      roomLabel: null, clusterId: null,
    };
  }

  /** Hur stark är bilden som blickfång? Skärpa, kontrast, komposition, djup. */
  function heroScore(f, cls) {
    let v = 0;
    v += U.clamp(f.sharpness * 9, 0, 1) * 0.28;
    v += U.clamp(f.contrast * 3.4, 0, 1) * 0.20;
    v += f.symmetry * 0.16;
    v += f.depthScore * 0.18;
    v += U.clamp(1 - Math.abs(f.meanL - 0.5) * 2.6, 0, 1) * 0.12;
    if (cls.isExterior) v += 0.10;
    if (cls.isDetail) v -= 0.16;
    if (f.darkFrac > 0.25) v -= 0.12;
    if (f.brightFrac > 0.18) v -= 0.08;
    return U.round(U.clamp(v, 0, 1), 3);
  }

  /** Strukturlikhet (average hash): fångar samma bildutsnitt. */
  function similarity(a, b) {
    if (!a || !b || !a.signature || !b.signature) return 0;
    let same = 0;
    for (let i = 0; i < 64; i++) if (a.signature[i] === b.signature[i]) same++;
    return U.round(same / 64, 3);
  }

  /** Histogramsnitt: hur stor andel av färgerna är gemensam? */
  function intersect(a, b) {
    if (!a || !b) return 0;
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.min(a[i], b[i]);
    return s;
  }

  /** Rumslikhet: hur troligt är det att två bilder visar SAMMA rum?
   *
   *  Färgvärlden bär informationen. Ett rum behåller sin palett när kameran
   *  flyttas — möblerna hamnar någon annanstans i bilden, men väggfärgen,
   *  golvtonen och materialen är kvar. Därför väger histogrammen tyngst och
   *  det spatiala rutnätet nästan ingenting: det senare säger mer om
   *  bildutsnittet än om rummet. */
  function sameRoomScore(a, b) {
    if (!a || !b) return 0;
    const histMatch = intersect(a.hist, b.hist);          // hela paletten
    const chromaMatch = intersect(a.chroma, b.chroma);    // paletten utan ljusstyrka
    const toneMatch = U.clamp(1 - Math.abs(a.meanL - b.meanL) * 3.0, 0, 1);
    const warmMatch = U.clamp(1 - Math.abs(a.warmth - b.warmth) * 6, 0, 1);
    const textureMatch = U.clamp(1 - Math.abs(a.edgeDensity - b.edgeDensity) * 10, 0, 1);
    let dc = 0;
    if (a.colorSig && b.colorSig) {
      for (let i = 0; i < a.colorSig.length; i++) dc += Math.abs(a.colorSig[i] - b.colorSig[i]);
      dc /= a.colorSig.length;
    }
    const layoutMatch = U.clamp(1 - dc * 4.5, 0, 1);
    return U.round(histMatch * 0.34 + chromaMatch * 0.30 + toneMatch * 0.14
      + warmMatch * 0.09 + textureMatch * 0.08 + layoutMatch * 0.05, 3);
  }

  /** Grupperar bilder i rum utan att gissa vad rummen heter.
   *
   *  Agglomerativ klustring med average linkage. Var gränsen går kan inte
   *  vara en enda fast siffra: hur lika två bilder av samma rum är beror på
   *  bostaden, kameran och ljuset. Därför slås grupperna ihop hela vägen ner
   *  till en, och sammanslagningarna accepteras så länge de håller sig i
   *  samma kvalitetsband som de föregående — när poängen faller av en klippa
   *  har vi lämnat rummet. FLOOR är skyddsräcket: under det är det aldrig
   *  samma rum, hur likt materialet i övrigt än är. */
  const FLOOR = 0.75, BAND = 0.08;
  function clusterRooms(analyses) {
    const items = analyses.filter(a => !a.isExterior);
    let groups = items.map(a => [a]);
    const score = (g1, g2) => {
      let s = 0, n = 0;
      for (const a of g1) for (const b of g2) { s += sameRoomScore(a, b); n++; }
      return n ? s / n : 0;
    };
    const merges = [];
    while (groups.length > 1) {
      let best = -1, bi = 0, bj = 0;
      for (let i = 0; i < groups.length; i++)
        for (let j = i + 1; j < groups.length; j++) {
          const v = score(groups[i], groups[j]);
          if (v > best) { best = v; bi = i; bj = j; }
        }
      merges.push({ score: best, i: bi, j: bj });
      groups[bi] = groups[bi].concat(groups[bj]);
      groups.splice(bj, 1);
    }

    // hur många av sammanslagningarna behåller vi?
    let keep = 0, weakest = 1;
    for (const m of merges) {
      if (m.score < FLOOR || m.score < weakest - BAND) break;
      weakest = Math.min(weakest, m.score);
      keep++;
    }

    // bygg om klustringen med bara de sammanslagningar vi behöll
    groups = items.map(a => [a]);
    for (let k = 0; k < keep; k++) {
      const m = merges[k];
      groups[m.i] = groups[m.i].concat(groups[m.j]);
      groups.splice(m.j, 1);
    }
    // störst och ljusast först — troligen sällskapsytorna
    groups.sort((a, b) => (b.length - a.length) || (avg(b, 'meanL') - avg(a, 'meanL')));
    groups.forEach((g, i) => g.forEach(a => {
      a.clusterId = 'room' + (i + 1);
      a.roomLabel = g.length > 1 ? `Rum ${i + 1}` : (a.isDetail ? 'Detalj' : `Rum ${i + 1}`);
      a.roomType = a.isDetail ? 'detail' : a.clusterId;
      a.clusterSize = g.length;
    }));
    for (const a of analyses) if (a.isExterior) {
      a.clusterId = a.isDrone ? 'drone' : 'exterior';
      a.roomLabel = a.isDrone ? 'Drönare' : 'Exteriör';
      a.roomType = a.clusterId;
    }
    return groups;
  }
  const avg = (g, k) => g.reduce((s, a) => s + a[k], 0) / Math.max(1, g.length);

  /** Analyserar en lista bilder med progress och andningspauser. */
  async function analyzeAll(assets, onProgress) {
    const out = new Map();
    for (let i = 0; i < assets.length; i++) {
      onProgress && onProgress(i / assets.length, assets[i].name);
      try { out.set(assets[i].id, await analyze(assets[i])); }
      catch (e) { console.warn('bildanalys misslyckades', assets[i].name, e); }
      await U.raf();
    }
    onProgress && onProgress(1, '');
    return out;
  }

  return { analyze, analyzeAll, similarity, sameRoomScore, clusterRooms, classify, heroScore };
})();


/* ===== 45-music-make.js ===== */
/* ============================================================
   45 — Musikmakaren

   Motion skapar sina egna låtar. Det är inte en kosmetisk finess: när
   appen komponerar musiken vet den EXAKT var varje takt, fras och
   sektionsbyte ligger — den behöver inte gissa fram dem ur en waveform.
   Klippunkterna blir därmed exakta i stället för ungefärliga, och det är
   låten som bestämmer hur långt varje klipp blir.

   Tempona är valda så att en takt hamnar nära den längd bostadsfilm
   faktiskt klipper i (2,4–3,2 s). Med halvtakter som mellansteg får
   regissören en stege av musikaliskt riktiga klipplängder att välja på.

   Syntesen är additiv och skrivs rakt in i en Float32Array — inget
   WebAudio-beroende, så låtarna går att bygga och verifiera headless.
   ============================================================ */
const MusicMake = (() => {
  const SR = 44100;
  const TAU = Math.PI * 2;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  const SCALES = {
    minor: [0, 2, 3, 5, 7, 8, 10],
    major: [0, 2, 4, 5, 7, 9, 11],
  };

  /* ---------- stilar ----------
     bpm väljs efter hur lång en takt blir:
       76 → 3,16 s   80 → 3,00 s   88 → 2,73 s   100 → 2,40 s   112 → 2,14 s */
  const STYLES = [
    {
      id: 'nordic', name: 'Nordic Calm', bpm: 80, root: 57, mode: 'minor',
      prog: [0, 5, 3, 4],
      mood: 'Stilla piano och varm pad. Standardvalet för svensk bostadsfilm.',
      palette: { piano: 1, pad: 0.9, sub: 0.5, kick: 0.5, hat: 0.35, clap: 0, pluck: 0.4, impact: 0.5, riser: 0.4 },
      kickPattern: [[], [0], [0, 2], [0, 2, 3.5], [0, 1.5, 2, 3.5]],
    },
    {
      id: 'warm', name: 'Warm Daylight', bpm: 76, root: 60, mode: 'major',
      prog: [0, 3, 5, 4],
      mood: 'Dur, ljust och vänligt. Passar villa, trädgård och morgonljus.',
      palette: { piano: 1, pad: 0.75, sub: 0.45, kick: 0.42, hat: 0.3, clap: 0, pluck: 0.55, impact: 0.4, riser: 0.35 },
      kickPattern: [[], [0], [0, 2], [0, 2, 3.5], [0, 1.5, 2, 3.5]],
    },
    {
      id: 'deep', name: 'Modern Deep', bpm: 100, root: 53, mode: 'minor',
      prog: [0, 5, 6, 4],
      mood: 'Stadig puls och djup bas. Nyproduktion, city, kväll.',
      palette: { piano: 0.35, pad: 0.7, sub: 0.9, kick: 0.95, hat: 0.7, clap: 0.5, pluck: 0.6, impact: 0.7, riser: 0.6 },
      kickPattern: [[], [0], [0, 2], [0, 1, 2, 3], [0, 1, 2, 3]],
    },
    {
      id: 'uplift', name: 'Uplift', bpm: 112, root: 62, mode: 'major',
      prog: [5, 3, 0, 4],
      mood: 'Snabbare puls och plockade toner. Familjebostad, rörelse, ljus.',
      palette: { piano: 0.4, pad: 0.6, sub: 0.7, kick: 0.85, hat: 0.75, clap: 0.65, pluck: 1, impact: 0.6, riser: 0.55 },
      kickPattern: [[], [0], [0, 2], [0, 1, 2, 3], [0, 1, 2, 3]],
    },
    {
      id: 'wide', name: 'Cinematic Wide', bpm: 88, root: 50, mode: 'minor',
      prog: [0, 5, 3, 0],
      mood: 'Breda stråkliknande svep och tunga anslag. Exteriör och drönare.',
      palette: { piano: 0.5, pad: 1, sub: 0.8, kick: 0.6, hat: 0.2, clap: 0, pluck: 0.3, impact: 1, riser: 0.8 },
      kickPattern: [[], [0], [0, 2], [0, 2], [0, 2, 3.5]],
    },
  ];
  const styleById = id => STYLES.find(s => s.id === id) || STYLES[0];

  /* ---------- ackord ur skalan ---------- */
  function chordNotes(style, degree) {
    const sc = SCALES[style.mode];
    const at = d => style.root + Math.floor(d / 7) * 12 + sc[((d % 7) + 7) % 7];
    return [at(degree), at(degree + 2), at(degree + 4)];
  }

  /* ---------- arrangemang ----------
     Nivå 0 intro, 4 peak. Sektionerna faller ut ur nivåerna, så filmen
     kan klippa på ett sektionsbyte som verkligen finns i låten. */
  function arrange(nPhrases) {
    const lv = new Array(nPhrases).fill(2);
    lv[0] = 0;
    if (nPhrases > 1) lv[1] = 1;
    const pk = Math.max(2, Math.round((nPhrases - 1) * 0.62));
    for (let i = 2; i < nPhrases; i++) lv[i] = i < pk ? 2 : i === pk ? 4 : 3;
    lv[nPhrases - 1] = 1;
    if (nPhrases >= 6) lv[nPhrases - 2] = 2;
    return lv;
  }

  /* ---------- instrument ----------
     Alla skriver direkt i mixbufferten. Ingen filterkedja — bara
     summerade partialer med egna envelopes, vilket räcker långt och är
     snabbt nog att köra i en enda synkron passning. */
  function kick(buf, s, g) {
    const n = (SR * 0.4) | 0;
    let ph = 0;
    for (let i = 0; i < n && s + i < buf.length; i++) {
      const t = i / SR;
      const f = 46 + 105 * Math.exp(-t * 34);
      ph += TAU * f / SR;
      const a = Math.exp(-t * 9) * (1 - Math.exp(-t * 900));
      buf[s + i] += Math.sin(ph) * a * g;
    }
  }
  function sub(buf, s, note, dur, g) {
    const n = (SR * dur) | 0, f = mtof(note - 12);
    for (let i = 0; i < n && s + i < buf.length; i++) {
      const t = i / SR, e = Math.min(1, t * 22) * Math.min(1, (dur - t) * 6);
      buf[s + i] += (Math.sin(TAU * f * t) * 0.85 + Math.sin(TAU * f * 2 * t) * 0.15) * e * g;
    }
  }
  function hat(buf, s, g, open) {
    const n = (SR * (open ? 0.2 : 0.055)) | 0;
    let prev = 0;
    for (let i = 0; i < n && s + i < buf.length; i++) {
      const t = i / SR, r = Math.random() * 2 - 1;
      const hp = r - prev; prev = r;                       // enkel diskant
      buf[s + i] += hp * Math.exp(-t * (open ? 16 : 65)) * g * 0.35;
    }
  }
  function clap(buf, s, g) {
    for (let k = 0; k < 3; k++) {
      const off = s + ((SR * 0.009 * k) | 0), n = (SR * 0.09) | 0;
      let prev = 0;
      for (let i = 0; i < n && off + i < buf.length; i++) {
        const t = i / SR, r = Math.random() * 2 - 1, hp = r - prev; prev = r;
        buf[off + i] += hp * Math.exp(-t * 34) * g * 0.3;
      }
    }
    const n2 = (SR * 0.22) | 0;
    let prev = 0;
    for (let i = 0; i < n2 && s + i < buf.length; i++) {
      const t = i / SR, r = Math.random() * 2 - 1, hp = r - prev; prev = r;
      buf[s + i] += hp * Math.exp(-t * 13) * g * 0.11;
    }
  }
  /** Piano: harmoniskt avtagande partialer, ljusare partialer dör först. */
  function piano(buf, s, note, dur, g) {
    const f0 = mtof(note), n = (SR * Math.min(dur, 3.2)) | 0;
    const H = [1, 2, 3, 4, 5, 6], A = [1, 0.42, 0.22, 0.11, 0.06, 0.03];
    for (let h = 0; h < H.length; h++) {
      const f = f0 * H[h] * (1 + h * 0.0006), a = A[h] * g * 0.32, dec = 2.6 + h * 1.5;
      if (f > 16000) continue;
      for (let i = 0; i < n && s + i < buf.length; i++) {
        const t = i / SR;
        buf[s + i] += Math.sin(TAU * f * t) * a * Math.exp(-t * dec) * (1 - Math.exp(-t * 500));
      }
    }
  }
  function pluck(buf, s, note, g) {
    const f0 = mtof(note), n = (SR * 0.55) | 0;
    for (let h = 1; h <= 3; h++) {
      const f = f0 * h, a = g * 0.26 / h;
      if (f > 16000) continue;
      for (let i = 0; i < n && s + i < buf.length; i++) {
        const t = i / SR;
        buf[s + i] += Math.sin(TAU * f * t) * a * Math.exp(-t * (7 + h * 4)) * (1 - Math.exp(-t * 800));
      }
    }
  }
  /** Pad: lätt detunade partialer med långsam attack — filmens grundton. */
  function pad(buf, s, notes, dur, g) {
    const n = (SR * dur) | 0;
    for (const note of notes) {
      const f0 = mtof(note);
      for (const [mul, det, amp] of [[1, 0, 1], [1, 0.004, 0.8], [2, 0.002, 0.32], [3, -0.003, 0.13]]) {
        const f = f0 * mul * (1 + det), a = g * 0.075 * amp;
        if (f > 15000) continue;
        for (let i = 0; i < n && s + i < buf.length; i++) {
          const t = i / SR;
          const e = Math.min(1, t / (dur * 0.35)) * Math.min(1, (dur - t) / (dur * 0.45));
          buf[s + i] += Math.sin(TAU * f * t) * a * e;
        }
      }
    }
  }
  function impact(buf, s, g) {
    const n = (SR * 1.4) | 0;
    let prev = 0;
    for (let i = 0; i < n && s + i < buf.length; i++) {
      const t = i / SR, r = Math.random() * 2 - 1, hp = r - prev; prev = r;
      buf[s + i] += Math.sin(TAU * 41 * t) * Math.exp(-t * 3.2) * g * 0.5
        + hp * Math.exp(-t * 12) * g * 0.09;
    }
  }
  /** Riser inför ett sektionsbyte — hörbar signal om att ett klipp kommer. */
  function riser(buf, s, dur, g) {
    const n = (SR * dur) | 0;
    let lp = 0;
    for (let i = 0; i < n && s + i < buf.length; i++) {
      const t = i / SR, p = t / dur;
      const r = Math.random() * 2 - 1;
      const k = 0.06 + p * 0.5;                            // öppnas uppåt
      lp += (r - lp) * k;
      buf[s + i] += (r - lp) * p * p * g * 0.16;
    }
  }

  /* ---------- komposition ---------- */
  /** Bygger en färdig låt och dess EXAKTA struktur.
   *  targetSeconds styr antalet fraser; låten görs alltid något längre än
   *  filmen så att sista klippet får sluta på en musikalisk punkt. */
  function compose(styleId, targetSeconds) {
    const style = styleById(styleId);
    const beat = 60 / style.bpm, bar = beat * 4, phrase = bar * 4;
    const nPhrases = Math.max(4, Math.ceil((targetSeconds + 1.5) / phrase));
    const levels = arrange(nPhrases);
    const nBars = nPhrases * 4;
    const musicEnd = nBars * bar;
    const tail = 2.2;
    const total = musicEnd + tail;
