<title>Master Bostadsfilm</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Master Bostadsfilm Editor — dark neutral pro editing UI */
:root{
  --accent:#6d7266;
  --accent-hi:#8b9080;
  --accent-dim:#3d413a;
  --bg-0:#0e0f10;
  --bg-1:#141618;
  --bg-2:#1a1d1f;
  --bg-3:#212528;
  --bg-4:#2a2f33;
  --line:#31363a;
  --line-soft:#262b2e;
  --fg-0:#e8eaea;
  --fg-1:#b6bbbc;
  --fg-2:#7e8587;
  --fg-3:#575d60;
  --warn:#c2903f;
  --danger:#b4574f;
  --ok:#6d8f68;
  --track-h:64px;
  --radius:3px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg-0);color:var(--fg-0);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:#33383c;border:2px solid var(--bg-1);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#464c50}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
#topbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);
}
#mid{flex:1;display:flex;min-height:0}
#leftpanel{width:356px;flex:0 0 356px;display:flex;background:var(--bg-1);border-right:1px solid var(--line);min-height:0}
#tabrail{width:68px;flex:0 0 68px;background:var(--bg-2);border-right:1px solid var(--line);padding:6px 0;overflow-y:auto}
#panelbody{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-0)}
#inspector{width:296px;flex:0 0 296px;background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
#timelinewrap{flex:0 0 258px;background:var(--bg-1);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:120px}
#tlresizer{height:5px;cursor:ns-resize;background:var(--bg-2);border-bottom:1px solid var(--line)}
#tlresizer:hover{background:var(--accent-dim)}

/* ---------- generic controls ---------- */
.btn{
  height:26px;padding:0 9px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:var(--radius);color:var(--fg-1);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{background:var(--bg-4);color:var(--fg-0);border-color:#3d4348}
.btn:active{background:#191c1e}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#10120f;font-weight:600}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.on{background:var(--accent-dim);border-color:var(--accent);color:#dfe4d8}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.btn.icon{width:26px;padding:0;justify-content:center}
.btn.icon.sm{width:22px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger:hover{background:#43302e;border-color:var(--danger);color:#e5b7b3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg-3)}
.seg>button{height:24px;padding:0 8px;background:transparent;border:0;border-right:1px solid var(--line);color:var(--fg-2);cursor:pointer;font-size:11px}
.seg>button:last-child{border-right:0}
.seg>button.on{background:var(--accent-dim);color:#dfe4d8}
.seg>button:hover:not(.on){background:var(--bg-4);color:var(--fg-0)}
select,input[type=text],input[type=number]{
  height:24px;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);
  color:var(--fg-0);padding:0 6px;min-width:0;
}
select:focus,input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
label{color:var(--fg-1)}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.spacer{flex:1}
.tag{
  display:inline-block;padding:1px 5px;border-radius:2px;background:var(--bg-4);
  color:var(--fg-2);font-size:10px;letter-spacing:.02em;
}
.tag.accent{background:var(--accent-dim);color:#cfd6c6}
.tag.warn{background:#3a2f1c;color:#d8b273}
.tag.danger{background:#3a2523;color:#dda49e}
.tag.ok{background:#233022;color:#a2c69c}
.hint{color:var(--fg-3);font-size:11px;line-height:1.5}
.mono{font-family:var(--mono);font-size:11px}
h3.sectitle{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);
  font-weight:600;padding:11px 12px 5px;
}
.panelhead{
  flex:0 0 auto;padding:10px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:6px;
}
.panelhead .title{font-size:12px;font-weight:600;letter-spacing:.02em}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.row{display:flex;align-items:center;gap:6px;padding:4px 12px}
.row.wrap{flex-wrap:wrap}
.row>label.lbl{flex:0 0 96px;color:var(--fg-2);font-size:11px}
.divider{height:1px;background:var(--line-soft);margin:8px 0}
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:36px 20px;text-align:center;color:var(--fg-3);
}

/* ---------- tab rail ---------- */
.tab{
  width:100%;padding:9px 4px;background:transparent;border:0;border-left:2px solid transparent;
  color:var(--fg-2);cursor:pointer;display:block;text-align:center;font-size:11px;letter-spacing:.01em;
}
.tab:hover{background:var(--bg-3);color:var(--fg-0)}
.tab.on{background:var(--bg-1);border-left-color:var(--accent);color:#e6ebe0}
.tab .dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto -2px}

/* ---------- sliders ---------- */
.sl{display:flex;align-items:center;gap:8px;padding:3px 12px}
.sl .name{flex:0 0 112px;color:var(--fg-1);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl input[type=range]{flex:1;min-width:40px;-webkit-appearance:none;background:transparent;height:16px;cursor:pointer}
.sl input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--bg-4);border-radius:2px}
.sl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;
  background:var(--fg-1);border:1px solid #0c0d0e;
}
.sl input[type=range]:hover::-webkit-slider-thumb{background:var(--accent-hi)}
.sl input[type=range]::-moz-range-track{height:3px;background:var(--bg-4);border-radius:2px}
.sl input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg-1);border:1px solid #0c0d0e}
.sl .val{flex:0 0 46px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--fg-2)}
.sl.mod .name{color:var(--accent-hi)}
.sl .reset{opacity:0;flex:0 0 12px;cursor:pointer;color:var(--fg-3);font-size:12px;line-height:1;background:none;border:0}
.sl:hover .reset{opacity:1}
.sl .reset:hover{color:var(--fg-0)}

/* ---------- media library ---------- */
#dropzone{border:1px dashed var(--line);margin:8px 12px;border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;color:var(--fg-2)}
#dropzone:hover{border-color:var(--accent);color:var(--fg-0);background:var(--bg-2)}
body.dragging #dropzone{border-color:var(--accent);background:var(--accent-dim)}
#dragveil{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(14,15,16,.86);border:2px dashed var(--accent);font-size:16px;color:var(--fg-0);
}
body.dragging #dragveil{display:flex}
.mediagrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px 12px}
.mediagrid.list{grid-template-columns:1fr;gap:3px}
.mitem{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative}
.mitem:hover{border-color:#41474b}
.mitem.sel{border-color:var(--accent);background:var(--bg-3)}
.mitem .thumb{width:100%;aspect-ratio:16/9;background:#0a0b0c;object-fit:cover;display:block}
.mitem .meta{padding:4px 6px}
.mitem .nm{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-0)}
.mitem .sub{font-size:10px;color:var(--fg-3);font-family:var(--mono);display:flex;gap:6px;flex-wrap:wrap}
.mitem .badges{position:absolute;top:3px;left:3px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 6px)}
.mitem .dur{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.72);padding:1px 4px;border-radius:2px;font-family:var(--mono);font-size:10px;color:#dfe2e2}
.mitem .acts{position:absolute;bottom:3px;right:3px;display:none;gap:3px}
.mitem:hover .acts{display:flex}
.mitem.list-mode{display:flex;align-items:center;gap:7px;padding:4px}
.mitem.list-mode .thumb{width:66px;flex:0 0 66px;aspect-ratio:16/9}
.mitem.list-mode .dur,.mitem.list-mode .badges{position:static}
.mitem.list-mode .meta{flex:1;min-width:0;padding:0}
.mitem.audio .thumb{display:flex;align-items:center;justify-content:center;color:var(--fg-3)}

/* ---------- preview ---------- */
#previewarea{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 10px 0}
#stage{
  flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;
  background:#000;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
}
#stageinner{position:relative;background:#000;box-shadow:0 0 0 1px #000}
#outcanvas{display:block;width:100%;height:100%}
#stageoverlay{position:absolute;inset:0;pointer-events:none}
#emptyprev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg-3);background:var(--bg-0)}
#splitbar{position:absolute;top:0;bottom:0;width:11px;margin-left:-5px;cursor:ew-resize;display:none;z-index:5}
#splitbar::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#fff;opacity:.85}
#splitbar .h{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.6)}
body.cmp #splitbar{display:block}
.cmplabel{position:absolute;top:6px;padding:2px 6px;background:rgba(0,0,0,.6);font-size:10px;letter-spacing:.06em;color:#e8eaea;border-radius:2px}
#transportbar{flex:0 0 38px;display:flex;align-items:center;gap:6px;padding:0 4px}
#timecode{font-family:var(--mono);font-size:12px;color:var(--fg-0)}
#timecode .tot{color:var(--fg-3)}
#scrub{flex:1;-webkit-appearance:none;background:transparent;height:16px;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:3px;background:var(--bg-4);border-radius:2px}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-3.5px;border-radius:50%;background:var(--accent-hi)}

/* ---------- timeline ---------- */
#tltoolbar{flex:0 0 30px;display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid var(--line-soft);background:var(--bg-2)}
#tlmain{flex:1;display:flex;min-height:0}
#tlgutter{width:66px;flex:0 0 66px;background:var(--bg-2);border-right:1px solid var(--line);overflow:hidden}
#tlgutter .gspacer{height:22px;border-bottom:1px solid var(--line)}
#tlgutter .glabel{
  border-bottom:1px solid var(--line-soft);font-size:10px;color:var(--fg-3);
  padding:5px 7px;letter-spacing:.06em;text-transform:uppercase;
}
#tlgutter .glabel.video{height:var(--track-h)}
#tlgutter .glabel.music{height:44px}
#tlgutter .glabel.text{height:30px}
#tlscroll{flex:1;overflow:auto;position:relative}
#tlcontent{position:relative;min-width:100%}
#ruler{height:22px;position:relative;z-index:12;background:var(--bg-2);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
#ruler .tick{position:absolute;top:0;bottom:0;border-left:1px solid #33393d}
#ruler .tick span{position:absolute;left:3px;top:4px;font-size:9.5px;color:var(--fg-3);font-family:var(--mono)}
#ruler .tick.minor{border-left-color:#262b2e}
.tltrack{position:relative;border-bottom:1px solid var(--line-soft);background:var(--bg-1)}
.tltrack.video{height:var(--track-h)}
.tltrack.music{height:44px;background:#131618}
.tltrack.text{height:30px;background:#131618}
.clip{
  position:absolute;top:2px;bottom:2px;background:var(--bg-3);border:1px solid #3a4045;border-radius:2px;
  overflow:hidden;cursor:grab;min-width:6px;
}
.clip:hover{border-color:#4d5459}
.clip.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.clip.dragging{opacity:.55;cursor:grabbing;z-index:20}
.clip .cthumb{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.5}
.clip .cbody{position:relative;padding:3px 5px;height:100%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.clip .cname{font-size:10.5px;color:#eceeee;text-shadow:0 1px 2px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .cbadges{display:flex;gap:3px;flex-wrap:wrap}
.clip .cdur{font-family:var(--mono);font-size:10px;color:#cdd1d1;text-shadow:0 1px 2px #000}
.clip .grip{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(0,0,0,.35);z-index:3}
.clip .grip:hover{background:var(--accent)}
.clip .grip.l{left:0}.clip .grip.r{right:0}
.clip.music{background:#1c2320;border-color:#2f3a34}
.clip.music canvas{position:absolute;inset:0;width:100%;height:100%}
.clip.text{background:#22201c;border-color:#3a352d}
.clip.offbeat{outline:1px dashed var(--warn);outline-offset:-3px}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:#e0574f;z-index:30;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-5px;border-left:5.5px solid transparent;border-right:5.5px solid transparent;border-top:8px solid #e0574f}
.snapline{position:absolute;top:0;bottom:0;width:1px;background:var(--accent-hi);z-index:29;pointer-events:none;display:none}
.beatmark{position:absolute;top:0;bottom:0;width:1px;background:rgba(160,180,150,.5);z-index:4;pointer-events:none}
.trans{
  position:absolute;top:3px;transform:translateX(-50%);height:17px;padding:0 5px;z-index:9;
  background:#2b3033;border:1px solid #454b50;border-radius:11px;font-size:9.5px;color:#c9cecf;
  display:flex;align-items:center;cursor:pointer;white-space:nowrap;
}
.trans:hover{border-color:var(--accent);color:#fff}
.trans.cut{opacity:.5;padding:0 3px}
.clip .grip{z-index:12}

/* ---------- stabilization ---------- */
.report{padding:2px 12px 8px}
.rrow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.rrow .k{flex:0 0 100px;color:var(--fg-2);font-size:11px;line-height:1.35}
.rrow .v{flex:1;font-size:11px;color:var(--fg-0)}
.meter{flex:1;height:4px;background:var(--bg-4);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent-hi)}
.meter i.warn{background:var(--warn)}
.meter i.danger{background:var(--danger)}
.preset-card{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:3px 12px;border-radius:var(--radius);
  background:var(--bg-2);border:1px solid var(--line-soft);cursor:pointer;
}
.preset-card:hover{border-color:#41474b;background:var(--bg-3)}
.preset-card.on{border-color:var(--accent);background:var(--bg-3)}
.preset-card .pn{font-size:11.5px;color:var(--fg-0)}
.preset-card .pd{font-size:10px;color:var(--fg-3);line-height:1.35}
.progress{height:3px;background:var(--bg-4);border-radius:2px;overflow:hidden;margin:6px 12px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .12s linear}

/* filter swatches */
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px 12px}
.fsw{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:2px;padding:4px;cursor:pointer;text-align:center}
.fsw:hover{border-color:#41474b}
.fsw.on{border-color:var(--accent);background:var(--bg-3)}
.fsw canvas{width:100%;aspect-ratio:16/9;display:block;border-radius:1px;background:#000}
.fsw span{display:block;font-size:9.5px;color:var(--fg-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsw.on span{color:var(--fg-0)}

/* ---------- modal / toast ---------- */
#modalwrap{position:fixed;inset:0;background:rgba(8,9,10,.72);z-index:300;display:none;align-items:center;justify-content:center}
#modalwrap.on{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--line);border-radius:4px;min-width:380px;max-width:640px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.modal header{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
.modal .body{padding:12px 14px;overflow-y:auto}
.modal footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end}
#toasts{position:fixed;right:12px;bottom:12px;z-index:400;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--bg-3);border:1px solid var(--line);border-left:2px solid var(--accent);padding:7px 11px;border-radius:2px;font-size:11.5px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast .t2{color:var(--fg-2);font-size:10.5px;margin-top:2px;line-height:1.45}

/* tooltips */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  background:#0a0b0c;border:1px solid var(--line);color:var(--fg-0);font-size:10.5px;padding:4px 7px;
  border-radius:2px;white-space:pre-line;z-index:500;pointer-events:none;
  max-width:260px;width:max-content;box-shadow:0 6px 18px rgba(0,0,0,.55);
}
.scroll [data-tip]:hover::after,#panelbody [data-tip]:hover::after,#inspector [data-tip]:hover::after{
  left:0;transform:none;max-width:236px;
}
[data-tip].tipup:hover::after{top:auto;bottom:calc(100% + 5px)}
.busy{position:relative;pointer-events:none;opacity:.6}

</style>
<div id="app">
  <div id="topbar">
    <span style="font-weight:700;letter-spacing:.02em;color:var(--fg-0)">Master Bostadsfilm</span>
    <span class="sep"></span>
    <input type="text" id="projname" style="width:172px" data-tip="Projektets namn">
    <button class="btn icon" id="btnUndo" data-tip="Ångra (Ctrl+Z)">↶</button>
    <button class="btn icon" id="btnRedo" data-tip="Gör om (Ctrl+Shift+Z)">↷</button>
    <button class="btn" id="btnSave" data-tip="Spara projekt (Ctrl+S)">Spara</button>
    <button class="btn" id="btnProjects" data-tip="Projekt: nytt, duplicera, importera, exportera">Projekt</button>
    <span class="sep"></span>
    <label class="hint">Format</label>
    <select id="selAspect" data-tip="Bildformat"></select>
    <select id="selRes" data-tip="Upplösning"></select>
    <select id="selFps" data-tip="Framerate"></select>
    <span class="sep"></span>
    <label class="hint">Preview</label>
    <select id="selPQ" data-tip="Preview quality — lägre = mjukare uppspelning"></select>
    <span class="spacer"></span>
    <span id="autosave" class="tag" data-tip="Autosave-status">Autosave</span>
    <span id="storagestat" class="tag" data-tip="Lokal lagring (IndexedDB)">Lagring</span>
    <button class="btn primary" id="btnExport" data-tip="Öppna exportpanelen">Exportera</button>
  </div>

  <div id="mid">
    <div id="leftpanel">
      <div id="tabrail"></div>
      <div id="panelbody"></div>
    </div>

    <div id="center">
      <div id="previewarea">
        <div id="stage">
          <div id="stageinner">
            <canvas id="outcanvas"></canvas>
            <div id="stageoverlay"></div>
            <div id="splitbar"><div class="h"></div></div>
          </div>
          <div id="emptyprev">
            <div style="font-size:15px;color:var(--fg-1)">Ingen film ännu</div>

/* ===== 00-utils.js ===== */
/* ============================================================

const U = (() => {
  const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const round = (v, d = 2) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };

  function tc(sec, withFrames = true, fps = 30) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    if (!withFrames) return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    const f = Math.floor((sec % 1) * fps);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
  }
  const dur = s => (!isFinite(s) ? '–' : s < 60 ? s.toFixed(1) + 's' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`);
  const bytes = b => {
    if (b == null || !isFinite(b)) return '–';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(b < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
  };

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  }
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
  const clone = o => JSON.parse(JSON.stringify(o));

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  const raf = () => new Promise(r => requestAnimationFrame(r));
  const idle = () => new Promise(r => (window.requestIdleCallback || setTimeout)(r, 1));

  /* --- tiny emitter --- */
  class Emitter {
    constructor() { this.m = new Map(); }
    on(e, f) { (this.m.get(e) || this.m.set(e, []).get(e)).push(f); return () => this.off(e, f); }
    off(e, f) { const a = this.m.get(e); if (a) a.splice(a.indexOf(f) >>> 0, 1); }
    emit(e, ...d) { (this.m.get(e) || []).forEach(f => { try { f(...d); } catch (err) { console.error('[' + e + ']', err); } }); }
  }

  /* --- toasts --- */
  function toast(title, detail, kind) {
    const host = $('#toasts');
    const n = el('div', { class: 'toast' + (kind ? ' ' + kind : '') }, el('div', { text: title }), detail ? el('div', { class: 't2', text: detail }) : null);
    host.append(n);
    setTimeout(() => { n.style.transition = 'opacity .3s'; n.style.opacity = '0'; setTimeout(() => n.remove(), 320); }, kind === 'err' ? 8000 : 4200);
    return n;
  }
  const errToast = (ctx, e) => { console.error(ctx, e); toast(ctx, (e && (e.message || e.name)) || String(e), 'err'); };

  /* --- modal --- */
  function modal({ title, body, actions, wide }) {
    const wrap = $('#modalwrap'), m = $('#modal');
    clear(m);
    if (wide) m.style.minWidth = '620px'; else m.style.minWidth = '380px';
    m.append(el('header', {}, title));
    const b = el('div', { class: 'body' }); if (body) b.append(body); m.append(b);
    const close = () => { wrap.classList.remove('on'); clear(m); };
    const f = el('footer');
    (actions || [{ label: 'Stäng' }]).forEach(a => {
      f.append(el('button', {
        class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''),

    });
    m.append(f);

  }

  /* --- controls --- */
  function slider(name, value, min, max, step, onInput, opts = {}) {
    const fmt = opts.fmt || (v => (step >= 1 ? v.toFixed(0) : v.toFixed(2)));
    const def = opts.def != null ? opts.def : 0;
    const val = el('span', { class: 'val', text: fmt(value) });
    const inp = el('input', { type: 'range', min, max, step, value });
    const wrap = el('div', { class: 'sl' + (Math.abs(value - def) > 1e-6 ? ' mod' : '') },
      el('span', { class: 'name', text: name, title: name }), inp, val,
      el('button', { class: 'reset', title: 'Återställ', onclick: () => { inp.value = def; inp.dispatchEvent(new Event('input')); } }, '⨯'));
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      val.textContent = fmt(v);
      wrap.classList.toggle('mod', Math.abs(v - def) > 1e-6);
      onInput(v);
    });
    wrap.setValue = v => { inp.value = v; val.textContent = fmt(v); wrap.classList.toggle('mod', Math.abs(v - def) > 1e-6); };
    if (opts.tip) { wrap.setAttribute('data-tip', opts.tip); wrap.classList.add('tipup'); }
    return wrap;
  }
  function check(label, value, onChange, tip) {
    const inp = el('input', { type: 'checkbox', onchange: () => onChange(inp.checked) });
    inp.checked = !!value;
    const r = el('label', { class: 'row', style: { cursor: 'pointer', padding: '3px 12px' } }, inp, el('span', { text: label, style: { fontSize: '11px' } }));
    if (tip) { r.setAttribute('data-tip', tip); r.classList.add('tipup'); }
    r.setValue = v => { inp.checked = !!v; };
    return r;
  }
  function select(options, value, onChange, tip) {
    const s = el('select', { onchange: () => onChange(s.value) });
    options.forEach(o => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      s.append(el('option', { value: v, selected: String(v) === String(value) }, l));
    });
    s.value = value;
    if (tip) s.setAttribute('data-tip', tip);
    return s;
  }
  function num(value, onChange, opts = {}) {
    const i = el('input', { type: 'number', value, step: opts.step || 0.1, min: opts.min, max: opts.max, style: { width: (opts.w || 66) + 'px' } });
    i.addEventListener('change', () => { let v = parseFloat(i.value); if (!isFinite(v)) v = 0; if (opts.min != null) v = Math.max(opts.min, v); if (opts.max != null) v = Math.min(opts.max, v); i.value = round(v, 3); onChange(v); });
    return i;
  }
  const section = t => el('h3', { class: 'sectitle', text: t });
  const row = (...k) => el('div', { class: 'row' }, ...k);
  const lrow = (label, ...k) => el('div', { class: 'row' }, el('label', { class: 'lbl', text: label }), ...k);

  /* --- pointer drag helper --- */
  function drag(startEvt, { onMove, onEnd, cursor }) {
    startEvt.preventDefault();
    const x0 = startEvt.clientX, y0 = startEvt.clientY;
    const prevCursor = document.body.style.cursor;
    if (cursor) document.body.style.cursor = cursor;
    let moved = false;
    const mv = e => { moved = moved || Math.abs(e.clientX - x0) > 2 || Math.abs(e.clientY - y0) > 2; onMove && onMove(e.clientX - x0, e.clientY - y0, e, moved); };
    const up = e => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      document.body.style.cursor = prevCursor; onEnd && onEnd(moved, e);
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  }

  const ASPECTS = { '16:9': 16 / 9, '9:16': 9 / 16, '4:5': 4 / 5, '1:1': 1 };
  function frameSize(aspect, height) {
    const r = ASPECTS[aspect] || 16 / 9;
    let h = height, w = Math.round(h * r);
    if (w % 2) w++; if (h % 2) h++;
    return { w, h };
  }

  return {
    uid, clamp, lerp, round, tc, dur, bytes, el, $, $$, clear, clone, debounce, raf, idle,
    Emitter, toast, errToast, modal, slider, check, select, num, section, row, lrow, drag, ASPECTS, frameSize
  };
})();
