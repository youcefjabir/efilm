        g.beginPath(); g.moveTo(w * i / 3, 0); g.lineTo(w * i / 3, h); g.stroke();
        g.beginPath(); g.moveTo(0, h * i / 3); g.lineTo(w, h * i / 3); g.stroke();
      }
      g.strokeStyle = 'rgba(109,114,102,.85)';
      g.strokeRect(w * .05, h * .05, w * .9, h * .9);
      g.setLineDash([6, 6]); g.strokeStyle = 'rgba(255,255,255,.35)';
      g.strokeRect(w * .1, h * .1, w * .8, h * .8);
      g.restore();
    }
    if (view.compare && !view.exporting) {
      const x = Math.round(w * view.compareX);
      g.save();
      g.strokeStyle = '#fff'; g.lineWidth = Math.max(1, h / 700);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
      g.font = `600 ${Math.round(h * .022)}px -apple-system,sans-serif`;
      g.fillStyle = 'rgba(0,0,0,.55)';
      g.fillRect(8, 8, h * .13, h * .04); g.fillRect(x + 8, 8, h * .11, h * .04);
      g.fillStyle = '#fff'; g.textBaseline = 'top';
      g.fillText('EFTER', 16, 8 + h * .008); g.fillText('FÖRE', x + 16, 8 + h * .008);
      g.restore();
    }
  }
  function drawText(g, tx, alpha, w, h) {
    const size = h * (tx.size || 4) / 100;
    const pad = h * .07;
    g.save();
    g.globalAlpha = alpha;
    g.textBaseline = 'alphabetic';
    const preset = M.TEXT_PRESETS.find(p => p.id === tx.preset) || M.TEXT_PRESETS[0];
    const st = preset.style;
    let x = tx.align === 'center' ? w / 2 : tx.align === 'right' ? w - pad : pad;
    let y = tx.pos === 'center' ? h / 2 : tx.pos === 'upper' ? pad + size : h - pad;
    g.textAlign = tx.align === 'center' ? 'center' : tx.align === 'right' ? 'right' : 'left';
    if (st.plate) { g.fillStyle = 'rgba(10,11,12,.82)'; g.fillRect(0, 0, w, h); }
    if (st.bar) {
      g.fillStyle = 'rgba(109,114,102,.95)';
      const bw = Math.max(2, h * .004), bh = size * 1.9;
      if (tx.align === 'left') g.fillRect(x - bw * 4, y - bh + size * .25, bw, bh);
    }
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = h * .012; g.shadowOffsetY = h * .002;
    g.fillStyle = tx.color || '#f2f3f1';
    g.font = `${st.weight} ${size}px -apple-system,"Segoe UI",Roboto,Helvetica,sans-serif`;
    if (st.track) g.letterSpacing = (size * st.track) + 'px';
    const subSize = size * .42;
    if (tx.pos === 'center') {
      g.fillText(tx.title || '', x, y);
      if (tx.sub) { g.font = `400 ${subSize}px -apple-system,sans-serif`; g.letterSpacing = (subSize * .12) + 'px'; g.globalAlpha = alpha * .82; g.fillText(tx.sub, x, y + size * .95); }
    } else {
      if (tx.sub) { g.font = `400 ${subSize}px -apple-system,sans-serif`; g.letterSpacing = (subSize * .12) + 'px'; g.globalAlpha = alpha * .82; g.fillText(tx.sub, x, y); g.globalAlpha = alpha; }
      g.font = `${st.weight} ${size}px -apple-system,"Segoe UI",Roboto,sans-serif`;
      if (st.track) g.letterSpacing = (size * st.track) + 'px';
      g.fillText(tx.title || '', x, y - (tx.sub ? subSize * 1.5 : 0));
    }
    g.restore();
  }

  /* ---------- musik ---------- */
  function syncMusic(t, project, playing) {
    const list = project.tracks.music;
    const a = list.find(c => t >= c.start && t < c.start + (c.out - c.in));
    if (!a) { if (musicEl && !musicEl.paused) musicEl.pause(); if (musicGain) musicGain.gain.value = 0; return; }
    const media = M.mediaById(project, a.mediaId);
    if (!media || !media.url) return;
    if (!musicEl) {
      musicEl = document.createElement('audio');
      musicEl.preload = 'auto';
      try { musicSrc = ctx().createMediaElementSource(musicEl); musicGain = ctx().createGain(); musicSrc.connect(musicGain); musicGain.connect(master); }
      catch (e) { }
    }
    if (musicEl._mediaId !== media.id) { musicEl.src = media.url; musicEl._mediaId = media.id; musicEl.load(); }
    musicClipId = a.id;
    const local = t - a.start;
    const target = a.in + local;
    if (Math.abs(musicEl.currentTime - target) > 0.3) { try { musicEl.currentTime = target; } catch (e) { } }
    if (playing && musicEl.paused) { const p = musicEl.play(); if (p && p.catch) p.catch(() => { }); }
    if (!playing && !musicEl.paused) musicEl.pause();
    let v = a.muted ? 0 : a.volume / 100;
    const len = a.out - a.in;
    if (a.fade.in > 0) v *= U.clamp(local / a.fade.in, 0, 1);
    if (a.fade.out > 0) v *= U.clamp((len - local) / a.fade.out, 0, 1);
    // auto fade mot filmens slut
    const total = M.totalDuration(project);
    if (total - t < 1.6) v *= U.clamp((total - t) / 1.6, 0, 1);
    if (musicGain) { try { musicGain.gain.setTargetAtTime(v, audioCtx.currentTime, .06); } catch (e) { musicGain.gain.value = v; } }
    return a;
  }
  function duckFactor(t, project) {
    const a = project.tracks.music.find(c => t >= c.start && t < c.start + (c.out - c.in));
    return (a && a.duck) ? 0.35 : 1;
  }

  /* ---------- loop ---------- */
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const project = S.project;
    const dt = Math.min(.25, (now - lastNow) / 1000 || 0);
    lastNow = now;
    let t = S.st.playhead;
    if (S.st.playing) {
      t += dt;
      const total = M.totalDuration(project);
      const sel = view.loopClip ? S.primaryClip() : null;
      if (sel && sel.kind === 'video') {
        const e0 = sel.start, e1 = sel.start + M.clipDuration(sel);
        if (t >= e1 || t < e0) t = e0;
      } else if (t >= total) {
        if (view.loopClip) t = 0; else { t = total; S.st.playing = false; S.bus.emit('playstate', false); }
      }
      S.st.playhead = t;
      S.bus.emit('time', t);
    }
    const duck = duckFactor(t, project);
    renderAt(t, project, { playing: S.st.playing, duck });
    syncMusic(t, project, S.st.playing);
    if (onFrame) onFrame(t);
  }
  function start() { if (!raf) { lastNow = performance.now(); raf = requestAnimationFrame(tick); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function play() {
    resume();
    const total = M.totalDuration(S.project);
    if (S.st.playhead >= total - .02) S.st.playhead = 0;
    S.st.playing = true; S.bus.emit('playstate', true);
  }
  function pause() {
    S.st.playing = false; S.bus.emit('playstate', false);
    for (const [, e] of pool) { try { e.video.pause(); } catch (x) { } }
    if (musicEl) { try { musicEl.pause(); } catch (x) { } }
  }
  const toggle = () => S.st.playing ? pause() : play();

  return {
    start, stop, play, pause, toggle, renderAt, view, releaseAll, release, acquire,
    setMasterVolume, setMuted, audioDest, ctx, resume, sourceTime, motionAt, syncMusic, duckFactor,
    set frameHook(f) { onFrame = f; },
    get pool() { return pool; },
    get musicEl() { return musicEl; },
  };
})();


/* ===== 80-timeline.js ===== */
/* ============================================================
   80 — Timeline: rendering, drag, trim, snapping, zoom
   ============================================================ */
const Timeline = (() => {
  let pps = 60;                 // pixlar per sekund
  let snap = true;
  let scroll, content, ruler, trackV, trackM, trackT, playhead, snapline;
  const PAD = 40;

  function init() {
    scroll = U.$('#tlscroll'); content = U.$('#tlcontent');
    U.clear(content);
    ruler = U.el('div', { id: 'ruler' });
    trackV = U.el('div', { class: 'tltrack video' });
    trackM = U.el('div', { class: 'tltrack music' });
    trackT = U.el('div', { class: 'tltrack text' });
    playhead = U.el('div', { id: 'playhead' });
    snapline = U.el('div', { class: 'snapline' });
    content.append(ruler, trackV, trackM, trackT, playhead, snapline);

    ruler.addEventListener('pointerdown', e => {
      const scrubTo = ev => {
        const x = ev.clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft;
        S.seek(Math.max(0, x / pps));
      };
      scrubTo(e);
      U.drag(e, { onMove: (dx, dy, ev) => scrubTo(ev), cursor: 'ew-resize' });
    });
    [trackV, trackM, trackT].forEach(tr => tr.addEventListener('pointerdown', e => {
      if (e.target === tr) { S.selectClips([]); }
    }));
    // släpp media direkt på timelinen
    content.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    content.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/media-id');
      if (!id) return;
      const m = M.mediaById(S.project, id);
      if (!m) return;
      const x = e.clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft;
      App.addMediaToTimeline(m, m.type === 'audio' ? Math.max(0, x / pps) : null);
    });
    S.bus.on('change', render);
    S.bus.on('project', () => { zoomFit(); render(); });
    S.bus.on('selection', render);
    S.bus.on('seek', updatePlayhead);
    S.bus.on('time', updatePlayhead);
    render();
  }

  const timeAt = clientX => (clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft) / pps;

  /* ---------- snapping ---------- */
  function snapTargets(exceptId) {
    const p = S.project, out = [0, M.totalDuration(p), S.st.playhead];
    for (const c of p.tracks.video) { if (c.id === exceptId) continue; out.push(c.start, c.start + M.clipDuration(c)); }
    for (const c of p.tracks.music) { if (c.id === exceptId) continue; out.push(c.start, c.start + (c.out - c.in)); }
    for (const c of p.tracks.text) { if (c.id === exceptId) continue; out.push(c.start, c.start + c.duration); }
    for (const c of p.tracks.music) {
      const m = M.mediaById(p, c.mediaId);
      if (m && m.beats && App.state.snapBeats) for (const b of m.beats) { const t = c.start + (b - c.in); if (t >= 0) out.push(t); }
    }
    return out;
  }
  function applySnap(t, exceptId) {
    if (!snap) return { t, hit: null };
    const tol = 8 / pps;
    let best = null, bd = tol;
    for (const s of snapTargets(exceptId)) { const d = Math.abs(s - t); if (d < bd) { bd = d; best = s; } }
    return best != null ? { t: best, hit: best } : { t, hit: null };
  }
  function showSnap(t) {
    if (t == null) { snapline.style.display = 'none'; return; }
    snapline.style.display = 'block';
    snapline.style.left = (t * pps) + 'px';
  }

  /* ---------- rendering ---------- */
  function render() {
    if (!content) return;
    const p = S.project;
    const total = M.totalDuration(p);
    const w = Math.max(scroll.clientWidth, total * pps + PAD);
    content.style.width = w + 'px';
    renderRuler(total, w);
    renderVideo(p);
    renderMusic(p);
    renderText(p);
    updatePlayhead();
    const zi = U.$('#tlzoomval'); if (zi) zi.textContent = pps.toFixed(0) + ' px/s';
    const info = U.$('#tlinfo');
    if (info) info.textContent = `${p.tracks.video.length} klipp · ${U.tc(total, false)} totalt`;
    const sel = U.$('#tlsel');
    if (sel) {
      const cs = S.selectedClips();
      sel.textContent = cs.length ? (cs.length === 1 ? nameOf(cs[0]) + ' · ' + U.dur(lenOf(cs[0])) : cs.length + ' klipp markerade') : 'Inget markerat';
    }
  }
  const nameOf = c => c.kind === 'text' ? (c.title || 'Text') : (M.mediaById(S.project, c.mediaId) || { name: '?' }).name;
  const lenOf = c => c.kind === 'video' ? M.clipDuration(c) : c.kind === 'text' ? c.duration : (c.out - c.in);

  function renderRuler(total, w) {
    U.clear(ruler);
    const steps = [.1, .25, .5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
    const step = steps.find(s => s * pps >= 62) || 600;
    const sub = step / (step >= 5 ? 5 : 2);
    for (let t = 0; t <= (w / pps); t += sub) {
      const major = Math.abs(t / step - Math.round(t / step)) < 1e-6;
      const d = U.el('div', { class: 'tick' + (major ? '' : ' minor'), style: { left: (t * pps) + 'px' } });
      if (major) d.append(U.el('span', { text: U.tc(t, false) }));
      ruler.append(d);
      if (t > 100000) break;
    }
  }

  function badges(c) {
    const b = [];
    if (c.stabEnabled) b.push(U.el('span', { class: 'tag accent', text: 'STAB' }));
    if (c.filter && c.filter !== 'none') b.push(U.el('span', { class: 'tag', title: M.filterById(c.filter).name, text: M.filterById(c.filter).name.split(' ')[0].slice(0, 5).toUpperCase() }));
    else if (!Color.isNeutral(Color.effective(c))) b.push(U.el('span', { class: 'tag', text: 'GRADE' }));
    if (Math.abs((c.speed || 1) - 1) > .001) b.push(U.el('span', { class: 'tag', text: (c.speed).toFixed(2).replace(/0$/, '') + '×' }));
    if (c.reverse) b.push(U.el('span', { class: 'tag', text: 'REV' }));
    if (c.motion && c.motion.preset !== 'none') b.push(U.el('span', { class: 'tag', text: 'MOVE' }));
    if (c._deviation > .55) b.push(U.el('span', { class: 'tag warn', text: 'AVVIKER' }));
    return b;
  }

  function renderVideo(p) {
    U.clear(trackV);
    const selIds = new Set(S.sel.clips);
    p.tracks.video.forEach((c, i) => {
      const m = M.mediaById(p, c.mediaId);
      const dur = M.clipDuration(c);
      const left = c.start * pps, wid = Math.max(6, dur * pps);
      const node = U.el('div', {
        class: 'clip' + (selIds.has(c.id) ? ' sel' : '') + (c._deviation > .55 ? ' offbeat' : ''),
        style: { left: left + 'px', width: wid + 'px' },
        'data-id': c.id,
      });
      if (m && m.strip) {
        const srcDur = m.duration || 1;
        const full = wid * (srcDur / Math.max(.05, (c.out - c.in)));
        node.append(U.el('div', {
          class: 'cthumb',
          style: { backgroundImage: `url(${m.strip})`, backgroundSize: `${full}px 100%`, backgroundPosition: `${-full * (c.in / srcDur)}px 0`, backgroundRepeat: 'no-repeat' },
        }));
      }
      node.append(U.el('div', { class: 'cbody' },
        U.el('div', { class: 'cname', text: (m ? m.name : 'Saknad fil') }),
        U.el('div', { class: 'cbadges' }, badges(c)),
        U.el('div', { class: 'cdur', text: U.dur(dur) })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'video', i));
      node.addEventListener('dblclick', () => { S.seek(c.start); S.selectClips([c.id]); });
      trackV.append(node);
      // övergångsmarkör vid starten
      if (i > 0) {
        const tr = c.transitionIn || { type: 'cut', dur: 0 };
        const t = M.transById(tr.type);
        const chip = U.el('div', {
          class: 'trans' + (tr.type === 'cut' ? ' cut' : ''), style: { left: left + 'px' },
          'data-tip': t.name + (tr.dur ? ` · ${tr.dur.toFixed(1)}s` : ''), title: t.name,
          onpointerdown: e => { e.stopPropagation(); S.selectClips([c.id]); Panels.open('trans'); },
        }, tr.type === 'cut' ? '│' : t.name.split(' ')[0] + (tr.dur ? ' ' + tr.dur.toFixed(1) + 's' : ''));
        trackV.append(chip);
      }
    });
    if (!p.tracks.video.length) {
      trackV.append(U.el('div', { class: 'hint', style: { padding: '22px 14px' } }, 'Dra videoklipp hit från mediabiblioteket'));
    }
  }

  function renderMusic(p) {
    U.clear(trackM);
    const selIds = new Set(S.sel.clips);
    for (const c of p.tracks.music) {
      const m = M.mediaById(p, c.mediaId);
      const len = c.out - c.in;
      const wid = Math.max(6, len * pps);
      const node = U.el('div', { class: 'clip music' + (selIds.has(c.id) ? ' sel' : ''), style: { left: (c.start * pps) + 'px', width: wid + 'px' }, 'data-id': c.id });
      const cv = U.el('canvas'); node.append(cv);
      requestAnimationFrame(() => drawWave(cv, m, c, Math.min(wid, 4000)));
      node.append(U.el('div', { class: 'cbody' },
        U.el('div', { class: 'cname', text: (m ? m.name : 'Saknat ljud') + (c.muted ? ' (mute)' : '') }),
        U.el('div', { class: 'cdur', text: U.dur(len) + (m && m.bpm ? ` · ${m.bpm} BPM` : '') })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'music'));
      trackM.append(node);
      if (m && m.beats && App.state.showBeats) {
        for (const b of m.beats) {
          const t = c.start + (b - c.in);
          if (t < c.start || t > c.start + len) continue;
          trackM.append(U.el('div', { class: 'beatmark', style: { left: (t * pps) + 'px' } }));
        }
      }
    }
    if (!p.tracks.music.length) trackM.append(U.el('div', { class: 'hint', style: { padding: '13px 14px' } }, 'Musikspår — ladda upp en låt i Ljud-panelen'));
  }
  function drawWave(cv, m, c, w) {
    if (!m || !m.wave) return;
    const h = cv.clientHeight || 40;
    cv.width = Math.max(2, Math.round(w)); cv.height = h;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, h);
    g.fillStyle = 'rgba(140,160,132,.55)';
    const N = m.wave.length, dur = m.duration || 1;
    for (let x = 0; x < cv.width; x++) {
      const t = c.in + (x / cv.width) * (c.out - c.in);
      const i = U.clamp(Math.floor(t / dur * N), 0, N - 1);
      const v = (m.wave[i] / 255) * (h * .46);
      g.fillRect(x, h / 2 - v, 1, v * 2);
    }
  }

  function renderText(p) {
    U.clear(trackT);
    const selIds = new Set(S.sel.clips);
    for (const c of p.tracks.text) {
      const node = U.el('div', {
        class: 'clip text' + (selIds.has(c.id) ? ' sel' : ''),
        style: { left: (c.start * pps) + 'px', width: Math.max(8, c.duration * pps) + 'px' }, 'data-id': c.id,
      });
      node.append(U.el('div', { class: 'cbody' }, U.el('div', { class: 'cname', text: c.title || 'Text' })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'text'));
      trackT.append(node);
    }
    if (!p.tracks.text.length) trackT.append(U.el('div', { class: 'hint', style: { padding: '7px 14px' } }, 'Textspår'));
  }

  function updatePlayhead() {
    if (!playhead) return;
    playhead.style.left = (S.st.playhead * pps) + 'px';
    if (S.st.playing) {
      const x = S.st.playhead * pps, l = scroll.scrollLeft, w = scroll.clientWidth;
      if (x < l || x > l + w - 40) scroll.scrollLeft = Math.max(0, x - w * .35);

  }

  /* ---------- interaktion ---------- */
  function onClipDown(e, clip, kind, index) {
    e.stopPropagation();

    if (e.shiftKey || e.metaKey || e.ctrlKey) S.toggleClip(clip.id);
    else if (!S.sel.clips.includes(clip.id)) S.selectClips([clip.id]);
    if (grip) return startTrim(e, clip, kind, grip);
    startMove(e, clip, kind, index);
  }

  function startTrim(e, clip, kind, side) {
    const t0 = timeAt(e.clientX);
    const orig = { in: clip.in, out: clip.out, start: clip.start, duration: clip.duration };
    const media = M.mediaById(S.project, clip.mediaId);
    const maxDur = media ? media.duration : (clip.out || 10);
    U.drag(e, {
      cursor: 'ew-resize',
      onMove: (dx, dy, ev) => {
        let t = timeAt(ev.clientX);
        const sn = applySnap(t, clip.id); t = sn.t; showSnap(sn.hit);
        const d = t - t0;
        S.update(p => {
          const c = M.findClip(p, clip.id); if (!c) return;
          if (kind === 'text') {
            if (side === 'l') { const ns = U.clamp(orig.start + d, 0, orig.start + orig.duration - .2); c.duration = orig.duration - (ns - orig.start); c.start = ns; }
            else c.duration = Math.max(.2, orig.duration + d);
            return;
          }
          const speed = kind === 'video' ? Math.max(.05, c.speed || 1) : 1;
          if (side === 'l') {
            const ni = U.clamp(orig.in + d * speed, 0, orig.out - .08);
            c.in = ni;
            if (kind === 'music') c.start = U.clamp(orig.start + (ni - orig.in), 0, 1e6);
          } else {
            c.out = U.clamp(orig.out + d * speed, c.in + .08, maxDur);
          }
        }, 'trim', true);
      },
      onEnd: () => { showSnap(null); S.bus.emit('change', 'trim-end'); },
    });
  }

  function startMove(e, clip, kind, index) {
    const t0 = timeAt(e.clientX);
    const orig = clip.start;
    let moved = false;
    const node = e.currentTarget;
    U.drag(e, {
      cursor: 'grabbing',
      onMove: (dx, dy, ev, didMove) => {
        if (!didMove) return;
        moved = true;
        node.classList.add('dragging');
        if (kind === 'video') {
          // ordningsändring: hitta målindex utifrån muspekarens position
          const t = timeAt(ev.clientX);
          const list = S.project.tracks.video;
          let target = list.length - 1;
          for (let i = 0; i < list.length; i++) {
            const c = list[i], d = M.clipDuration(c);
            if (t < c.start + d / 2) { target = i; break; }
          }
          const from = list.findIndex(c => c.id === clip.id);
          if (target !== from && target >= 0) {
            S.update(p => {
              const arr = p.tracks.video;
              const f = arr.findIndex(c => c.id === clip.id);
              const [it] = arr.splice(f, 1);
              arr.splice(U.clamp(target, 0, arr.length), 0, it);
              M.relayout(arr);
            }, 'reorder', true);
          }
          showSnap(null);
        } else {
          let t = orig + (timeAt(ev.clientX) - t0);
          const sn = applySnap(t, clip.id); t = Math.max(0, sn.t); showSnap(sn.hit);
          S.update(p => { const c = M.findClip(p, clip.id); if (c) c.start = t; }, 'move', true);
        }
      },
      onEnd: () => {
        node.classList.remove('dragging');
        showSnap(null);
        if (moved) S.bus.emit('change', 'move-end');
      },
    });
  }

  /* ---------- zoom ---------- */
  function setZoom(v, anchorTime) {
    const old = pps;
    pps = U.clamp(v, 2, 800);
    if (anchorTime != null && scroll) {
      const x = anchorTime * old - scroll.scrollLeft;
      scroll.scrollLeft = Math.max(0, anchorTime * pps - x);
    }
    render();
  }
  const zoomIn = () => setZoom(pps * 1.35, S.st.playhead);
  const zoomOut = () => setZoom(pps / 1.35, S.st.playhead);
  function zoomFit() {
    const total = M.totalDuration(S.project) || 10;
    const w = (scroll ? scroll.clientWidth : 900) - PAD;
    setZoom(U.clamp(w / total, 2, 400));
  }
  const setSnap = v => { snap = v; };

  return { init, render, updatePlayhead, zoomIn, zoomOut, zoomFit, setZoom, setSnap, get pps() { return pps; }, get snap() { return snap; }, drawWave };
})();

        { def, fmt: v => step < 1 ? v.toFixed(2) : v.toFixed(0) }));
    }
    return panel('Bild', null, ...body);
  }
  function drawSwatch(cv, thumbSrc, f) {
    const img = new Image();
    img.onload = () => {
      const g = cv.getContext('2d');
      const gr = { ...M.emptyGrade(), ...f.g };
      // approximativ förhandsvisning med canvas-filter (den riktiga körs i GPU-shadern)
      const br = Math.pow(2, gr.exposure) * (1 + gr.shadows / 500 - gr.highlights / 900);
      const ct = 1 + gr.contrast / 160, sa = 1 + gr.saturation / 130 + gr.vibrance / 260;
      const hue = gr.temperature * -0.06 + gr.tint * 0.05;
      g.filter = `brightness(${br.toFixed(3)}) contrast(${ct.toFixed(3)}) saturate(${sa.toFixed(3)}) hue-rotate(${hue.toFixed(1)}deg) sepia(${Math.max(0, gr.temperature) / 400})`;
      g.drawImage(img, 0, 0, cv.width, cv.height);
      g.filter = 'none';
    };
    img.src = thumbSrc;
  }

/* ============================================================
   Inspektor — klippverktyg
   ============================================================ */
const Inspector = (() => {
  function render() {
    const host = U.$('#inspector'); if (!host) return;
    const top = host.scrollTop;
    U.clear(host);
    const clip = S.primaryClip();
    if (!clip) {
      host.append(U.el('div', { class: 'panelhead' }, U.el('span', { class: 'title', text: 'Klippverktyg' })),
        U.el('div', { class: 'empty' }, U.el('div', { text: 'Inget klipp markerat' }),
          U.el('div', { class: 'hint' }, 'Klicka på ett klipp i timelinen för att redigera in-/utpunkt, hastighet, bild och stabilisering.')));
      return;
    }
    if (clip.kind !== 'video') { renderOther(host, clip); return; }
    const p = S.project;
    const media = M.mediaById(p, clip.mediaId);
    const dur = M.clipDuration(clip);
    const set = (fn, label, coalesce) => S.update(pp => fn(M.findClip(pp, clip.id), pp), label, coalesce);
    const body = [];

    body.push(U.el('div', { class: 'panelhead' },
      U.el('span', { class: 'title', text: media ? media.name : 'Klipp' }),
      U.el('span', { class: 'spacer' }),
      U.el('span', { class: 'tag mono', text: U.dur(dur) })));

    const sc = U.el('div', { class: 'scroll' });
    body.push(sc);
    const add = (...n) => sc.append(...n.filter(Boolean));

    add(U.section('Tid'));
    add(U.lrow('In point', U.num(U.round(clip.in, 2), v => set(c => { c.in = U.clamp(v, 0, c.out - .05); }, 'in'), { min: 0, step: .05 }), U.el('span', { class: 'hint', text: 's' })));
    add(U.lrow('Out point', U.num(U.round(clip.out, 2), v => set(c => { c.out = U.clamp(v, c.in + .05, media ? media.duration : v); }, 'out'), { min: 0, step: .05 }), U.el('span', { class: 'hint', text: 's' })));
    add(U.lrow('Duration', U.num(U.round(dur, 2), v => set(c => { c.out = U.clamp(c.in + v * c.speed, c.in + .05, media ? media.duration : c.out); }, 'dur'), { min: .05, step: .1 }), U.el('span', { class: 'hint', text: 's' })));

    add(U.section('Hastighet'));
    const speeds = [.5, .75, 1, 1.25, 1.5, 2];
    add(U.el('div', { class: 'row wrap' }, ...speeds.map(s =>
      U.el('button', { class: 'btn sm' + (Math.abs(clip.speed - s) < .001 ? ' on' : ''), onclick: () => set(c => { c.speed = s; }, 'speed') }, s + '×'))));
    add(U.slider('Speed', clip.speed, .25, 4, .05, v => set(c => { c.speed = v; }, 'speed', true), { def: 1, fmt: v => v.toFixed(2) + '×' }));
    const fitInp = U.num(U.round(dur, 1), () => { }, { min: .2, step: .1, w: 60 });
    add(U.lrow('Fit to duration', fitInp, U.el('button', {
      class: 'btn sm', 'data-tip': 'Räknar ut hastigheten som ger önskad klipplängd',
      onclick: () => {
        const want = parseFloat(fitInp.value);
        if (!(want > .1)) return;
        const sp = U.clamp((clip.out - clip.in) / want, .1, 8);
        set(c => { c.speed = sp; }, 'fit');
        U.toast('Hastighet satt till ' + sp.toFixed(2) + '×', 'Klipplängd ' + want.toFixed(1) + ' s');
      }
    }, 'Räkna ut')));
    add(U.el('div', { class: 'row wrap' },
      U.el('button', { class: 'btn sm' + (clip.reverse ? ' on' : ''), onclick: () => set(c => { c.reverse = !c.reverse; }, 'rev'), 'data-tip': 'Baklängesuppspelning (stegvis i preview)' }, 'Reverse'),

    const set = (k, v) => S.update(pp => { const x = M.findClip(pp, clip.id); if (k.includes('.')) { const [a, b] = k.split('.'); x[a][b] = v; } else x[k] = v; }, 'i-' + k, true);

/* ===== 90-export.js ===== */
/* ============================================================
   90 — Export: riktig rendering via canvas.captureStream + MediaRecorder

   Renderingen sker i realtid genom samma pipeline som previewn, i full
   projektupplösning. Ljudet tas från Web Audio-grafen. Vill man senare
   flytta renderingen till en backend-worker byter man bara ut runExport()
   — resten av editorn är oberoende av den.
   ============================================================ */
const Exporter = (() => {
  const PRESETS = [
    { id: 'web169', name: 'Hemnet / webbplats 16:9', desc: '1080p, 30 fps, 12 Mbit/s', settings: { aspect: '16:9', resolution: 1080, fps: 30 }, quality: 12 },
    { id: 'reel', name: 'Instagram Reel 9:16', desc: '1080×1920, 30 fps', settings: { aspect: '9:16', resolution: 1920, fps: 30 }, quality: 10 },
    { id: 'feed', name: 'Instagram Feed 4:5', desc: '1080×1350, 30 fps', settings: { aspect: '4:5', resolution: 1350, fps: 30 }, quality: 10 },
    { id: 'story', name: 'Story 9:16', desc: '1080×1920, 30 fps, lättare fil', settings: { aspect: '9:16', resolution: 1920, fps: 30 }, quality: 8 },
    { id: 'master', name: 'High-quality master', desc: 'Högsta upplösning miljön klarar, 28 Mbit/s', settings: { aspect: '16:9', resolution: 2160, fps: 30 }, quality: 28 },
    { id: 'light', name: 'Lightweight preview', desc: '1080p, 25 fps, 4 Mbit/s', settings: { aspect: '16:9', resolution: 1080, fps: 25 }, quality: 4 },
  ];

  const CANDIDATES = [
    ['mp4h264', 'MP4 · H.264 + AAC', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2'],
    ['mp4', 'MP4', 'video/mp4'],
    ['webmvp9', 'WebM · VP9 + Opus', 'video/webm;codecs=vp9,opus'],
    ['webmvp8', 'WebM · VP8 + Opus', 'video/webm;codecs=vp8,opus'],
    ['webm', 'WebM', 'video/webm'],
  ];
  function supported() {
    if (typeof MediaRecorder === 'undefined') return [];
    return CANDIDATES.filter(c => { try { return MediaRecorder.isTypeSupported(c[2]); } catch (e) { return false; } });
  }
  function codecOptions() {
    const s = supported();
    if (!s.length) return [['auto', 'Ingen inbyggd encoder']];
    return [['auto', 'Auto (' + s[0][1] + ')'], ...s.map(c => [c[0], c[1]])];
  }
  function pick(container) {
    const s = supported();
    if (!s.length) return null;
    if (container && container !== 'auto') { const f = s.find(c => c[0] === container); if (f) return f; }
    return s[0];
  }

  const status = { running: false, progress: 0, message: '', result: null, error: null };
  let recorder = null, cancelled = false, chunks = [];

  function outSize(p) {
    const h = p.settings.resolution || 1080;
    const { w, h: hh } = U.frameSize(p.settings.aspect, h);
    return { w, h: hh };
  }
  function projectFps(p) {
    if (p.settings.fps === 'source') {
      const f = p.media.filter(m => m.type === 'video' && m.fps).map(m => m.fps);
      return f.length ? Math.round(f.sort((a, b) => a - b)[Math.floor(f.length / 2)]) : 30;
    }
    return p.settings.fps || 30;
  }
  function estimate(p) {
    const { w, h } = outSize(p);
    const duration = M.totalDuration(p);
    const fps = projectFps(p);
    const bits = (p.export.quality || 12) * 1e6;
    const c = pick(p.export.container);
    return {
      w, h, fps, duration,
      bytes: duration * bits / 8 * (p.export.audio ? 1.03 : 1),
      time: duration + 3,
      codecLabel: c ? c[1] : 'saknas i denna webbläsare',
    };
  }
  function capabilityNote() {
    const s = supported();
    if (!s.length) return 'Den här webbläsaren saknar MediaRecorder — exporten kan inte köras lokalt. Allt annat (projekt, timeline, stabilisering) fungerar, och renderingen kan kopplas till en backend-worker via runExport().';
    return 'Exporten renderas i realtid genom samma GPU-pipeline som previewn, i full projektupplösning, och kodas med webbläsarens inbyggda encoder (' + s[0][1] + '). Långa filmer tar ungefär lika lång tid som de är långa.';
  }

  async function start() {
    if (status.running) return;
    const p = S.project;
    const duration = M.totalDuration(p);
    if (duration < .2) { U.toast('Inget att exportera', 'Lägg minst ett klipp på timelinen först.', 'warn'); return; }
    const codec = pick(p.export.container);
    if (!codec) { U.toast('Export stöds inte här', capabilityNote(), 'err'); return; }
    cancelled = false; chunks = [];
    status.running = true; status.progress = 0; status.result = null; status.error = null;
    status.message = 'Förbereder…';
    Panels.render();
    try {
      await runExport(p, codec, duration);
      if (!cancelled) {
        const blob = new Blob(chunks, { type: codec[2].split(';')[0] });
        const ext = codec[2].includes('mp4') ? 'mp4' : 'webm';
        status.result = { blob, name: (p.export.filename || 'bostadsfilm') + '.' + ext, size: blob.size, url: URL.createObjectURL(blob) };
        status.message = 'Klar';
        U.toast('Exporten är klar', status.result.name + ' · ' + U.bytes(blob.size));
      } else {
        status.message = 'Avbruten';
      }
    } catch (e) {
      status.error = e.message;
      U.errToast('Exporten misslyckades', e);
    } finally {
      status.running = false;
      Playback.view.exporting = false;
      App.applyPreviewSize();
      Panels.render();
    }
  }

  /** Den utbytbara renderingsmodulen. Byt ut denna mot ett anrop till en
      backend-worker om exporten ska ske på server — inget annat behöver ändras. */
  function runExport(p, codec, duration) {
    return new Promise((resolve, reject) => {
      const { w, h } = outSize(p);
      const fps = projectFps(p);
      Playback.pause();
      Playback.view.exporting = true;
      Renderer.setSize(w, h);
      const canvas = Renderer.canvas;
      let stream;
      try { stream = canvas.captureStream(fps); }
      catch (e) { return reject(new Error('canvas.captureStream stöds inte i den här webbläsaren.')); }
      if (p.export.audio) {
        try {
          const ac = Playback.ctx();
          const dest = ac.createMediaStreamDestination();
          Playback.audioDest().connect(dest);
          dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
        } catch (e) { console.warn('ljudspår kunde inte läggas till', e); }
      }
      let rec;
      try {
        rec = new MediaRecorder(stream, {
          mimeType: codec[2],
          videoBitsPerSecond: (p.export.quality || 12) * 1e6,
          audioBitsPerSecond: 160000,
        });
      } catch (e) { return reject(new Error('Encodern kunde inte startas: ' + e.message)); }
      recorder = rec;
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onerror = e => reject(new Error('Inspelningsfel: ' + (e.error && e.error.name)));
      rec.onstop = () => { recorder = null; resolve(); };

      S.st.playhead = 0;
      S.st.playing = false;
      Playback.resume();
      Playback.renderAt(0, p, { playing: false });

      // en kort inledande paus så att första bildrutan hinner dekodas
      setTimeout(() => {
        rec.start(400);
        const t0 = performance.now();
        let last = t0;
        const step = now => {
          if (cancelled) { try { rec.stop(); } catch (e) { } return; }
          const t = (now - t0) / 1000;
          last = now;
          S.st.playhead = Math.min(t, duration);
          Playback.renderAt(S.st.playhead, p, { playing: true, duck: Playback.duckFactor(S.st.playhead, p) });
          Playback.syncMusic(S.st.playhead, p, true);
          status.progress = U.clamp(t / duration, 0, 1);
          status.message = `Renderar ${U.tc(Math.min(t, duration), false)} / ${U.tc(duration, false)} · ${w}×${h} @ ${fps} fps`;
          S.bus.emit('exportprogress', status.progress);
          if (t >= duration + .25) {
            Playback.pause();
            setTimeout(() => { try { rec.stop(); } catch (e) { reject(e); } }, 250);
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }, 350);
    });
  }

  function cancel() {
    cancelled = true;
    status.message = 'Avbryter…';
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) { }
    Playback.pause();
  }
  function download() {
    if (!status.result) return;
    const a = document.createElement('a');
    a.href = status.result.url; a.download = status.result.name;
    document.body.append(a); a.click(); a.remove();
  }

  return { PRESETS, start, cancel, download, estimate, codecOptions, capabilityNote, supported, status, outSize, projectFps };
})();


/* ===== 95-app.js ===== */
/* ============================================================
   95 — App: bootstrap, kommandon, kortkommandon, projekthantering
   ============================================================ */
const App = (() => {
  const state = { showBeats: true, snapBeats: false, ready: false };
  let cancelStab = false;

  /* ---------- storlek & preview ---------- */
  function applyPreviewSize() {
    const p = S.project;
    const { w, h } = Exporter.outSize(p);
    const q = U.clamp(p.settings.previewQuality || .55, .2, 1);
    Renderer.setSize(Math.round(w * q / 2) * 2, Math.round(h * q / 2) * 2);
    fitStage();
  }
  function fitStage() {
    const stage = U.$('#stage'), inner = U.$('#stageinner');
    if (!stage || !inner) return;
    const p = S.project;
    const ar = U.ASPECTS[p.settings.aspect] || 16 / 9;
    const sw = stage.clientWidth - 16, sh = stage.clientHeight - 16;
    let w = sw, h = w / ar;
    if (h > sh) { h = sh; w = h * ar; }
    inner.style.width = Math.max(40, Math.floor(w)) + 'px';
    inner.style.height = Math.max(24, Math.floor(h)) + 'px';
    const empty = U.$('#emptyprev');
    if (empty) empty.style.display = p.tracks.video.length ? 'none' : 'flex';
  }

  /* ---------- media → timeline ---------- */
  function addMediaToTimeline(media, at) {
    if (!media) return;
    if (media.missing) { U.toast('Filen saknas', 'Importera om ' + media.name, 'err'); return; }
    S.update(p => {
      if (media.type === 'audio') {
        const c = M.newAudioClip(media, at == null ? 0 : Math.max(0, at));
        p.tracks.music.push(c);
        S.selectClips([c.id]);
      } else {
        const c = M.newClip(media, 0);
        p.tracks.video.push(c);
        M.relayout(p.tracks.video);
        S.selectClips([c.id]);
      }
    }, 'add-clip');
    U.toast('Lagt till på timelinen', media.name);
    Timeline.zoomFit();
  }

  /* ---------- klippkommandon ---------- */
  function splitAtPlayhead() {
    const t = S.st.playhead;
    const p = S.project;
    const c = M.clipAt(p, t);
    if (!c) { U.toast('Inget klipp vid playhead', 'Flytta playheaden till ett klipp först.', 'warn'); return; }
    const local = t - c.start;
    const dur = M.clipDuration(c);
    if (local < .08 || local > dur - .08) { U.toast('För nära klippets kant', 'Dela minst 0,1 s in i klippet.', 'warn'); return; }
    S.update(pp => {
      const arr = pp.tracks.video;
      const i = arr.findIndex(x => x.id === c.id);
      const orig = arr[i];
      const cut = orig.in + local * (orig.speed || 1);
      const b = U.clone(orig);
      b.id = U.uid('clip');
      b.in = cut; b.transitionIn = { type: 'cut', dur: 0 };
      orig.out = cut;
      orig.fade.out = 0; b.fade.in = 0;
      arr.splice(i + 1, 0, b);
      M.relayout(arr);
      S.selectClips([b.id]);
    }, 'split');
    U.toast('Klippet delat');
  }
  function deleteSelected(ripple) {
    const sel = S.selectedClips();
    if (!sel.length) return;
    S.update(p => {
      for (const c of sel) {
        if (c.kind === 'video') {
          const d = M.clipDuration(c);
          p.tracks.video = p.tracks.video.filter(x => x.id !== c.id);
          if (ripple) {
            for (const a of p.tracks.music) if (a.start > c.start) a.start = Math.max(0, a.start - d);
            for (const a of p.tracks.text) if (a.start > c.start) a.start = Math.max(0, a.start - d);
          }
        } else if (c.kind === 'music') p.tracks.music = p.tracks.music.filter(x => x.id !== c.id);
        else p.tracks.text = p.tracks.text.filter(x => x.id !== c.id);
      }
      M.relayout(p.tracks.video);
      S.selectClips([]);
    }, 'delete');
  }
  const deleteClip = id => { S.selectClips([id]); deleteSelected(false); };
  function duplicateSelected() {
    const sel = S.selectedClips();
    if (!sel.length) return;
    S.update(p => {
      const ids = [];
      for (const c of sel) {
        const n = U.clone(c); n.id = U.uid(c.kind === 'video' ? 'clip' : c.kind === 'music' ? 'aclip' : 'txt');
        if (c.kind === 'video') { const i = p.tracks.video.findIndex(x => x.id === c.id); p.tracks.video.splice(i + 1, 0, n); }
        else if (c.kind === 'music') { n.start = c.start + (c.out - c.in); p.tracks.music.push(n); }
        else { n.start = c.start + c.duration; p.tracks.text.push(n); }
        ids.push(n.id);
      }
      M.relayout(p.tracks.video);
      S.selectClips(ids);
    }, 'duplicate');
  }

  /* ---------- stabilisering ---------- */
  async function runStabAnalysis(media) {
    if (!media) return;
    cancelStab = false;
    Panels.ui.stabBusy = { pct: 0, msg: 'Startar…' };
    try {
      await Stab.analyze(media, (pct, msg) => {
        Panels.ui.stabBusy = { pct, msg };
        const bar = U.$('#panelbody .progress i'); if (bar) bar.style.width = (pct * 100) + '%';
        const h = U.$('#panelbody .progress + .row'); if (h) h.textContent = msg;
      });
      Panels.ui.stabBusy = null;
      Panels.render();
      const r = media.stab.report;
      U.toast('Analys klar · ' + M.stabModeById(r.recommended).name,
        `${r.samples} bildrutor · skakning ${r.shake.label} · crop ≈ ${r.estimatedCrop} %`);
      const clip = S.primaryClip();
      if (clip && clip.mediaId === media.id && !clip.stabEnabled) toggleStabOnClip(true);
    } catch (e) {
      Panels.ui.stabBusy = null;
      if (e.message !== 'cancelled') U.errToast('Analysen misslyckades', e);
      Panels.render();
    }
  }
  function toggleStabOnClip(on) {
    const clip = S.primaryClip();
    if (!clip || clip.kind !== 'video') return;
    const media = M.mediaById(S.project, clip.mediaId);
    if (on && (!media.stab || media.stab.status !== 'analyzed')) {
      U.toast('Klippet måste analyseras först', 'Kör "Analysera klippet" i stabiliseringspanelen.', 'warn');
      Panels.open('stab');
      return;
    }
    S.update(p => { M.findClip(p, clip.id).stabEnabled = !!on; }, 'stab-toggle');
  }
  function applyStabToAll(media) {
    if (!media || !media.stab || media.stab.status !== 'analyzed') { U.toast('Analysera först', '', 'warn'); return; }
    let n = 0;
    S.update(p => { for (const c of p.tracks.video) if (c.mediaId === media.id) { c.stabEnabled = true; n++; } }, 'stab-all');
    U.toast('Stabilisering på ' + n + ' klipp', media.name);
  }
  async function analyzeAllUsedMedia() {
    const p = S.project;
    const ids = [...new Set(p.tracks.video.map(c => c.mediaId))];
    const list = ids.map(id => M.mediaById(p, id)).filter(m => m && m.type === 'video' && (!m.stab || m.stab.status !== 'analyzed'));
    if (!list.length) { U.toast('Alla klipp är redan analyserade'); return; }
    for (const m of list) {
      if (cancelStab) break;
      await runStabAnalysis(m);
    }
    S.update(pp => { for (const c of pp.tracks.video) { const m = M.mediaById(pp, c.mediaId); if (m && m.stab && m.stab.status === 'analyzed') c.stabEnabled = true; } }, 'stab-all');
    U.toast('Alla klipp analyserade och stabiliserade');
  }

  /* ---------- färg ---------- */
  async function autoEnhance(clip) {
    const media = M.mediaById(S.project, clip.mediaId);
    if (!media) return;
    const t = U.toast('Analyserar bildruta…', media.name);
    try {
      const idx = S.project.tracks.video.findIndex(c => c.id === clip.id);
      let prevStats = null;
      if (idx > 0) {
        const pc = S.project.tracks.video[idx - 1];
        const pm = M.mediaById(S.project, pc.mediaId);
        if (pm && pm.url) prevStats = await Color.frameStats(pm, pc.in + (pc.out - pc.in) * .4);
      }
      const res = await Color.autoEnhance(clip, media, prevStats);
      t.remove();
      const all = [...res.suggestions, ...res.match];
      if (!all.length) { U.toast('Inget att justera', 'Klippet ser redan balanserat ut.'); return; }
      const box = U.el('div');
      const checks = all.map(s => {
        const inp = U.el('input', { type: 'checkbox' }); inp.checked = true;
        box.append(U.el('label', { class: 'row', style: { cursor: 'pointer', alignItems: 'flex-start' } },
          inp,
          U.el('div', { style: { flex: '1' } },
            U.el('div', {}, s.label, ' ', U.el('span', { class: 'tag accent', text: (s.value > 0 ? '+' : '') + s.value })),
            U.el('div', { class: 'hint', text: s.why }))));
        return { inp, s };
      });
      box.append(U.el('div', { class: 'hint', style: { marginTop: '8px' } },
        'Förslagen är begränsade till försiktiga värden — inga extrema ändringar appliceras automatiskt.'));
      U.modal({
        title: 'Auto Enhance for Real Estate', body: box,
        actions: [{ label: 'Avbryt' }, {
          label: 'Applicera valda', primary: true, onclick: () => {
            S.update(p => {
              const c = M.findClip(p, clip.id);
              for (const { inp, s } of checks) if (inp.checked) c.grade[s.key] = U.clamp((c.grade[s.key] || 0) + s.value, -200, 200);
            }, 'auto-enhance');
            U.toast('Auto Enhance applicerad');
          }
        }],
      });
    } catch (e) { t.remove(); U.errToast('Auto Enhance misslyckades', e); }
  }
  function copyGradeToAll(clip) {
    S.update(p => {
      for (const c of p.tracks.video) if (c.id !== clip.id) { c.grade = U.clone(clip.grade); c.filter = clip.filter; c.filterIntensity = clip.filterIntensity; }
    }, 'copy-grade');
    U.toast('Bildinställningarna kopierade till alla klipp');
  }
  async function openMatchClips() {
    const p = S.project;
    const clips = p.tracks.video;
    if (clips.length < 2) { U.toast('Minst två klipp krävs', '', 'warn'); return; }
    const t = U.toast('Analyserar klippen…');
    const stats = await Color.collectStats(p, clips, () => { });
    t.remove();
    const refSel = U.select(clips.map((c, i) => [c.id, (i + 1) + '. ' + ((M.mediaById(p, c.mediaId) || {}).name || '')]), (S.primaryClip() || clips[0]).id, () => refresh());
    const opts = { exposure: true, wb: true, contrast: true, tone: false };
    const scope = U.select([['all', 'Hela filmen'], ['sel', 'Endast markerade klipp']], 'all', v => scope.value = v);
    const listBox = U.el('div');
    function refresh() {
      U.clear(listBox);
      const ref = stats.get(refSel.value);
      for (const c of clips) {
        const dev = Color.deviation(stats.get(c.id), ref);
        c._deviation = c.id === refSel.value ? 0 : dev;
        const m = M.mediaById(p, c.mediaId);
        listBox.append(U.el('div', { class: 'rrow' },
          U.el('span', { class: 'k', style: { flex: '1' }, text: (m ? m.name : '?') }),
          U.el('span', { class: 'meter', style: { flex: '0 0 90px' } }, U.el('i', { class: dev > .55 ? 'warn' : '', style: { width: U.clamp(dev / 1.2, 0, 1) * 100 + '%' } })),
          U.el('span', { class: 'v mono', style: { flex: '0 0 54px', textAlign: 'right' }, text: c.id === refSel.value ? 'referens' : dev.toFixed(2) })));
      }
      Timeline.render();
    }
    const box = U.el('div', {},
      U.el('div', { class: 'row' }, U.el('label', { class: 'lbl', text: 'Referensklipp' }), refSel),
      U.el('div', { class: 'row' }, U.el('label', { class: 'lbl', text: 'Applicera på' }), scope),
      U.el('div', { class: 'row wrap' },
        U.check('Exponering', true, v => opts.exposure = v),
        U.check('Vitbalans', true, v => opts.wb = v),
        U.check('Kontrast', true, v => opts.contrast = v),
        U.check('Färgton', false, v => opts.tone = v)),
      U.el('h3', { class: 'sectitle', text: 'Avvikelse mot referensen' }), listBox);
    refresh();
    U.modal({
      title: 'Match Clips', wide: true, body: box,
      actions: [{ label: 'Stäng' }, {
        label: 'Matcha', primary: true, onclick: () => {
          const ref = stats.get(refSel.value);
          const selIds = new Set(S.sel.clips);
          let n = 0;
          S.update(pp => {
            for (const c of pp.tracks.video) {
              if (c.id === refSel.value) continue;
              if (scope.value === 'sel' && !selIds.has(c.id)) continue;
              const s = stats.get(c.id); if (!s) continue;
              const d = Color.matchDelta(s, ref, opts);
              for (const k in d) c.grade[k] = U.clamp((c.grade[k] || 0) + d[k], -200, 200);
              n++;
            }
          }, 'match-clips');
          U.toast('Matchade ' + n + ' klipp', 'Referens: ' + ((M.mediaById(p, (M.findClip(p, refSel.value) || {}).mediaId) || {}).name || ''));
        }
      }],
    });
  }

  /* ---------- musik ---------- */
  function trimMusicToFilm(c) {
    const total = M.totalDuration(S.project);
    S.update(p => { const x = M.findClip(p, c.id); x.out = Math.min(x.in + Math.max(1, total - x.start), (M.mediaById(p, x.mediaId) || {}).duration || x.out); }, 'music-trim');
    U.toast('Musiken trimmad till filmens längd');
  }
  function loopMusicToFilm(c) {
    const p0 = S.project;
    const total = M.totalDuration(p0);
    const m = M.mediaById(p0, c.mediaId);
    if (!m) return;
    S.update(p => {
      p.tracks.music = p.tracks.music.filter(x => x.mediaId !== c.mediaId || x.id === c.id);
      const len = c.out - c.in;
      let t = c.start + len;
      let guard = 0;
      while (t < total - .3 && guard++ < 40) {
        const n = M.newAudioClip(m, t);
        n.in = c.in; n.out = c.out; n.volume = c.volume; n.loop = true; n.fade = { in: .2, out: Math.min(2, len / 3) };
        p.tracks.music.push(n);
        t += len;
      }
      const cc = M.findClip(p, c.id); if (cc) cc.loop = true;
    }, 'music-loop');
    U.toast('Musiken loopad över hela filmen');
  }
  function beatSyncSuggest(c) {
    const p = S.project;
    const m = M.mediaById(p, c.mediaId);
    if (!m || !m.beats || !m.beats.length) { U.toast('Inga transienter hittade', '', 'warn'); return; }
    const times = m.beats.map(b => c.start + (b - c.in)).filter(t => t > .3 && t < M.totalDuration(p));
    const clips = p.tracks.video;
    const rows = clips.map((cl, i) => {
      if (i === 0) return null;
      const cut = cl.start;
      let best = null, bd = 1e9;
      for (const t of times) { const d = Math.abs(t - cut); if (d < bd) { bd = d; best = t; } }
      return best == null ? null : { clip: cl, cut, beat: best, delta: best - cut };
    }).filter(Boolean).filter(r => Math.abs(r.delta) < 1.2);
    if (!rows.length) { U.toast('Inga klippunkter nära en beat'); return; }
    const box = U.el('div');
    box.append(U.el('div', { class: 'hint', style: { marginBottom: '6px' } }, 'Förslagen flyttar klippgränsen genom att justera föregående klipps längd. Inget tvingas på dig — bocka ur det du inte vill ha.'));
    const checks = rows.map(r => {
      const inp = U.el('input', { type: 'checkbox' }); inp.checked = Math.abs(r.delta) < .5;
      box.append(U.el('label', { class: 'row', style: { cursor: 'pointer' } }, inp,
        U.el('span', { style: { flex: '1' }, text: `Klippunkt ${U.tc(r.cut, false)} → beat ${U.tc(r.beat, false)}` }),
        U.el('span', { class: 'tag mono', text: (r.delta > 0 ? '+' : '') + r.delta.toFixed(2) + ' s' })));
      return { inp, r };
    });
    U.modal({
      title: 'Beat Sync', body: box, wide: true,
      actions: [{ label: 'Avbryt' }, {
        label: 'Applicera valda', primary: true, onclick: () => {
          S.update(pp => {
            for (const { inp, r } of checks) {
              if (!inp.checked) continue;
              const arr = pp.tracks.video;
              const i = arr.findIndex(x => x.id === r.clip.id);
              if (i <= 0) continue;
              const prev = arr[i - 1];
              const want = M.clipDuration(prev) + r.delta;
              const media = M.mediaById(pp, prev.mediaId);
              const maxOut = media ? media.duration : prev.out;
              prev.out = U.clamp(prev.in + want * (prev.speed || 1), prev.in + .15, maxOut);
              M.relayout(arr);
            }
          }, 'beatsync');
          U.toast('Klippunkter synkade mot musiken');
        }
      }],
    });
  }

  async function duplicateProject() {
    await Autosave.saveNow(true);
    const copy = S.serialize();
    copy.id = U.uid('proj'); copy.name = S.project.name + ' (kopia)'; copy.createdAt = Date.now();
    const byId = new Map(S.project.media.map(m => [m.id, m]));
    copy.media.forEach(m => { const live = byId.get(m.id); if (live) { m.url = live.url; m.thumb = live.thumb; m.strip = live.strip; m.wave = live.wave; m.file = live.file; } });
    S.setProject(copy);
    await Autosave.saveNow(true);
    U.toast('Projektet duplicerat', copy.name);
  }
  function exportProjectFile() {
    const data = S.serialize();
    data._note = 'Projektfil för Master Bostadsfilm Editor. Videofilerna ligger kvar lokalt i webbläsaren och följer inte med denna fil.';
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');

  async function importProjectFile(file) {

      const data = JSON.parse(await file.text());

      Playback.releaseAll();
      S.setProject(data);
      await Media.rehydrate(data, m => console.warn('saknad fil', m.name));

      U.toast('Projekt importerat', missing.length ? `${missing.length} mediefiler saknas i den här webbläsaren — importera om dem.` : data.name);

  function syncTopbar() {

  function updateTime(t) {
    const total = M.totalDuration(S.project);
    const fps = Exporter.projectFps(S.project);
    const tc = U.$('#timecode');
    if (tc) tc.innerHTML = `${U.tc(t, true, fps)} <span class="tot">/ ${U.tc(total, true, fps)}</span>`;
    const sc = U.$('#scrub');
    if (sc && document.activeElement !== sc) sc.value = total > 0 ? Math.round(t / total * 1000) : 0;
  }
  function step(dir) {
    const fps = Exporter.projectFps(S.project);
    Playback.pause();
    S.seek(U.clamp(S.st.playhead + dir / fps, 0, M.totalDuration(S.project)));
  }
  function jumpClip(dir) {
    const v = S.project.tracks.video;
    if (!v.length) return;
    const t = S.st.playhead + (dir > 0 ? .05 : -.05);
    let target = 0;
    if (dir > 0) { const n = v.find(c => c.start > t); target = n ? n.start : M.totalDuration(S.project); }
    else { const prev = [...v].reverse().find(c => c.start < t - .1); target = prev ? prev.start : 0; }
    S.seek(target);
    const c = M.clipAt(S.project, target + .01); if (c) S.selectClips([c.id]);
  }
  function keys(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (tag === 'button' && (e.key === ' ' || e.key === 'Enter')) return;
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? S.redo() : S.undo(); return; }
    if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); S.redo(); return; }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); Autosave.saveNow(false); return; }
    if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    switch (e.key) {
      case ' ': e.preventDefault(); Playback.toggle(); break;
      case 'Delete': case 'Backspace': e.preventDefault(); deleteSelected(e.shiftKey); break;
      case 's': case 'S': splitAtPlayhead(); break;
      case 'ArrowLeft': e.preventDefault(); step(-1); break;
      case 'ArrowRight': e.preventDefault(); step(1); break;
      case 'Home': S.seek(0); break;
      case 'End': S.seek(M.totalDuration(S.project)); break;
      case '+': case '=': Timeline.zoomIn(); break;
      case '-': case '_': Timeline.zoomOut(); break;
      case 'z': case 'Z': if (e.shiftKey) Timeline.zoomFit(); break;
      case 'b': case 'B': setCompare(!Playback.view.compare); break;
      case 'l': case 'L': setLoop(!Playback.view.loopClip); break;
    }
  }

  /* ---------- start ---------- */
  async function boot() {
    const ok = Renderer.init(U.$('#outcanvas'));
    if (!ok) U.toast('WebGL kunde inte startas', 'Previewn kan inte rendera i den här miljön. Timeline, analys och projekt fungerar ändå.', 'err');
    wire();
    Timeline.init();
    Panels.init();
    Autosave.init();
    applyPreviewSize();
    syncTopbar();
    Playback.start();
    new ResizeObserver(() => { fitStage(); }).observe(U.$('#stage'));

    try {
      await DB.open();
      const lastId = await DB.getMeta('lastProject');
      if (lastId) {
        const pr = await DB.getProject(lastId);
        if (pr && (pr.media.length || pr.tracks.video.length)) {
          S.setProject(pr);
          await Media.rehydrate(pr, () => { });
          const missing = pr.media.filter(m => m.missing);
          applyPreviewSize(); Timeline.zoomFit(); syncTopbar();
          Autosave.markClean('Sparad');
          U.toast('Senaste projektet återställt', pr.name + (missing.length ? ` · ${missing.length} mediefiler saknas` : ''));
        }
      }
    } catch (e) {
      U.toast('Lokal lagring ej tillgänglig', 'Projektet lever bara i den här fliken. ' + (DB.error || ''), 'warn');
    }
    state.ready = true;
    document.body.setAttribute('data-ready', '1');
  }

  return {
    state, boot, applyPreviewSize, fitStage, addMediaToTimeline, splitAtPlayhead, deleteSelected, deleteClip,
    duplicateSelected, runStabAnalysis, toggleStabOnClip, applyStabToAll, analyzeAllUsedMedia,
    autoEnhance, copyGradeToAll, openMatchClips, addText, addPropertyIntro, trimMusicToFilm, loopMusicToFilm,
    beatSyncSuggest, setCompare, setLoop, setZoomView, newProject, duplicateProject, exportProjectFile,
    importProjectFile, projectsModal, openProject, handleFiles,
    get cancelStab() { return cancelStab; }, set cancelStab(v) { cancelStab = v; },
  };
})();

document.addEventListener('DOMContentLoaded', () => App.boot());

</script>
