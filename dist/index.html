      }, 'Stabilisering'),
      U.el('button', { class: 'btn sm', onclick: () => Panels.open('stab') }, 'Öppna stabilisering'),
      st && st.status === 'analyzed' ? U.el('span', { class: 'tag ok', text: M.stabModeById(Stab.settingsFor(media).mode).name }) : U.el('span', { class: 'tag', text: 'ej analyserad' })));
    add(U.el('div', { class: 'row wrap' },
      U.el('span', { class: 'hint', style: { flex: '0 0 72px' }, text: 'Filter' }),
      U.select(M.FILTERS.map(f => [f.id, f.name]), clip.filter, v => set(c => { c.filter = v; }, 'filter')),
      U.el('button', { class: 'btn sm', onclick: () => Panels.open('image') }, 'Bild')));
    add(U.el('div', { class: 'row wrap' },
      U.el('span', { class: 'hint', style: { flex: '0 0 72px' }, text: 'Rörelse' }),
      U.select(M.MOTION_PRESETS.map(f => [f.id, f.name]), clip.motion.preset, v => set(c => { c.motion = { ...M.emptyMotion(), preset: v }; }, 'motion')),
      U.el('button', { class: 'btn sm', onclick: () => Panels.open('motion') }, 'Rörelse')));
    const idx = p.tracks.video.findIndex(c => c.id === clip.id);
    add(U.el('div', { class: 'row wrap' },
      U.el('span', { class: 'hint', style: { flex: '0 0 72px' }, text: 'Transition' }),
      idx > 0 ? U.select(M.TRANSITIONS.map(t => [t.id, t.name]), clip.transitionIn.type, v => set(c => { c.transitionIn = { type: v, dur: M.transById(v).defDur }; }, 'tin'))
        : U.el('span', { class: 'hint', text: 'första klippet' })));

    add(U.section('Åtgärder'));
    add(U.el('div', { class: 'row wrap' },
      U.el('button', { class: 'btn sm', onclick: () => App.splitAtPlayhead(), 'data-tip': 'Dela vid playhead (S)' }, 'Split'),
      U.el('button', { class: 'btn sm', onclick: () => App.duplicateSelected(), 'data-tip': 'Duplicera (Ctrl+D)' }, 'Duplicera'),
      U.el('button', { class: 'btn sm', onclick: () => App.deleteSelected(false) }, 'Ta bort'),
      U.el('button', { class: 'btn sm danger', onclick: () => App.deleteSelected(true), 'data-tip': 'Tar bort och stänger luckan' }, 'Ripple delete')));

    host.append(...body);
    host.scrollTop = top;
  }

  function renderOther(host, clip) {
    const isText = clip.kind === 'text';
    host.append(U.el('div', { class: 'panelhead' }, U.el('span', { class: 'title', text: isText ? 'Textklipp' : 'Musikklipp' })));
    const sc = U.el('div', { class: 'scroll' });
    const set = (k, v) => S.update(pp => { const x = M.findClip(pp, clip.id); if (k.includes('.')) { const [a, b] = k.split('.'); x[a][b] = v; } else x[k] = v; }, 'i-' + k, true);
    sc.append(U.section('Tid'));
    sc.append(U.lrow('Start', U.num(U.round(clip.start, 2), v => set('start', Math.max(0, v)), { step: .1 })));
    if (isText) sc.append(U.lrow('Längd', U.num(U.round(clip.duration, 2), v => set('duration', Math.max(.2, v)), { step: .1 })));
    else {
      sc.append(U.lrow('In', U.num(U.round(clip.in, 2), v => set('in', Math.max(0, v)), { step: .1 })));
      sc.append(U.lrow('Out', U.num(U.round(clip.out, 2), v => set('out', v), { step: .1 })));
      sc.append(U.slider('Volym', clip.volume, 0, 100, 1, v => set('volume', v), { def: 80, fmt: v => v + ' %' }));
    }
    sc.append(U.el('div', { class: 'row' },
      U.el('button', { class: 'btn sm', onclick: () => Panels.open(isText ? 'text' : 'audio') }, 'Öppna panel'),
      U.el('button', { class: 'btn sm danger', onclick: () => App.deleteClip(clip.id) }, 'Ta bort')));
    host.append(sc);
  }
  return { render };
})();


/* ===== 87-motion-ui.js ===== */
/* ============================================================
   87 — Motion: gränssnittet

   Tre steg för användaren: bilder → musik → skapa. All komplexitet
   (analys, regi, jobbkö, QC) ligger bakom en enkel progressvy.
   ============================================================ */
const Motion = (() => {
  const st = {
    step: 'images',
    images: [],            // media-objekt i vald ordning
    music: null,
    imageAnalysis: new Map(),
    musicAnalysis: null,
    plan: null,
    provider: 'local',
    targetDuration: 45,
    aspect: '16:9',
    propertyName: '',
    aiOrder: true,
    phase: '', progress: 0,
    result: null,
    credits: null,
    overrides: { moves: new Map(), durations: new Map(), rooms: new Map(), names: new Map() },
  };
  let root = null;

  /* ---------- vy ---------- */
  function open() {
    if (!root) {
      root = U.el('div', { id: 'motionview' });
      document.body.append(root);
    }
    root.style.display = 'flex';
    document.body.classList.add('motion-open');
    render();
  }
  function close() {
    if (root) root.style.display = 'none';
    document.body.classList.remove('motion-open');
  }

  const shell = (title, sub, body, footer) => U.el('div', { class: 'mo-shell' },
    U.el('div', { class: 'mo-steps' }, ...['images', 'music', 'plan'].map((s, i) => {
      const order = ['images', 'music', 'plan'];
      const cur = order.indexOf(st.step === 'run' || st.step === 'done' ? 'plan' : st.step);
      return U.el('div', { class: 'mo-step' + (i === cur ? ' on' : '') + (i < cur ? ' past' : '') },
        U.el('span', { class: 'n', text: String(i + 1) }),
        ['Bilder', 'Musik', 'Motion'][i]);
    })),
    U.el('div', { class: 'mo-card' },
      U.el('h2', { text: title }),
      sub ? U.el('p', { class: 'mo-sub', text: sub }) : null,
      body),
    footer || null);

  function render() {
    if (!root) return;
    U.clear(root);
    root.append(U.el('button', { class: 'mo-close', onclick: close, 'data-tip': 'Stäng Motion' }, '✕'));
    const view = { images: viewImages, music: viewMusic, plan: viewPlan, run: viewRun, done: viewDone }[st.step];
    root.append(view());
  }

  /* ---------- steg 1: bilder ---------- */
  function viewImages() {
    const grid = U.el('div', { class: 'mo-grid' });
    st.images.forEach((m, i) => {
      const cell = U.el('div', {
        class: 'mo-img', draggable: 'true',
        ondragstart: e => { e.dataTransfer.setData('text/idx', String(i)); e.dataTransfer.effectAllowed = 'move'; },
        ondragover: e => { e.preventDefault(); cell.classList.add('over'); },
        ondragleave: () => cell.classList.remove('over'),
        ondrop: e => {
          e.preventDefault(); cell.classList.remove('over');
          const from = parseInt(e.dataTransfer.getData('text/idx'), 10);
          if (isNaN(from) || from === i) return;
          const [x] = st.images.splice(from, 1);
          st.images.splice(i, 0, x);
          st.aiOrder = false;
          render();
        },
      },
        U.el('img', { src: m.thumb, alt: m.name }),
        U.el('span', { class: 'idx', text: String(i + 1) }),
        U.el('button', {
          class: 'rm', 'data-tip': 'Ta bort',
          onclick: () => { st.images.splice(i, 1); render(); },
        }, '✕'),
        U.el('span', { class: 'nm', text: m.name }));
      grid.append(cell);
    });

    const drop = U.el('div', {
      class: 'mo-drop',
      onclick: () => pickFiles('image'),
      ondragover: e => { e.preventDefault(); drop.classList.add('over'); },
      ondragleave: () => drop.classList.remove('over'),
      ondrop: async e => {
        e.preventDefault(); drop.classList.remove('over');
        if (e.dataTransfer.files.length) await addFiles(e.dataTransfer.files);
      },
    },
      U.el('div', { style: { fontSize: '14px', color: 'var(--fg-1)' } }, st.images.length ? 'Lägg till fler bilder' : 'Släpp bostadsbilderna här'),
      U.el('div', { class: 'hint', style: { marginTop: '4px' } }, 'JPG, PNG eller WebP · eller klicka för att välja'));

    const aiRow = U.el('div', { class: 'mo-toggle' },
      U.el('div', {},
        U.el('div', { style: { fontSize: '12.5px', color: 'var(--fg-0)' } }, 'AI-bildordning'),
        U.el('div', { class: 'hint' }, 'Claude analyserar bilderna och bygger en logisk rundtur i stället för filordning.')),
      U.el('button', {
        class: 'mo-switch' + (st.aiOrder ? ' on' : ''),
        onclick: () => { st.aiOrder = !st.aiOrder; render(); },
      }, U.el('i')));

    const name = U.el('input', {
      type: 'text', placeholder: 'Adress eller projektnamn', value: st.propertyName,
      oninput: e => st.propertyName = e.target.value, style: { width: '100%' },
    });

    return shell('Välj bilder',
      st.images.length ? `${st.images.length} bilder valda. Du kan dra för att ändra ordning, och redigera allt efteråt.` : 'Börja med bilderna som ska bli film.',
      U.el('div', {}, drop, grid.children.length ? grid : null,
        U.el('div', { class: 'mo-field' }, U.el('label', {}, 'Bostad'), name), aiRow),
      U.el('div', { class: 'mo-foot' },
        U.el('span', { class: 'hint', text: st.images.length < 3 ? 'Minst 3 bilder behövs' : `${st.images.length} bilder` }),
        U.el('span', { class: 'spacer' }),
        U.el('button', {
          class: 'btn primary', disabled: st.images.length < 3,
          onclick: () => { st.step = 'music'; render(); },
        }, 'Fortsätt →')));
  }

  /* ---------- steg 2: musik ---------- */
  function viewMusic() {
    const list = U.el('div', { class: 'mo-tracks' });
    const tracks = S.project.media.filter(m => m.type === 'audio');
    if (!tracks.length) list.append(U.el('div', { class: 'hint', style: { padding: '10px 0' } },
      'Ingen låt ännu. Skapa en nedan, eller ladda upp din egen.'));

    for (const m of tracks) {
      const sel = st.music && st.music.id === m.id;
      const wave = U.el('canvas', { class: 'mo-wave', width: 600, height: 40 });
      const c = m.composed;
      const row = U.el('div', {
        class: 'mo-track' + (sel ? ' on' : ''),
        onclick: () => { st.music = m; render(); },
      },
        U.el('button', {
          class: 'mo-play', onclick: e => { e.stopPropagation(); togglePlay(m); },
        }, playingId === m.id ? '❚❚' : '▶'),
        U.el('div', { class: 'mo-tmeta' },
          U.el('div', { class: 'nm' }, m.name.replace(/\.[^.]+$/, ''),
            c ? U.el('span', { class: 'tag accent', style: { marginLeft: '6px' }, text: 'SKAPAD' }) : null),
          U.el('div', { class: 'hint mono' }, c
            ? `${c.bpm} BPM · ${U.dur(c.duration)} · takt ${c.barSeconds}s · ${c.sections.length} sektioner · ${c.cutPoints.length} klipplägen`
            : `${m.bpm ? m.bpm + ' BPM · ' : ''}${U.dur(m.duration)}${m.beats ? ' · ' + m.beats.length + ' transienter (uppmätta)' : ''}`)),
        sel ? wave : U.el('span', { class: 'hint mono', text: U.dur(m.duration) }));
      list.append(row);
      if (sel) requestAnimationFrame(() => drawWave(wave, m));
    }

    /* Låtarna är inte pynt: eftersom appen komponerar dem vet den exakt var
       takterna ligger, och det är takterna som bestämmer klipplängderna. */
    const styles = U.el('div', { class: 'mo-styles' },
      ...MusicMake.STYLES.map(s => {
        const barSec = 240 / s.bpm;
        // vilka klipplängder låten faktiskt erbjuder: hel och halv takt inom
        // det spann ett klipp får ligga i
        const steps = [];
        for (let k = 1; k * barSec / 2 <= Director.SHOT_MAX_MANUAL + 0.01; k++) {
          const d = U.round(k * barSec / 2, 2);
          if (d >= Director.SHOT_MIN) steps.push(d);
        }
        return U.el('div', { class: 'preset-card', onclick: () => composeTrack(s.id) },
          U.el('div', { style: { flex: '1' } },
            U.el('div', { class: 'pn' }, s.name,
              U.el('span', { class: 'tag', style: { marginLeft: '6px' }, text: s.bpm + ' BPM' })),
            U.el('div', { class: 'pd', text: s.mood }),
            U.el('div', { class: 'hint mono', style: { marginTop: '2px' } },
              `Takt ${U.round(barSec, 2)}s · klipplängder ${steps.join(' / ')}s`)),
          U.el('button', { class: 'btn sm', onclick: e => { e.stopPropagation(); composeTrack(s.id); } }, 'Skapa'));
      }));

    return shell('Musiken',
      'Musiken är inte bakgrund — den bestämmer var filmen klipper. Skapar appen låten vet den exakt var varje takt ligger, och klipplängderna blir exakta i stället för ungefärliga.',
      U.el('div', {},
        U.el('div', { class: 'mo-field' },
          U.el('label', {}, 'Ungefärlig filmlängd'),
          U.el('div', { class: 'row', style: { padding: 0, gap: '8px' } },
            ...[30, 45, 60, 90].map(v => U.el('button', {
              class: 'btn sm' + (st.targetDuration === v ? ' on' : ''),
              onclick: () => { st.targetDuration = v; render(); },
            }, v + ' s')))),
        U.el('div', { class: 'mo-field' },
          U.el('label', {}, 'Format'),
          U.el('div', { class: 'row', style: { padding: 0, gap: '8px' } },
            ...['16:9', '9:16', '4:5', '1:1'].map(a => U.el('button', {
              class: 'btn sm' + (st.aspect === a ? ' on' : ''),
              onclick: () => { st.aspect = a; render(); },
            }, a)))),
        U.el('h3', { class: 'sectitle', text: 'Skapa en låt' }),
        U.el('div', { class: 'hint', style: { padding: '0 0 8px' } },
          `Låten komponeras för ${st.targetDuration} s film med intro, uppbyggnad, peak och avslut.`),
        styles,
        U.el('h3', { class: 'sectitle', text: 'Låtar i projektet' }),
        list,
        U.el('button', { class: 'btn', style: { marginTop: '10px' }, onclick: () => pickFiles('audio') }, 'Ladda upp egen musik')),
      U.el('div', { class: 'mo-foot' },
        U.el('button', { class: 'btn', onclick: () => { st.step = 'images'; render(); } }, '← Tillbaka'),
        U.el('span', { class: 'spacer' }),
        U.el('button', {
          class: 'btn primary', disabled: !st.music,
          onclick: () => startPlanning(),
        }, 'Fortsätt →')));
  }

  async function composeTrack(styleId) {
    const t = U.toast('Komponerar…', MusicMake.styleById(styleId).name);
    await U.raf(); await U.raf();
    try {
      const m = await MusicMake.makeTrack(styleId, st.targetDuration);
      S.update(p => { p.media.push(m); }, 'motion-compose');
      st.music = m;
      t.remove();
      render();
      U.toast('Låten är klar', `${m.composed.bpm} BPM · ${U.dur(m.duration)} · ${m.composed.cutPoints.length} klipplägen`);
    } catch (e) { t.remove(); U.errToast('Kunde inte skapa låten', e); }
  }

  let playingId = null, audioEl = null;
  function togglePlay(m) {
    if (!audioEl) audioEl = new Audio();
    if (playingId === m.id) { audioEl.pause(); playingId = null; render(); return; }
    audioEl.src = m.url; audioEl.currentTime = 0;
    audioEl.play().catch(() => { });
    playingId = m.id;
    audioEl.onended = () => { playingId = null; render(); };
    render();
  }
  function drawWave(cv, m) {
    if (!m.wave) return;
    const g = cv.getContext('2d'), w = cv.width, h = cv.height;
    g.clearRect(0, 0, w, h);
    g.fillStyle = 'rgba(139,144,128,.75)';
    for (let x = 0; x < w; x++) {
      const v = (m.wave[Math.floor(x / w * m.wave.length)] / 255) * (h * .46);
      g.fillRect(x, h / 2 - v, 1, v * 2);
    }
  }

  /* ---------- steg 3: planen ---------- */
  async function startPlanning() {
    st.step = 'run'; st.phase = 'Analyserar bostaden'; st.progress = 0; render();
    try {
      st.imageAnalysis = await ImageAnalyze.analyzeAll(st.images, (p, name) => {
        st.phase = 'Analyserar bostaden'; st.progress = p * 0.5;
        st.detail = name || ''; renderProgress();
      });
      st.phase = 'Lyssnar igenom musiken'; st.progress = 0.55; renderProgress();
      await U.raf();
      st.musicAnalysis = MusicStructure.analyze(st.music);

      st.phase = 'Regisserar filmen'; st.progress = 0.8; renderProgress();
      await U.raf();
      st.plan = Director.buildPlan({
        assets: st.images, imageAnalysis: st.imageAnalysis, musicAnalysis: st.musicAnalysis,
        targetDuration: st.targetDuration, provider: st.provider, aspect: st.aspect,
        overrides: st.overrides,
      });
      const errs = Director.validate(st.plan, { assets: st.images, musicAnalysis: st.musicAnalysis, provider: st.provider });
      if (errs.length) console.warn('planvalidering', errs);
      st.planErrors = errs;
      st.step = 'plan'; render();
    } catch (e) {
      U.errToast('Kunde inte skapa planen', e);
      st.step = 'music'; render();
    }
  }

  function viewPlan() {
    const plan = st.plan;
    const cost = MM.planCost(plan, st.provider);
    const prov = MM.providerById(st.provider);

    const shots = U.el('div', { class: 'mo-shots' });
    plan.shots.forEach((s, i) => {
      const a = st.images.find(x => x.id === s.assetId);
      const edited = s.movementLocked || s.durationLocked;
      shots.append(U.el('div', { class: 'mo-shot' + (edited ? ' edited' : '') },
        U.el('img', { src: a ? a.thumb : '', alt: '' }),
        U.el('div', { class: 'mo-shotmeta' },
          U.el('div', { class: 'top' },
            U.el('span', { class: 'tag accent', text: 'SHOT ' + String(s.index + 1).padStart(2, '0') }),
            roomSelect(s),
            s.role === 'hero' || s.role === 'closer' ? U.el('span', { class: 'tag ok', text: s.role.toUpperCase() }) : null,
            edited ? U.el('span', { class: 'tag warn', text: 'ÄNDRAD' }) : null),
          U.el('div', { class: 'mo-shotctl' }, moveSelect(s, plan, i), durationStepper(s),
            edited ? U.el('button', {
              class: 'btn sm', 'data-tip': 'Återgå till regissörens val',
              onclick: () => {
                st.overrides.moves.delete(s.assetId);
                st.overrides.durations.delete(s.assetId);
                rebuildPlan();
              },
            }, '↺') : null),
          U.el('div', { class: 'hint', text: s.motivation }),
          U.el('div', { class: 'hint mono' },
            `${U.tc(s.timelineIn, false)}–${U.tc(s.timelineOut, false)} · ${s.timelineDuration}s i filmen · genererar ${s.generatedDuration}s, använder ${s.sourceIn}–${s.sourceOut}`))));
    });

    const provRow = U.el('div', { class: 'mo-field' },
      U.el('label', {}, 'Generering'),
      U.el('div', {},
        ...Object.values(MM.PROVIDERS).map(p => U.el('div', {
          class: 'preset-card' + (st.provider === p.id ? ' on' : ''), style: { margin: '4px 0' },
          onclick: () => { st.provider = p.id; st.plan.provider = p.id; render(); },
        },
          U.el('div', { style: { flex: '1' } },
            U.el('div', { class: 'pn' }, p.name,
              p.id !== 'stub' && p.creditsPer5s ? U.el('span', { class: 'tag warn', style: { marginLeft: '6px' }, text: MM.planCost(plan, p.id) + ' credits' }) : null),
            U.el('div', { class: 'pd', text: p.note }))))));

    const warn = [];
    if (plan.droppedImages) {
      // Klippen ligger på takten, så antalet bilder som får plats bestäms av
      // låtens taktlängd. Säg vad som faktiskt krävs i stället för "höj längden".
      const bar = st.musicAnalysis.barSeconds || (240 / (st.musicAnalysis.bpm || 100));
      const need = Math.ceil((plan.duration + plan.droppedImages * bar) / 5) * 5;
      warn.push(`${plan.droppedImages} bilder rymdes inte i ${st.targetDuration} s. `
        + `Med den här låten tar varje klipp ${U.round(bar, 1)} s — välj ${need} s film, `
        + `eller ta bort ${plan.droppedImages} bilder.`);
    }
    if (st.provider === 'higgsfield_kling3') {
      warn.push(`Genereringen kostar ${cost} credits av dina ${st.credits != null ? st.credits : '–'}.`);
      if (!Generation.bridgeAlive) warn.push('Ingen brygga ansluten: jobben läggs i kön och exporteras som manifest som Claude kör via Higgsfield MCP.');
    }
    if (st.planErrors && st.planErrors.length) warn.push('Planvarning: ' + st.planErrors[0]);

    return shell('Motion',
      plan.rationale,
      U.el('div', {},
        U.el('div', { class: 'mo-stats' },
          stat(st.images.length, 'bilder'),
          stat(plan.shots.length, 'shots'),
          stat(U.round(plan.duration, 1) + ' s', 'film'),
          stat(st.musicAnalysis.bpm + ' BPM', st.music.name.replace(/\.[^.]+$/, '')),
          stat(st.aiOrder ? 'AI' : 'Manuell', 'bildordning')),
        provRow,
        warn.length ? U.el('div', { class: 'mo-warn' }, ...warn.map(w => U.el('div', { text: w }))) : null,
        U.el('h3', { class: 'sectitle', text: 'Director Plan' }),
        U.el('div', { class: 'hint', style: { padding: '0 0 8px' } },
          'Allt går att ändra: rum, kamerarörelse och längd. Längden stegar mellan låtens klipplägen, så filmen håller sig på musiken oavsett vad du väljer. Efterföljande klipp flyttas med.'),
        shots),
      U.el('div', { class: 'mo-foot' },
        U.el('button', { class: 'btn', onclick: () => { st.step = 'music'; render(); } }, '← Tillbaka'),
        U.el('span', { class: 'spacer' }),
        st.provider === 'higgsfield_kling3'
          ? U.el('button', { class: 'btn', onclick: exportManifest }, 'Exportera jobbmanifest')
          : null,
        U.el('button', { class: 'btn primary', onclick: confirmAndRun },
          st.provider === 'higgsfield_kling3' ? `Skapa Motion · ${cost} credits` : 'Skapa Motion')));
  }
  const stat = (v, l) => U.el('div', { class: 'mo-stat' }, U.el('b', { text: String(v) }), U.el('span', { text: l }));

  /** Kamerarörelsen går alltid att byta. Biblioteket visas i sin helhet, men
   *  de rörelser regissören anser olämpliga för just den bilden ligger i en
   *  egen grupp — en drönarbild ska inte råka få en sidled-slide av misstag. */
  function moveSelect(s, plan, i) {
    const f = st.imageAnalysis.get(s.assetId);
    const x = { a: { id: s.assetId }, f };
    const energy = MusicStructure.energyAt(st.musicAnalysis, (s.timelineIn + s.timelineOut) / 2);
    const opts = f ? Director.moveOptions(x, plan.shots[i - 1], plan.shots[i - 2], energy)
      : MM.MOVES.map(m => ({ move: m, suitable: true }));
    const sel = U.el('select', {
      class: 'mo-move' + (s.movementLocked ? ' locked' : ''),
      'data-tip': 'Kamerarörelse för det här klippet',
      onchange: () => {
        if (sel.value === '__auto') st.overrides.moves.delete(s.assetId);
        else st.overrides.moves.set(s.assetId, sel.value);
        rebuildPlan(false);
      },
    });
    sel.append(U.el('option', { value: '__auto' }, s.movementLocked
      ? 'Regissörens val' : 'Regissörens val: ' + MM.moveById(s.movementId).name));
    const good = U.el('optgroup', { label: 'Passar bilden' });
    const bad = U.el('optgroup', { label: 'Mindre lämpliga för den här bilden' });
    for (const o of opts) (o.suitable ? good : bad).append(U.el('option', { value: o.move.id }, o.move.name));
    if (good.children.length) sel.append(good);
    if (bad.children.length) sel.append(bad);
    sel.value = s.movementLocked ? s.movementId : '__auto';
    return sel;
  }

  /** Längden stegas mellan låtens egna klipplägen. Det går alltså inte att
   *  välja en längd som ligger utanför takten — men allt som ligger på takten
   *  går att välja. */
  function durationStepper(s) {
    const opts = Director.durationOptions(st.musicAnalysis, s.timelineIn);
    let cur = 0, bd = 1e9;
    opts.forEach((o, i) => { const d = Math.abs(o.duration - s.timelineDuration); if (d < bd) { bd = d; cur = i; } });
    const set = k => {
      const o = opts[U.clamp(cur + k, 0, opts.length - 1)];
      if (!o || o.duration === s.timelineDuration) return;
      st.overrides.durations.set(s.assetId, o.duration);
      rebuildPlan(false);
    };
    const kind = opts[cur] ? opts[cur].kind : '';
    return U.el('div', { class: 'mo-dur', 'data-tip': 'Längd i filmen — stegar mellan musikens klipplägen' },
      U.el('button', { class: 'btn sm', disabled: cur <= 0, onclick: () => set(-1) }, '−'),
      U.el('span', { class: 'mono' }, s.timelineDuration.toFixed(2) + ' s',
        U.el('i', { class: 'k', text: kind ? ' ' + kindLabel(kind) : '' })),
      U.el('button', { class: 'btn sm', disabled: cur >= opts.length - 1, onclick: () => set(1) }, '+'));
  }
  const kindLabel = k => ({ section: 'sektion', phrase: 'fras', downbeat: 'takt', halfbar: '½ takt', accent: 'accent' }[k] || k);

  /** Klustringen grupperar bilder som är samma rum, men den kan ha fel.
   *  Här flyttas en bild till rätt rum, och rummen får riktiga namn. */
  function roomSelect(s) {
    const rooms = Director.roomsOf(st.images, st.imageAnalysis, st.overrides);
    const sel = U.el('select', {
      class: 'mo-room',
      'data-tip': 'Vilket rum bilden hör till. Ändra om grupperingen är fel.',
      onchange: () => {
        if (sel.value === '__new') {
          const n = rooms.reduce((m, r) => Math.max(m, parseInt(String(r.id).replace(/^room/, ''), 10) || 0), 0);
          st.overrides.rooms.set(s.assetId, 'room' + (n + 1));
          rebuildPlan(false);
        } else if (sel.value === '__rename') {
          renameRoom(s.clusterId || s.roomType, s.roomLabel);
        } else {
          st.overrides.rooms.set(s.assetId, sel.value);
          rebuildPlan(false);
        }
      },
    });
    for (const r of rooms) sel.append(U.el('option', { value: r.id }, r.label + (r.size > 1 ? ` (${r.size})` : '')));
    // Scentypen styr vilka kamerarörelser bilden får. Har analysen gissat fel
    // — en fasadbild tagen för en drönarbild — rättas det här, och rörelse-
    // reglerna följer med.
    const scenes = U.el('optgroup', { label: 'Scentyp' });
    for (const [id, label] of [['exterior', 'Exteriör'], ['drone', 'Drönare'], ['detail', 'Detalj']])
      if (!rooms.some(r => r.id === id)) scenes.append(U.el('option', { value: id }, label));
    if (scenes.children.length) sel.append(scenes);
    sel.append(U.el('option', { value: '__new' }, 'Nytt rum…'));
    sel.append(U.el('option', { value: '__rename' }, 'Byt namn på rummet…'));
    sel.value = s.clusterId || rooms[0] && rooms[0].id || '';
    return sel;
  }

  function renameRoom(clusterId, current) {
    const inp = U.el('input', { type: 'text', value: current || '', style: { width: '100%' }, placeholder: 'Vardagsrum' });
    U.modal({
      title: 'Byt namn på rummet',
      body: U.el('div', {}, inp,
        U.el('div', { class: 'hint', style: { marginTop: '6px' } },
          'Namnet gäller alla bilder som hör till samma rum.')),
      actions: [{ label: 'Avbryt', onclick: () => render() }, {
        label: 'Spara', primary: true, onclick: () => {
          const v = inp.value.trim();
          if (v) st.overrides.names.set(clusterId, v); else st.overrides.names.delete(clusterId);
          rebuildPlan(false);
        },
      }],
    });
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  }

  function rebuildPlan(notify = true) {
    try {
      st.plan = Director.buildPlan({
        assets: st.images, imageAnalysis: st.imageAnalysis, musicAnalysis: st.musicAnalysis,
        targetDuration: st.targetDuration, provider: st.provider, aspect: st.aspect,
        overrides: st.overrides,
      });
      st.planErrors = Director.validate(st.plan, { assets: st.images, musicAnalysis: st.musicAnalysis, provider: st.provider });
      render();
      if (notify) U.toast('Planen omregisserad', 'Ordning, längder och rörelser räknades om.');
    } catch (e) { U.errToast('Kunde inte bygga om planen', e); }
  }

  function exportManifest() {
    const man = Generation.manifest(st.plan, { id: st.plan.id, propertyName: st.propertyName || 'Motion' }, st.images);
    const blob = new Blob([JSON.stringify(man, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'motion-jobs.json';
    document.body.append(a); a.click(); a.remove();
    U.toast('Jobbmanifest exporterat', `${man.jobs.length} jobb · ${man.totalCredits} credits`);
  }

  function confirmAndRun() {
    if (st.provider !== 'higgsfield_kling3') return runGeneration();
    const cost = MM.planCost(st.plan, st.provider);
    U.modal({
      title: 'Bekräfta generering',
      body: U.el('div', {},
        U.el('div', { text: `${st.plan.shots.length} shots genereras med Kling v3.0.` }),
        U.el('div', { class: 'hint', style: { marginTop: '6px' } },
          `Detta drar ${cost} credits från ditt Higgsfield-konto${st.credits != null ? ` (saldo ${st.credits})` : ''}. Kostnaden är inte återbetalbar.`),
        !Generation.bridgeAlive ? U.el('div', { class: 'hint', style: { marginTop: '6px' } },
          'Ingen brygga är ansluten, så jobben läggs i kön utan att köras. Exportera manifestet och låt Claude köra dem via Higgsfield MCP.') : null),
      actions: [{ label: 'Avbryt' }, { label: `Generera för ${cost} credits`, primary: true, onclick: runGeneration }],
    });
  }

  /* ---------- körning ---------- */
  async function runGeneration() {
    st.step = 'run'; st.phase = 'Skapar kamerarörelser'; st.progress = 0; render();
    const off = Generation.bus.on('progress', s => {
      st.progress = s.total ? s.done / s.total : 0;
      st.detail = s.message; renderProgress();
    });
    try {
      const results = await Generation.runPlan(st.plan, { assets: st.images });
      st.phase = 'Bygger projektet'; st.progress = 0.97; renderProgress();
      const project = Generation.buildProject(st.plan, {
        assets: st.images, music: st.music, musicAssetId: st.music.id,
        musicAnalysis: st.musicAnalysis, propertyName: st.propertyName || 'Motion',
      }, results);
      for (const r of results) if (r.shot.needsStabilization) {
        const c = project.tracks.video.find(c => c.shotId === r.shot.id);
        if (c) c.stabEnabled = true;
      }
      st.result = { project, results };
      st.step = 'done'; render();
      await Autosave.saveNow(true);
    } catch (e) {
      U.errToast('Genereringen misslyckades', e);
      st.step = 'plan'; render();
    } finally { off(); }
  }

  function viewRun() {
    const phases = ['Analyserar bostaden', 'Lyssnar igenom musiken', 'Regisserar filmen', 'Skapar kamerarörelser', 'Bygger projektet'];
    return shell('Skapar din film', null,
      U.el('div', {},
        U.el('div', { class: 'progress', style: { margin: '18px 0 10px' } }, U.el('i', { id: 'mo-bar', style: { width: (st.progress * 100) + '%' } })),
        U.el('div', { class: 'mo-phases' }, ...phases.map(p => {
          const done = phases.indexOf(p) < phases.indexOf(st.phase);
          return U.el('div', { class: 'mo-phase' + (p === st.phase ? ' on' : '') + (done ? ' done' : '') },
            U.el('span', { class: 'dot' }), p);
        })),
        U.el('div', { class: 'hint', id: 'mo-detail', style: { marginTop: '10px' }, text: st.detail || '' })),
      U.el('div', { class: 'mo-foot' },
        U.el('span', { class: 'spacer' }),
        U.el('button', { class: 'btn danger', onclick: () => { Generation.cancel(); } }, 'Avbryt')));
  }
  function renderProgress() {
    const bar = document.getElementById('mo-bar');
    if (bar) bar.style.width = (st.progress * 100) + '%';
    const d = document.getElementById('mo-detail');
    if (d) d.textContent = st.detail || '';
    const phases = root && root.querySelectorAll('.mo-phase');
    if (phases) phases.forEach(el => el.classList.toggle('on', el.textContent.trim() === st.phase));
  }

  /* ---------- klar ---------- */
  function viewDone() {
    const r = st.result;
    const failed = r.results.filter(x => x.shot.status === 'qc_fail' || x.shot.status === 'failed').length;
    const stabbed = r.results.filter(x => x.shot.needsStabilization).length;
    return shell('Filmen är klar',
      `${r.results.length} shots · ${U.round(M.totalDuration(r.project), 1)} s · ${st.music.name.replace(/\.[^.]+$/, '')}`,
      U.el('div', {},
        U.el('div', { class: 'mo-stats' },
          stat(r.results.length, 'shots'),
          stat(U.round(M.totalDuration(r.project), 1) + ' s', 'längd'),
          stat(failed, 'QC-anmärkningar'),
          stat(stabbed, 'stabiliserade')),
        failed ? U.el('div', { class: 'mo-warn' }, U.el('div', { text: `${failed} shots klarade inte QC efter tre försök. Öppna i Master Editor och generera om dem.` })) : null,
        U.el('div', { class: 'hint', style: { marginTop: '10px' } },
          'Projektet ligger nu under Mina projekt med hela Director Plan, musikanalysen och alla shots.')),
      U.el('div', { class: 'mo-foot' },
        U.el('span', { class: 'spacer' }),
        U.el('button', { class: 'btn', onclick: () => { st.step = 'plan'; render(); } }, 'Se planen'),
        U.el('button', {
          class: 'btn primary', onclick: () => {
            Playback.releaseAll();
            S.setProject(st.result.project);
            App.applyPreviewSize(); Timeline.zoomFit();
            close();
            U.toast('Öppnad i Master Editor', 'Alla shots ligger på timelinen med musiken.');
          },
        }, 'Öppna i Master Editor →')));
  }

  /* ---------- filhantering ---------- */
  let pickKind = 'image';
  function pickFiles(kind) {
    pickKind = kind;
    const inp = U.$('#motionfiles');
    inp.accept = kind === 'audio' ? 'audio/*' : 'image/*';
    inp.click();
  }
  async function addFiles(files) {
    const t = U.toast('Importerar…');
    try {
      const items = await Media.ingestFiles(files);
      t.remove();
      if (!items.length) return;
      S.update(p => { p.media.push(...items); }, 'motion-import');
      for (const m of items) {
        if (m.type === 'image') st.images.push(m);
        else if (m.type === 'audio' && !st.music) st.music = m;
      }
      render();
    } catch (e) { t.remove(); U.errToast('Import misslyckades', e); }
  }

  function init() {
    const inp = U.el('input', { type: 'file', id: 'motionfiles', multiple: true, accept: 'image/*', style: { display: 'none' } });
    inp.addEventListener('change', async e => { await addFiles(e.target.files); e.target.value = ''; });
    document.body.append(inp);
    Generation.bus.on('bridge', () => { if (st.step === 'plan') render(); });
  }

  return { init, open, close, render, st, startPlanning, runGeneration };
})();


/* ===== 90-export.js ===== */
/* ============================================================
   90 — Export: riktig rendering via canvas.captureStream + MediaRecorder

   Renderingen sker i realtid genom samma pipeline som previewn, i full
   projektupplösning. Ljudet tas från Web Audio-grafen. Vill man senare
   flytta renderingen till en backend-worker byter man bara ut runExport()
   — resten av editorn är oberoende av den.
   ============================================================ */
const Exporter = (() => {
  const PRESETS = [
    { id: 'web169', name: 'Hemnet / webbplats 16:9', desc: '1080p, 30 fps, 12 Mbit/s', settings: { aspect: '16:9', resolution: 1080, fps: 30 }, quality: 12 },
    { id: 'reel', name: 'Instagram Reel 9:16', desc: '1080×1920, 30 fps', settings: { aspect: '9:16', resolution: 1920, fps: 30 }, quality: 10 },
    { id: 'feed', name: 'Instagram Feed 4:5', desc: '1080×1350, 30 fps', settings: { aspect: '4:5', resolution: 1350, fps: 30 }, quality: 10 },
    { id: 'story', name: 'Story 9:16', desc: '1080×1920, 30 fps, lättare fil', settings: { aspect: '9:16', resolution: 1920, fps: 30 }, quality: 8 },
    { id: 'master', name: 'High-quality master', desc: 'Högsta upplösning miljön klarar, 28 Mbit/s', settings: { aspect: '16:9', resolution: 2160, fps: 30 }, quality: 28 },
    { id: 'light', name: 'Lightweight preview', desc: '1080p, 25 fps, 4 Mbit/s', settings: { aspect: '16:9', resolution: 1080, fps: 25 }, quality: 4 },
  ];

  const CANDIDATES = [
    ['mp4h264', 'MP4 · H.264 + AAC', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2'],
    ['mp4', 'MP4', 'video/mp4'],
    ['webmvp9', 'WebM · VP9 + Opus', 'video/webm;codecs=vp9,opus'],
    ['webmvp8', 'WebM · VP8 + Opus', 'video/webm;codecs=vp8,opus'],
    ['webm', 'WebM', 'video/webm'],
  ];
  function supported() {
    if (typeof MediaRecorder === 'undefined') return [];
    return CANDIDATES.filter(c => { try { return MediaRecorder.isTypeSupported(c[2]); } catch (e) { return false; } });
  }
  function codecOptions() {
    const s = supported();
    if (!s.length) return [['auto', 'Ingen inbyggd encoder']];
    return [['auto', 'Auto (' + s[0][1] + ')'], ...s.map(c => [c[0], c[1]])];
  }
  function pick(container) {
    const s = supported();
    if (!s.length) return null;
    if (container && container !== 'auto') { const f = s.find(c => c[0] === container); if (f) return f; }
    return s[0];
  }

  const status = { running: false, progress: 0, message: '', result: null, error: null };
  let recorder = null, cancelled = false, chunks = [];

  function outSize(p) {
    const h = p.settings.resolution || 1080;
    const { w, h: hh } = U.frameSize(p.settings.aspect, h);
    return { w, h: hh };
  }
  function projectFps(p) {
    if (p.settings.fps === 'source') {
      const f = p.media.filter(m => m.type === 'video' && m.fps).map(m => m.fps);
      return f.length ? Math.round(f.sort((a, b) => a - b)[Math.floor(f.length / 2)]) : 30;
    }
    return p.settings.fps || 30;
  }
  function estimate(p) {
    const { w, h } = outSize(p);
    const duration = M.totalDuration(p);
    const fps = projectFps(p);
    const bits = (p.export.quality || 12) * 1e6;
    const c = pick(p.export.container);
    return {
      w, h, fps, duration,
      bytes: duration * bits / 8 * (p.export.audio ? 1.03 : 1),
      time: duration + 3,
      codecLabel: c ? c[1] : 'saknas i denna webbläsare',
    };
  }
  function capabilityNote() {
    const s = supported();
    if (!s.length) return 'Den här webbläsaren saknar MediaRecorder — exporten kan inte köras lokalt. Allt annat (projekt, timeline, stabilisering) fungerar, och renderingen kan kopplas till en backend-worker via runExport().';
    return 'Exporten renderas i realtid genom samma GPU-pipeline som previewn, i full projektupplösning, och kodas med webbläsarens inbyggda encoder (' + s[0][1] + '). Långa filmer tar ungefär lika lång tid som de är långa.';
  }

  async function start() {
    if (status.running) return;
    const p = S.project;
    const duration = M.totalDuration(p);
    if (duration < .2) { U.toast('Inget att exportera', 'Lägg minst ett klipp på timelinen först.', 'warn'); return; }
    const codec = pick(p.export.container);
    if (!codec) { U.toast('Export stöds inte här', capabilityNote(), 'err'); return; }
    cancelled = false; chunks = [];
    status.running = true; status.progress = 0; status.result = null; status.error = null;
    status.message = 'Förbereder…';
    Panels.render();
    try {
      await runExport(p, codec, duration);
      if (!cancelled) {
        const blob = new Blob(chunks, { type: codec[2].split(';')[0] });
        const ext = codec[2].includes('mp4') ? 'mp4' : 'webm';
        status.result = { blob, name: (p.export.filename || 'bostadsfilm') + '.' + ext, size: blob.size, url: URL.createObjectURL(blob) };
        status.message = 'Klar';
        U.toast('Exporten är klar', status.result.name + ' · ' + U.bytes(blob.size));
      } else {
        status.message = 'Avbruten';
      }
    } catch (e) {
      status.error = e.message;
      U.errToast('Exporten misslyckades', e);
    } finally {
      status.running = false;
      Playback.view.exporting = false;
      App.applyPreviewSize();
      Panels.render();
    }
  }

  /** Den utbytbara renderingsmodulen. Byt ut denna mot ett anrop till en
      backend-worker om exporten ska ske på server — inget annat behöver ändras. */
  function runExport(p, codec, duration) {
    return new Promise((resolve, reject) => {
      const { w, h } = outSize(p);
      const fps = projectFps(p);
      Playback.pause();
      Playback.view.exporting = true;
      Renderer.setSize(w, h);
      const canvas = Renderer.canvas;
      let stream;
      try { stream = canvas.captureStream(fps); }
      catch (e) { return reject(new Error('canvas.captureStream stöds inte i den här webbläsaren.')); }
      if (p.export.audio) {
        try {
          const ac = Playback.ctx();
          const dest = ac.createMediaStreamDestination();
          Playback.audioDest().connect(dest);
          dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
        } catch (e) { console.warn('ljudspår kunde inte läggas till', e); }
      }
      let rec;
      try {
        rec = new MediaRecorder(stream, {
          mimeType: codec[2],
          videoBitsPerSecond: (p.export.quality || 12) * 1e6,
          audioBitsPerSecond: 160000,
        });
      } catch (e) { return reject(new Error('Encodern kunde inte startas: ' + e.message)); }
      recorder = rec;
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onerror = e => reject(new Error('Inspelningsfel: ' + (e.error && e.error.name)));
      rec.onstop = () => { recorder = null; resolve(); };

      S.st.playhead = 0;
      S.st.playing = false;
      Playback.resume();
      Playback.renderAt(0, p, { playing: false });

      // en kort inledande paus så att första bildrutan hinner dekodas
      setTimeout(() => {
        rec.start(400);
        const t0 = performance.now();
        let last = t0;
        const step = now => {
          if (cancelled) { try { rec.stop(); } catch (e) { } return; }
          const t = (now - t0) / 1000;
          last = now;
          S.st.playhead = Math.min(t, duration);
          Playback.renderAt(S.st.playhead, p, { playing: true, duck: Playback.duckFactor(S.st.playhead, p) });
          Playback.syncMusic(S.st.playhead, p, true);
          status.progress = U.clamp(t / duration, 0, 1);
          status.message = `Renderar ${U.tc(Math.min(t, duration), false)} / ${U.tc(duration, false)} · ${w}×${h} @ ${fps} fps`;
          S.bus.emit('exportprogress', status.progress);
          if (t >= duration + .25) {
            Playback.pause();
            setTimeout(() => { try { rec.stop(); } catch (e) { reject(e); } }, 250);
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }, 350);
    });
  }

  function cancel() {
    cancelled = true;
    status.message = 'Avbryter…';
    try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) { }
    Playback.pause();
  }
  function download() {
    if (!status.result) return;
    const a = document.createElement('a');
    a.href = status.result.url; a.download = status.result.name;
    document.body.append(a); a.click(); a.remove();
  }

  return { PRESETS, start, cancel, download, estimate, codecOptions, capabilityNote, supported, status, outSize, projectFps };
})();


/* ===== 95-app.js ===== */
/* ============================================================
   95 — App: bootstrap, kommandon, kortkommandon, projekthantering
   ============================================================ */
const App = (() => {
  const state = { showBeats: true, snapBeats: false, ready: false };
  let cancelStab = false;

  /* ---------- storlek & preview ---------- */
  function applyPreviewSize() {
    const p = S.project;
    const { w, h } = Exporter.outSize(p);
    const q = U.clamp(p.settings.previewQuality || .55, .2, 1);
    Renderer.setSize(Math.round(w * q / 2) * 2, Math.round(h * q / 2) * 2);
    fitStage();
  }
  function fitStage() {
    const stage = U.$('#stage'), inner = U.$('#stageinner');
    if (!stage || !inner) return;
    const p = S.project;
    const ar = U.ASPECTS[p.settings.aspect] || 16 / 9;
    const sw = stage.clientWidth - 16, sh = stage.clientHeight - 16;
    let w = sw, h = w / ar;
    if (h > sh) { h = sh; w = h * ar; }
    inner.style.width = Math.max(40, Math.floor(w)) + 'px';
    inner.style.height = Math.max(24, Math.floor(h)) + 'px';
    const empty = U.$('#emptyprev');
    if (empty) empty.style.display = p.tracks.video.length ? 'none' : 'flex';
  }

  /* ---------- media → timeline ---------- */
  function addMediaToTimeline(media, at) {
    if (!media) return;
    if (media.missing) { U.toast('Filen saknas', 'Importera om ' + media.name, 'err'); return; }
    S.update(p => {
      if (media.type === 'audio') {
        const c = M.newAudioClip(media, at == null ? 0 : Math.max(0, at));
        p.tracks.music.push(c);
        S.selectClips([c.id]);
      } else {
        const c = M.newClip(media, 0);
        p.tracks.video.push(c);
        M.relayout(p.tracks.video);
        S.selectClips([c.id]);
      }
    }, 'add-clip');
    U.toast('Lagt till på timelinen', media.name);
    Timeline.zoomFit();
  }

  /* ---------- klippkommandon ---------- */
  function splitAtPlayhead() {
    const t = S.st.playhead;
    const p = S.project;
    const c = M.clipAt(p, t);
    if (!c) { U.toast('Inget klipp vid playhead', 'Flytta playheaden till ett klipp först.', 'warn'); return; }
    const local = t - c.start;
    const dur = M.clipDuration(c);
    if (local < .08 || local > dur - .08) { U.toast('För nära klippets kant', 'Dela minst 0,1 s in i klippet.', 'warn'); return; }
    S.update(pp => {
      const arr = pp.tracks.video;
      const i = arr.findIndex(x => x.id === c.id);
      const orig = arr[i];
      const cut = orig.in + local * (orig.speed || 1);
      const b = U.clone(orig);
      b.id = U.uid('clip');
      b.in = cut; b.transitionIn = { type: 'cut', dur: 0 };
      orig.out = cut;
      orig.fade.out = 0; b.fade.in = 0;
      arr.splice(i + 1, 0, b);
      M.relayout(arr);
      S.selectClips([b.id]);
    }, 'split');
    U.toast('Klippet delat');
  }
  function deleteSelected(ripple) {
    const sel = S.selectedClips();
    if (!sel.length) return;
    S.update(p => {
      for (const c of sel) {
        if (c.kind === 'video') {
          const d = M.clipDuration(c);
          p.tracks.video = p.tracks.video.filter(x => x.id !== c.id);
          if (ripple) {
            for (const a of p.tracks.music) if (a.start > c.start) a.start = Math.max(0, a.start - d);
            for (const a of p.tracks.text) if (a.start > c.start) a.start = Math.max(0, a.start - d);
          }
        } else if (c.kind === 'music') p.tracks.music = p.tracks.music.filter(x => x.id !== c.id);
        else p.tracks.text = p.tracks.text.filter(x => x.id !== c.id);
      }
      M.relayout(p.tracks.video);
      S.selectClips([]);
    }, 'delete');
  }
  const deleteClip = id => { S.selectClips([id]); deleteSelected(false); };
  function duplicateSelected() {
    const sel = S.selectedClips();
    if (!sel.length) return;
    S.update(p => {
      const ids = [];
      for (const c of sel) {
        const n = U.clone(c); n.id = U.uid(c.kind === 'video' ? 'clip' : c.kind === 'music' ? 'aclip' : 'txt');
        if (c.kind === 'video') { const i = p.tracks.video.findIndex(x => x.id === c.id); p.tracks.video.splice(i + 1, 0, n); }
        else if (c.kind === 'music') { n.start = c.start + (c.out - c.in); p.tracks.music.push(n); }
        else { n.start = c.start + c.duration; p.tracks.text.push(n); }
        ids.push(n.id);
      }
      M.relayout(p.tracks.video);
      S.selectClips(ids);
    }, 'duplicate');
  }

  /* ---------- stabilisering ---------- */
  async function runStabAnalysis(media) {
    if (!media) return;
    cancelStab = false;
    Panels.ui.stabBusy = { pct: 0, msg: 'Startar…' };
    try {
      await Stab.analyze(media, (pct, msg) => {
        Panels.ui.stabBusy = { pct, msg };
        const bar = U.$('#panelbody .progress i'); if (bar) bar.style.width = (pct * 100) + '%';
        const h = U.$('#panelbody .progress + .row'); if (h) h.textContent = msg;
      });
      Panels.ui.stabBusy = null;
      Panels.render();
      const r = media.stab.report;
      U.toast('Analys klar · ' + M.stabModeById(r.recommended).name,
        `${r.samples} bildrutor · skakning ${r.shake.label} · crop ≈ ${r.estimatedCrop} %`);
      const clip = S.primaryClip();
      if (clip && clip.mediaId === media.id && !clip.stabEnabled) toggleStabOnClip(true);
    } catch (e) {
      Panels.ui.stabBusy = null;
      if (e.message !== 'cancelled') U.errToast('Analysen misslyckades', e);
      Panels.render();
    }
  }
  function toggleStabOnClip(on) {
    const clip = S.primaryClip();
    if (!clip || clip.kind !== 'video') return;
    const media = M.mediaById(S.project, clip.mediaId);
    if (on && (!media.stab || media.stab.status !== 'analyzed')) {
      U.toast('Klippet måste analyseras först', 'Kör "Analysera klippet" i stabiliseringspanelen.', 'warn');
      Panels.open('stab');
      return;
    }
    S.update(p => { M.findClip(p, clip.id).stabEnabled = !!on; }, 'stab-toggle');
  }
  function applyStabToAll(media) {
    if (!media || !media.stab || media.stab.status !== 'analyzed') { U.toast('Analysera först', '', 'warn'); return; }
    let n = 0;
    S.update(p => { for (const c of p.tracks.video) if (c.mediaId === media.id) { c.stabEnabled = true; n++; } }, 'stab-all');
    U.toast('Stabilisering på ' + n + ' klipp', media.name);
  }
  async function analyzeAllUsedMedia() {
    const p = S.project;
    const ids = [...new Set(p.tracks.video.map(c => c.mediaId))];
    const list = ids.map(id => M.mediaById(p, id)).filter(m => m && m.type === 'video' && (!m.stab || m.stab.status !== 'analyzed'));
    if (!list.length) { U.toast('Alla klipp är redan analyserade'); return; }
    for (const m of list) {
      if (cancelStab) break;
      await runStabAnalysis(m);
    }
    S.update(pp => { for (const c of pp.tracks.video) { const m = M.mediaById(pp, c.mediaId); if (m && m.stab && m.stab.status === 'analyzed') c.stabEnabled = true; } }, 'stab-all');
    U.toast('Alla klipp analyserade och stabiliserade');
  }

  /* ---------- färg ---------- */
  async function autoEnhance(clip) {
    const media = M.mediaById(S.project, clip.mediaId);
    if (!media) return;
    const t = U.toast('Analyserar bildruta…', media.name);
    try {
      const idx = S.project.tracks.video.findIndex(c => c.id === clip.id);
      let prevStats = null;
      if (idx > 0) {
        const pc = S.project.tracks.video[idx - 1];
        const pm = M.mediaById(S.project, pc.mediaId);
        if (pm && pm.url) prevStats = await Color.frameStats(pm, pc.in + (pc.out - pc.in) * .4);
      }
      const res = await Color.autoEnhance(clip, media, prevStats);
      t.remove();
      const all = [...res.suggestions, ...res.match];
      if (!all.length) { U.toast('Inget att justera', 'Klippet ser redan balanserat ut.'); return; }
      const box = U.el('div');
      const checks = all.map(s => {
        const inp = U.el('input', { type: 'checkbox' }); inp.checked = true;
        box.append(U.el('label', { class: 'row', style: { cursor: 'pointer', alignItems: 'flex-start' } },
          inp,
          U.el('div', { style: { flex: '1' } },
            U.el('div', {}, s.label, ' ', U.el('span', { class: 'tag accent', text: (s.value > 0 ? '+' : '') + s.value })),
            U.el('div', { class: 'hint', text: s.why }))));
        return { inp, s };
      });
      box.append(U.el('div', { class: 'hint', style: { marginTop: '8px' } },
        'Förslagen är begränsade till försiktiga värden — inga extrema ändringar appliceras automatiskt.'));
      U.modal({
        title: 'Auto Enhance for Real Estate', body: box,
        actions: [{ label: 'Avbryt' }, {
          label: 'Applicera valda', primary: true, onclick: () => {
            S.update(p => {
              const c = M.findClip(p, clip.id);
              for (const { inp, s } of checks) if (inp.checked) c.grade[s.key] = U.clamp((c.grade[s.key] || 0) + s.value, -200, 200);
            }, 'auto-enhance');
            U.toast('Auto Enhance applicerad');
          }
        }],
      });
    } catch (e) { t.remove(); U.errToast('Auto Enhance misslyckades', e); }
  }
  function copyGradeToAll(clip) {
    S.update(p => {
      for (const c of p.tracks.video) if (c.id !== clip.id) { c.grade = U.clone(clip.grade); c.filter = clip.filter; c.filterIntensity = clip.filterIntensity; }
    }, 'copy-grade');
    U.toast('Bildinställningarna kopierade till alla klipp');
  }
  async function openMatchClips() {
    const p = S.project;
    const clips = p.tracks.video;
    if (clips.length < 2) { U.toast('Minst två klipp krävs', '', 'warn'); return; }
    const t = U.toast('Analyserar klippen…');
    const stats = await Color.collectStats(p, clips, () => { });
    t.remove();
    const refSel = U.select(clips.map((c, i) => [c.id, (i + 1) + '. ' + ((M.mediaById(p, c.mediaId) || {}).name || '')]), (S.primaryClip() || clips[0]).id, () => refresh());
    const opts = { exposure: true, wb: true, contrast: true, tone: false };
    const scope = U.select([['all', 'Hela filmen'], ['sel', 'Endast markerade klipp']], 'all', v => scope.value = v);
    const listBox = U.el('div');
    function refresh() {
      U.clear(listBox);
      const ref = stats.get(refSel.value);
      for (const c of clips) {
        const dev = Color.deviation(stats.get(c.id), ref);
        c._deviation = c.id === refSel.value ? 0 : dev;
        const m = M.mediaById(p, c.mediaId);
        listBox.append(U.el('div', { class: 'rrow' },
          U.el('span', { class: 'k', style: { flex: '1' }, text: (m ? m.name : '?') }),
          U.el('span', { class: 'meter', style: { flex: '0 0 90px' } }, U.el('i', { class: dev > .55 ? 'warn' : '', style: { width: U.clamp(dev / 1.2, 0, 1) * 100 + '%' } })),
          U.el('span', { class: 'v mono', style: { flex: '0 0 54px', textAlign: 'right' }, text: c.id === refSel.value ? 'referens' : dev.toFixed(2) })));
      }
      Timeline.render();
    }
    const box = U.el('div', {},
      U.el('div', { class: 'row' }, U.el('label', { class: 'lbl', text: 'Referensklipp' }), refSel),
      U.el('div', { class: 'row' }, U.el('label', { class: 'lbl', text: 'Applicera på' }), scope),
      U.el('div', { class: 'row wrap' },
        U.check('Exponering', true, v => opts.exposure = v),
        U.check('Vitbalans', true, v => opts.wb = v),
        U.check('Kontrast', true, v => opts.contrast = v),
        U.check('Färgton', false, v => opts.tone = v)),
      U.el('h3', { class: 'sectitle', text: 'Avvikelse mot referensen' }), listBox);
    refresh();
    U.modal({
      title: 'Match Clips', wide: true, body: box,
      actions: [{ label: 'Stäng' }, {
        label: 'Matcha', primary: true, onclick: () => {
          const ref = stats.get(refSel.value);
          const selIds = new Set(S.sel.clips);
          let n = 0;
          S.update(pp => {
            for (const c of pp.tracks.video) {
              if (c.id === refSel.value) continue;
              if (scope.value === 'sel' && !selIds.has(c.id)) continue;
              const s = stats.get(c.id); if (!s) continue;
              const d = Color.matchDelta(s, ref, opts);
              for (const k in d) c.grade[k] = U.clamp((c.grade[k] || 0) + d[k], -200, 200);
              n++;
            }
          }, 'match-clips');
          U.toast('Matchade ' + n + ' klipp', 'Referens: ' + ((M.mediaById(p, (M.findClip(p, refSel.value) || {}).mediaId) || {}).name || ''));
        }
      }],
    });
  }

  /* ---------- musik ---------- */
  function trimMusicToFilm(c) {
    const total = M.totalDuration(S.project);
    S.update(p => { const x = M.findClip(p, c.id); x.out = Math.min(x.in + Math.max(1, total - x.start), (M.mediaById(p, x.mediaId) || {}).duration || x.out); }, 'music-trim');
    U.toast('Musiken trimmad till filmens längd');
  }
  function loopMusicToFilm(c) {
    const p0 = S.project;
    const total = M.totalDuration(p0);
    const m = M.mediaById(p0, c.mediaId);
    if (!m) return;
    S.update(p => {
      p.tracks.music = p.tracks.music.filter(x => x.mediaId !== c.mediaId || x.id === c.id);
      const len = c.out - c.in;
      let t = c.start + len;
      let guard = 0;
      while (t < total - .3 && guard++ < 40) {
        const n = M.newAudioClip(m, t);
        n.in = c.in; n.out = c.out; n.volume = c.volume; n.loop = true; n.fade = { in: .2, out: Math.min(2, len / 3) };
        p.tracks.music.push(n);
        t += len;
      }
      const cc = M.findClip(p, c.id); if (cc) cc.loop = true;
    }, 'music-loop');
    U.toast('Musiken loopad över hela filmen');
  }
  function beatSyncSuggest(c) {
    const p = S.project;
    const m = M.mediaById(p, c.mediaId);
    if (!m || !m.beats || !m.beats.length) { U.toast('Inga transienter hittade', '', 'warn'); return; }
    const times = m.beats.map(b => c.start + (b - c.in)).filter(t => t > .3 && t < M.totalDuration(p));
    const clips = p.tracks.video;
    const rows = clips.map((cl, i) => {
      if (i === 0) return null;
      const cut = cl.start;
      let best = null, bd = 1e9;
      for (const t of times) { const d = Math.abs(t - cut); if (d < bd) { bd = d; best = t; } }
      return best == null ? null : { clip: cl, cut, beat: best, delta: best - cut };
    }).filter(Boolean).filter(r => Math.abs(r.delta) < 1.2);
    if (!rows.length) { U.toast('Inga klippunkter nära en beat'); return; }
    const box = U.el('div');
    box.append(U.el('div', { class: 'hint', style: { marginBottom: '6px' } }, 'Förslagen flyttar klippgränsen genom att justera föregående klipps längd. Inget tvingas på dig — bocka ur det du inte vill ha.'));
    const checks = rows.map(r => {
      const inp = U.el('input', { type: 'checkbox' }); inp.checked = Math.abs(r.delta) < .5;
      box.append(U.el('label', { class: 'row', style: { cursor: 'pointer' } }, inp,
        U.el('span', { style: { flex: '1' }, text: `Klippunkt ${U.tc(r.cut, false)} → beat ${U.tc(r.beat, false)}` }),
        U.el('span', { class: 'tag mono', text: (r.delta > 0 ? '+' : '') + r.delta.toFixed(2) + ' s' })));
      return { inp, r };
    });
    U.modal({
      title: 'Beat Sync', body: box, wide: true,
      actions: [{ label: 'Avbryt' }, {
        label: 'Applicera valda', primary: true, onclick: () => {
          S.update(pp => {
            for (const { inp, r } of checks) {
              if (!inp.checked) continue;
              const arr = pp.tracks.video;
              const i = arr.findIndex(x => x.id === r.clip.id);
              if (i <= 0) continue;
              const prev = arr[i - 1];
              const want = M.clipDuration(prev) + r.delta;
              const media = M.mediaById(pp, prev.mediaId);
              const maxOut = media ? media.duration : prev.out;
              prev.out = U.clamp(prev.in + want * (prev.speed || 1), prev.in + .15, maxOut);
              M.relayout(arr);
            }
          }, 'beatsync');
          U.toast('Klippunkter synkade mot musiken');
        }
      }],
    });
  }

    S.setProject(M.newProject());
    applyPreviewSize();

  function confirmUnsaved() {
    if (!S.st.dirty) return Promise.resolve(true);
    return new Promise(res => {
      U.modal({
        title: 'Osparade ändringar',
        body: U.el('div', { text: 'Projektet har ändringar som inte är sparade. Vill du fortsätta?' }),
        actions: [{ label: 'Avbryt', onclick: () => res(false) }, { label: 'Spara först', onclick: async () => { await Autosave.saveNow(true); res(true); } }, { label: 'Fortsätt utan att spara', danger: true, onclick: () => res(true) }],

  async function duplicateProject() {
    await Autosave.saveNow(true);
    const copy = S.serialize();
    copy.id = U.uid('proj'); copy.name = S.project.name + ' (kopia)'; copy.createdAt = Date.now();
    const byId = new Map(S.project.media.map(m => [m.id, m]));
    copy.media.forEach(m => { const live = byId.get(m.id); if (live) { m.url = live.url; m.thumb = live.thumb; m.strip = live.strip; m.wave = live.wave; m.file = live.file; } });

  function exportProjectFile() {
    const data = S.serialize();
    data._note = 'Projektfil för Master Bostadsfilm Editor. Videofilerna ligger kvar lokalt i webbläsaren och följer inte med denna fil.';

    U.$('#btnMotion').onclick = () => Motion.open();
    U.$('#btnEmptyUpload').onclick = () => U.$('#fileinput').click();

    const selA = U.$('#selAspect'); Object.keys(U.ASPECTS).forEach(a => selA.append(U.el('option', { value: a }, a)));
    selA.onchange = () => { S.update(pp => { pp.settings.aspect = selA.value; }, 'aspect'); applyPreviewSize(); };
    const selR = U.$('#selRes'); M.RESOLUTIONS.forEach(([v, l]) => selR.append(U.el('option', { value: v }, l)));
    selR.onchange = () => { S.update(pp => { pp.settings.resolution = +selR.value; }, 'res'); applyPreviewSize(); };
    const selF = U.$('#selFps'); M.FPS_OPTS.forEach(([v, l]) => selF.append(U.el('option', { value: v }, l)));
    selF.onchange = () => S.update(pp => { pp.settings.fps = selF.value === 'source' ? 'source' : +selF.value; }, 'fps');
    const selQ = U.$('#selPQ'); M.PQ_OPTS.forEach(([v, l]) => selQ.append(U.el('option', { value: v }, l)));
    selQ.onchange = () => { S.update(pp => { pp.settings.previewQuality = +selQ.value; }, 'pq'); applyPreviewSize(); };

    U.$('#btnPlay').onclick = () => Playback.toggle();
    U.$('#btnFrameBack').onclick = () => step(-1);
    U.$('#btnFrameFwd').onclick = () => step(1);
    U.$('#btnPrevClip').onclick = () => jumpClip(-1);
    U.$('#btnNextClip').onclick = () => jumpClip(1);
    U.$('#btnLoopClip').onclick = () => setLoop(!Playback.view.loopClip);
    U.$('#btnBeforeAfter').onclick = () => setCompare(!Playback.view.compare);
    U.$('#btnZoomView').onclick = () => setZoomView(!Playback.view.zoomView);
    U.$('#btnGuides').onclick = () => { Playback.view.guides = !Playback.view.guides; U.$('#btnGuides').classList.toggle('on', Playback.view.guides); };
    U.$('#btnFitFill').onclick = () => {
      const v = Playback.view.fitFill === 'fit' ? 'fill' : 'fit';
      Playback.view.fitFill = v;
      S.update(pp => { pp.settings.fitMode = v; }, 'fit');
      U.$('#btnFitFill').textContent = v === 'fit' ? 'Fit' : 'Fill';
    };
    U.$('#btnFull').onclick = () => {
      const el = U.$('#stage');
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => U.toast('Fullscreen nekades av webbläsaren', '', 'warn'));
    };
    U.$('#btnMute').onclick = () => {
      const m = !Playback.view.muted;
      Playback.setMuted(m);
      U.$('#btnMute').textContent = m ? '🔇' : '🔊';
      U.$('#btnMute').classList.toggle('on', m);
    };
    U.$('#volume').oninput = e => { const v = e.target.value / 100; Playback.setMasterVolume(v); S.update(pp => { pp.masterVolume = e.target.value | 0; }, 'vol', true); };
    U.$('#scrub').oninput = e => { const total = M.totalDuration(S.project); S.seek(total * e.target.value / 1000); };

    U.$('#tlSplit').onclick = splitAtPlayhead;
    U.$('#tlDup').onclick = duplicateSelected;
    U.$('#tlDel').onclick = () => deleteSelected(false);
    U.$('#tlRipple').onclick = () => deleteSelected(true);
    U.$('#tlSnap').onclick = () => { const on = !Timeline.snap; Timeline.setSnap(on); U.$('#tlSnap').classList.toggle('on', on); };
    U.$('#tlZoomIn').onclick = Timeline.zoomIn;
    U.$('#tlZoomOut').onclick = Timeline.zoomOut;
    U.$('#tlZoomFit').onclick = Timeline.zoomFit;

    U.$('#fileinput').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
    U.$('#projinput').onchange = e => { if (e.target.files[0]) importProjectFile(e.target.files[0]); e.target.value = ''; };

    // drag & drop
    let dragDepth = 0;
    window.addEventListener('dragenter', e => { if (!e.dataTransfer.types.includes('Files')) return; dragDepth++; document.body.classList.add('dragging'); });
    window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
    window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
    window.addEventListener('drop', e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
      handleFiles(e.dataTransfer.files);
    });

    // jämförelselinje
    const sb = U.$('#splitbar');
    sb.addEventListener('pointerdown', e => {
      const inner = U.$('#stageinner');
      U.drag(e, {
        cursor: 'ew-resize', onMove: (dx, dy, ev) => {
          const r = inner.getBoundingClientRect();
          Playback.view.compareX = U.clamp((ev.clientX - r.left) / r.width, 0, 1);
          sb.style.left = (Playback.view.compareX * 100) + '%';
        }
      });
    });
    sb.style.left = '50%';

    // timeline-höjd
    U.$('#tlresizer').addEventListener('pointerdown', e => {
      const wrap = U.$('#timelinewrap'), h0 = wrap.clientHeight;
      U.drag(e, { cursor: 'ns-resize', onMove: (dx, dy) => { wrap.style.flex = `0 0 ${U.clamp(h0 - dy, 120, window.innerHeight - 260)}px`; Timeline.render(); fitStage(); } });
    });

    window.addEventListener('resize', () => { fitStage(); Timeline.render(); });
    document.addEventListener('keydown', keys);
    S.bus.on('playstate', on => { U.$('#btnPlay').textContent = on ? '❚❚' : '▶'; });
    S.bus.on('project', syncTopbar);
    S.bus.on('change', U.debounce(syncTopbar, 120));
    S.bus.on('time', updateTime);
    S.bus.on('seek', updateTime);
  }
  function syncTopbar() {
    const p = S.project;
    const nm = U.$('#projname'); if (nm && nm.value !== p.name) nm.value = p.name;
    U.$('#selAspect').value = p.settings.aspect;
    U.$('#selRes').value = p.settings.resolution;
    U.$('#selFps').value = p.settings.fps;
    U.$('#selPQ').value = p.settings.previewQuality;
    U.$('#btnUndo').disabled = !S.canUndo();
    U.$('#btnRedo').disabled = !S.canRedo();
    updateTime(S.st.playhead);
    const empty = U.$('#emptyprev');
    if (empty) empty.style.display = p.tracks.video.length ? 'none' : 'flex';
  }
  function updateTime(t) {
    const total = M.totalDuration(S.project);
    const fps = Exporter.projectFps(S.project);
    const tc = U.$('#timecode');
    if (tc) tc.innerHTML = `${U.tc(t, true, fps)} <span class="tot">/ ${U.tc(total, true, fps)}</span>`;
    const sc = U.$('#scrub');
    if (sc && document.activeElement !== sc) sc.value = total > 0 ? Math.round(t / total * 1000) : 0;
  }
  function step(dir) {
    const fps = Exporter.projectFps(S.project);
    Playback.pause();
    S.seek(U.clamp(S.st.playhead + dir / fps, 0, M.totalDuration(S.project)));
  }
  function jumpClip(dir) {
    const v = S.project.tracks.video;
    if (!v.length) return;
    const t = S.st.playhead + (dir > 0 ? .05 : -.05);
    let target = 0;
    if (dir > 0) { const n = v.find(c => c.start > t); target = n ? n.start : M.totalDuration(S.project); }
    else { const prev = [...v].reverse().find(c => c.start < t - .1); target = prev ? prev.start : 0; }
    S.seek(target);
    const c = M.clipAt(S.project, target + .01); if (c) S.selectClips([c.id]);
  }
  function keys(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (tag === 'button' && (e.key === ' ' || e.key === 'Enter')) return;
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? S.redo() : S.undo(); return; }
    if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); S.redo(); return; }
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); Autosave.saveNow(false); return; }
    if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); return; }
    switch (e.key) {
      case ' ': e.preventDefault(); Playback.toggle(); break;
      case 'Delete': case 'Backspace': e.preventDefault(); deleteSelected(e.shiftKey); break;
      case 's': case 'S': splitAtPlayhead(); break;
      case 'ArrowLeft': e.preventDefault(); step(-1); break;
      case 'ArrowRight': e.preventDefault(); step(1); break;
      case 'Home': S.seek(0); break;
      case 'End': S.seek(M.totalDuration(S.project)); break;
      case '+': case '=': Timeline.zoomIn(); break;
      case '-': case '_': Timeline.zoomOut(); break;
      case 'z': case 'Z': if (e.shiftKey) Timeline.zoomFit(); break;
      case 'b': case 'B': setCompare(!Playback.view.compare); break;
      case 'l': case 'L': setLoop(!Playback.view.loopClip); break;
    }
  }

  /* ---------- start ---------- */
  async function boot() {
    const ok = Renderer.init(U.$('#outcanvas'));
    if (!ok) U.toast('WebGL kunde inte startas', 'Previewn kan inte rendera i den här miljön. Timeline, analys och projekt fungerar ändå.', 'err');
    wire();
    Timeline.init();
    Panels.init();
    Motion.init();
    Autosave.init();
    applyPreviewSize();
    syncTopbar();
    Playback.start();
    new ResizeObserver(() => { fitStage(); }).observe(U.$('#stage'));

    try {
      await DB.open();
      const lastId = await DB.getMeta('lastProject');
      if (lastId) {
        const pr = await DB.getProject(lastId);
        if (pr && (pr.media.length || pr.tracks.video.length)) {
          S.setProject(pr);
          await Media.rehydrate(pr, () => { });
          const missing = pr.media.filter(m => m.missing);
          applyPreviewSize(); Timeline.zoomFit(); syncTopbar();
          Autosave.markClean('Sparad');
          U.toast('Senaste projektet återställt', pr.name + (missing.length ? ` · ${missing.length} mediefiler saknas` : ''));
        }
      }
    } catch (e) {
      U.toast('Lokal lagring ej tillgänglig', 'Projektet lever bara i den här fliken. ' + (DB.error || ''), 'warn');
    }
    state.ready = true;
    document.body.setAttribute('data-ready', '1');
  }

  return {
    state, boot, applyPreviewSize, fitStage, addMediaToTimeline, splitAtPlayhead, deleteSelected, deleteClip,
    duplicateSelected, runStabAnalysis, toggleStabOnClip, applyStabToAll, analyzeAllUsedMedia,
    autoEnhance, copyGradeToAll, openMatchClips, addText, addPropertyIntro, trimMusicToFilm, loopMusicToFilm,
    beatSyncSuggest, setCompare, setLoop, setZoomView, newProject, duplicateProject, exportProjectFile,
    importProjectFile, projectsModal, openProject, handleFiles,
    get cancelStab() { return cancelStab; }, set cancelStab(v) { cancelStab = v; },
  };
})();

document.addEventListener('DOMContentLoaded', () => App.boot());

</script>
