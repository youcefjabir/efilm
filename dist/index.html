  /* --- bandpass runt en frekvens: skillnad mellan två glidande medel --- */
  function bandpass(a, fps, hz) {
    if (!(hz > 0.2)) return new Float32Array(a.length);
    const period = fps / hz;
    const s1 = gauss(a, Math.max(0.6, period / 6));
    const s2 = gauss(a, Math.max(1.2, period * 0.9));
    return sub(s1, s2);
  }

  const hashSettings = s => JSON.stringify(s);

  /** Bygger korrigeringsspåret för ett medium + inställningar. */
  function build(traj, settings, report) {
    const n = traj.n, fps = traj.fps, a = 1 / traj.aspect;   // halvhöjd i halvbredds-enheter
    const st = settings;
    const g = st.strength / 100;
    const smoothSec = U.lerp(0.10, 1.9, Math.pow(st.smoothness / 100, 0.85));
    let sigma = smoothSec * fps;
    if (st.mode === 'locked') sigma = Math.max(sigma, n);     // i praktiken hela klippet = tripod

    const raw = { tx: Float32Array.from(traj.tx), ty: Float32Array.from(traj.ty), rot: Float32Array.from(traj.rot), scale: Float32Array.from(traj.scale), shear: Float32Array.from(traj.shear), aspect: Float32Array.from(traj.aspectCh) };

    // extra utjämning där spårningen visade icke-rigid deformation
    const wob = st.wobble / 100;
    const sigmaShape = sigma * (1 + wob * 1.6);

    // Walking bob: för att ta bort en svängning på f Hz måste lågpassfiltret
    // ligga klart under f. Ett extra bandstopp ovanpå utjämningen dubbelräknar
    // samma rörelse och gör resultatet sämre — bredda filtret i stället.
    const bobHzDet = (report && report.bob && report.bob.hz) || 0;
    let sigmaY = sigma;
    if (st.verticalBob > 0 && bobHzDet > 0.4 && bobHzDet < 4) {
      const need = (fps / bobHzDet) * 1.1;             // ~1,1 perioder
      sigmaY = Math.max(sigmaY, need * (st.verticalBob / 100));
    }
    const sm = {
      tx: gauss(raw.tx, sigma), ty: gauss(raw.ty, sigmaY),
      rot: st.lockHorizon ? constArr(n, mean(raw.rot)) : gauss(raw.rot, sigma * (0.6 + 0.8 * st.rotation / 100)),
      scale: gauss(raw.scale, sigma), shear: gauss(raw.shear, sigmaShape), aspect: gauss(raw.aspect, sigmaShape),
    };
    if (st.mode === 'locked') { sm.tx = constArr(n, mean(raw.tx)); sm.ty = constArr(n, mean(raw.ty)); sm.scale = constArr(n, mean(raw.scale)); }

    const gRot = g * (st.rotation / 100);
    const gPersp = g * (st.perspective / 100);
    const gScale = g * (0.55 + 0.45 * st.perspective / 100);

    let cTx = sub(sm.tx, raw.tx), cTy = sub(sm.ty, raw.ty);
    let cRot = sub(sm.rot, raw.rot), cScale = sub(sm.scale, raw.scale);
    let cShear = sub(sm.shear, raw.shear), cAspect = sub(sm.aspect, raw.aspect);

    // --- rolling shutter: shear proportionell mot horisontell hastighet ---
    if (st.rollingShutter > 0) {
      const k = st.rollingShutter / 100 * 0.10;
      for (let i = 1; i < n; i++) cShear[i] += -(raw.tx[i] - raw.tx[i - 1]) * fps * k * 0.02;
    }
    // --- motion preservation: låt avsiktlig lågfrekvent rörelse vara ifred ---
    const mp = st.motionPreservation / 100;
    if (mp > 0.01) {
      const bigSigma = Math.max(sigma * 2.2, fps * 1.2);
      const keep = (c) => { const lp = gauss(c, bigSigma); const o = new Float32Array(n); for (let i = 0; i < n; i++) o[i] = c[i] - lp[i] * mp; return o; };
      cTx = keep(cTx); cTy = keep(cTy); cRot = keep(cRot); cScale = keep(cScale);
    }
    // --- global styrka + gränser ---
    const maxShift = U.lerp(0.30, 0.06, mp) * (st.mode === 'locked' ? 1.4 : 1);
    for (let i = 0; i < n; i++) {
      cTx[i] = U.clamp(cTx[i] * g, -maxShift, maxShift);
      cTy[i] = U.clamp(cTy[i] * g, -maxShift * a * 1.6, maxShift * a * 1.6);
      cRot[i] = U.clamp(cRot[i] * gRot, -0.12, 0.12);
      cScale[i] = U.clamp(cScale[i] * gScale, -0.08, 0.08);
      cShear[i] = U.clamp(cShear[i] * gPersp * (1 + wob), -0.03, 0.03);
      cAspect[i] = 0;   // bildförhållandet får aldrig ändras
    }

    // --- nödvändig zoom: minsta z så att hela vyn täcks i varje bildruta ---
    const need = requiredZoom(n, a, cTx, cTy, cRot, cScale, cShear, cAspect);
    let extra = st.reduceEdgeWarp ? 0.015 : 0;
    extra += wob * 0.02;
    let zoomNeed = need * (1 + extra);
    const zoomCap = 1 / Math.max(0.5, 1 - 2 * (st.crop / 100));
    let limited = false, scaleDown = 1;
    if (st.autoCrop) {
      if (zoomNeed > zoomCap) {
        // dämpa hela korrigeringen tills den ryms inom tillåten crop
        limited = true;
        scaleDown = U.clamp((zoomCap - 1) / Math.max(1e-4, zoomNeed - 1), 0.15, 1);
        for (let i = 0; i < n; i++) { cTx[i] *= scaleDown; cTy[i] *= scaleDown; cRot[i] *= scaleDown; cScale[i] *= scaleDown; cShear[i] *= scaleDown; cAspect[i] *= scaleDown; }
        zoomNeed = requiredZoom(n, a, cTx, cTy, cRot, cScale, cShear, cAspect) * (1 + extra);
      }
    } else {
      zoomNeed = zoomCap;
    }
    const zoom = 1 + (zoomNeed - 1) * (st.zoomComp / 100);
    const cropPct = U.round((1 - 1 / zoom) / 2 * 100, 1);

    return {
      hash: hashSettings(st), n, fps, step: traj.step, duration: traj.duration,
      tx: cTx, ty: cTy, rot: cRot, scale: cScale, shear: cShear, aspect: cAspect,
      zoom, cropPct, limited, scaleDown: U.round(scaleDown, 2),
      note: limited ? `Korrigeringen dämpades till ${Math.round(scaleDown * 100)} % för att hålla sig inom ${st.crop} % crop.` : null,
    };
  }

  /** Minsta zoom som gör att vyn aldrig hamnar utanför källbilden. */
  function requiredZoom(n, a, cTx, cTy, cRot, cScale, cShear, cAspect) {
    const corners = [[-1, -a], [1, -a], [1, a], [-1, a]];
    let z = 1;
    for (let i = 0; i < n; i++) {
      const cs = Math.cos(cRot[i]), sn = Math.sin(cRot[i]);
      const s = Math.exp(cScale[i]), ar = Math.exp(cAspect[i]);
      const m00 = cs * s * ar, m01 = (cShear[i] * cs - sn) * s / ar;
      const m10 = sn * s * ar, m11 = (cShear[i] * sn + cs) * s / ar;
      for (const [cx, cy] of corners) {
        const x = m00 * cx + m01 * cy + cTx[i];
        const y = m10 * cx + m11 * cy + cTy[i];
        // vyn måste rymmas innanför den transformerade bilden i varje bildruta
        z = Math.max(z, Math.abs(x), Math.abs(y) / a);
      }
    }
    return U.clamp(z, 1, 1.6);
  }

  /** Interpolerar korrigeringen vid en godtycklig källtid. */
  function sample(corr, t) {
    if (!corr || !corr.n) return null;
    const f = U.clamp(t / corr.step, 0, corr.n - 1);
    const i = Math.floor(f), j = Math.min(corr.n - 1, i + 1), u = f - i;
    const L = (arr) => arr[i] + (arr[j] - arr[i]) * u;
    return { tx: L(corr.tx), ty: L(corr.ty), rot: L(corr.rot), scale: L(corr.scale), shear: L(corr.shear), aspect: L(corr.aspect), zoom: corr.zoom };
  }

  /** Snabb cropuppskattning för rapporten (utan att bygga hela spåret). */
  function estimateCrop(traj, settings) {
    try {
      const c = build(traj, settings, null);
      return { cropPct: c.cropPct, zoom: c.zoom };
    } catch (e) { return { cropPct: 0, zoom: 1 }; }
  }
  StabAnalyze._bind(estimateCrop);

  return { build, sample, estimateCrop, gauss };
})();

/* ============================================================
   Stab — publik fasad: analys, cache, presetval
   ============================================================ */
const Stab = (() => {
  const running = new Map();

  function settingsFor(media, clipStab) {
    const base = M.emptyStab();
    // Presetvärdena skrivs in i settings när läget väljs (applyMode) — de får
    // INTE återappliceras här, annars nollas användarens egna reglage.
    const s = { ...base, ...(media.stab && media.stab.settings) };
    if (clipStab) Object.assign(s, clipStab);
    return s;
  }
  function applyMode(media, mode) {
    const cur = (media.stab && media.stab.settings) || M.emptyStab();
    let next;
    if (mode === 'auto') {
      const rec = (media.stab && media.stab.report && media.stab.report.recommended) || 'smooth';
      next = { ...M.emptyStab(), ...M.stabModeById(rec).s, mode: 'auto', autoResolved: rec };
    } else {
      next = { ...M.emptyStab(), ...M.stabModeById(mode).s, mode };
    }
    next.autoCrop = cur.autoCrop !== undefined ? cur.autoCrop : true;
    return next;
  }

  async function analyze(media, onProgress) {
    if (running.has(media.id)) return running.get(media.id);
    const p = (async () => {
      media.stab = media.stab || {};
      media.stab.status = 'analyzing';
      S.bus.emit('media', media);
      try {
        const { traj, report } = await StabAnalyze.analyze(media, { onProgress, cancelled: () => App.cancelStab });
        media.stab.traj = traj;
        media.stab.report = report;
        media.stab.status = 'analyzed';
        if (!media.stab.settings || media.stab.settings.mode === 'auto')
          media.stab.settings = applyMode(media, 'auto');
        media.stab.corr = null;
        corrFor(media);
        S.touch(null, 'stab-analyzed');
        S.bus.emit('media', media);
        return report;
      } catch (e) {
        media.stab.status = e.message === 'cancelled' ? 'none' : 'error';
        media.stab.error = e.message;
        S.bus.emit('media', media);
        throw e;
      } finally { running.delete(media.id); }
    })();
    running.set(media.id, p);
    return p;
  }

  /** Hämtar (och cachar) korrigeringsspåret för ett medium. */
  function corrFor(media) {
    const s = media.stab;
    if (!s || !s.traj) return null;
    const set = settingsFor(media);
    const hash = JSON.stringify(set);
    if (s.corr && s.corr.hash === hash) return s.corr;
    s.corr = StabProcess.build(s.traj, set, s.report);
    s.corr.hash = hash;
    return s.corr;
  }
  const isAnalyzing = id => running.has(id);

  return { analyze, corrFor, settingsFor, applyMode, sample: StabProcess.sample, isAnalyzing };
})();


/* ===== 60-color.js ===== */
/* ============================================================
   60 — Färg: presets, bildanalys, Auto Enhance, Match Clips
   ============================================================ */
const Color = (() => {

  /** Effektiv grade = manuella värden + preset × intensitet. */
  function effective(clip) {
    const g = { ...M.emptyGrade(), ...(clip.grade || {}) };
    const f = M.filterById(clip.filter || 'none');
    const k = (clip.filterIntensity == null ? 100 : clip.filterIntensity) / 100;
    for (const key in f.g) g[key] = (g[key] || 0) + f.g[key] * k;
    for (const [key, , min, max] of M.GRADE_DEFS) g[key] = U.clamp(g[key] || 0, min, max);
    return g;
  }
  const isNeutral = g => M.GRADE_DEFS.every(d => Math.abs(g[d[0]] - d[5]) < 1e-4);

  /* ---------- bildstatistik från en riktig bildruta ---------- */
  const statCache = new Map();
  async function frameStats(media, t) {
    const key = media.id + '@' + U.round(t, 2);
    if (statCache.has(key)) return statCache.get(key);
    if (!media.url) throw new Error('Mediefilen är inte tillgänglig — importera om den.');
    const v = await Media.loadVideoEl(media.url);
    await Media.seekTo(v, U.clamp(t, 0, Math.max(0, (media.duration || 1) - .05)));
    const w = 192, h = Math.max(2, Math.round(w * (v.videoHeight / Math.max(1, v.videoWidth))));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(v, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    try { v.src = ''; v.load(); } catch (e) { }

    let sr = 0, sg = 0, sb = 0, sl = 0, n = w * h, clipped = 0, crushed = 0, midR = 0, midG = 0, midB = 0, midN = 0;
    const hist = new Uint32Array(64);
    const lum = new Float32Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const r = d[p] / 255, gg = d[p + 1] / 255, b = d[p + 2] / 255;
      const l = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
      lum[i] = l;
      sr += r; sg += gg; sb += b; sl += l;
      hist[Math.min(63, (l * 64) | 0)]++;
      if (l > 0.965) clipped++;
      if (l < 0.02) crushed++;
      if (l > 0.22 && l < 0.78) { midR += r; midG += gg; midB += b; midN++; }
    }
    let varSum = 0; const meanL = sl / n;
    for (let i = 0; i < n; i++) { const dd = lum[i] - meanL; varSum += dd * dd; }
    // detaljnivå + brus: hög- resp. mycket högfrekvent energi
    let hf = 0, hf2 = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = lum[i + 1] - lum[i - 1], gy = lum[i + w] - lum[i - w];
      const m = Math.hypot(gx, gy);
      hf += m;
      const lap = Math.abs(4 * lum[i] - lum[i - 1] - lum[i + 1] - lum[i - w] - lum[i + w]);
      if (m < 0.06) hf2 += lap;                 // laplace i platta ytor ≈ brus
    }
    const px = (w - 2) * (h - 2);

    // konvergerande vertikaler (keystone): lutning på nära-vertikala kanter, vänster vs höger
    let lSlope = 0, lN = 0, rSlope = 0, rN = 0;
    for (let y = 2; y < h - 2; y += 2) for (let x = 2; x < w - 2; x += 2) {
      const i = y * w + x;
      const gx = lum[i + 1] - lum[i - 1], gy = lum[i + w] - lum[i - w];
      if (Math.abs(gx) > 0.05 && Math.abs(gx) > Math.abs(gy) * 2.2) {   // nära vertikal linje
        const slope = gy / gx;                                          // lutning
        if (x < w / 2) { lSlope += slope; lN++; } else { rSlope += slope; rN++; }
      }
    }
    const keystone = (lN > 12 && rN > 12) ? (lSlope / lN - rSlope / rN) : 0;

    // fönster: ljusa sammanhängande ytor omgivna av mörkare
    let windowish = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (lum[i] > 0.88) {
        const around = (lum[i - 1] + lum[i + 1] + lum[i - w] + lum[i + w]) / 4;
        if (around < 0.8) windowish++;
      }
    }
    const st = {
      meanL, meanR: sr / n, meanG: sg / n, meanB: sb / n,
      midR: midN ? midR / midN : .5, midG: midN ? midG / midN : .5, midB: midN ? midB / midN : .5,
      contrast: Math.sqrt(varSum / n),
      clipped: clipped / n, crushed: crushed / n,
      detail: hf / px, noise: hf2 / px,
      keystone, windowRatio: windowish / n,
      hist: Array.from(hist),
    };
    statCache.set(key, st);
    return st;
  }

  /* ---------- Auto Enhance for Real Estate ---------- */
  async function autoEnhance(clip, media, prevClipStats) {
    const t = clip.in + Math.min(1.0, (clip.out - clip.in) * .35);
    const s = await frameStats(media, t);
    const sug = [];
    const push = (key, value, why) => {
      const def = M.GRADE_DEFS.find(d => d[0] === key);
      const v = U.clamp(value, def[2], def[3]);
      if (Math.abs(v) < (key === 'exposure' ? 0.02 : 1.5)) return;
      sug.push({ key, label: def[1], value: U.round(v, key === 'exposure' ? 2 : 0), why });
    };
    // exponering mot 0,50 i medelluminans — försiktigt, max ±0,45 EV
    const target = 0.50;
    const ev = U.clamp(Math.log2(target / Math.max(0.03, s.meanL)), -0.45, 0.45);
    push('exposure', ev, `Medelluminans ${(s.meanL * 100).toFixed(0)} % → mål ${(target * 100) | 0} %`);
    // vitbalans via mellantonerna (grå värld på väggar)
    const avg = (s.midR + s.midG + s.midB) / 3;
    const rb = (s.midR - s.midB) / Math.max(0.05, avg);
    const gm = (s.midG - (s.midR + s.midB) / 2) / Math.max(0.05, avg);
    push('temperature', U.clamp(-rb * 55, -22, 22), rb > 0 ? 'Bilden drar mot varmt/orange' : 'Bilden drar mot kallt/blått');
    push('tint', U.clamp(gm * 55, -18, 18), gm > 0 ? 'Grönt stick i mellantonerna' : 'Magenta stick i mellantonerna');
    // högdagrar och fönster
    if (s.clipped > 0.012) push('highlightRecovery', U.clamp(s.clipped * 900, 0, 55), `${(s.clipped * 100).toFixed(1)} % utbrända pixlar`);
    if (s.windowRatio > 0.008) push('windowProtect', U.clamp(s.windowRatio * 1600, 0, 60), 'Ljusa fönsterytor upptäckta');
    if (s.crushed > 0.02) push('shadowRecovery', U.clamp(s.crushed * 700, 0, 45), `${(s.crushed * 100).toFixed(1)} % helsvarta pixlar`);
    // kontrast
    if (s.contrast < 0.16) push('contrast', U.clamp((0.19 - s.contrast) * 240, 0, 18), 'Låg kontrast — bilden ser platt ut');
    // brus & skärpa
    if (s.noise > 0.012) push('denoise', U.clamp((s.noise - 0.008) * 2200, 0, 45), 'Brus i jämna ytor');
    if (s.detail < 0.055) push('sharpen', U.clamp((0.07 - s.detail) * 700, 0, 35), 'Mjuk bild — tål lite skärpa');
    // vertikaler
    if (Math.abs(s.keystone) > 0.05) push('verticalCorrection', U.clamp(-s.keystone * 40, -18, 18), 'Vertikaler konvergerar (kameran lutar)');
    const match = [];
    if (prevClipStats) {
      const dEv = U.clamp(Math.log2(Math.max(0.03, prevClipStats.meanL) / Math.max(0.03, s.meanL)), -0.4, 0.4);
      if (Math.abs(dEv) > 0.05) match.push({ key: 'exposure', label: 'Exposure (matcha föregående klipp)', value: U.round(dEv, 2), why: 'Föregående klipp är ljusare/mörkare' });
      const dT = U.clamp(-((s.midR - s.midB) - (prevClipStats.midR - prevClipStats.midB)) * 130, -20, 20);
      if (Math.abs(dT) > 2) match.push({ key: 'temperature', label: 'Temperature (matcha föregående klipp)', value: Math.round(dT), why: 'Vitbalansen skiljer sig från föregående klipp' });
    }
    return { stats: s, suggestions: sug, match };
  }

  /* ---------- Match Clips ---------- */
  async function collectStats(project, clips, onProgress) {
    const out = new Map();
    for (let i = 0; i < clips.length; i++) {
      const c = clips[i], m = M.mediaById(project, c.mediaId);
      if (!m || !m.url) continue;
      onProgress && onProgress(i / clips.length, m.name);
      try { out.set(c.id, await frameStats(m, c.in + (c.out - c.in) * .4)); } catch (e) { }
    }
    onProgress && onProgress(1, '');
    return out;
  }
  function deviation(stats, ref) {
    if (!stats || !ref) return 0;
    const dl = Math.abs(stats.meanL - ref.meanL) / Math.max(.05, ref.meanL);
    const dwb = Math.abs((stats.midR - stats.midB) - (ref.midR - ref.midB)) * 3;
    const dc = Math.abs(stats.contrast - ref.contrast) / Math.max(.05, ref.contrast);
    return U.clamp(dl * .9 + dwb * 1.5 + dc * .5, 0, 2);
  }
  function matchDelta(stats, ref, opts) {
    const d = {};
    if (opts.exposure) d.exposure = U.round(U.clamp(Math.log2(Math.max(.03, ref.meanL) / Math.max(.03, stats.meanL)), -.7, .7), 2);
    if (opts.wb) {
      d.temperature = Math.round(U.clamp(-((stats.midR - stats.midB) - (ref.midR - ref.midB)) * 140, -35, 35));
      d.tint = Math.round(U.clamp(((stats.midG - (stats.midR + stats.midB) / 2) - (ref.midG - (ref.midR + ref.midB) / 2)) * -140, -30, 30));
    }
    if (opts.contrast) d.contrast = Math.round(U.clamp((ref.contrast - stats.contrast) * 260, -40, 40));
    if (opts.tone) {
      d.saturation = Math.round(U.clamp(((ref.midR + ref.midG + ref.midB) - (stats.midR + stats.midG + stats.midB)) * 30, -25, 25));
    }
    return d;
  }
  const clearStatCache = () => statCache.clear();

  return { effective, isNeutral, frameStats, autoEnhance, collectStats, deviation, matchDelta, clearStatCache };
})();


/* ===== 70-render.js ===== */
/* ============================================================
   70 — Rendering: WebGL-kompositor + 2D-överlägg

   All geometri (crop, stabilisering, rörelsepresets, skala, position,
   perspektivkorrigering) läggs ihop till en homografi som inverteras och
   skickas till vertex-shadern. All färg körs i fragment-shadern.
   Utkanvasen är 2D och innehåller GL-bilden + text, watermark och guider,
   så att canvas.captureStream() fångar exakt det man ser.
   ============================================================ */

/* --- 3x3 matriser (radvis) --- */
const m3 = {
  id: () => [1, 0, 0, 0, 1, 0, 0, 0, 1],
  mul(A, B) {
    const C = new Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
      C[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];
    return C;
  },
  chain(...ms) { return ms.reduce((a, b) => m3.mul(a, b)); },
  translate: (x, y) => [1, 0, x, 0, 1, y, 0, 0, 1],
  scale: (x, y) => [x, 0, 0, 0, y, 0, 0, 0, 1],
  rotate: r => { const c = Math.cos(r), s = Math.sin(r); return [c, -s, 0, s, c, 0, 0, 0, 1]; },
  shear: k => [1, k, 0, 0, 1, 0, 0, 0, 1],
  persp: (kx, ky) => [1, 0, 0, 0, 1, 0, kx, ky, 1],
  invert(m) {
    const [a, b, c, d, e, f, g, h, i] = m;
    const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
    const det = a * A + b * B + c * C;
    if (Math.abs(det) < 1e-12) return m3.id();
    const id = 1 / det;
    return [
      A * id, (c * h - b * i) * id, (b * f - c * e) * id,
      B * id, (a * i - c * g) * id, (c * d - a * f) * id,
      C * id, (b * g - a * h) * id, (a * e - b * d) * id,
    ];
  },
  toGL(m) { return new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]); },
};

const Renderer = (() => {
  const VS = `
    attribute vec2 a_pos;
    uniform mat3 u_mat;
    varying vec3 v_uvh;
    varying vec2 v_pos;
    void main(){
      v_pos = a_pos;
      v_uvh = u_mat * vec3(a_pos, 1.0);
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }`;
  const FS = `
    precision highp float;
    varying vec3 v_uvh;
    varying vec2 v_pos;
    uniform sampler2D u_tex;
    uniform vec2 u_texel;
    uniform float u_alpha, u_isSolid, u_blur, u_feather;
    uniform vec3 u_solid;
    uniform float u_exposure,u_contrast,u_highlights,u_shadows,u_whites,u_blacks;
    uniform float u_temp,u_tintv,u_sat,u_vib,u_clarity,u_dehaze,u_sharpen,u_denoise;
    uniform float u_hlrec,u_shrec,u_winprot,u_vignette;

    float luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }
    vec3 tex(vec2 uv){ return texture2D(u_tex, uv).rgb; }

    void main(){
      if(u_isSolid > 0.5){ gl_FragColor = vec4(u_solid, u_alpha); return; }
      vec2 uv = v_uvh.xy / v_uvh.z;
      if(uv.x < -0.002 || uv.x > 1.002 || uv.y < -0.002 || uv.y > 1.002){ gl_FragColor = vec4(0.0); return; }
      uv = clamp(uv, 0.0005, 0.9995);

      vec3 c = tex(uv);
      vec3 n1 = tex(uv + vec2(u_texel.x,0.0));
      vec3 n2 = tex(uv - vec2(u_texel.x,0.0));
      vec3 n3 = tex(uv + vec2(0.0,u_texel.y));
      vec3 n4 = tex(uv - vec2(0.0,u_texel.y));
      vec3 avg4 = (n1+n2+n3+n4)*0.25;

      if(u_denoise > 0.001){
        vec3 soft = mix(c, (c + n1+n2+n3+n4)/5.0, 1.0);
        float edge = clamp(length(c - avg4)*7.0, 0.0, 1.0);   // spara kanter
        c = mix(mix(soft, c, edge), c, 1.0 - u_denoise);
      }
      if(u_blur > 0.001){
        float r = u_blur;
        vec3 b = vec3(0.0);
        b += tex(uv + vec2( u_texel.x*r, 0.0));
        b += tex(uv + vec2(-u_texel.x*r, 0.0));
        b += tex(uv + vec2(0.0,  u_texel.y*r));
        b += tex(uv + vec2(0.0, -u_texel.y*r));
        b += tex(uv + vec2( u_texel.x*r*0.7,  u_texel.y*r*0.7));
        b += tex(uv + vec2(-u_texel.x*r*0.7,  u_texel.y*r*0.7));
        b += tex(uv + vec2( u_texel.x*r*0.7, -u_texel.y*r*0.7));
        b += tex(uv + vec2(-u_texel.x*r*0.7, -u_texel.y*r*0.7));
        c = mix(c, b/8.0, clamp(u_blur*0.55, 0.0, 1.0));
      }
      if(u_sharpen > 0.001) c = clamp(c + (c - avg4) * u_sharpen * 2.2, 0.0, 4.0);
      if(abs(u_clarity) > 0.001){
        vec3 lp = (c + avg4 + tex(uv+u_texel*2.0) + tex(uv-u_texel*2.0))*0.25;
        c = clamp(c + (c - lp) * u_clarity * 1.6, 0.0, 4.0);
      }

      c *= exp2(u_exposure);

      // vitbalans
      c.r *= 1.0 + u_temp*0.30;
      c.b *= 1.0 - u_temp*0.30;
      c.g *= 1.0 + u_tintv*0.22;
      c.r *= 1.0 - u_tintv*0.07;
      c.b *= 1.0 - u_tintv*0.07;

      // dehaze: lyft bort dis genom att dra ner svartpunkten och öka mikro-kontrast
      if(abs(u_dehaze) > 0.001){
        float d = u_dehaze*0.10;
        c = clamp((c - d) / max(0.35, 1.0 - d), 0.0, 8.0);
      }

      float l = luma(c);
      // högdagrar / skuggor
      float hiMask = smoothstep(0.45, 1.0, l);
      float loMask = 1.0 - smoothstep(0.0, 0.55, l);
      c += u_highlights * hiMask * 0.45;
      c += u_shadows   * loMask * 0.45;
      // whites / blacks
      c += u_whites * smoothstep(0.6, 1.0, l) * 0.35;
      c += u_blacks * (1.0 - smoothstep(0.0, 0.35, l)) * 0.35;
      // återhämtning
      if(u_hlrec > 0.001){
        float k = u_hlrec;
        vec3 over = max(c - 0.72, 0.0);
        c = c - over * k * 0.75 / (1.0 + over);
      }
      if(u_shrec > 0.001){
        float k = u_shrec;
        c = c + (1.0 - smoothstep(0.0, 0.30, luma(c))) * k * 0.28;
      }
      // fönsterskydd: mjuk rolloff + avfärgning i mycket ljusa partier
      if(u_winprot > 0.001){
        float w = smoothstep(0.78, 1.0, luma(c));
        vec3 rolled = 1.0 - (1.0 - min(c, vec3(1.2)))*(1.0 - min(c, vec3(1.2)))*0.0;
        rolled = c / (1.0 + max(c - 0.80, 0.0) * u_winprot * 2.2);
        float g = luma(rolled);
        c = mix(c, mix(rolled, vec3(g), w * u_winprot * 0.35), u_winprot);
      }
      // kontrast kring en interiörvänlig pivot
      c = clamp((c - 0.45) * (1.0 + u_contrast) + 0.45, 0.0, 8.0);

      // mättnad & vibrance
      float g2 = luma(c);
      c = mix(vec3(g2), c, 1.0 + u_sat);
      if(abs(u_vib) > 0.001){
        float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));
        float sat = (mx - mn) / max(0.001, mx);
        c = mix(vec3(luma(c)), c, 1.0 + u_vib * (1.0 - sat) * 1.4);
      }
      // vinjett
      if(abs(u_vignette) > 0.001){
        float d = length(v_pos * vec2(1.0, 1.0));
        c *= 1.0 - u_vignette * smoothstep(0.35, 1.45, d) * 0.75;
      }
      float a = u_alpha;
      if(u_feather > 0.001){
        vec2 e = min(uv, 1.0 - uv);
        a *= smoothstep(0.0, u_feather, min(e.x, e.y));
      }
      gl_FragColor = vec4(clamp(c, 0.0, 1.0) * a, a);
    }`;

  let gl = null, glc = null, prog = null, loc = {}, quad = null;
  let out = null, octx = null, W = 1920, H = 1080;
  const texCache = new WeakMap();
  let failed = false;

  function init(outCanvas) {
    out = outCanvas; octx = out.getContext('2d');
    glc = document.createElement('canvas');
    const opts = { alpha: false, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' };
    gl = glc.getContext('webgl', opts) || glc.getContext('experimental-webgl', opts);
    if (!gl) { failed = true; return false; }
    const vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) { failed = true; return false; }
    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); failed = true; return false; }
    gl.useProgram(prog);
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const a = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    ['u_mat', 'u_tex', 'u_texel', 'u_alpha', 'u_isSolid', 'u_solid', 'u_blur', 'u_feather',
      'u_exposure', 'u_contrast', 'u_highlights', 'u_shadows', 'u_whites', 'u_blacks',
      'u_temp', 'u_tintv', 'u_sat', 'u_vib', 'u_clarity', 'u_dehaze', 'u_sharpen', 'u_denoise',
      'u_hlrec', 'u_shrec', 'u_winprot', 'u_vignette'].forEach(n => loc[n] = gl.getUniformLocation(prog, n));
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // förmultiplicerad alfa
    gl.uniform1i(loc.u_tex, 0);
    setSize(W, H);
    return true;
  }
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s), src); return null; }
    return s;
  }
  function setSize(w, h) {
    W = Math.max(2, Math.round(w)); H = Math.max(2, Math.round(h));
    if (glc.width !== W || glc.height !== H) { glc.width = W; glc.height = H; }
    if (out.width !== W || out.height !== H) { out.width = W; out.height = H; }
    if (gl) gl.viewport(0, 0, W, H);
  }
  function texFor(video) {
    let e = texCache.get(video);
    if (!e) {
      const t = gl.createTexture();
      e = { tex: t, filled: false };
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      texCache.set(video, e);
    }
    return e;
  }
  /** Laddar upp aktuell bildruta. Går den inte att läsa (t.ex. mitt i en
   *  sökning) behålls förra bildrutan i stället för att blinka svart. */
  function upload(video) {
    const e = texFor(video);
    gl.bindTexture(gl.TEXTURE_2D, e.tex);
    if (video.readyState < 2) return e.filled;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video); e.filled = true; }
    catch (err) { return e.filled; }
    return true;
  }

  /* ---------- geometri ---------- */
  /** Bygger matrisen som mappar clip-space → textur-uv (homografi). */
  function buildMatrix(o) {
    const aSrc = o.srcH / Math.max(1, o.srcW);         // halvhöjd i halvbredds-enheter
    const aOut = o.outH / Math.max(1, o.outW);
    const cr = o.crop || { l: 0, r: 0, t: 0, b: 0 };
    const cl = U.clamp(cr.l / 100, 0, .45), crr = U.clamp(cr.r / 100, 0, .45);
    const ct = U.clamp(cr.t / 100, 0, .45), cb = U.clamp(cr.b / 100, 0, .45);

    let F = m3.id();
    // 1. crop på källbilden
    F = m3.chain(m3.scale(1 / Math.max(.1, 1 - cl - crr), 1 / Math.max(.1, 1 - ct - cb)),
      m3.translate(-(cl - crr), -aSrc * (ct - cb)), F);
    // 2. perspektiv/vertikalkorrigering
    if (o.keystone) F = m3.mul(m3.persp(0, o.keystone / aSrc), F);
    // 3. stabilisering
    const s = o.stab;
    if (s) {
      // Skalan är ALLTID likformig. En separat aspektkorrigering skulle töja
      // bilden och ändra bildförhållandet, vilket aldrig är acceptabelt.
      const sc = Math.exp(s.scale || 0);
      const A = m3.chain(m3.rotate(s.rot || 0), m3.shear(s.shear || 0), m3.scale(sc, sc));
      F = m3.chain(m3.scale(s.zoom || 1, s.zoom || 1), m3.translate(s.tx || 0, s.ty || 0), A, F);
    }
    // 4. rörelsepreset
    const mo = o.motion;
    if (mo) F = m3.chain(m3.translate(mo.x || 0, mo.y || 0), m3.rotate(mo.rot || 0),
      m3.scale(mo.zoom || 1, mo.zoom || 1), mo.keystone ? m3.persp(0, mo.keystone / aSrc) : m3.id(), F);
    // 5. klippets egen transform

      if (tx.sub) { g.font = `400 ${subSize}px -apple-system,sans-serif`; g.letterSpacing = (subSize * .12) + 'px'; g.globalAlpha = alpha * .82; g.fillText(tx.sub, x, y); g.globalAlpha = alpha; }
      g.font = `${st.weight} ${size}px -apple-system,"Segoe UI",Roboto,sans-serif`;
      if (st.track) g.letterSpacing = (size * st.track) + 'px';
      g.fillText(tx.title || '', x, y - (tx.sub ? subSize * 1.5 : 0));
    }
    g.restore();
  }

  /* ---------- musik ---------- */
  function syncMusic(t, project, playing) {
    const list = project.tracks.music;
    const a = list.find(c => t >= c.start && t < c.start + (c.out - c.in));
    if (!a) { if (musicEl && !musicEl.paused) musicEl.pause(); if (musicGain) musicGain.gain.value = 0; return; }
    const media = M.mediaById(project, a.mediaId);
    if (!media || !media.url) return;
    if (!musicEl) {
      musicEl = document.createElement('audio');
      musicEl.preload = 'auto';
      try { musicSrc = ctx().createMediaElementSource(musicEl); musicGain = ctx().createGain(); musicSrc.connect(musicGain); musicGain.connect(master); }
      catch (e) { }
    }
    if (musicEl._mediaId !== media.id) { musicEl.src = media.url; musicEl._mediaId = media.id; musicEl.load(); }
    musicClipId = a.id;
    const local = t - a.start;
    const target = a.in + local;
    if (Math.abs(musicEl.currentTime - target) > 0.3) { try { musicEl.currentTime = target; } catch (e) { } }
    if (playing && musicEl.paused) { const p = musicEl.play(); if (p && p.catch) p.catch(() => { }); }
    if (!playing && !musicEl.paused) musicEl.pause();
    let v = a.muted ? 0 : a.volume / 100;
    const len = a.out - a.in;
    if (a.fade.in > 0) v *= U.clamp(local / a.fade.in, 0, 1);
    if (a.fade.out > 0) v *= U.clamp((len - local) / a.fade.out, 0, 1);
    // auto fade mot filmens slut
    const total = M.totalDuration(project);
    if (total - t < 1.6) v *= U.clamp((total - t) / 1.6, 0, 1);
    if (musicGain) { try { musicGain.gain.setTargetAtTime(v, audioCtx.currentTime, .06); } catch (e) { musicGain.gain.value = v; } }
    return a;
  }
  function duckFactor(t, project) {
    const a = project.tracks.music.find(c => t >= c.start && t < c.start + (c.out - c.in));
    return (a && a.duck) ? 0.35 : 1;
  }

  /* ---------- loop ---------- */
  function tick(now) {
    raf = requestAnimationFrame(tick);
    const project = S.project;
    const dt = Math.min(.25, (now - lastNow) / 1000 || 0);
    lastNow = now;
    let t = S.st.playhead;
    if (S.st.playing) {
      t += dt;
      const total = M.totalDuration(project);
      const sel = view.loopClip ? S.primaryClip() : null;
      if (sel && sel.kind === 'video') {
        const e0 = sel.start, e1 = sel.start + M.clipDuration(sel);
        if (t >= e1 || t < e0) t = e0;
      } else if (t >= total) {
        if (view.loopClip) t = 0; else { t = total; S.st.playing = false; S.bus.emit('playstate', false); }
      }
      S.st.playhead = t;
      S.bus.emit('time', t);
    }
    const duck = duckFactor(t, project);
    renderAt(t, project, { playing: S.st.playing, duck });
    syncMusic(t, project, S.st.playing);
    if (onFrame) onFrame(t);
  }
  function start() { if (!raf) { lastNow = performance.now(); raf = requestAnimationFrame(tick); } }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function play() {
    resume();
    const total = M.totalDuration(S.project);
    if (S.st.playhead >= total - .02) S.st.playhead = 0;
    S.st.playing = true; S.bus.emit('playstate', true);
  }
  function pause() {
    S.st.playing = false; S.bus.emit('playstate', false);
    for (const [, e] of pool) { try { e.video.pause(); } catch (x) { } }
    if (musicEl) { try { musicEl.pause(); } catch (x) { } }
  }
  const toggle = () => S.st.playing ? pause() : play();

  return {
    start, stop, play, pause, toggle, renderAt, view, releaseAll, release, acquire,
    setMasterVolume, setMuted, audioDest, ctx, resume, sourceTime, motionAt, syncMusic, duckFactor,
    set frameHook(f) { onFrame = f; },
    get pool() { return pool; },
    get musicEl() { return musicEl; },
  };
})();


/* ===== 80-timeline.js ===== */
/* ============================================================
   80 — Timeline: rendering, drag, trim, snapping, zoom
   ============================================================ */
const Timeline = (() => {
  let pps = 60;                 // pixlar per sekund
  let snap = true;
  let scroll, content, ruler, trackV, trackM, trackT, playhead, snapline;
  const PAD = 40;

  function init() {
    scroll = U.$('#tlscroll'); content = U.$('#tlcontent');
    U.clear(content);
    ruler = U.el('div', { id: 'ruler' });
    trackV = U.el('div', { class: 'tltrack video' });
    trackM = U.el('div', { class: 'tltrack music' });
    trackT = U.el('div', { class: 'tltrack text' });
    playhead = U.el('div', { id: 'playhead' });
    snapline = U.el('div', { class: 'snapline' });
    content.append(ruler, trackV, trackM, trackT, playhead, snapline);

    ruler.addEventListener('pointerdown', e => {
      const scrubTo = ev => {
        const x = ev.clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft;
        S.seek(Math.max(0, x / pps));
      };
      scrubTo(e);
      U.drag(e, { onMove: (dx, dy, ev) => scrubTo(ev), cursor: 'ew-resize' });
    });
    [trackV, trackM, trackT].forEach(tr => tr.addEventListener('pointerdown', e => {
      if (e.target === tr) { S.selectClips([]); }
    }));
    // släpp media direkt på timelinen
    content.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    content.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/media-id');
      if (!id) return;
      const m = M.mediaById(S.project, id);
      if (!m) return;
      const x = e.clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft;
      App.addMediaToTimeline(m, m.type === 'audio' ? Math.max(0, x / pps) : null);
    });
    S.bus.on('change', render);
    S.bus.on('project', () => { zoomFit(); render(); });
    S.bus.on('selection', render);
    S.bus.on('seek', updatePlayhead);
    S.bus.on('time', updatePlayhead);
    render();
  }

  const timeAt = clientX => (clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft) / pps;

  /* ---------- snapping ---------- */
  function snapTargets(exceptId) {
    const p = S.project, out = [0, M.totalDuration(p), S.st.playhead];
    for (const c of p.tracks.video) { if (c.id === exceptId) continue; out.push(c.start, c.start + M.clipDuration(c)); }
    for (const c of p.tracks.music) { if (c.id === exceptId) continue; out.push(c.start, c.start + (c.out - c.in)); }
    for (const c of p.tracks.text) { if (c.id === exceptId) continue; out.push(c.start, c.start + c.duration); }
    for (const c of p.tracks.music) {
      const m = M.mediaById(p, c.mediaId);
      if (m && m.beats && App.state.snapBeats) for (const b of m.beats) { const t = c.start + (b - c.in); if (t >= 0) out.push(t); }
    }
    return out;
  }
  function applySnap(t, exceptId) {
    if (!snap) return { t, hit: null };
    const tol = 8 / pps;
    let best = null, bd = tol;
    for (const s of snapTargets(exceptId)) { const d = Math.abs(s - t); if (d < bd) { bd = d; best = s; } }
    return best != null ? { t: best, hit: best } : { t, hit: null };
  }
  function showSnap(t) {
    if (t == null) { snapline.style.display = 'none'; return; }
    snapline.style.display = 'block';
    snapline.style.left = (t * pps) + 'px';
  }

  /* ---------- rendering ---------- */
  function render() {
    if (!content) return;
    const p = S.project;
    const total = M.totalDuration(p);
    const w = Math.max(scroll.clientWidth, total * pps + PAD);
    content.style.width = w + 'px';
    renderRuler(total, w);
    renderVideo(p);
    renderMusic(p);
    renderText(p);
    updatePlayhead();
    const zi = U.$('#tlzoomval'); if (zi) zi.textContent = pps.toFixed(0) + ' px/s';
    const info = U.$('#tlinfo');
    if (info) info.textContent = `${p.tracks.video.length} klipp · ${U.tc(total, false)} totalt`;
    const sel = U.$('#tlsel');
    if (sel) {
      const cs = S.selectedClips();
      sel.textContent = cs.length ? (cs.length === 1 ? nameOf(cs[0]) + ' · ' + U.dur(lenOf(cs[0])) : cs.length + ' klipp markerade') : 'Inget markerat';
    }
  }
  const nameOf = c => c.kind === 'text' ? (c.title || 'Text') : (M.mediaById(S.project, c.mediaId) || { name: '?' }).name;
  const lenOf = c => c.kind === 'video' ? M.clipDuration(c) : c.kind === 'text' ? c.duration : (c.out - c.in);

  function renderRuler(total, w) {
    U.clear(ruler);
    const steps = [.1, .25, .5, 1, 2, 5, 10, 15, 30, 60, 120, 300];
    const step = steps.find(s => s * pps >= 62) || 600;
    const sub = step / (step >= 5 ? 5 : 2);
    for (let t = 0; t <= (w / pps); t += sub) {
      const major = Math.abs(t / step - Math.round(t / step)) < 1e-6;
      const d = U.el('div', { class: 'tick' + (major ? '' : ' minor'), style: { left: (t * pps) + 'px' } });
      if (major) d.append(U.el('span', { text: U.tc(t, false) }));
      ruler.append(d);
      if (t > 100000) break;
    }
  }

  function badges(c) {
    const b = [];
    if (c.stabEnabled) b.push(U.el('span', { class: 'tag accent', text: 'STAB' }));
    if (c.filter && c.filter !== 'none') b.push(U.el('span', { class: 'tag', title: M.filterById(c.filter).name, text: M.filterById(c.filter).name.split(' ')[0].slice(0, 5).toUpperCase() }));
    else if (!Color.isNeutral(Color.effective(c))) b.push(U.el('span', { class: 'tag', text: 'GRADE' }));
    if (Math.abs((c.speed || 1) - 1) > .001) b.push(U.el('span', { class: 'tag', text: (c.speed).toFixed(2).replace(/0$/, '') + '×' }));
    if (c.reverse) b.push(U.el('span', { class: 'tag', text: 'REV' }));
    if (c.motion && c.motion.preset !== 'none') b.push(U.el('span', { class: 'tag', text: 'MOVE' }));
    if (c._deviation > .55) b.push(U.el('span', { class: 'tag warn', text: 'AVVIKER' }));
    return b;
  }

  function renderVideo(p) {
    U.clear(trackV);
    const selIds = new Set(S.sel.clips);
    p.tracks.video.forEach((c, i) => {
      const m = M.mediaById(p, c.mediaId);
      const dur = M.clipDuration(c);
      const left = c.start * pps, wid = Math.max(6, dur * pps);
      const node = U.el('div', {
        class: 'clip' + (selIds.has(c.id) ? ' sel' : '') + (c._deviation > .55 ? ' offbeat' : ''),
        style: { left: left + 'px', width: wid + 'px' },
        'data-id': c.id,
      });
      if (m && m.strip) {
        const srcDur = m.duration || 1;
        const full = wid * (srcDur / Math.max(.05, (c.out - c.in)));
        node.append(U.el('div', {
          class: 'cthumb',
          style: { backgroundImage: `url(${m.strip})`, backgroundSize: `${full}px 100%`, backgroundPosition: `${-full * (c.in / srcDur)}px 0`, backgroundRepeat: 'no-repeat' },
        }));
      }
      node.append(U.el('div', { class: 'cbody' },
        U.el('div', { class: 'cname', text: (m ? m.name : 'Saknad fil') }),
        U.el('div', { class: 'cbadges' }, badges(c)),
        U.el('div', { class: 'cdur', text: U.dur(dur) })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'video', i));
      node.addEventListener('dblclick', () => { S.seek(c.start); S.selectClips([c.id]); });
      trackV.append(node);
      // övergångsmarkör vid starten
      if (i > 0) {
        const tr = c.transitionIn || { type: 'cut', dur: 0 };
        const t = M.transById(tr.type);
        const chip = U.el('div', {
          class: 'trans' + (tr.type === 'cut' ? ' cut' : ''), style: { left: left + 'px' },
          'data-tip': t.name + (tr.dur ? ` · ${tr.dur.toFixed(1)}s` : ''), title: t.name,
          onpointerdown: e => { e.stopPropagation(); S.selectClips([c.id]); Panels.open('trans'); },
        }, tr.type === 'cut' ? '│' : t.name.split(' ')[0] + (tr.dur ? ' ' + tr.dur.toFixed(1) + 's' : ''));
        trackV.append(chip);
      }
    });
    if (!p.tracks.video.length) {
      trackV.append(U.el('div', { class: 'hint', style: { padding: '22px 14px' } }, 'Dra videoklipp hit från mediabiblioteket'));
    }
  }

  function renderMusic(p) {
    U.clear(trackM);
    const selIds = new Set(S.sel.clips);
    for (const c of p.tracks.music) {
      const m = M.mediaById(p, c.mediaId);
      const len = c.out - c.in;
      const wid = Math.max(6, len * pps);
      const node = U.el('div', { class: 'clip music' + (selIds.has(c.id) ? ' sel' : ''), style: { left: (c.start * pps) + 'px', width: wid + 'px' }, 'data-id': c.id });
      const cv = U.el('canvas'); node.append(cv);
      requestAnimationFrame(() => drawWave(cv, m, c, Math.min(wid, 4000)));
      node.append(U.el('div', { class: 'cbody' },
        U.el('div', { class: 'cname', text: (m ? m.name : 'Saknat ljud') + (c.muted ? ' (mute)' : '') }),
        U.el('div', { class: 'cdur', text: U.dur(len) + (m && m.bpm ? ` · ${m.bpm} BPM` : '') })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'music'));
      trackM.append(node);
      if (m && m.beats && App.state.showBeats) {
        for (const b of m.beats) {
          const t = c.start + (b - c.in);
          if (t < c.start || t > c.start + len) continue;
          trackM.append(U.el('div', { class: 'beatmark', style: { left: (t * pps) + 'px' } }));
        }
      }
    }
    if (!p.tracks.music.length) trackM.append(U.el('div', { class: 'hint', style: { padding: '13px 14px' } }, 'Musikspår — ladda upp en låt i Ljud-panelen'));
  }
  function drawWave(cv, m, c, w) {
    if (!m || !m.wave) return;
    const h = cv.clientHeight || 40;
    cv.width = Math.max(2, Math.round(w)); cv.height = h;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, h);
    g.fillStyle = 'rgba(140,160,132,.55)';
    const N = m.wave.length, dur = m.duration || 1;
    for (let x = 0; x < cv.width; x++) {
      const t = c.in + (x / cv.width) * (c.out - c.in);
      const i = U.clamp(Math.floor(t / dur * N), 0, N - 1);
      const v = (m.wave[i] / 255) * (h * .46);
      g.fillRect(x, h / 2 - v, 1, v * 2);
    }
  }

  function renderText(p) {
    U.clear(trackT);
    const selIds = new Set(S.sel.clips);
    for (const c of p.tracks.text) {
      const node = U.el('div', {
        class: 'clip text' + (selIds.has(c.id) ? ' sel' : ''),
        style: { left: (c.start * pps) + 'px', width: Math.max(8, c.duration * pps) + 'px' }, 'data-id': c.id,
      });
      node.append(U.el('div', { class: 'cbody' }, U.el('div', { class: 'cname', text: c.title || 'Text' })));
      node.append(U.el('div', { class: 'grip l', 'data-grip': 'l' }), U.el('div', { class: 'grip r', 'data-grip': 'r' }));
      node.addEventListener('pointerdown', e => onClipDown(e, c, 'text'));
      trackT.append(node);
    }
    if (!p.tracks.text.length) trackT.append(U.el('div', { class: 'hint', style: { padding: '7px 14px' } }, 'Textspår'));
  }

  function updatePlayhead() {
    if (!playhead) return;
    playhead.style.left = (S.st.playhead * pps) + 'px';
    if (S.st.playing) {
      const x = S.st.playhead * pps, l = scroll.scrollLeft, w = scroll.clientWidth;
      if (x < l || x > l + w - 40) scroll.scrollLeft = Math.max(0, x - w * .35);
    }
  }

  /* ---------- interaktion ---------- */
  function onClipDown(e, clip, kind, index) {
    e.stopPropagation();
    const grip = e.target.getAttribute && e.target.getAttribute('data-grip');
    if (e.shiftKey || e.metaKey || e.ctrlKey) S.toggleClip(clip.id);
    else if (!S.sel.clips.includes(clip.id)) S.selectClips([clip.id]);
    if (grip) return startTrim(e, clip, kind, grip);
    startMove(e, clip, kind, index);
  }

  function startTrim(e, clip, kind, side) {
    const t0 = timeAt(e.clientX);
    const orig = { in: clip.in, out: clip.out, start: clip.start, duration: clip.duration };
    const media = M.mediaById(S.project, clip.mediaId);
    const maxDur = media ? media.duration : (clip.out || 10);
    U.drag(e, {
      cursor: 'ew-resize',
      onMove: (dx, dy, ev) => {
        let t = timeAt(ev.clientX);
        const sn = applySnap(t, clip.id); t = sn.t; showSnap(sn.hit);
        const d = t - t0;
        S.update(p => {
          const c = M.findClip(p, clip.id); if (!c) return;
          if (kind === 'text') {
            if (side === 'l') { const ns = U.clamp(orig.start + d, 0, orig.start + orig.duration - .2); c.duration = orig.duration - (ns - orig.start); c.start = ns; }
            else c.duration = Math.max(.2, orig.duration + d);
            return;
          }
          const speed = kind === 'video' ? Math.max(.05, c.speed || 1) : 1;
          if (side === 'l') {
            const ni = U.clamp(orig.in + d * speed, 0, orig.out - .08);
            c.in = ni;
            if (kind === 'music') c.start = U.clamp(orig.start + (ni - orig.in), 0, 1e6);
          } else {
            c.out = U.clamp(orig.out + d * speed, c.in + .08, maxDur);
          }
        }, 'trim', true);
      },
      onEnd: () => { showSnap(null); S.bus.emit('change', 'trim-end'); },
    });
  }

  function startMove(e, clip, kind, index) {
    const t0 = timeAt(e.clientX);
    const orig = clip.start;
    let moved = false;
    const node = e.currentTarget;
    U.drag(e, {
      cursor: 'grabbing',
      onMove: (dx, dy, ev, didMove) => {
        if (!didMove) return;
        moved = true;
        node.classList.add('dragging');
        if (kind === 'video') {
          // ordningsändring: hitta målindex utifrån muspekarens position
          const t = timeAt(ev.clientX);
          const list = S.project.tracks.video;
          let target = list.length - 1;
          for (let i = 0; i < list.length; i++) {
            const c = list[i], d = M.clipDuration(c);
            if (t < c.start + d / 2) { target = i; break; }
          }
          const from = list.findIndex(c => c.id === clip.id);
          if (target !== from && target >= 0) {
            S.update(p => {
              const arr = p.tracks.video;
              const f = arr.findIndex(c => c.id === clip.id);
              const [it] = arr.splice(f, 1);
              arr.splice(U.clamp(target, 0, arr.length), 0, it);
              M.relayout(arr);
            }, 'reorder', true);
          }
          showSnap(null);
        } else {
          let t = orig + (timeAt(ev.clientX) - t0);
          const sn = applySnap(t, clip.id); t = Math.max(0, sn.t); showSnap(sn.hit);
          S.update(p => { const c = M.findClip(p, clip.id); if (c) c.start = t; }, 'move', true);
        }
      },
      onEnd: () => {
        node.classList.remove('dragging');
        showSnap(null);
        if (moved) S.bus.emit('change', 'move-end');
      },
    });
  }

  /* ---------- zoom ---------- */
  function setZoom(v, anchorTime) {
    const old = pps;
    pps = U.clamp(v, 2, 800);
    if (anchorTime != null && scroll) {
      const x = anchorTime * old - scroll.scrollLeft;
      scroll.scrollLeft = Math.max(0, anchorTime * pps - x);
    }
    render();
  }
  const zoomIn = () => setZoom(pps * 1.35, S.st.playhead);
  const zoomOut = () => setZoom(pps / 1.35, S.st.playhead);
  function zoomFit() {
    const total = M.totalDuration(S.project) || 10;
    const w = (scroll ? scroll.clientWidth : 900) - PAD;
    setZoom(U.clamp(w / total, 2, 400));
  }
  const setSnap = v => { snap = v; };

  return { init, render, updatePlayhead, zoomIn, zoomOut, zoomFit, setZoom, setSnap, get pps() { return pps; }, get snap() { return snap; }, drawWave };
})();


/* ===== 85-panels.js ===== */
/* ============================================================
   85 — Vänsterpaneler + inspektor
   ============================================================ */
const Panels = (() => {
  const TABS = [
    ['media', 'Media'], ['stab', 'Stabilisering'], ['image', 'Bild'], ['motion', 'Rörelse'],
    ['trans', 'Övergångar'], ['audio', 'Ljud'], ['text', 'Text'], ['export', 'Export'],
  ];
  let active = 'media';
  const ui = { mediaView: 'grid', search: '', sort: 'added', filter: 'all', folder: 'Alla', stabBusy: null, matchRef: null, matchStats: null };

  function init() {
    const rail = U.$('#tabrail');
    U.clear(rail);
    TABS.forEach(([id, label]) => {
      const b = U.el('button', { class: 'tab' + (id === active ? ' on' : ''), 'data-tab': id, onclick: () => open(id) }, label);
      rail.append(b);
    });
    S.bus.on('change', () => { render(); Inspector.render(); });
    S.bus.on('selection', () => { render(); Inspector.render(); });
    S.bus.on('media', () => { if (active === 'media' || active === 'stab') render(); });
    render(); Inspector.render();
  }
  function open(tab) {
    active = tab;
    U.$$('#tabrail .tab').forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === tab));

  }
  function render() {
    const host = U.$('#panelbody');
    if (!host) return;
    const scrollTop = host.querySelector('.scroll') ? host.querySelector('.scroll').scrollTop : 0;
    U.clear(host);
    const fn = { media: mediaPanel, stab: stabPanel, image: imagePanel, motion: motionPanel, trans: transPanel, audio: audioPanel, text: textPanel, export: exportPanel }[active] || mediaPanel;

    const sc = host.querySelector('.scroll'); if (sc) sc.scrollTop = scrollTop;

  const panel = (title, right, ...body) => {
    const head = U.el('div', { class: 'panelhead' }, U.el('span', { class: 'title', text: title }), U.el('span', { class: 'spacer' }), right || null);
    const scroll = U.el('div', { class: 'scroll' }, ...body);

  /* ==========================================================

  function mediaPanel() {

    );
    const tools2 = U.el('div', { class: 'row wrap' },
      U.select([['all', 'Alla filer'], ['video', 'Endast video'], ['audio', 'Endast ljud'], ['used', 'I projektet'], ['unused', 'Ej använda'], ['stab', 'Stabiliserade']], ui.filter, v => { ui.filter = v; render(); }, 'Filter'),
      U.select(p.folders, ui.folder, v => { ui.folder = v; render(); }, 'Samling'),
      U.el('button', { class: 'btn sm', 'data-tip': 'Ny samling', onclick: newFolder }, '+'),
      U.el('span', { class: 'spacer' }),

        U.el('button', { class: ui.mediaView === 'grid' ? 'on' : '', onclick: () => { ui.mediaView = 'grid'; render(); } }, 'Rutnät'),
        U.el('button', { class: ui.mediaView === 'list' ? 'on' : '', onclick: () => { ui.mediaView = 'list'; render(); } }, 'Lista')),
    );

    let list = p.media.filter(m => {
      if (ui.search && !m.name.toLowerCase().includes(ui.search.toLowerCase())) return false;
      if (ui.folder !== 'Alla' && m.folder !== ui.folder) return false;
      const used = Media.usedCount(p, m.id);
      if (ui.filter === 'video' && m.type !== 'video') return false;
      if (ui.filter === 'audio' && m.type !== 'audio') return false;
      if (ui.filter === 'used' && !used) return false;
      if (ui.filter === 'unused' && used) return false;
      if (ui.filter === 'stab' && !(m.stab && m.stab.status === 'analyzed')) return false;
      return true;
    });
    list.sort((a, b) => ui.sort === 'name' ? a.name.localeCompare(b.name)
      : ui.sort === 'duration' ? b.duration - a.duration

    const grid = U.el('div', { class: 'mediagrid' + (ui.mediaView === 'list' ? ' list' : '') });

    return panel('Mediabibliotek',

  function mediaItem(m, p) {
    const used = Media.usedCount(p, m.id);
    const selected = S.sel.media.includes(m.id);
    const st = m.stab || {};
    const node = U.el('div', {
      class: 'mitem' + (ui.mediaView === 'list' ? ' list-mode' : '') + (selected ? ' sel' : '') + (m.type === 'audio' ? ' audio' : ''),
      draggable: 'true',
      onclick: e => { S.selectMedia([m.id], e.shiftKey); },
      ondblclick: () => App.addMediaToTimeline(m),
      ondragstart: e => { e.dataTransfer.setData('text/media-id', m.id); e.dataTransfer.effectAllowed = 'copy'; },
    });
    if (m.type === 'audio') node.append(U.el('div', { class: 'thumb' }, '♪'));
    else if (m.thumb) node.append(U.el('img', { class: 'thumb', src: m.thumb, alt: m.name }));
    else node.append(U.el('div', { class: 'thumb' }));
    const sub = U.el('div', { class: 'sub' });
    if (m.type === 'video') {
      sub.append(U.el('span', { text: `${m.width}×${m.height}` }));
      sub.append(U.el('span', { text: m.fps ? `${m.fps} fps` : 'fps ?' }));
    } else sub.append(U.el('span', { text: m.bpm ? `${m.bpm} BPM` : 'ljud' }));
    sub.append(U.el('span', { text: U.bytes(m.size) }));
    node.append(U.el('div', { class: 'meta' }, U.el('div', { class: 'nm', text: m.name, title: m.name }), sub));
    node.append(U.el('span', { class: 'dur', text: U.dur(m.duration) }));
    const bd = U.el('div', { class: 'badges' });
    if (m.missing) bd.append(U.el('span', { class: 'tag danger', text: 'SAKNAS' }));

    if (st.status === 'analyzing') bd.append(U.el('span', { class: 'tag warn', text: 'ANALYS…' }));

    if (st.report) {

      rep.append(meter('Rotationsdrift', r.rotation.score, `${r.rotation.rangeDeg}° spann`));
      rep.append(meter('Perspektivförändring', r.perspective.score, `${r.perspective.scalePct} % skala`));
      rep.append(meter('Wobble-risk', r.wobble.score, `${r.wobble.label}`));

      rep.append(U.el('div', { class: 'rrow' }, U.el('span', { class: 'k', text: 'Plötsliga ryck' }), U.el('span', { class: 'v mono', text: r.jerks + ' st' })));
      rep.append(U.el('div', { class: 'rrow' }, U.el('span', { class: 'k', text: 'Spårningskvalitet' }), U.el('span', { class: 'v mono', text: Math.round(r.trackingQuality * 100) + ' % inliers · ' + r.samples + ' sampel' })));

      U.el('button', { class: 'btn sm' + (Playback.view.loopClip ? ' on' : ''), onclick: () => App.setLoop(!Playback.view.loopClip) }, 'Loop'),
      U.el('button', { class: 'btn sm' + (Playback.view.zoomView ? ' on' : ''), onclick: () => App.setZoomView(!Playback.view.zoomView) }, 'Detaljvy 200 %'),

      U.el('button', { class: 'btn sm', onclick: () => App.analyzeAllUsedMedia() }, 'Analysera alla klipp i projektet')));

    body.push(U.section('Vad som faktiskt görs'));
    body.push(U.el('div', { class: 'row hint', style: { display: 'block' } },
      'Spårning: Harris-hörn viktade mot raka linjer (dörrkarmar, fönster, väggmöten), grov-till-fin blockmatchning i tre nivåer, robust affinanpassning med IRLS. ' +
      'Korrigering: banan jämnas ut per kanal (x, y, rotation, skala, shear, aspekt) och skillnaden appliceras som en homografi i GPU-renderingen — samma transform i preview och export. ' +

    return panel('Stabilisering', null, ...body);

    body.push(U.section('Match Clips'));
    body.push(U.el('div', { class: 'row' }, U.el('button', { class: 'btn', style: { flex: '1' }, onclick: () => App.openMatchClips() }, 'Matcha klippen mot ett referensklipp')));

    body.push(U.section('Manuella kontroller'));
    for (const [key, label, min, max, step, def] of M.GRADE_DEFS) {
      body.push(U.slider(label, clip.grade[key], min, max, step, v => S.update(p => { M.findClip(p, clip.id).grade[key] = v; }, 'g-' + key, true),
        { def, fmt: v => step < 1 ? v.toFixed(2) : v.toFixed(0) }));
    }
    return panel('Bild', null, ...body);
  }
  function drawSwatch(cv, thumbSrc, f) {
    const img = new Image();
    img.onload = () => {
      const g = cv.getContext('2d');
      const gr = { ...M.emptyGrade(), ...f.g };
      // approximativ förhandsvisning med canvas-filter (den riktiga körs i GPU-shadern)
      const br = Math.pow(2, gr.exposure) * (1 + gr.shadows / 500 - gr.highlights / 900);
      const ct = 1 + gr.contrast / 160, sa = 1 + gr.saturation / 130 + gr.vibrance / 260;
      const hue = gr.temperature * -0.06 + gr.tint * 0.05;
      g.filter = `brightness(${br.toFixed(3)}) contrast(${ct.toFixed(3)}) saturate(${sa.toFixed(3)}) hue-rotate(${hue.toFixed(1)}deg) sepia(${Math.max(0, gr.temperature) / 400})`;
      g.drawImage(img, 0, 0, cv.width, cv.height);
      g.filter = 'none';
    };
    img.src = thumbSrc;
  }
  const emptySel = msg => U.el('div', { class: 'empty' }, U.el('div', { text: 'Inget klipp markerat' }), U.el('div', { class: 'hint' }, msg));

    for (const p0 of M.MOTION_PRESETS) {
      body.push(U.el('div', {
        class: 'preset-card' + (mo.preset === p0.id ? ' on' : ''),
        onclick: () => S.update(p => { const c = M.findClip(p, clip.id); c.motion = { ...M.emptyMotion(), preset: p0.id }; }, 'motion'),
      }, U.el('div', { style: { flex: '1' } }, U.el('div', { class: 'pn', text: p0.name }), U.el('div', { class: 'pd', text: p0.desc }))));
    }
    body.push(U.section('Justering'));
    const set = (k, v) => S.update(p => { M.findClip(p, clip.id).motion[k] = v; }, 'mo-' + k, true);

  /* ==========================================================

  function exportPanel() {
    const p = S.project, x = p.export;
    const body = [];
    body.push(U.section('Exportpresets'));
    for (const pr of Exporter.PRESETS) {
      body.push(U.el('div', {
        class: 'preset-card' + (x.preset === pr.id ? ' on' : ''),

      }, U.el('div', { style: { flex: '1' } }, U.el('div', { class: 'pn', text: pr.name }), U.el('div', { class: 'pd', text: pr.desc }))));

    body.push(U.lrow('Filnamn', fn));
    body.push(U.check('Ljud', x.audio, v => S.update(pp => { pp.export.audio = v; }, 'exa')));
    body.push(U.check('Watermark', x.watermark, v => S.update(pp => { pp.export.watermark = v; }, 'exw')));
    if (x.watermark) body.push(U.lrow('Text', U.el('input', { type: 'text', value: x.watermarkText, style: { flex: '1' }, oninput: e => S.update(pp => { pp.export.watermarkText = e.target.value; }, 'exwt', true) })));

    const est = Exporter.estimate(p);
    body.push(U.section('Beräknat'));
    body.push(U.el('div', { class: 'report' },

      U.el('div', { class: 'rrow' }, U.el('span', { class: 'k', text: 'Filstorlek' }), U.el('span', { class: 'v mono', text: '≈ ' + U.bytes(est.bytes) })),
      U.el('div', { class: 'rrow' }, U.el('span', { class: 'k', text: 'Exporttid' }), U.el('span', { class: 'v mono', text: '≈ ' + U.tc(est.time, false) })),
      U.el('div', { class: 'rrow' }, U.el('span', { class: 'k', text: 'Codec' }), U.el('span', { class: 'v mono', text: est.codecLabel }))));

    const st = Exporter.status;
    if (st.running) {
      body.push(U.el('div', { class: 'progress' }, U.el('i', { style: { width: (st.progress * 100) + '%' } })));

    }
    body.push(U.el('div', { class: 'row hint', style: { display: 'block' } }, Exporter.capabilityNote()));
    return panel('Export', null, ...body);
  }

  return { init, open, render, get active() { return active; }, ui };
})();

/* ============================================================
   Inspektor — klippverktyg
   ============================================================ */
const Inspector = (() => {
  function render() {
    const host = U.$('#inspector'); if (!host) return;
    const top = host.scrollTop;
    U.clear(host);
    const clip = S.primaryClip();
    if (!clip) {
      host.append(U.el('div', { class: 'panelhead' }, U.el('span', { class: 'title', text: 'Klippverktyg' })),
        U.el('div', { class: 'empty' }, U.el('div', { text: 'Inget klipp markerat' }),
          U.el('div', { class: 'hint' }, 'Klicka på ett klipp i timelinen för att redigera in-/utpunkt, hastighet, bild och stabilisering.')));
      return;
    }
    if (clip.kind !== 'video') { renderOther(host, clip); return; }
    const p = S.project;
    const media = M.mediaById(p, clip.mediaId);
    const dur = M.clipDuration(clip);
    const set = (fn, label, coalesce) => S.update(pp => fn(M.findClip(pp, clip.id), pp), label, coalesce);
    const body = [];

    body.push(U.el('div', { class: 'panelhead' },
      U.el('span', { class: 'title', text: media ? media.name : 'Klipp' }),
      U.el('span', { class: 'spacer' }),
      U.el('span', { class: 'tag mono', text: U.dur(dur) })));

    const sc = U.el('div', { class: 'scroll' });
    body.push(sc);
    const add = (...n) => sc.append(...n.filter(Boolean));

    add(U.section('Tid'));
    add(U.lrow('In point', U.num(U.round(clip.in, 2), v => set(c => { c.in = U.clamp(v, 0, c.out - .05); }, 'in'), { min: 0, step: .05 }), U.el('span', { class: 'hint', text: 's' })));
    add(U.lrow('Out point', U.num(U.round(clip.out, 2), v => set(c => { c.out = U.clamp(v, c.in + .05, media ? media.duration : v); }, 'out'), { min: 0, step: .05 }), U.el('span', { class: 'hint', text: 's' })));
    add(U.lrow('Duration', U.num(U.round(dur, 2), v => set(c => { c.out = U.clamp(c.in + v * c.speed, c.in + .05, media ? media.duration : c.out); }, 'dur'), { min: .05, step: .1 }), U.el('span', { class: 'hint', text: 's' })));

    add(U.section('Hastighet'));
    const speeds = [.5, .75, 1, 1.25, 1.5, 2];
    add(U.el('div', { class: 'row wrap' }, ...speeds.map(s =>
      U.el('button', { class: 'btn sm' + (Math.abs(clip.speed - s) < .001 ? ' on' : ''), onclick: () => set(c => { c.speed = s; }, 'speed') }, s + '×'))));
    add(U.slider('Speed', clip.speed, .25, 4, .05, v => set(c => { c.speed = v; }, 'speed', true), { def: 1, fmt: v => v.toFixed(2) + '×' }));
    const fitInp = U.num(U.round(dur, 1), () => { }, { min: .2, step: .1, w: 60 });

        const want = parseFloat(fitInp.value);

        const sp = U.clamp((clip.out - clip.in) / want, .1, 8);
        set(c => { c.speed = sp; }, 'fit');
        U.toast('Hastighet satt till ' + sp.toFixed(2) + '×', 'Klipplängd ' + want.toFixed(1) + ' s');
      }
    }, 'Räkna ut')));
    add(U.el('div', { class: 'row wrap' },
      U.el('button', { class: 'btn sm' + (clip.reverse ? ' on' : ''), onclick: () => set(c => { c.reverse = !c.reverse; }, 'rev'), 'data-tip': 'Baklängesuppspelning (stegvis i preview)' }, 'Reverse'),
      U.el('button', { class: 'btn sm' + (clip.freeze ? ' on' : ''), onclick: () => set(c => { c.freeze = !c.freeze; }, 'freeze'), 'data-tip': 'Frys bildrutan vid in-punkten' }, 'Freeze frame')));

    add(U.slider('Position Y', clip.transform.y, -100, 100, .5, v => set(c => { c.transform.y = v; }, 'py', true), { def: 0 }));

    add(U.slider('Crop topp', clip.transform.crop.t, 0, 45, .5, v => set(c => { c.transform.crop.t = v; }, 'ct', true), { def: 0, fmt: v => v + ' %' }));

    const st = media && media.stab;
    add(U.el('div', { class: 'row wrap' },
