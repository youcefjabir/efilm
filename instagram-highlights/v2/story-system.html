:root{
  --g:#E9E8E5; --panel:#F5F4F1; --raise:#FFFFFF; --line:#D9D7D2; --line2:#C6C3BC;
  --ink:#1A1B1D; --ink2:#43464A; --mut:#63676A; --acc:#5C6154; --accS:#E4E7DE;
  --keep:#3F6B4A; --keepS:#E3EDE5; --rew:#8A5A1A; --rewS:#F7ECDC; --rem:#9A3535; --remS:#F6E3E3;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px -16px rgba(0,0,0,.2);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --g:#161719; --panel:#1C1E20; --raise:#232629; --line:#2E3134; --line2:#3C4045;
  --ink:#E8E7E4; --ink2:#BBBAB6; --mut:#8A8E92; --acc:#98A088; --accS:#23261F;
  --keep:#8FBF9C; --keepS:#1B2620; --rew:#D6A45F; --rewS:#2A2318; --rem:#DE8B8B; --remS:#2C1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --g:#161719; --panel:#1C1E20; --raise:#232629; --line:#2E3134; --line2:#3C4045;
  --ink:#E8E7E4; --ink2:#BBBAB6; --mut:#8A8E92; --acc:#98A088; --accS:#23261F;
  --keep:#8FBF9C; --keepS:#1B2620; --rew:#D6A45F; --rewS:#2A2318; --rem:#DE8B8B; --remS:#2C1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--mut);font-weight:600}

.wrap{max-width:1280px;margin:0 auto;padding:0 30px}
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--g) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:11px 30px;display:flex;align-items:center;gap:22px}
.bm{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.bm svg{width:19px;height:auto}
.bm b{font-size:12px;letter-spacing:.2em;font-weight:650}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;padding:7px 12px;
  border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
nav button:hover{background:var(--raise);color:var(--ink)}
nav button[aria-current="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
nav button i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--acc)}
.tbtn{background:none;border:1px solid var(--line2);color:var(--mut);font:inherit;font-size:11px;
  padding:5px 10px;border-radius:6px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--acc)}

section{display:none;padding:38px 0 100px}
section[data-on]{display:block}
.head{max-width:74ch;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.head h2{font-size:30px}
.head .l{color:var(--mut);font-size:14.5px;margin-top:11px;line-height:1.68}
h3.h{font-size:16px;margin:40px 0 15px;display:flex;gap:12px;align-items:center}
h3.h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.v{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.09em;padding:2px 7px;border-radius:4px;white-space:nowrap}
.v.k{color:var(--keep);background:var(--keepS)}
.v.w{color:var(--rew);background:var(--rewS)}
.v.r{color:var(--rem);background:var(--remS)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line2);color:var(--mut)}
.pill.a{color:var(--acc);border-color:var(--acc);background:var(--accS)}

/* stat bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:186px 1fr 96px;gap:12px;align-items:center;font-size:12.5px}
.bar .t{color:var(--ink2)}
.bar .track{display:block;height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:5px;background:var(--acc)}
.bar .fill.bad{background:var(--rem)}
.bar .n{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--mut)}

/* mix meter */
.mix{display:flex;height:34px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.mix div{display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.04em}
.mix .gd{background:var(--acc);color:#fff}
.mix .ph{background:var(--line);color:var(--ink2)}

/* story frames */
.protos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
.proto{display:flex;flex-direction:column;gap:11px}
.story{width:100%;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:#EFECE7;
  box-shadow:var(--shadow);position:relative}
.story svg{display:block;width:100%;height:100%}
.pcap b{font-size:13px;font-weight:650;display:block}
.pcap span{font-size:11.5px;color:var(--mut);display:block;margin-top:2px;line-height:1.5}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.ctl label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:7px}
.ctl label:hover{color:var(--ink)}

/* geometry */
.geo{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:26px;align-items:start}
.geobox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.geobox svg{width:100%;height:auto;display:block}
code.blk{display:block;background:var(--raise);border:1px solid var(--line);border-radius:7px;
  padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.7;overflow-x:auto;
  white-space:pre;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-family:var(--mono);font-size:12px}
@media(max-width:820px){.geo{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 84px}}
</style>

  <span class="bm" id="bm"></span>
  <nav id="nav"></nav>
  <button class="tbtn" id="theme" type="button">Tema</button>

/* ---------- A · VIEWLY — one object becomes the whole presentation */
function protoA(){
  var o={x:SA.liveL,y:610,w:150,h:104};          /* objektsprimitivet */
  var spineX=o.x+o.w/2, spineTop=o.y+o.h, spineBot=1472;
  var items=["FOTO","PLANRITNING","3D","E-STYLING","MOTION","ANNONS","KAMPANJ"];
  var y0=800, step=112, rise=56, run=rise/TAN;   /* the branch itself is a true 58° */
  var e0=430, e1=850;                             /* endpoints ride a second 58° line */
  var g='';
  /* the brand angle emerges from the data rather than being stamped on */
  g+='<line x1="'+e0+'" y1="'+y0+'" x2="'+e1+'" y2="'+(y0+step*6)+'" stroke="'+INK+'" '
    +'stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="2 8"/>';
  g+='<line x1="'+spineX+'" y1="'+spineTop+'" x2="'+spineX+'" y2="'+spineBot+'" stroke="'+INK+'" stroke-width="1.5"/>';
  items.forEach(function(t,i){
    var y=y0+i*step, ex=e0+i*((e1-e0)/6);
    g+='<path d="M '+spineX+' '+(y-rise)+' L '+(spineX+run)+' '+y+' L '+ex+' '+y+'" '
      +'fill="none" stroke="'+INK+'" stroke-width="1.5"/>';
    g+='<circle cx="'+ex+'" cy="'+y+'" r="4.5" fill="'+INK+'"/>';
    g+=T(spineX+run+6, y-20, t, F.k, 29, INK, 'letter-spacing="4.5"');
  });
  return ''
   +'<rect width="1080" height="1920" fill="'+PAPER+'"/>'
   +kicker("01 — VIEWLY")
   +wm(SA.liveR, 276, 30)
   +T(SA.liveL,420,"Ett objekt.",F.s,98,INK)
   +T(SA.liveL,522,"Hela presentationen.",F.s,98,INK)
   /* the object: a plan footprint — the single place colour is spent */
   +'<rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" fill="'+OLIVE+'"/>'
   +'<line x1="'+(o.x+o.w*0.6)+'" y1="'+o.y+'" x2="'+(o.x+o.w*0.6)+'" y2="'+(o.y+o.h)+'" stroke="'+PAPER+'" stroke-width="2.5"/>'

   +g;
}

/* ---------- B · FÖR MÄKLARE — the operations transformation ------- */

function protoC(){
  var nodeX=768, nodeY=784, x0=470, stop=nodeX-80/TAN;   /* 80 px rise at 58° */

    ["OBJEKTSDATA", 704],
    ["BILDER",      784],
    ["OMRÅDE",      864]

  var g='';
  rows.forEach(function(r,i){
    var y=r[1];
    g+=T(SA.liveL+92, y+9, r[0], F.k, 27, INK, 'letter-spacing="4.5"');

      g+='<line x1="'+x0+'" y1="'+y+'" x2="'+nodeX+'" y2="'+y+'" stroke="'+INK+'" stroke-width="1.5"/>';

      g+='<path d="M '+x0+' '+y+' L '+stop+' '+y+' L '+nodeX+' '+nodeY+'" fill="none" stroke="'+INK+'" stroke-width="1.5"/>';

  g+='<g stroke="'+OLIVE+'" stroke-width="2.5" fill="none">'

    +'</g>';

    +'<line x1="'+nodeX+'" y1="'+(nodeY+11)+'" x2="'+nodeX+'" y2="938" stroke="'+INK+'" stroke-width="1.5"/>'
    +'<path d="M '+(nodeX-13)+' 922 L '+nodeX+' 946 L '+(nodeX+13)+' 922" fill="none" stroke="'+INK+'" stroke-width="1.5" stroke-linejoin="round"/>';

  var px=SA.liveL, py=976, pw=SA.liveR-SA.liveL, ph=490, notch=96;
  var panel='<path d="M '+px+' '+py+' L '+(px+pw-notch)+' '+py+' L '+(px+pw)+' '+(py+notch*TAN)

  var body=["Söderläget gör sig påmint redan i hallen. Ljuset når in",
            "över den breda ekparketten och fortsätter genom de",
            "öppna sällskapsytorna, där takhöjden ger rummet en",
            "stillhet som är ovanlig för adressen. Köket vetter mot",
            "gården och rymmer ett längre bord. Sovrummen ligger",
            "avskilt från det gemensamma."];
  var b='';
  body.forEach(function(l,i){
    b+=T(px+48, 1200+i*46, l, F.s, 33, INK2, i>4?'opacity=".35"':(i>3?'opacity=".62"':''));
  });
  return ''
   +'<rect width="1080" height="1920" fill="'+PAPER+'"/>'
   +kicker("03 — VERKTYG")
   +wm(SA.liveR, 276, 30)
   +T(SA.liveL,420,"Objektsdata in.",F.s,98,INK)
   +T(SA.liveL,522,"Färdig annons ut.",F.s,98,INK)

   +'<div class="geo"><div class="geobox">'+demo+'</div><div>'

   +'<dt>Källa</dt><dd>viewly-logo-mark.png · 1080 × 941</dd>'
   +'<dt>Överensstämmelse</dt><dd style="color:var(--acc)">IoU '+GEO.iou+'</dd>'
   +'<dt>Framkant</dt><dd>'+GEO.angle.toFixed(1)+'°  ← varumärkesvinkeln</dd>'
   +'<dt>Bakkant</dt><dd>'+GEO.angleRight.toFixed(2)+'°  (stapeln avsmalnar 0,57°)</dd>'
   +'<dt>Underkant</dt><dd>'+GEO.angleCut.toFixed(2)+'°  speglad</dd>'
   +'<dt>Cirkel</dt><dd>r '+GEO.dot.r+' · c ('+GEO.dot.cx+', '+GEO.dot.cy+')</dd>'
   +'<dt>Märkets svart</dt><dd>'+GEO.ink+'  (ej #1C1C1E)</dd>'
   +'<dt>Oliv</dt><dd>'+GEO.olive+'  bekräftad mot CSS</dd>'
   +'<dt>tan 58,0°</dt><dd>'+TAN.toFixed(4)+'  → Δy = 1,6003 · Δx</dd></dl>'
   +'<code class="blk">viewBox="'+GEO.viewBox+'"\n\n'
   +'&lt;path d="'+GEO.limb+'"/&gt;\n\n'
   +'&lt;circle cx="'+GEO.dot.cx+'" cy="'+GEO.dot.cy+'" r="'+GEO.dot.r+'"/&gt;</code>'
   +'<p style="font-size:12.5px;color:var(--mut);margin-top:14px;line-height:1.65">'
   +'Vinkeln 58,0° är nu konstanten i hela systemet. Varje förgrening, konvergens, mask och blockkant '
   +'använder den. Det är så igenkänningen byggs utan att logotypen upprepas.</p>'
   +'</div></div>';
}

var SECS=[
 {id:"audit", n:"Audit",     num:"01", f:secAudit},
 {id:"strat", n:"Strategi",  num:"02", f:secStrat},
 {id:"proto", n:"Prototyper",num:"03", f:secProto},
 {id:"geo",   n:"Geometri",  num:"04", f:secGeo}
];

function render(){
  var s=SECS.filter(function(x){return x.id===state.sec})[0];
  $("#main").innerHTML='<section data-on>'+s.f()+'</section>';
  document.querySelectorAll("#nav button").forEach(function(b){
    b.setAttribute("aria-current",String(b.dataset.s===state.sec));
  });
  window.scrollTo(0,0);
}
$("#nav").innerHTML=SECS.map(function(s){
  return '<button type="button" data-s="'+s.id+'" aria-current="'+(s.id===state.sec)+'">'
   +'<i>'+s.num+'</i>'+esc(s.n)+'</button>';
}).join("");
$("#bm").innerHTML=mark("currentColor",GEO.olive,'')+'<b>VIEWLY</b>';

document.addEventListener("click",function(e){
  var b=e.target.closest("#nav button");
  if(b){ state.sec=b.dataset.s; render() }
});
document.addEventListener("change",function(e){
  if(e.target.id==="tsz"){ state.sz=e.target.checked; render() }
  if(e.target.id==="tig"){ state.ig=e.target.checked; render() }
});
$("#theme").onclick=function(){
  var r=document.documentElement, c=r.getAttribute("data-theme");
  var d=window.matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme", c ? (c==="dark"?"light":"dark") : (d?"light":"dark"));
};
render();
})();

</script>
