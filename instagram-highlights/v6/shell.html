<title>Viewly Highlights</title>
<style>
/*__FONTS__*/

/* ============ TOKENS ============ */
:root{
  --g:#E9E8E5; --panel:#F5F4F1; --raise:#FFFFFF; --line:#D9D7D2; --line2:#C6C3BC;
  --ink:#1A1B1D; --ink2:#43464A; --mut:#63676A; --acc:#5C6154; --accS:#E4E7DE;
  --lock:#9A3535; --lockS:#F6E3E3; --edit:#3F6B4A; --editS:#E3EDE5; --semi:#8A5A1A; --semiS:#F7ECDC;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.18);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --g:#16171A; --panel:#1C1E21; --raise:#232629; --line:#2E3135; --line2:#3B3F44;
  --ink:#E8E7E4; --ink2:#BBBAB6; --mut:#8A8E92; --acc:#969C8A; --accS:#23261F;
  --lock:#DE8B8B; --lockS:#2C1D1D; --edit:#8FBF9C; --editS:#1B2620; --semi:#D6A45F; --semiS:#2A2318;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --g:#16171A; --panel:#1C1E21; --raise:#232629; --line:#2E3135; --line2:#3B3F44;
  --ink:#E8E7E4; --ink2:#BBBAB6; --mut:#8A8E92; --acc:#969C8A; --accS:#23261F;
  --lock:#DE8B8B; --lockS:#2C1D1D; --edit:#8FBF9C; --editS:#1B2620; --semi:#D6A45F; --semiS:#2A2318;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--g);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.018em;text-wrap:balance;line-height:1.2}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}

/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);border-right:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column}
.railhead{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:9px}
.brandrow svg{width:22px;height:auto;flex:0 0 22px}
.brandname{font-size:12.5px;font-weight:650;letter-spacing:.2em}
.railsub{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.45}
.nav{padding:10px;display:flex;flex-direction:column;gap:1px;flex:1}
.navb{display:flex;gap:11px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;color:var(--mut);font:inherit;font-size:13px;
  padding:8px 10px;border-radius:5px;cursor:pointer;transition:background .15s,color .15s}
.navb:hover{background:var(--raise);color:var(--ink)}
.navb[aria-current="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.navb .n{font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.05em}
.railfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}
.tbtn{background:none;border:1px solid var(--line2);color:var(--mut);font:inherit;font-size:11px;
  padding:5px 9px;border-radius:5px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--acc)}

.canvas{flex:1;min-width:0}
.sec{padding:40px 44px 110px;max-width:1520px}
.sechead{margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.sechead h2{font-size:29px;margin-top:7px}
.sechead .lede{color:var(--mut);font-size:14.5px;margin-top:11px;max-width:74ch;line-height:1.66}
.h3{font-size:16px;margin:44px 0 15px;display:flex;align-items:center;gap:11px}
.h3::after{content:"";flex:1;height:1px;background:var(--line)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);
  font-weight:600;padding:0 12px 9px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12px;margin:0}
.kv dt{color:var(--mut);white-space:nowrap}
.kv dd{margin:0;color:var(--ink2);line-height:1.5}

.ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.tg{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink2);cursor:pointer}
.tg input{accent-color:var(--acc);width:14px;height:14px}
.tg.dark{color:#D6D5D2}

/* ============ 9:16 FRAME SYSTEM ============ */
/* text-align resets on purpose: frames sit inside <button>, whose UA default centres everything. */
.frame{aspect-ratio:9/16;container-type:inline-size;position:relative;overflow:hidden;
  border-radius:3px;isolation:isolate;text-align:left;background:#EFECE7}
.frame *{box-sizing:border-box}
.cvr{width:100%;height:100%;container-type:inline-size;position:relative;overflow:hidden;isolation:isolate;text-align:left}
.specbtn{text-align:left;font:inherit;color:inherit}

/* ============ 01 RIKTNING ============ */
.dps{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:20px}
.dp{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.dphead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:11px;background:var(--raise)}
.dphead b{font-size:15px;font-weight:650;letter-spacing:.06em}
.dphead span{font-size:11.5px;color:var(--mut)}
.dpbody{display:grid;grid-template-columns:168px 1fr;gap:20px;padding:20px}
.dpshot .frame{box-shadow:var(--shadow)}
.dptext{min-width:0;display:flex;flex-direction:column;gap:14px}
.dptext p{font-size:13px;line-height:1.68;color:var(--ink2)}
.pals{display:flex;flex-wrap:wrap;gap:7px}
.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;
  padding:3px 8px 3px 4px;background:var(--raise);font-size:10.5px}
.sw i{width:15px;height:15px;border-radius:3px;border:1px solid rgba(0,0,0,.12);display:block}
.sw b{font-weight:600}
.sw code{font-family:var(--mono);color:var(--mut);font-size:9.5px}
.cmphead{display:grid;grid-template-columns:150px repeat(2,1fr);gap:16px;margin-bottom:9px}
.cmphead span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.cmprow{display:grid;grid-template-columns:150px repeat(2,1fr);gap:16px;align-items:start;
  padding:16px 0;border-top:1px solid var(--line)}
.cmplab b{display:block;font-size:13px;font-weight:650}
.cmplab span{display:block;font-family:var(--mono);font-size:10px;color:var(--acc);margin-top:3px;letter-spacing:.05em}
.cmplab em{display:block;font-size:11.5px;color:var(--mut);margin-top:8px;font-style:normal;line-height:1.5}
.cmpcell{max-width:250px}
.cmpcell .specbtn{padding:0;border:1px solid var(--line);background:none;border-radius:4px;cursor:pointer;
  overflow:hidden;display:block;width:100%;transition:box-shadow .18s,transform .18s}
.cmpcell .specbtn:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cmpcell .dlrow{margin-top:7px}
.cmpcell .dlb{font-size:10px;padding:4px 8px}

/* ============ 02 KOMPOSITIONER ============ */
.dirbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dirb{background:var(--panel);border:1px solid var(--line);color:var(--mut);font:inherit;font-size:12.5px;
  padding:8px 15px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:152px}
.dirb b{font-weight:650;font-size:13px;letter-spacing:.06em}
.dirb span{font-size:10.5px}
.dirb[aria-pressed="true"]{border-color:var(--acc);background:var(--raise);color:var(--ink);box-shadow:var(--shadow)}
.dirb[aria-pressed="true"] b{color:var(--acc)}
.specimens{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:22px}
.spec{display:flex;flex-direction:column;gap:9px}
.spec .specbtn{padding:0;border:1px solid var(--line);background:none;border-radius:4px;cursor:pointer;
  overflow:hidden;display:block;transition:box-shadow .18s,transform .18s,border-color .18s}
.spec .specbtn:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line2)}
.speccap{display:flex;gap:7px;align-items:baseline;justify-content:space-between}
.speccap .t{font-size:12px;font-weight:650}
.speccap .p{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.specd{font-size:11.5px;color:var(--mut);line-height:1.55}
.bars{display:grid;gap:7px;max-width:640px}
.bar{display:grid;grid-template-columns:132px 1fr 74px;gap:12px;align-items:center;font-size:12px}
.bn{color:var(--ink2)}
.bt{height:7px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:block}
.bt i{display:block;height:100%;background:var(--acc)}
.bv{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right}
.bv em{font-style:normal;color:var(--line2)}

/* ============ 03 PROFIL ============ */
.phones{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:26px;align-items:start}
.phone{background:var(--raise);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);max-width:396px}
.igbody{background:#fff;color:#000;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
.igtop{padding:14px 15px 0;font-size:15px;font-weight:600}
.igmain{display:flex;gap:22px;align-items:center;padding:12px 15px 0}
.igav{width:78px;height:78px;border-radius:50%;flex:0 0 78px;overflow:hidden;background:#F2EFEF;
  display:grid;place-items:center;border:1px solid #ECECEC}
.igav svg{width:50%;height:auto}
.igstats{display:flex;gap:26px;flex:1}
.igstat{text-align:center;font-size:12.5px;color:#262626}
.igstat b{display:block;font-size:15.5px;font-weight:700}
.igbio{padding:11px 15px 0;font-size:12.5px;line-height:1.42;color:#262626}
.igbio .nm{font-weight:600}
.igbio .cat{color:#8e8e93}
.igbio .lk{color:#00376b;font-weight:500}
.igbtns{display:flex;gap:6px;padding:13px 15px 0}
.igbtn{flex:1;background:#EFEFEF;border-radius:8px;padding:6px;text-align:center;font-size:13px;font-weight:600;color:#262626}
.igbtn.pri{background:#0095F6;color:#fff}
.ighl{display:flex;gap:15px;padding:17px 15px 15px;overflow-x:auto;scrollbar-width:thin}
.ighl::-webkit-scrollbar{height:3px}
.ighli{flex:0 0 auto;width:64px;text-align:center;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.ighli .ring{width:64px;height:64px;border-radius:50%;padding:2px;background:#fff;border:1px solid #DBDBDB;
  overflow:hidden;transition:transform .18s;display:block}
.ighli:hover .ring{transform:scale(1.06)}
.ighli .ring>span{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;display:block}
.ighli .lb{font-size:11px;color:#262626;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;display:block}
.igtabs{display:flex;border-top:1px solid #DBDBDB;margin-top:4px}
.igtabs span{flex:1;text-align:center;padding:9px;font-size:11px;letter-spacing:.08em;color:#8e8e93}
.igtabs span:first-child{color:#262626;box-shadow:inset 0 1px 0 #262626}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-top:2px}
.iggrid div{aspect-ratio:1}
.phonecap{padding:11px 15px;border-top:1px solid var(--line);background:var(--panel);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.phonecap b{font-size:12px;font-weight:650;letter-spacing:.06em}
.phonecap span{font-size:10.5px;color:var(--mut)}
.minis{display:grid;gap:16px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 18px}
.minirow{display:flex;gap:13px;flex-wrap:wrap}
.m56{width:56px;height:56px;border-radius:50%;overflow:hidden;border:1px solid var(--line2);display:block;flex:0 0 56px}
.minicap{font-size:11.5px;color:var(--mut);margin-top:11px}
.minicap b{color:var(--ink);letter-spacing:.06em}

/* ============ EXPORT ============ */
.dlb{background:var(--panel);border:1px solid var(--line2);color:var(--ink2);font:inherit;font-size:11px;
  letter-spacing:.02em;padding:6px 11px;border-radius:6px;cursor:pointer;transition:border-color .15s,color .15s}
.dlb:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.dlb:disabled{opacity:.55;cursor:progress}
.pdl{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:11px}
.pside .dlb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#E8E7E4;text-align:left}
.pside .dlb:hover:not(:disabled){border-color:#98A088;color:#fff}

/* ============ 04 FORMAT ============ */
.art{width:100%;position:relative;overflow:hidden;border-radius:3px;container-type:inline-size;
  isolation:isolate;text-align:left;background:#EFECE7;box-shadow:var(--shadow)}
.art *{box-sizing:border-box}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:end;margin-bottom:8px}
.fcol{display:flex;flex-direction:column;gap:12px}
.fcol .dlb{align-self:flex-start}
.fmeta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.fmeta b{font-size:13.5px;font-weight:650}
.fmeta .mono{font-size:11px;color:var(--acc)}
.fmeta em{flex:0 0 100%;font-style:normal;font-size:11.5px;color:var(--mut);line-height:1.5}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px}
.tpl{display:flex;flex-direction:column;gap:9px}
.tplcap{display:flex;justify-content:space-between;align-items:baseline}
.tplcap b{font-size:13px;font-weight:650}
.tplcap .mono{font-size:10px;color:var(--acc);letter-spacing:.08em}
.dlrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dlbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 22px;padding:12px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px}
.dlbar .eyebrow{margin-right:2px}
/* 08 EXPORT */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;margin-bottom:26px}
.xcard{border:1px solid var(--line);border-radius:10px;padding:15px 16px 14px;background:var(--panel);
  display:flex;flex-direction:column;gap:9px}
.xcard h4{font-size:13.5px;font-weight:650;letter-spacing:-.01em;margin:0}
.xcard p{font-size:12px;line-height:1.62;color:var(--mut);margin:0;flex:1}
.xcard .xn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.xcard .dlrow{margin-top:0}
.xnote{font-size:12px;line-height:1.68;color:var(--mut);max-width:78ch;margin:0 0 20px}
.tplrow{display:flex;gap:5px}
.tplrow .dlb{flex:1;text-align:center;padding:5px 4px;font-family:var(--mono);font-size:10px}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.bd{display:flex;flex-direction:column;gap:9px}
.bdcap{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bdcap .mono{font-size:10.5px;color:var(--mut);letter-spacing:.08em}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:460px;
  border:1px solid var(--line);padding:3px;background:var(--line);border-radius:4px}
.gcell{position:relative;aspect-ratio:1;overflow:hidden;container-type:inline-size;text-align:left;background:#EFECE7}
.gcell *{box-sizing:border-box}
@media(max-width:900px){.fmts{grid-template-columns:1fr}}

/* ============ 04 BIBLIOTEK ============ */
.hlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.hlwrap{display:flex;flex-direction:column}
.hlwrap .hlcard{flex:1}
.hlwrap .dlrow{margin-top:8px}
.hlcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;
  transition:box-shadow .18s,transform .18s,border-color .18s}
.hlcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line2)}
.hlcard .top{display:flex;gap:13px;padding:14px;align-items:center;border-bottom:1px solid var(--line)}
.hlcard .cvw{width:56px;height:56px;flex:0 0 56px;border-radius:50%;overflow:hidden;border:1px solid var(--line2)}
.hlcard .tt{min-width:0}
.hlcard .tt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:.01em}
.hlcard .tt span{font-size:11px;color:var(--mut);display:block;margin-top:2px;line-height:1.4}
.hlcard .strip{display:flex;gap:3px;padding:11px 14px;background:var(--raise)}
/* sekvensminiatyrerna måste behålla Story-formatet, annars blir kompositionen en fläck */
.hlcard .strip i{flex:1;min-width:0;aspect-ratio:9/16;border-radius:2px;overflow:hidden;position:relative;
  container-type:inline-size;display:block;text-align:left;background:var(--panel);font-style:normal}
.hlcard .foot{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mut)}

/* ============ 05 STUDIO ============ */
.hlcard .body{display:flex;gap:13px;padding:13px 14px;background:var(--raise);align-items:flex-start}
.hlcard .lead{flex:0 0 62px}
.hlcard .lead .frame{width:62px;display:block}
.hlcard .seq{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.pchip{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.02em;color:var(--mut);
  background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 5px;white-space:nowrap}
.pchip.ed{color:var(--edit);border-color:var(--edit);background:var(--editS)}
.hlcard .chip{margin-left:auto;flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.07em;
  padding:3px 7px;border-radius:4px;color:var(--edit);background:var(--editS);white-space:nowrap}
.hlcard .open{color:var(--acc);font-weight:600}
.flash{font-size:11.5px;color:var(--edit);opacity:0;transition:opacity .2s;white-space:nowrap}
.flash[data-on]{opacity:1}
.flash[data-on="warn"]{color:#9A5A1F}
:root[data-theme="dark"] .flash[data-on="warn"],
:root:not([data-theme="light"]) .flash[data-on="warn"]{color:#D6A45F}

.edtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:18px;
  margin-bottom:22px;border-bottom:1px solid var(--line)}
.edtitle b{display:block;font-size:16px;font-weight:650;letter-spacing:.02em}
.edtitle span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.edacts{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.edacts .dirbar{margin-bottom:0}
.edacts .dirb{min-width:0;padding:6px 12px}
.edacts .dirb span{display:none}
.dlb.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.dlb.pri:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}

.edgrid{display:grid;grid-template-columns:108px minmax(0,1fr) minmax(300px,360px);gap:26px;align-items:start}
.film{display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow-y:auto;padding-right:4px;
  position:sticky;top:18px}
.filmb{background:none;border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;font:inherit;color:inherit;text-align:left;transition:border-color .15s}
.filmb:hover{border-color:var(--line2)}
.filmb.on{border-color:var(--acc);background:var(--raise);box-shadow:var(--shadow)}
.filmn{font-family:var(--mono);font-size:9.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.filmb.on .filmn{color:var(--acc);font-weight:700}
.filmn .dot{width:5px;height:5px;border-radius:50%;background:var(--edit);display:block}
.filmf{display:block;width:100%;aspect-ratio:9/16;container-type:inline-size;position:relative;
  overflow:hidden;border-radius:3px;text-align:left;background:#EFECE7}
.filmf *{box-sizing:border-box}
.filmp{font-size:9px;color:var(--mut);letter-spacing:.04em}

.edstage{position:sticky;top:18px}
.edstage .frame{box-shadow:var(--shadow);max-width:420px;margin:0 auto}
.edunder{max-width:420px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--mut)}
.edstep{display:flex;gap:6px}
.edside{display:flex;flex-direction:column;gap:20px}
.edsec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px;
  display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--mut)}
.fld input,.fld textarea{font:inherit;font-size:12.5px;color:var(--ink);background:var(--raise);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{border-color:var(--acc);outline:none}
.mpan{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.mpan + .mpan{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mplab{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:baseline}
.mplab code{font-size:10px;color:var(--acc)}
.upl{display:block;text-align:center;border:1px dashed var(--line2);border-radius:7px;padding:9px;
  font-size:11.5px;color:var(--mut);cursor:pointer;margin-top:7px;transition:border-color .15s,color .15s}
.upl:hover{border-color:var(--acc);color:var(--ink)}
.edneed{background:var(--semiS);border-left:2px solid var(--semi);border-radius:0 7px 7px 0;
  padding:11px 13px;font-size:11.5px;color:var(--semi);line-height:1.5}
.edneed b{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.opGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.opRow{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:9px}
.opName{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--acc);font-weight:700}
.fld code{font-family:var(--mono);font-size:10px;color:var(--acc)}
.objwrap{max-width:560px;margin-bottom:30px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.objwrap .edsec{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.dlcol{display:flex;flex-direction:column;gap:6px}
.covprev{display:flex;gap:12px;align-items:center;margin:2px 0 6px}
.cvbig,.cvsm{border-radius:50%;overflow:hidden;border:1px solid var(--line2);display:block;flex:0 0 auto}
.cvbig{width:64px;height:64px}.cvsm{width:56px;height:56px}
.grow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:9px 0 6px}
/* Väljaren visar runda plåtar, inte ikoner i rutor — det är plåten man
   väljer mellan, och den är rund överallt annars. */
.gi{aspect-ratio:1;padding:2px;border:2px solid transparent;border-radius:50%;background:none;
  cursor:pointer;display:grid;place-items:center}
.gi:hover{border-color:var(--line2)}
.gi.on{border-color:var(--acc)}
.giw{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative}
.gi svg{width:100%;height:100%;display:block}
.dlstat{font-size:11px;line-height:1.5;color:var(--acc);margin-top:8px;min-height:1em;word-break:break-word}
.dlcol .dlb{text-align:left}
@media(max-width:1240px){
  .edgrid{grid-template-columns:92px minmax(0,1fr)}
  .edside{grid-column:1/-1}
  .edstage,.film{position:static}
  .film{flex-direction:row;max-height:none;overflow-x:auto}
  .filmb{flex:0 0 84px}
}

/* ============ 05 LAGER ============ */
.lgrid{display:grid;grid-template-columns:1fr minmax(300px,384px);gap:26px;align-items:start}
.lay{display:grid;grid-template-columns:98px 168px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;align-items:baseline}
.lay b{font-size:9.5px;letter-spacing:.09em;font-weight:700;padding:2.5px 7px;border-radius:4px;justify-self:start}
.lay.lock b{color:var(--lock);background:var(--lockS)}
.lay.edit b{color:var(--edit);background:var(--editS)}
.lay.semi b{color:var(--semi);background:var(--semiS)}
.lay .ln{font-weight:600}
.lay .ld{color:var(--mut);line-height:1.5}
.mcol{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;position:sticky;top:20px}
.mstage{max-width:216px;margin:0 auto 16px}
.mstage .frame{box-shadow:var(--shadow)}
.mrow{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 14px}
.mi{width:38px;height:38px;padding:0;border:2px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;background:none}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi.on{border-color:var(--acc)}
.mi{position:relative}
.vbadge{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:7px;line-height:1;
  background:rgba(0,0,0,.66);color:#fff;border-radius:2px;padding:2px 3px}
/* Egna bilder bär ett kryss. Krysset ligger utanpå knappen så att ett klick
   på det aldrig råkar välja bilden i stället för att ta bort den. */
.mislot{position:relative;display:inline-flex;line-height:0}
/* Alltid synligt, inte bara vid hover: borttagning var efterfrågad, och
   en funktion man måste hitta med musen är inte hittad. */
.midel{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;
  font-weight:600;line-height:1;padding:0 0 1px;cursor:pointer;display:grid;place-items:center;
  opacity:.75;transition:opacity .12s,background .12s,color .12s}
.mislot:hover .midel,.midel:focus-visible{opacity:1}
.midel:hover{background:#B4453B;border-color:#B4453B;color:#fff}
/* ============ 07 MOTION ============ */
.mstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.mstat>div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.mstat b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;line-height:1}
.mstat span{display:block;font-size:11.5px;color:var(--mut);margin-top:5px}
.mcand{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:20px 22px;margin-bottom:18px}
.mcandh{display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.mcandh>div{flex:1;min-width:0}
.mcandh b{font-size:16px}
.mnum{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.08em;padding-top:4px}
.mcandh code{font-size:10.5px;color:var(--mut);white-space:nowrap;padding-top:4px}
.mdir{padding:16px 0;border-top:1px solid var(--line)}
.mdir:first-of-type{border-top:0;padding-top:0}
.mdirh{margin-bottom:12px}
.mdirh b{display:block;font-size:13px;letter-spacing:.02em}
.mdirh span{display:block;font-size:11.5px;color:var(--mut);line-height:1.55;margin-top:3px;max-width:78ch}
.mkfs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mkf{width:150px}
.mkf .frame{box-shadow:var(--shadow)}
.mkfl{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin-top:6px}
.mboard{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;max-width:92ch}
.mboard li{display:flex;gap:12px;font-size:12.5px;line-height:1.6}
.mboard .t{flex:0 0 52px;font-family:var(--mono);font-size:11px;color:var(--acc);padding-top:2px}
.mboard .w{color:var(--ink2)}
.mboard i{color:var(--mut);font-style:italic}
@media(max-width:900px){.mkf{width:118px}}

/* Omslagsväljaren: tre system, renderade i verklig storlek. */
.csets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 4px}
.cset{padding:8px 6px 6px;border:2px solid var(--line);border-radius:8px;background:var(--card);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .12s}
.cset:hover{border-color:var(--mut)}
.cset.on{border-color:var(--acc)}
.csetc{display:block;width:56px;height:56px;border-radius:50%;overflow:hidden;position:relative;
  container-type:inline-size;box-shadow:0 0 0 1px var(--line)}
.csetn{font-size:9.5px;letter-spacing:.04em;color:var(--mut);text-align:center;line-height:1.25}
.cset.on .csetn b{color:var(--acc)}
.filmb.cov .filmp{color:var(--acc)}

/* Förslagsväljaren: tre riktiga bildrutor sida vid sida, inte tre etiketter. */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0 6px}
.vgrid4{grid-template-columns:repeat(4,1fr);gap:6px}
.mplay{display:flex;align-items:center;gap:9px;margin:8px 0 2px}
.mplay .dlb{flex:0 0 auto;margin:0}
.mplay input[type=range]{flex:1;accent-color:var(--acc)}
.mtime{font-size:11px;color:var(--mut);flex:0 0 44px;text-align:right}
.vcard{padding:0;border:2px solid var(--line);border-radius:6px;background:var(--card);
  cursor:pointer;overflow:hidden;display:block;text-align:left;transition:border-color .12s}
.vcard:hover{border-color:var(--mut)}
.vcard.on{border-color:var(--acc)}
.vfr{display:block;position:relative;width:100%;aspect-ratio:9/16;container-type:inline-size;overflow:hidden}
.vcap{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:4px 5px;
  border-top:1px solid var(--line);font-size:9.5px}
.vcap b{font-family:var(--mono);font-weight:600}
.vcap i{font-style:normal;font-family:var(--mono);color:var(--mut);font-size:8.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard.on .vcap{background:var(--acc);color:#fff}
.vcard.on .vcap i{color:rgba(255,255,255,.8)}
.eyebrow .cnt{font-style:normal;font-family:var(--mono);color:var(--mut);margin-left:5px}
.vtag{font-family:var(--mono);color:var(--acc);font-weight:700}
.bankm{margin-top:10px;font-size:11.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bankm.sm{margin:-6px 0 12px}
.lnkb{background:none;border:0;padding:0;font:inherit;color:var(--mut);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lnkb:hover{color:#B4453B}
.sl{display:block;font-size:11px;color:var(--mut);margin-bottom:12px}
.sl em{font-style:normal;font-family:var(--mono);color:var(--ink2);float:right}
.sl input{width:100%;margin-top:5px;accent-color:var(--acc)}
.geo{display:flex;gap:16px;align-items:flex-start;margin-top:11px}

/* ============ SPELARE ============ */
.player{position:fixed;inset:0;z-index:200;background:rgba(12,12,13,.94);backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;gap:26px;padding:22px}

.pstage{height:min(88vh,880px);aspect-ratio:9/16;position:relative;border-radius:9px;overflow:hidden;

.pbars i{flex:1;height:2.5px;background:rgba(255,255,255,.34);border-radius:2px;overflow:hidden}

.pclose{position:fixed;top:16px;right:18px;z-index:210;background:rgba(255,255,255,.11);border:0;color:#fff;
  width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1}

.pctl{display:flex;gap:7px}
.pctl button{background:rgba(255,255,255,.1);border:0;color:#fff;font:inherit;font-size:11px;letter-spacing:.08em;
  padding:7px 12px;border-radius:6px;cursor:pointer}

.pcopy{background:rgba(255,255,255,.05);border-radius:7px;padding:11px 13px;font-size:12px;line-height:1.55;color:#BBBAB6}
.pneed{border-left:2px solid #D9A46A;padding-left:10px;font-size:11.5px;color:#D9A46A;line-height:1.5}
.pslot{border-top:1px solid rgba(255,255,255,.12);padding-top:11px}
.phint{font-size:10.5px;color:#6E7276;letter-spacing:.04em}
