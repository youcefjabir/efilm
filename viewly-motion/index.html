<title>Viewly Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* ============================================================
   VIEWLY MOTION — deliberate single-theme (dark) working surface.
   A colour-critical video tool is judged on a dark ground; the
   palette is painted explicitly so it holds on any host ground.
   ============================================================ */
:root{
  --ground:#0E1113; --surface:#171B1E; --raised:#212729; --sunken:#0A0D0F;
  --line:#2C3438; --line-soft:#222A2D;
  --text:#E9EBE7; --text-2:#B4BDC0; --muted:#8B9599; --faint:#5C666A;
  --sel:#93B7CE; --sel-dim:#3C596B; --sel-wash:rgba(147,183,206,.12);
  --money:#C2A25E; --money-dim:#6B5A34;
  --ok:#6FBF8B; --warn:#E0A94A; --crit:#D9614C; --idle:#5C666A;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --r:3px; --rl:6px; --pad:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:400 13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.credits{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--money)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.h-page{font:300 22px/1.2 var(--disp);letter-spacing:-.01em}
.h-sec{font:500 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.dim{color:var(--muted)} .faint{color:var(--faint)}
hr.rule{border:none;border-top:1px solid var(--line-soft);margin:0}

.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);color:var(--text-2);font-size:12px;transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--faint);color:var(--text)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line);color:var(--text-2)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:#0B1014;font-weight:500}
.btn.primary:hover{background:#A8C7DA;border-color:#A8C7DA;color:#0B1014}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.xs{padding:2px 7px;font-size:10.5px}

.field{display:flex;flex-direction:column;gap:5px}
.field > label{font:500 10px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
input[type=text],input[type=number],select,textarea{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:12px;width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--sel-dim);outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:16px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--sel);margin-top:-4.5px}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;background:var(--sel)}
input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);cursor:pointer}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunken)}
.seg button{padding:5px 11px;font-size:11.5px;color:var(--muted);border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--sel-wash);color:var(--sel)}
.seg button:hover:not([aria-pressed=true]){color:var(--text)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:2px;font:500 10px/1.6 var(--sans);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--idle)}
.dot.ok{background:var(--ok)} .dot.run{background:var(--sel);animation:pulse 1.4s ease-in-out infinite} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.note{border-left:2px solid var(--line);padding:9px 12px;background:var(--surface);color:var(--text-2);font-size:12px;line-height:1.55}
.note.info{border-left-color:var(--sel-dim)}
.note.warn{border-left-color:var(--warn)}
.note b{font-weight:600;color:var(--text)}
.note code{font-family:var(--mono);font-size:11px;color:var(--sel);background:var(--sunken);padding:1px 4px;border-radius:2px}

#app{height:100%;display:flex;flex-direction:column}
.topbar{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:7px;cursor:pointer}
.brand .w{font:300 17px/1 var(--disp);letter-spacing:-.01em}
.brand .m{font:500 9.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--money)}
.topbar .sp{flex:1}
.projname{font-size:12.5px;color:var(--text-2);border-left:1px solid var(--line);padding-left:14px}
.projname b{font-weight:500;color:var(--text)}

.main{flex:1;display:flex;min-height:0}
.rail{width:196px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:14px 0;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.rail .rlabel{padding:6px 16px 8px}
.step{display:grid;grid-template-columns:20px 1fr 6px;align-items:center;gap:9px;padding:8px 16px;text-align:left;color:var(--muted);font-size:12.5px;position:relative}
.step:hover{color:var(--text);background:var(--raised)}
.step[aria-current=true]{color:var(--text);background:var(--raised)}
.step[aria-current=true]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sel)}
.step[disabled]{opacity:.34;cursor:not-allowed}
.step[disabled]:hover{background:none;color:var(--muted)}
.step .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
.step[aria-current=true] .n{color:var(--sel)}
.step .tick{width:5px;height:5px;border-radius:50%;background:var(--ok)}

.work{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.workhead{flex:none;padding:16px var(--pad) 13px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:16px;background:var(--surface)}
.workhead .sub{font-size:12px;color:var(--muted);max-width:62ch;margin-top:5px;line-height:1.5}
.workhead .sp{flex:1}
.workbody{flex:1;overflow-y:auto;padding:var(--pad);min-height:0}
.workbody.pad0{padding:0}
.inspector{width:296px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:var(--pad);display:flex;flex-direction:column;gap:18px}
.igroup{display:flex;flex-direction:column;gap:10px}
.irow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:12px}
.irow .k{color:var(--muted)}
.irow .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px}
.empty{color:var(--faint);font-size:12px;line-height:1.6;padding:26px 0;text-align:center}

/* ---------- projects ---------- */
.projwrap{max-width:960px;margin:0 auto;padding:44px 24px}
.projhero{display:flex;align-items:flex-end;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.projhero h1{font:300 34px/1.05 var(--disp);letter-spacing:-.02em}
.projhero .sp{flex:1}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:26px}
.projcard{background:var(--ground);padding:15px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:132px}
.projcard:hover{background:var(--surface)}
.projcard .pt{font-size:14px;color:var(--text)}
.projcard .pa{font-size:11.5px;color:var(--muted)}
.projcard .sp{flex:1}
.projcard .pf{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--faint)}
.projcard.new{align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px}
.projcard.new .plus{font:300 26px/1 var(--disp);color:var(--sel)}

/* ---------- material ---------- */
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .12s}
.icard[data-sel=true]{border-color:var(--sel)}
.icard[data-inc=false]{opacity:.42}
.icard .thumb{aspect-ratio:4/3;background:var(--sunken);position:relative;cursor:grab;overflow:hidden}
.icard .thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.icard.drag{opacity:.3}
.icard.over{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.icard .ord{position:absolute;top:6px;left:6px;background:rgba(10,13,15,.82);color:var(--text);font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:2px;letter-spacing:.04em}
.icard .imp{position:absolute;top:6px;right:6px;font:500 9px/1.6 var(--sans);letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:rgba(10,13,15,.82);color:var(--muted)}
.icard .imp[data-i=HERO]{color:var(--money);box-shadow:inset 0 0 0 1px var(--money-dim)}
.icard .imp[data-i=HIGH]{color:var(--sel)}
.icard .meta{padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.icard select{padding:4px 6px;font-size:11px}
.icard .row{display:flex;gap:6px;align-items:center}
.icard .row .sp{flex:1}
.sugg{font-size:10px;color:var(--faint);display:flex;align-items:center;gap:5px}
.sugg b{color:var(--sel);font-weight:500;cursor:pointer}
.dropzone{border:1px dashed var(--line);border-radius:var(--rl);padding:30px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface);transition:border-color .12s,color .12s}
.dropzone.hot{border-color:var(--sel);color:var(--sel);background:var(--sel-wash)}

/* ---------- option cards (direction / density / family) ---------- */
.optrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:var(--rl);padding:14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:7px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed=true]{border-color:var(--sel);background:var(--sel-wash)}
.opt .ot{font-size:14px;color:var(--text)}
.opt .od{font-size:11.5px;color:var(--muted);line-height:1.5}
.opt .om{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.opt[aria-pressed=true] .om{color:var(--sel)}

/* ---------- music ---------- */
.tracklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--rl);overflow:hidden}
.track{display:grid;grid-template-columns:30px 1fr 118px 62px 78px 96px;align-items:center;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line-soft);text-align:left;background:var(--surface)}
.track:last-child{border-bottom:none}
.track:hover{background:var(--raised)}
.track[aria-pressed=true]{background:var(--sel-wash)}
.track .tt{font-size:13px;color:var(--text)}
.track .ts{font-size:11px;color:var(--muted);margin-top:2px}
.track .play{width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:9px}
.track .play:hover{border-color:var(--sel);color:var(--sel)}
.trackhead{display:grid;grid-template-columns:30px 1fr 118px 62px 78px 96px;gap:12px;padding:0 13px 7px}
.meter{display:flex;gap:2px;align-items:center}
.meter i{width:3px;height:9px;background:var(--line);border-radius:1px;display:block}
.meter i.on{background:var(--sel)}
.meter.money i.on{background:var(--money)}

/* ---------- waveform / timing ---------- */
.wavewrap{border:1px solid var(--line);border-radius:var(--rl);background:var(--sunken);position:relative;overflow:hidden}
.wavewrap canvas{display:block;width:100%}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--sel);pointer-events:none;box-shadow:0 0 6px var(--sel)}
.shotstrip{display:flex;gap:2px;height:66px}
.shotcell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden;min-width:0;cursor:pointer;transition:border-color .12s}
.shotcell:hover{border-color:var(--faint)}
.shotcell[data-sel=true]{border-color:var(--sel)}
.shotcell img{width:100%;height:100%;object-fit:cover;opacity:.5}
.shotcell .lab{position:absolute;inset:auto 0 0 0;padding:3px 5px;background:linear-gradient(transparent,rgba(10,13,15,.9));font-family:var(--mono);font-size:9.5px;color:var(--text-2);display:flex;justify-content:space-between;gap:4px}
.shotcell .num{position:absolute;top:3px;left:4px;font-family:var(--mono);font-size:9.5px;color:var(--text-2)}

/* ---------- stage / preview ---------- */
.stage{flex:1;min-height:0;display:grid;place-items:center;background:var(--sunken);padding:16px;overflow:hidden}
.stage canvas{max-width:100%;max-height:100%;background:#000;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.transport{flex:none;display:flex;align-items:center;gap:12px;padding:9px var(--pad);border-top:1px solid var(--line);background:var(--surface)}
.transport .tc{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.transport .sp{flex:1}
.pbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none}
.pbtn:hover{border-color:var(--sel);color:var(--sel)}
.pbtn.big{width:36px;height:36px}

/* ---------- production ---------- */
.joblist{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden}
.job{display:grid;grid-template-columns:82px 1fr 132px 104px 86px 104px;align-items:center;gap:14px;padding:11px 14px;background:var(--ground);font-size:12px}
.job .jt{display:flex;align-items:center;gap:8px}
.job .jn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.job video{width:74px;height:42px;object-fit:cover;background:#000;border-radius:2px;border:1px solid var(--line)}
.job .thumbmini{width:74px;height:42px;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sel);transition:width .3s}

/* ---------- editor timeline ---------- */
.tlwrap{flex:none;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:236px}
.tlhead{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line-soft)}
.tlhead .sp{flex:1}
.tlscroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.tlinner{position:relative;height:100%;min-width:100%}
.tlruler{height:19px;border-bottom:1px solid var(--line-soft);position:relative}
.tlruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft);padding-left:3px;font-family:var(--mono);font-size:9px;color:var(--faint);line-height:19px}
.tltrack{height:52px;border-bottom:1px solid var(--line-soft);position:relative}
.tltrack .tlab{position:absolute;left:0;top:0;bottom:0;width:0;z-index:3}
.tlname{position:sticky;left:0;z-index:4;background:var(--surface)}
.clip{position:absolute;top:5px;bottom:5px;border-radius:2px;overflow:hidden;border:1px solid var(--line);background:var(--raised);cursor:pointer;min-width:2px}
.clip[data-sel=true]{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.clip .cl{position:absolute;inset:0;padding:4px 6px;font-family:var(--mono);font-size:9.5px;color:var(--text-2);pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.clip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34}
.clip.gfx{background:linear-gradient(180deg,rgba(147,183,206,.18),rgba(147,183,206,.07));border-color:var(--sel-dim)}
.clip.gfx[data-sel=true]{background:var(--sel-wash)}
.clip .hnd{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2}
.clip .hnd.l{left:0} .clip .hnd.r{right:0}
.clip .hnd:hover{background:var(--sel)}
.tlplay{position:absolute;top:0;bottom:0;width:1px;background:var(--sel);z-index:5;pointer-events:none}
.tlplay::before{content:"";position:absolute;top:0;left:-4px;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid var(--sel)}
.evmark{position:absolute;bottom:0;width:1px;background:var(--faint)}
.tracklabels{width:88px;flex:none;border-right:1px solid var(--line-soft);background:var(--surface);z-index:6}
.tracklabels div{height:52px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;padding:0 10px;font:500 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.tracklabels .sph{height:19px;border-bottom:1px solid var(--line-soft)}

/* ---------- graphics library ---------- */
.gfxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.gfxcard{border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;background:var(--surface);text-align:left;display:flex;flex-direction:column}
.gfxcard:hover{border-color:var(--sel)}
.gfxcard canvas{width:100%;display:block;background:#0A0D0F;border-bottom:1px solid var(--line-soft)}
.gfxcard .gm{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.gfxcard .gt{font-size:12px;color:var(--text)}
.gfxcard .gd{font-size:10.5px;color:var(--faint);line-height:1.45}

/* ---------- brand ---------- */
.brandgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.swatch{height:42px;border-radius:var(--r);border:1px solid var(--line)}
.logobox{height:74px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;padding:12px;background:var(--sunken)}
.logobox img{max-width:100%;max-height:100%;object-fit:contain}
.logobox.light{background:#F2F1ED}
.logobox.dark{background:#0A0D0F}

/* ---------- misc ---------- */
.modal{position:fixed;inset:0;background:rgba(6,8,9,.74);display:grid;place-items:center;z-index:50;padding:24px}
.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);width:min(560px,100%);max-height:84vh;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:9px 15px;font-size:12px;z-index:60;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.lg{gap:22px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.row .sp{flex:1}
.panel{border:1px solid var(--line);border-radius:var(--rl);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px}
table.cost{width:100%;border-collapse:collapse;font-size:11.5px}
table.cost th{text-align:left;font:500 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 0 7px}

/* Cost engine — reads the audited rate table, never a hardcoded guess.
   Returns {credits, verified, rateKey, rate, billedSeconds} */
function shotCost(model, opts){
  const m = MODELS[model]; if(!m) return {credits:0,verified:false,reason:"unknown model"};
  const key = m.id==="kling3_0" ? `${opts.mode||"std"}/${opts.sound||"off"}` : (opts.resolution||"720p");
  const e = m.rates[key];
  const billed = billedSeconds(model, opts.duration);
  if(!e || e.rate==null) return {credits:null,verified:false,rateKey:key,rate:null,billedSeconds:billed};
  return {credits:+(e.rate*billed).toFixed(2), verified:e.verified, rateKey:key, rate:e.rate, billedSeconds:billed};
}
/* Kling bills whole seconds. A 3.72s planned shot is generated at 4s and
   trimmed on the music event in the edit — so cost follows the ceiling. */
function billedSeconds(model, planned){
  const m = MODELS[model];
  return clamp(Math.ceil(planned - 1e-6), m.durationRange[0], m.durationRange[1]);
}

/* ==========================================================================
   2. CREATIVE VOCABULARY
   ========================================================================== */

const ROOMS = {

const ROOM_KEYS = Object.keys(ROOMS);

/* Filename-keyword classifier. This is a real, honest heuristic — not a
   vision model. It reports its own confidence and never overwrites a
   category the user has touched. */
const ROOM_HINTS = [
  [/\b(exterior|exterior|fasad|utsida|entre|entré|framsida|hus|villa|facade)\b/i,"EXTERIOR",.8],
  [/\b(vardagsrum|living|lounge|soffa|sallskapsrum|sällskapsrum)\b/i,"VARDAGSRUM",.85],
  [/\b(kok|kök|kitchen|kokso|kitchenette)\b/i,"KOK",.85],
  [/\b(matplats|matrum|dining|matsal|esszimmer)\b/i,"MATPLATS",.8],
  [/\b(sovrum|bedroom|master|gastrum|gästrum)\b/i,"SOVRUM",.85],
  [/\b(badrum|bathroom|bath|wc|dusch|toalett|shower)\b/i,"BADRUM",.85],
  [/\b(hall|entre|hallway|korridor|foyer)\b/i,"HALL",.7],
  [/\b(balkong|balcony|loggia)\b/i,"BALKONG",.85],
  [/\b(uteplats|terrass|terrace|patio|altan|tradgard|trädgård|garden)\b/i,"UTEPLATS",.8],
  [/\b(utsikt|view|vy|panorama|havsutsikt)\b/i,"UTSIKT",.8],
  [/\b(detalj|detail|narbild|närbild|closeup|kakel|handtag)\b/i,"DETALJ",.7],
  [/\b(omrade|område|area|grannskap|neighbourhood|neighborhood|karta)\b/i,"OMRADE",.7]
];
function guessRoom(filename, index, total){
  const name = filename.replace(/[_\-.]/g," ");
  for(const [re,room,conf] of ROOM_HINTS) if(re.test(name)) return {room, conf, why:"filnamn"};
  // Positional prior: the first frame of a property reel is almost always
  // the exterior, the last is the closing exterior.
  if(index===0) return {room:"EXTERIOR", conf:.35, why:"position"};
  if(index===total-1 && total>3) return {room:"EXTERIOR", conf:.3, why:"position"};
  return {room:"ANNAT", conf:.15, why:"fallback"};
}

const IMPORTANCE = {

};

}

const DIRECTIONS = {
  LUGN:{label:"Lugn", sv:"Långa andetag, få klipp, mjuk kamera.",

const MOTIONS = {

/* ==========================================================================
   3. PERSISTENCE
   Project JSON in localStorage; image/audio bytes in IndexedDB (blobs would
   blow the localStorage quota after two photos). Both sit behind one
   interface so a server-backed store is a drop-in replacement.
   ========================================================================== */

const Blobs = (()=>{
  let dbp=null;
  const open = ()=> dbp ||= new Promise((res,rej)=>{
    const r = indexedDB.open("viewly-motion",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("blobs");
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
  const tx = async (mode,fn)=>{ const db=await open();
    return new Promise((res,rej)=>{ const t=db.transaction("blobs",mode);
      const rq=fn(t.objectStore("blobs")); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); };
  return {
    put:(k,b)=>tx("readwrite",s=>s.put(b,k)).catch(()=>null),
    get:(k)=>tx("readonly",s=>s.get(k)).catch(()=>null),
    del:(k)=>tx("readwrite",s=>s.delete(k)).catch(()=>null)
  };
})();

const Store = {

          catch{ return {projects:[],brands:{}}; } },

/* ==========================================================================
   4. BACKEND CONTRACT
   The only part of the app that cannot run in a browser sandbox is the
   Higgsfield call itself (the MCP/API needs a server-side key). Everything
   talks to this interface. Point API_BASE at a real server and the mock
   transport disappears without a single change to the UI.

     POST   /api/motion/production            -> {productionId, jobs[]}
     GET    /api/motion/production/:id        -> {productionId, status, jobs[]}
     POST   /api/motion/production/:id/retry  -> {job}
     POST   /api/motion/cost                  -> {total, perShot[]}   (live get_cost)

   Server-side, each job maps 1:1 onto the audited MCP call:
     generate_video_batch({ requests:[{ index, params:{
        model, prompt, duration, mode, sound, aspect_ratio,
        medias:[{role:"start_image", value:<media_id>}] }}]})
     -> jobs_wait(...) -> show_generation_by_ids(...)
   Images are uploaded first with media_upload / media_import_url.
   ========================================================================== */

const API_BASE = null;   // e.g. "https://api.viewly.se" — null selects the mock transport.

const MotionAPI = {
  get live(){ return !!API_BASE; },

  async createProduction(spec){
    if(this.live) return this._post("/api/motion/production", spec);
    return MockBackend.createProduction(spec);
  },
  async getProduction(id){
    if(this.live) return this._get(`/api/motion/production/${id}`);
    return MockBackend.getProduction(id);
  },
  async retryShot(id, shotId){
    if(this.live) return this._post(`/api/motion/production/${id}/retry`, {shotId});
    return MockBackend.retryShot(id, shotId);
  },
  /* Live cost is authoritative: the server proxies get_cost:true, which
     returns the provider's own figure. Offline we fall back to the audited
     rate table and label the estimate as such. */
  async cost(spec){
    if(this.live){ try{ return await this._post("/api/motion/cost", spec); }catch{} }
    return localCost(spec);
  },
  async _post(p,b){ const r=await fetch(API_BASE+p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
    if(!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); },
  async _get(p){ const r=await fetch(API_BASE+p); if(!r.ok) throw new Error(r.status); return r.json(); }
};

function localCost(spec){
  const perShot = spec.shots.map(s=>{
    const c = shotCost(spec.model, {duration:s.duration, mode:spec.mode, sound:spec.sound, resolution:spec.resolution});
    return {shotId:s.shotId, ...c};
  });
  const known = perShot.filter(p=>p.credits!=null);
  return {
    total: +known.reduce((a,b)=>a+b.credits,0).toFixed(2),
    unpriced: perShot.length - known.length,
    perShot,
    source: "audited-rate-table",
    auditedAt: PROVIDER_AUDIT_DATE
  };
}

/* --- Mock transport -------------------------------------------------------
   Reproduces the real job lifecycle (queued -> generating -> completed|failed)
   with realistic latency, so every production/retry/error path in the UI is
   exercised for real. It returns no video URL: a mocked clip would be a lie.
   The editor falls back to rendering the still with its planned camera move,
   and each shot is clearly badged SIMULERAD until a server returns real MP4s.
   -------------------------------------------------------------------------- */
const MockBackend = {
  runs:{},
  createProduction(spec){
    const id = "prod_"+uid();
    this.runs[id] = {
      productionId:id, status:"running", createdAt:Date.now(), spec,
      jobs: spec.shots.map((s,i)=>({
        index:i, shotId:s.shotId, jobId:"job_"+uid(), status:"queued",
        startedAt:Date.now()+i*900 + Math.random()*600,
        durationMs: 7000 + Math.random()*9000,
        // one in twelve fails, so the retry path is a real path
        willFail: Math.random() < 0.085,
        resultUrl:null, actualCredits:null, error:null
      }))
    };
    return Promise.resolve(this._snap(id));
  },
  getProduction(id){ return Promise.resolve(this._snap(id)); },
  retryShot(id, shotId){
    const run=this.runs[id]; if(!run) return Promise.reject(new Error("no run"));
    const j=run.jobs.find(j=>j.shotId===shotId); if(!j) return Promise.reject(new Error("no job"));
    Object.assign(j,{status:"queued",startedAt:Date.now(),durationMs:6000+Math.random()*6000,
      willFail:Math.random()<0.04, error:null, resultUrl:null, jobId:"job_"+uid(), retried:(j.retried||0)+1});
    run.status="running";
    return Promise.resolve(this._snap(id));
  },
  _snap(id){
    const run=this.runs[id]; if(!run) throw new Error("unknown production");
    const now=Date.now();
    for(const j of run.jobs){
      if(j.status==="completed"||j.status==="failed") continue;
      if(now < j.startedAt){ j.status="queued"; continue; }
      const p = (now-j.startedAt)/j.durationMs;
      if(p<1){ j.status="generating"; j.progress=clamp(p,0,.98); }
      else if(j.willFail){ j.status="failed"; j.progress=1;
        j.error="Provider returned NSFW_OR_UNSUPPORTED_FRAME for the start image."; }
      else {
        const shot = run.spec.shots.find(s=>s.shotId===j.shotId);
        const c = shotCost(run.spec.model,{duration:shot.duration,mode:run.spec.mode,sound:run.spec.sound,resolution:run.spec.resolution});
        j.status="completed"; j.progress=1; j.resultUrl=null; j.simulated=true;
        j.actualCredits = c.credits;
        j.generatedSeconds = c.billedSeconds;
      }
    }
    const done = run.jobs.every(j=>j.status==="completed"||j.status==="failed");
    run.status = done ? (run.jobs.some(j=>j.status==="failed") ? "partial" : "completed") : "running";
    return JSON.parse(JSON.stringify(run));
  }
};

/* ==========================================================================
   5. MUSIC ANALYSIS
   Real DSP on the decoded buffer — spectral-flux onsets, autocorrelation
   tempo, an inferred beat grid, energy novelty for section boundaries.
   Output is one Music Event Map that cuts, transitions and graphics all read.
   ========================================================================== */

function fft(re, im){                     // in-place radix-2, n = power of two
  const n = re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1; for(;j&bit;bit>>=1) j^=bit; j^=bit;
    if(i<j){ [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1, ci=0;
      for(let k=0;k<len/2;k++){
        const ur=re[i+k], ui=im[i+k];
        const vr=re[i+k+len/2]*cr - im[i+k+len/2]*ci;
        const vi=re[i+k+len/2]*ci + im[i+k+len/2]*cr;
        re[i+k]=ur+vr; im[i+k]=ui+vi;
        re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
        const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr;
      }
    }
  }
}

const AN = {WIN:1024, HOP:256, SR:22050};   // ~86 frames/s — enough for piano onsets

function analyseBuffer(buf){
  // ---- downmix + resample to a fixed analysis rate
  const src = buf.getChannelData(0);
  const src2 = buf.numberOfChannels>1 ? buf.getChannelData(1) : null;
  const ratio = buf.sampleRate/AN.SR;
  const n = Math.floor(buf.length/ratio);
  const x = new Float32Array(n);
  for(let i=0;i<n;i++){ const j=Math.floor(i*ratio);
    x[i] = src2 ? (src[j]+src2[j])*.5 : src[j]; }

  const nFrames = Math.max(1, Math.floor((n-AN.WIN)/AN.HOP));
  const nBins = AN.WIN/2;
  const win = new Float32Array(AN.WIN);
  for(let i=0;i<AN.WIN;i++) win[i]=.5-.5*Math.cos(2*Math.PI*i/(AN.WIN-1));

  const flux=new Float32Array(nFrames), rms=new Float32Array(nFrames),
        centroid=new Float32Array(nFrames), lowFlux=new Float32Array(nFrames);
  let prev=new Float32Array(nBins);
  const re=new Float32Array(AN.WIN), im=new Float32Array(AN.WIN);

  for(let f=0;f<nFrames;f++){
    const off=f*AN.HOP;
    let e=0;
    for(let i=0;i<AN.WIN;i++){ const v=x[off+i]||0; re[i]=v*win[i]; im[i]=0; e+=v*v; }
    rms[f]=Math.sqrt(e/AN.WIN);
    fft(re,im);
    let fl=0, lf=0, num=0, den=0;
    for(let b=1;b<nBins;b++){
      const mag=Math.sqrt(re[b]*re[b]+im[b]*im[b]);
      const d=mag-prev[b];
      if(d>0){ fl+=d; if(b<nBins*0.08) lf+=d; }   // <~900 Hz: kick / bass / left hand
      num+=b*mag; den+=mag;
      prev[b]=mag;
    }
    flux[f]=fl; lowFlux[f]=lf; centroid[f]= den>0 ? num/den/nBins : 0;
  }

  const norm=a=>{ let m=0; for(const v of a) m=Math.max(m,v); return m>0? a.map(v=>v/m) : Array.from(a); };
  const fluxN=norm(flux), lowN=norm(lowFlux), rmsN=norm(rms);
  const tOf = f => f*AN.HOP/AN.SR;

  // ---- onset peak-picking against a local adaptive threshold
  const onsets=[];
  const W=12;
  for(let f=2;f<nFrames-2;f++){
    if(fluxN[f]<=fluxN[f-1] || fluxN[f]<fluxN[f+1]) continue;
    let sum=0,c=0;
    for(let k=f-W;k<=f+W;k++){ if(k<0||k>=nFrames) continue; sum+=fluxN[k]; c++; }
    const thr=sum/c*1.42+0.018;
    if(fluxN[f]>thr){
      const last=onsets[onsets.length-1];
      if(last && tOf(f)-last.t < .055){ if(fluxN[f]>last.raw){ last.t=tOf(f); last.raw=fluxN[f]; last.low=lowN[f]; } }
      else onsets.push({t:tOf(f), raw:fluxN[f], low:lowN[f]});
    }
  }

  // ---- tempo by autocorrelating the onset envelope (60–180 BPM)
  const fps=AN.SR/AN.HOP;
  let best={bpm:0,score:0};
  for(let bpm=60;bpm<=180;bpm+=.25){
    const lag=Math.round(60/bpm*fps);
    if(lag<4||lag>=nFrames/2) continue;
    let s=0;
    for(let f=0;f<nFrames-lag;f++) s+=fluxN[f]*fluxN[f+lag];
    s/= (nFrames-lag);
    if(s>best.score) best={bpm,score:s};
  }
  const bpm = best.bpm||110;
  const beatLen = 60/bpm;

  // ---- beat phase: the offset that lands most onset energy on the grid
  let phase=0, phBest=-1;
  for(let p=0;p<beatLen;p+=beatLen/48){
    let s=0;
    for(let t=p;t<tOf(nFrames-1);t+=beatLen){
      const f=Math.round(t*fps); if(f>0&&f<nFrames) s+=fluxN[f];
    }
    if(s>phBest){ phBest=s; phase=p; }
  }
  const beats=[];
  for(let t=phase;t<buf.duration;t+=beatLen) beats.push(t);

  // ---- bar phase: which beat-of-4 carries the most low-end energy
  let barOff=0, barBest=-1;
  for(let o=0;o<4;o++){
    let s=0;
    for(let i=o;i<beats.length;i+=4){ const f=Math.round(beats[i]*fps); if(f>0&&f<nFrames) s+=lowN[f]; }
    if(s>barBest){ barBest=s; barOff=o; }
  }

  // ---- sections: novelty in smoothed energy + brightness
  const smooth=(a,k)=>a.map((_,i)=>{ let s=0,c=0;
    for(let j=i-k;j<=i+k;j++){ if(j<0||j>=a.length) continue; s+=a[j]; c++; } return s/c; });
  const rs=smooth(rmsN,26), cs=smooth(Array.from(centroid),26);
  const sections=[0];
  const gap=Math.max(6, beatLen*8);
  for(let f=30;f<nFrames-30;f++){
    const dE=Math.abs(rs[f+22]-rs[f-22]), dC=Math.abs(cs[f+22]-cs[f-22]);
    const nov=dE*1.0+dC*0.55;
    if(nov>0.16){
      const t=tOf(f);
      if(t-sections[sections.length-1]>gap) sections.push(t);
    }
  }

  // ---- assemble the Music Event Map
  const snap=(t,arr,tol)=>{ let bi=-1,bd=tol;
    for(let i=0;i<arr.length;i++){ const d=Math.abs(arr[i]-t); if(d<bd){bd=d;bi=i;} } return bi; };
  const events=[];
  const push=(t,type,strength,meta)=>{ if(t>=0&&t<=buf.duration) events.push({t:+t.toFixed(3),type,strength:+clamp(strength,0,1).toFixed(3),...meta}); };

  sections.forEach((t,i)=> push(t,"SECTION_START", i===0?1:0.95));
  beats.forEach((t,i)=>{
    const f=Math.round(t*fps);
    const energy = f>0&&f<nFrames ? fluxN[f] : 0;
    const isBar=(i-barOff)%4===0, bar=Math.floor((i-barOff)/4);
    const isPhrase = isBar && bar>=0 && bar%4===0;
    if(isPhrase)     push(t,"PHRASE_ACCENT", clamp(.80+energy*.20,0,1), {bar});
    else if(isBar)   push(t,"DOWNBEAT",      clamp(.62+energy*.25,0,1), {bar});
    else             push(t,"BEAT",          clamp(.20+energy*.25,0,1));
  });
  onsets.forEach(o=>{
    if(snap(o.t,beats,.075)>=0) return;              // already covered by the grid
    const perc = o.low>0.35;
    push(o.t, perc?"PERCUSSION_HIT":"ONSET", clamp((perc?.40:.34)+o.raw*.42,0,1));
  });

  events.sort((a,b)=>a.t-b.t);
  // collapse events closer than 40 ms, keeping the strongest
  const map=[];
  for(const e of events){
    const p=map[map.length-1];
    if(p && e.t-p.t<.04){ if(e.strength>p.strength) map[map.length-1]=e; }
    else map.push(e);
  }

  const energyCurve=[]; const step=Math.max(1,Math.floor(nFrames/420));
  for(let f=0;f<nFrames;f+=step) energyCurve.push(+rmsN[f].toFixed(3));

  // Editability: can this track actually be cut on? Strong, regular, well-spread
  // events matter more than whether it is pleasant music.
  const strong = map.filter(e=>e.strength>=.6);
  const spread = strong.length>2 ? (()=>{ const g=[]; for(let i=1;i<strong.length;i++) g.push(strong[i].t-strong[i-1].t);
      const mean=g.reduce((a,b)=>a+b,0)/g.length;
      const sd=Math.sqrt(g.reduce((a,b)=>a+(b-mean)**2,0)/g.length);
      return clamp(1-sd/Math.max(mean,.001),0,1); })() : .2;
  const density = clamp(strong.length/Math.max(buf.duration,1)/1.1,0,1);
  const editability = clamp(.45*spread + .35*density + .20*clamp(best.score*180,0,1), 0, 1);

  return {
    duration:+buf.duration.toFixed(3), bpm:+bpm.toFixed(1), beatLen:+beatLen.toFixed(4),
    events:map, beats:beats.map(t=>+t.toFixed(3)), sections:sections.map(t=>+t.toFixed(3)),
    energyCurve, peaks:buildPeaks(x), editability:+editability.toFixed(2),
    counts:{ total:map.length, strong:strong.length,
      section:map.filter(e=>e.type==="SECTION_START").length,
      phrase:map.filter(e=>e.type==="PHRASE_ACCENT").length,
      downbeat:map.filter(e=>e.type==="DOWNBEAT").length,
      onset:map.filter(e=>e.type==="ONSET"||e.type==="PERCUSSION_HIT").length }
  };
}
function buildPeaks(x, n=1400){
  const out=new Array(n).fill(0), block=Math.floor(x.length/n)||1;
  for(let i=0;i<n;i++){ let m=0; const s=i*block;
    for(let j=0;j<block;j+=3){ const v=Math.abs(x[s+j]||0); if(v>m) m=v; }
    out[i]=+m.toFixed(3); }
  const mx=Math.max(...out,.001);
  return out.map(v=>+(v/mx).toFixed(3));
}

const EVENT_WEIGHT = {SECTION_START:1.0, PHRASE_ACCENT:.88, DOWNBEAT:.68, PERCUSSION_HIT:.46, ONSET:.42, BEAT:.24};

/* ==========================================================================
   6. SHOT TIMING ENGINE
   Each image gets a preferred duration and an allowed range from its room,
   its importance and the creative direction. The engine then walks the
   Music Event Map and places each cut on the strongest event inside that
   range — never on a fixed grid, never on every beat. Total video length is
   an output, not an input.
   ========================================================================== */

function shotPriors(img, direction){
  const r = ROOMS[img.room] || ROOMS.ANNAT;
  const imp = IMPORTANCE[img.importance] || IMPORTANCE.NORMAL;
  const d = DIRECTIONS[direction] || DIRECTIONS.BALANSERAD;
  const k = imp.mult * d.durScale;
  return {
    preferred:+(r.pref*k).toFixed(2),
    min:+(r.range[0]*k).toFixed(2),
    max:+(r.range[1]*k).toFixed(2)
  };
}

function planTiming(images, music, direction){
  const dir = DIRECTIONS[direction] || DIRECTIONS.BALANSERAD;
  const included = images.filter(i=>i.include);
  const shots=[]; let t=0;

  for(let i=0;i<included.length;i++){
    const img=included[i];
    const p = img.lockDuration ? {preferred:img.duration, min:img.duration, max:img.duration}
                               : shotPriors(img, direction);
    const isLast = i===included.length-1;
    let end = t + p.preferred, chosen=null;

    if(music && music.events.length && !img.lockDuration){
      const lo=t+p.min, hi=t+p.max;
      const cands = music.events.filter(e=>e.t>=lo && e.t<=hi &&
        e.strength*EVENT_WEIGHT[e.type] >= dir.minEventStrength*0.62);
      if(cands.length){
        let bestScore=-Infinity;
        for(const e of cands){
          const w = e.strength*EVENT_WEIGHT[e.type];
          // proximity to the preferred length, normalised across the allowed span
          const drift = Math.abs(e.t-end)/Math.max(p.max-p.min,.001);
          // the closing shot is rewarded for resolving on a section or phrase
          const closing = isLast && (e.type==="SECTION_START"||e.type==="PHRASE_ACCENT") ? .45 : 0;
          const score = w*1.35 - drift*0.9 + closing;
          if(score>bestScore){ bestScore=score; chosen=e; }
        }
        end = chosen.t;
      }
    }
    if(music) end = Math.min(end, music.duration);
    const dur = Math.max(1.2, +(end-t).toFixed(3));
    shots.push({
      shotId:img.id, imageId:img.id, index:i,
      start:+t.toFixed(3), duration:dur, end:+(t+dur).toFixed(3),
      preferred:p.preferred, min:p.min, max:p.max,
      cutEvent: chosen ? {t:chosen.t, type:chosen.type, strength:chosen.strength} : null,
      aligned: !!chosen,
      motion: img.motion || (ROOMS[img.room]?.motion) || "SUBTLE_DRIFT",
      trimIn:0
    });
    t += dur;
  }
  return {
    shots, total:+t.toFixed(3),
    alignedCuts: shots.filter(s=>s.aligned).length,
    rawPreferred:+shots.reduce((a,s)=>a+s.preferred,0).toFixed(2),
    endsOnResolution: shots.length ? ["SECTION_START","PHRASE_ACCENT"].includes(shots[shots.length-1].cutEvent?.type) : false
  };
}

function newProject(name){
  return {
    schema:VERSION, id:"prj_"+uid(), name:name||"Namnlöst objekt",
    createdAt:Date.now(), updatedAt:Date.now(),
    property:{address:"",city:"",property_type:"",living_area_m2:null},
    broker:{name:"",phone:"",image_url:""},
    brandId:null,
    images:[], music:null, direction:"BALANSERAD",
    output:{aspect:"9:16", model:DEFAULT_MODEL, mode:"std", sound:"off", resolution:"1080p"},
    plan:null, production:null,
    graphics:[], graphicFamily:"EDITORIAL", graphicDensity:"BALANCED", brandLock:true,
    step:"material"
  };
}

const App = {
  data:Store.read(),
  project:null,
  view:"projects",
  sel:{image:null, shot:null, graphic:null},
  audio:{ctx:null, buffer:null, source:null, gain:null, playing:false, startedAt:0, offset:0},
  undo:[], redo:[],

  save(){
    if(!this.project) return;
    this.project.updatedAt=Date.now();
    const i=this.data.projects.findIndex(p=>p.id===this.project.id);
    const lean = {...this.project, images:this.project.images.map(im=>({...im, url:undefined, el:undefined}))};
    if(i>=0) this.data.projects[i]=lean; else this.data.projects.push(lean);
    Store.write(this.data);
  },
  snapshot(label){
    if(!this.project) return;
    this.undo.push({label, state:JSON.stringify({images:this.project.images.map(i=>({...i,url:undefined,el:undefined})),
      plan:this.project.plan, graphics:this.project.graphics})});
    if(this.undo.length>40) this.undo.shift();
    this.redo.length=0;
  },
  restore(stack, other){
    if(!stack.length) return;
    const s=stack.pop();
    other.push({label:s.label, state:JSON.stringify({images:this.project.images.map(i=>({...i,url:undefined,el:undefined})),
      plan:this.project.plan, graphics:this.project.graphics})});
    const st=JSON.parse(s.state);
    st.images.forEach(im=>{ const cur=this.project.images.find(x=>x.id===im.id);
      Object.assign(im,{url:cur?.url, el:cur?.el}); });
    this.project.images=st.images; this.project.plan=st.plan; this.project.graphics=st.graphics;
    this.save(); render(); toast(`Ångrade: ${s.label}`);
  },
  replan(){
    if(!this.project) return;
    const inc=this.project.images.filter(i=>i.include);
    if(!inc.length){ this.project.plan=null; return; }
    this.project.plan = planTiming(this.project.images, this.project.music?.analysis, this.project.direction);
    this.save();
  }
};

/* ==========================================================================
   8. RENDERER — one implementation drives the animatic, the editor preview
   and the export. Preview is the render.
   ========================================================================== */

function easeInOut(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function drawShot(ctx, W, H, img, motion, p, opts={}){
  ctx.save();
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  if(img && img.complete && img.naturalWidth){
    const m = MOTIONS[motion] || MOTIONS.STATIC;
    const e = easeInOut(clamp(p,0,1));
    const intensity = opts.intensity ?? 1;
    const z = 1 + Math.abs(m.zoom)*intensity*0.6 + (m.zoom>=0 ? m.zoom*intensity*e : m.zoom*intensity*(e-1));
    const scale = Math.max(W/img.naturalWidth, H/img.naturalHeight) * Math.max(1.001, z);
    const dw=img.naturalWidth*scale, dh=img.naturalHeight*scale;
    const px = m.pan[0]*intensity*(e-.5)*(dw-W||W*.1);
    const py = m.pan[1]*intensity*(e-.5)*(dh-H||H*.1);
    ctx.drawImage(img, (W-dw)/2 - px, (H-dh)/2 - py, dw, dh);
  } else {
    ctx.fillStyle="#14181A"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#3A4448"; ctx.font=`500 ${Math.round(W*.026)}px ui-sans-serif,sans-serif`;
    ctx.textAlign="center"; ctx.fillText("Ingen bild", W/2, H/2);
  }
  ctx.restore();
}

/* ==========================================================================
   9. MOTION GRAPHICS
   A separate, editable layer composited over the cut video — never baked
   into the generation. Components are built from reusable primitives so a
   line that grows in one treatment is the same line that grows in the next.
   BRAND decides typeface and colour. FAMILY decides construction and timing.
   ========================================================================== */

const FAMILIES = {
  EDITORIAL:{label:"Editorial", desc:"Hairline rules, generous tracking, asymmetric weight.",
    line:1.0, ease:"quart", tracking:1.0, pace:1.0},
  ARCHITECTURAL:{label:"Architectural", desc:"Constructed corners, dimension lines, drawing logic.",
    line:1.15, ease:"expo", tracking:.9, pace:.92},
  QUIET_LUXURY:{label:"Quiet Luxury", desc:"Slow fades, minimal linework, wide breathing room.",
    line:.75, ease:"sine", tracking:1.25, pace:1.28},
  MODERN_PRECISION:{label:"Modern Precision", desc:"Fast masks, tight geometry, decisive holds.",
    line:1.0, ease:"expo", tracking:.85, pace:.82},
  CINEMATIC:{label:"Cinematic", desc:"Soft scrims, letterbox weight, slow resolve.",
    line:.9, ease:"sine", tracking:1.1, pace:1.15}
};
const EASES = {
  quart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  expo:t=>t===0?0:t===1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  sine:t=>-(Math.cos(Math.PI*t)-1)/2
};
const DENSITY = {
  MINIMAL:{label:"Minimal", desc:"Intro och outro. Inget mer.", max:3},
  BALANCED:{label:"Balanced", desc:"Intro, ett par fakta, outro.", max:5},
  EXPRESSIVE:{label:"Expressive", desc:"Tätare rytm mot musiken.", max:8}
};

/* ---- primitives ---------------------------------------------------------- */
const P = {
  line(ctx,x1,y1,x2,y2,p,w=1){
    if(p<=0) return; ctx.save(); ctx.lineWidth=w; ctx.lineCap="butt";
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+(x2-x1)*p, y1+(y2-y1)*p); ctx.stroke(); ctx.restore();
  },
  maskReveal(ctx,x,y,w,h,p,draw,dir="left"){
    if(p<=0) return; ctx.save(); ctx.beginPath();
    const rw=w*clamp(p,0,1);
    if(dir==="left") ctx.rect(x,y,rw,h);
    else if(dir==="right") ctx.rect(x+w-rw,y,rw,h);
    else ctx.rect(x,y+h-h*p,w,h*p);
    ctx.clip(); draw(); ctx.restore();
  },
  trackingResolve(ctx,text,x,y,p,{size,family,weight=400,color,track=.3,align="left"}){
    const e=clamp(p,0,1);
    ctx.save();
    ctx.font=`${weight} ${size}px ${family}`;
    ctx.fillStyle=color; ctx.globalAlpha=clamp(e*1.5,0,1); ctx.textBaseline="alphabetic";
    const sp = size*track*(1-e);
    const chars=[...text];
    let total=0; for(const c of chars) total+=ctx.measureText(c).width+sp;
    total-=sp;
    let cx = align==="center" ? x-total/2 : align==="right" ? x-total : x;
    const sc = 1 + .012*(1-e);
    ctx.translate(cx,y); ctx.scale(sc,sc);
    let ox=0;
    for(const c of chars){ ctx.fillText(c,ox,0); ox+=ctx.measureText(c).width+sp; }
    ctx.restore();
    return total;
  },
  corner(ctx,x,y,w,h,p,lw=1,flip=1){
    const half=clamp(p*2,0,1), second=clamp(p*2-1,0,1);
    ctx.save(); ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w*half*flip,y); ctx.stroke();
    if(second>0){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+h*second); ctx.stroke(); }
    ctx.restore();
  },
  partialFrame(ctx,x,y,w,h,p,lw=1){
    const s=clamp(p,0,1);
    ctx.save(); ctx.lineWidth=lw;
    P.line(ctx,x,y,x+w*.34,y,clamp(s*2.2,0,1),lw);
    P.line(ctx,x+w,y,x+w,y+h*.42,clamp(s*2.2-.4,0,1),lw);
    P.line(ctx,x+w,y+h,x+w*.66,y+h,clamp(s*2.2-.8,0,1),lw);
    P.line(ctx,x,y+h,x,y+h*.58,clamp(s*2.2-1.2,0,1),lw);
    ctx.restore();
  },
  dimension(ctx,x1,x2,y,p,lw=1,cap=7){
    const s=clamp(p,0,1);
    ctx.save(); ctx.lineWidth=lw;
    ctx.globalAlpha=clamp(s*3,0,1);
    ctx.beginPath(); ctx.moveTo(x1,y-cap); ctx.lineTo(x1,y+cap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y-cap); ctx.lineTo(x2,y+cap); ctx.stroke();
    ctx.globalAlpha=1;
    P.line(ctx,x1,y,x2,y,clamp(s*1.4-.15,0,1),lw);
    ctx.restore();
  },
  /* Monoline architectural icon set — consistent stroke, square caps, no clipart. */
  icon(ctx,name,x,y,s,p,lw=1){
    ctx.save(); ctx.lineWidth=lw; ctx.lineCap="square"; ctx.lineJoin="miter";
    ctx.translate(x,y);
    const seg=(a,b,c,d,f,t)=>P.line(ctx,a*s,b*s,c*s,d*s,clamp((p-f)/Math.max(t-f,.001),0,1),lw);
    if(name==="roof"){ seg(-.5,.15,0,-.35,0,.5); seg(0,-.35,.5,.15,.4,.9); seg(-.35,.15,-.35,.5,.75,1); seg(.35,.15,.35,.5,.75,1); }
    else if(name==="area"){ seg(-.45,-.45,.45,-.45,0,.35); seg(.45,-.45,.45,.45,.3,.6); seg(.45,.45,-.45,.45,.55,.82); seg(-.45,.45,-.45,-.45,.78,1); }
    else if(name==="pin"){ seg(0,.45,0,-.1,0,.45); seg(-.28,-.1,0,-.42,.4,.75); seg(0,-.42,.28,-.1,.65,1); seg(-.28,-.1,.28,-.1,.85,1); }
    else if(name==="window"){ seg(-.4,-.45,.4,-.45,0,.3); seg(.4,-.45,.4,.45,.25,.5); seg(.4,.45,-.4,.45,.45,.7); seg(-.4,.45,-.4,-.45,.65,.85); seg(0,-.45,0,.45,.8,1); }
    else if(name==="stair"){ seg(-.45,.45,-.15,.45,0,.25); seg(-.15,.45,-.15,.1,.2,.4); seg(-.15,.1,.15,.1,.35,.6); seg(.15,.1,.15,-.25,.55,.78); seg(.15,-.25,.45,-.25,.75,1); }
    ctx.restore();
  },
  scrim(ctx,W,H,p,from=.0,to=.55,dir="bottom"){
    const a=clamp(p,0,1)*to;
    const g=ctx.createLinearGradient(0, dir==="bottom"?H:0, 0, dir==="bottom"?H*.42:H*.58);
    g.addColorStop(0,`rgba(6,8,9,${a})`); g.addColorStop(1,"rgba(6,8,9,0)");
    ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  },
  portraitMask(ctx,img,x,y,r,p){
    if(!img||!img.complete) return;
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r*clamp(p*1.1,0,1),0,Math.PI*2); ctx.clip();
    const s=Math.max(r*2/img.naturalWidth, r*2/img.naturalHeight);
    ctx.drawImage(img,x-img.naturalWidth*s/2,y-img.naturalHeight*s/2,img.naturalWidth*s,img.naturalHeight*s);
    ctx.restore();
  }
};

const GFX = {};
const def = (id,o)=>{ GFX[id]={id,...o}; };

def("line_address",{

  draw(g){
    const {ctx,W,H,u,c,f,e,anchor}=g;

    ctx.strokeStyle=c.accent;
    P.line(ctx,x,y-3.2*u,x+16*u,y-3.2*u, clamp(e*2.1,0,1), g.lw);
    const t2=clamp(e*1.9-.55,0,1);
    P.maskReveal(ctx,x,y-2.6*u,26*u,7*u,t2,()=>{
      ctx.fillStyle=c.text; ctx.textBaseline="alphabetic";
      ctx.font=`400 ${4.6*u}px ${f.display}`;
      ctx.fillText(g.content.address||"—", x, y+1.6*u);
    });
    const t3=clamp(e*1.8-1.0,0,1);
    if(t3>0){ ctx.save(); ctx.globalAlpha=t3;
      P.trackingResolve(ctx,(g.content.city||"").toUpperCase(),x,y+4.6*u,t3,
        {size:1.55*u,family:f.body,weight:500,color:c.muted,track:.42*g.fam.tracking});
      ctx.restore(); }

});

def("corner_facts",{
  name:"Corner → Facts", group:"Facts",

    const rows=[[g.content.type,"Typ"],[g.content.area?g.content.area+" m²":"","Boarea"],[g.content.rooms,"Rum"]].filter(r=>r[0]);
    rows.forEach((r,i)=>{

      P.maskReveal(ctx,x+2.4*u,ry-2.4*u,22*u,4*u,t,()=>{
        ctx.fillStyle=c.text; ctx.font=`400 ${3.1*u}px ${f.display}`; ctx.textBaseline="alphabetic";
        ctx.fillText(String(r[0]), x+2.4*u, ry);

def("dimension_area",{
  name:"Dimension → Area", group:"Facts",
  desc:"Drawing endpoints, a measured line, the figure. No CAD gimmickry.",
  fields:["area"], defaultDur:3.0,
  draw(g){

const GFX_KEYS = Object.keys(GFX);

/* ---- graphic instances, anchors, compositing ----------------------------- */

const ANCHORS = {
  TOP_LEFT:[.5,.5,"left"],      TOP_CENTER:[0,.5,"center"],   TOP_RIGHT:[-.5,.5,"right"],
  MIDDLE_LEFT:[.5,0,"left"],    CENTER:[0,0,"center"],        MIDDLE_RIGHT:[-.5,0,"right"],
  BOTTOM_LEFT:[.5,-.5,"left"],  BOTTOM_CENTER:[0,-.5,"center"],BOTTOM_RIGHT:[-.5,-.5,"right"]
};
const ANCHOR_KEYS = Object.keys(ANCHORS);

function resolveAnchor(name, W, H, dx, dy){
  const [ax,ay,align] = ANCHORS[name] || ANCHORS.BOTTOM_LEFT;
  const mx = W*0.088, my = H*0.075;
  const x = W/2 + ax*(W - mx*2) + (dx/100)*W;
  const y = H/2 - ay*(H - my*2) + (dy/100)*H;
  return {x, y, align};
}

function newGraphic(componentId, start, project, brand){
  const comp = GFX[componentId];
  const p = project.property, b = project.broker;
  const content = {
    address:p.address||"", city:p.city||"", type:p.property_type||"",
    area:p.living_area_m2??"", rooms:p.rooms||"",
    name:b.name||"", phone:b.phone||"",
    office:brand?.office_name||"", label:"", icon:"area", value:p.living_area_m2??"", label2:""
  };
  if(componentId==="icon_spec"){ content.value=p.living_area_m2??"—"; content.label="m² boarea"; }
  const dur = comp.defaultDur;
  return {
    id:"gfx_"+uid(), componentId, start:+start.toFixed(3), duration:dur,
    enter:0.85, exit:0.6, anchor:defaultAnchor(componentId), dx:0, dy:0,
    scale:1, opacity:1, content, colorRole:"accent", locked:false
  };
}
function defaultAnchor(id){
  return ({line_address:"BOTTOM_LEFT", tracking_title:"CENTER", frame_intro:"CENTER",
    corner_facts:"BOTTOM_LEFT", stack_facts:"BOTTOM_LEFT", dimension_area:"CENTER",
    icon_spec:"BOTTOM_LEFT", rule_location:"BOTTOM_LEFT", broker_card:"BOTTOM_LEFT",
    quiet_outro:"CENTER", corner_mark:"TOP_LEFT", section_slate:"CENTER"})[id] || "BOTTOM_LEFT";
}

function brandColors(brand){
  const c = brand?.colors || {};
  return {
    accent: c.accent || c.primary || "#C2A25E",
    primary: c.primary || "#E9EBE7",
    text: c.light || "#FFFFFF",
    muted: "rgba(255,255,255,.66)",
    line: "rgba(255,255,255,.34)",
    dark: c.dark || "#0A0D0F"
  };
}
function brandFonts(brand, lock){
  const disp = lock && brand?.typography?.display_family ? brand.typography.display_family : "Fraunces";
  const body = lock && brand?.typography?.body_family ? brand.typography.body_family : "IBM Plex Sans";
  return { display:`"${disp}", Georgia, serif`, body:`"${body}", system-ui, sans-serif` };
}

/* Composite the graphics layer at time t. Same function for the animatic,
   the editor preview and the exporter — so preview is the render. */
function drawGraphics(ctx, W, H, t, project, brand, assets){
  const fam = FAMILIES[project.graphicFamily] || FAMILIES.EDITORIAL;
  const ease = EASES[fam.ease] || EASES.quart;
  const c = brandColors(brand), f = brandFonts(brand, project.brandLock);
  const u = Math.min(W,H)/100 * 3.2;                    // unit scale, resolution-independent

  for(const gi of project.graphics){
    const tl = t - gi.start;
    if(tl < 0 || tl > gi.duration) continue;
    const comp = GFX[gi.componentId]; if(!comp) continue;
    const enter = gi.enter*fam.pace, exit = gi.exit*fam.pace;
    let e = 1, alpha = 1;
    if(tl < enter) e = ease(clamp(tl/enter,0,1));
    if(tl > gi.duration - exit) alpha = 1 - ease(clamp((tl-(gi.duration-exit))/Math.max(exit,.001),0,1));
    const anchor = resolveAnchor(gi.anchor, W, H, gi.dx, gi.dy);
    ctx.save();
    ctx.globalAlpha = alpha * gi.opacity;
    ctx.translate(anchor.x, anchor.y); ctx.scale(gi.scale, gi.scale); ctx.translate(-anchor.x, -anchor.y);
    ctx.textBaseline="alphabetic"; ctx.textAlign="left";
    try{
      comp.draw({ctx, W, H, u, c, f, e, alpha, anchor, fam,
        lw: Math.max(1, u*0.11*fam.line),
        content: gi.content,
        logoImg: assets?.logo, brokerImg: assets?.broker});
    }catch(err){ /* one broken graphic must never kill the frame */ }
    ctx.restore();
  }
}

/* Auto Composer — reads the timeline, the property data, the density and the
   music map, and proposes a graphics plan. The user can change everything. */
function composeGraphics(project, brand){
  const plan = project.plan; if(!plan || !plan.shots.length) return [];
  const dens = DENSITY[project.graphicDensity] || DENSITY.BALANCED;
  const music = project.music?.analysis;
  const p = project.property;
  const total = plan.total;
  const out = [];

  const snapEvent = (t, window=.6)=>{
    if(!music) return t;
    const c = music.events.filter(e=>Math.abs(e.t-t)<=window && e.strength>=.4);
    if(!c.length) return t;
    return c.reduce((a,b)=> (b.strength*EVENT_WEIGHT[b.type] > a.strength*EVENT_WEIGHT[a.type] ? b : a)).t;
  };

  // Intro: on the first cut, not on frame zero — let the property land first.
  const introAt = snapEvent(Math.min(0.7, plan.shots[0].duration*0.35));
  const introId = project.graphicFamily==="ARCHITECTURAL" ? "corner_facts"
                : project.graphicFamily==="QUIET_LUXURY" ? "tracking_title"
                : project.graphicFamily==="MODERN_PRECISION" ? "frame_intro" : "line_address";
  if(p.address) out.push({...newGraphic(introId, introAt, project, brand), duration:3.4});

  if(dens.max>=4){
    // Facts land on the second half, on a strong event inside a mid shot.
    const mid = plan.shots[Math.floor(plan.shots.length*0.42)];
    if(mid && p.living_area_m2)
      out.push({...newGraphic(project.graphicFamily==="ARCHITECTURAL"?"dimension_area":"icon_spec",
        snapEvent(mid.start+0.5), project, brand)});
    const mid2 = plan.shots[Math.floor(plan.shots.length*0.66)];
    if(mid2 && (p.property_type||p.living_area_m2))
      out.push({...newGraphic("stack_facts", snapEvent(mid2.start+0.4), project, brand)});
  }
  if(dens.max>=5 && p.city){
    const s = plan.shots[Math.floor(plan.shots.length*0.22)];
    if(s) out.push({...newGraphic("rule_location", snapEvent(s.start+0.5), project, brand)});
  }
  if(dens.max>=8 && project.broker.name){
    const s = plan.shots[plan.shots.length-2];
    if(s) out.push({...newGraphic("broker_card", snapEvent(s.start+0.3), project, brand)});
  }
  // Outro: always the last thing, sized to the closing shot's breathing room.
  const last = plan.shots[plan.shots.length-1];
  const outroDur = Math.min(3.6, Math.max(2.0, last.duration));
  out.push({...newGraphic("quiet_outro", Math.max(0,total-outroDur), project, brand), duration:outroDur});

  return out.filter(g=>g.start+g.duration<=total+0.01 || (g.start=Math.max(0,total-g.duration))>=0);
}

/* ==========================================================================
   10. BRAND — versioned import, validated and normalised, stored per office.
   ========================================================================== */

const IMPORT_SCHEMAS = ["viewly.motion-import.v1","viewly.motion-import.v2"];

function normaliseImport(raw){
  const warn=[];
  if(!raw || typeof raw!=="object") throw new Error("Payloaden är inte ett objekt.");
  const schema = raw.schema || "viewly.motion-import.v2";
  if(!IMPORT_SCHEMAS.includes(schema)) warn.push(`Okänt schema "${schema}" — läser den som v2.`);

  const p = raw.property||{}, b = raw.broker||{}, br = raw.brand||{};
  const num = v => (v==null||v==="") ? null : (isNaN(+v)?null:+v);

  const property = {
    address: String(p.address||"").trim(),
    city: String(p.city||"").trim(),
    property_type: String(p.property_type||"").trim(),
    living_area_m2: num(p.living_area_m2),
    rooms: p.rooms!=null ? String(p.rooms) : ""
  };
  if(!property.address) warn.push("Adress saknas — intro-grafiken får ingen text.");
  if(property.living_area_m2==null) warn.push("Boarea saknas — faktagrafiken hoppas över.");
  if(p.asking_price!=null || p.viewing_time!=null)
    warn.push("Pris/visningstid ignorerades — de ingår inte i Motion-schemat.");

  const broker = {name:String(b.name||"").trim(), phone:String(b.phone||"").trim(), image_url:String(b.image_url||"").trim()};
  if(!broker.image_url && broker.name) warn.push("Mäklarbild saknas — Broker Card ritar en tom ring.");

  const id = br.brand_id || br.office_id || null;
  if(!id) warn.push("brand_id/office_id saknas — brandprofilen kan inte återanvändas mellan projekt.");

  const hex = v => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(v||"")) ? String(v) : null;
  const colors = {};
  for(const k of ["primary","secondary","accent","light","dark"]){
    const v = hex(br.colors?.[k]);
    if(br.colors?.[k] && !v) warn.push(`Färgen "${k}" är inte giltig hex och ignorerades.`);
    if(v) colors[k]=v;
  }
  const brand = id ? {
    brand_id:id, office_id:br.office_id||id,
    office_name:String(br.office_name||"Okänt kontor").trim(),
    logos:{primary:br.logos?.primary||"", light:br.logos?.light||"", dark:br.logos?.dark||""},
    typography:{
      display_family:String(br.typography?.display_family||"").trim(),
      body_family:String(br.typography?.body_family||"").trim(),
      allowed_weights:Array.isArray(br.typography?.allowed_weights)?br.typography.allowed_weights:[]
    },
    colors, importedAt:Date.now()
  } : null;
  if(brand && (brand.typography.display_family||brand.typography.body_family))
    warn.push("Brandfonter registrerade. De renderas när fontfilerna serveras — annars används fallback.");

  return {property, broker, brand, warnings:warn, schema};
}

const stepEnabled = (p,id)=>{

  if(id==="music") return p.images.some(i=>i.include);
  if(id==="brand") return true;
  if(["timing","camera","preflight"].includes(id)) return !!p.plan;
  if(id==="produce") return !!p.plan;
  if(id==="editor") return !!p.production;
  return false;
};

function goto(step){
  if(!stepEnabled(App.project, step)) return;
  Playback.stop();
  App.project.step=step; App.save(); render();
}

/* ==========================================================================
   13. PLAYBACK — one engine for the animatic, the editor and the exporter.
   ========================================================================== */

const Playback = {
  canvas:null, ctx:null, raf:null, t:0, playing:false, startWall:0, startT:0,
  src:null, gain:null, onFrame:null, showGraphics:true, useVideo:false, muted:false,

  ac(){ App.audio.ctx ||= new (window.AudioContext||window.webkitAudioContext)(); return App.audio.ctx; },
  attach(canvas,{onFrame,showGraphics=true}={}){
    this.canvas=canvas; this.ctx=canvas.getContext("2d");
    this.onFrame=onFrame; this.showGraphics=showGraphics; this.draw();
  },
  duration(){ const p=App.project; return p?.plan?.total || p?.music?.analysis?.duration || 0; },

  play(){
    const p=App.project; if(!p||this.playing) return;
    const dur=this.duration(); if(dur<=0) return;
    if(this.t>=dur-0.02) this.t=0;
    const ctxA=this.ac(); if(ctxA.state==="suspended") ctxA.resume();
    if(App.audio.buffer && !this.muted){
      this.src=ctxA.createBufferSource(); this.src.buffer=App.audio.buffer;
      this.gain=ctxA.createGain(); this.gain.gain.value=.9;
      this.src.connect(this.gain).connect(ctxA.destination);
      try{ this.src.start(0, this.t); }catch{}
    }
    this.playing=true; this.startWall=performance.now()/1000; this.startT=this.t;
    this.loop();
  },
  pause(){
    if(!this.playing) return;
    this.playing=false; try{this.src?.stop();}catch{} this.src=null;
    cancelAnimationFrame(this.raf); this.draw();
  },
  stop(){ this.pause(); this.t=0; },
  seek(t){ const was=this.playing; this.pause(); this.t=clamp(t,0,Math.max(this.duration()-.01,0));
    this.draw(); if(was) this.play(); },
  toggle(){ this.playing?this.pause():this.play(); },
  loop(){
    if(!this.playing) return;
    this.t = this.startT + (performance.now()/1000 - this.startWall);
    const d=this.duration();
    if(this.t>=d){ this.t=d; this.pause(); this.onFrame?.(this.t); return; }
    this.draw();
    this.raf=requestAnimationFrame(()=>this.loop());
  },
  shotAt(t){
    const plan=App.project?.plan; if(!plan) return null;
    for(const s of plan.shots) if(t>=s.start && t<s.end) return s;
    return plan.shots[plan.shots.length-1]||null;
  },
  draw(){
    if(!this.ctx) return;
    const p=App.project, W=this.canvas.width, H=this.canvas.height, ctx=this.ctx;
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
    const s=this.shotAt(this.t);
    if(s){
      const img=p.images.find(i=>i.id===s.imageId);
      const local=clamp((this.t-s.start)/Math.max(s.duration,.001),0,1);
      const intensity=(DIRECTIONS[p.direction]?.motionIntensity)||1;
      drawShot(ctx,W,H,img?.el,s.motion,local,{intensity});
    }
    if(this.showGraphics && p) drawGraphics(ctx,W,H,this.t,p,currentBrand(),{logo:App.logoImg,broker:App.brokerImg});
    this.onFrame?.(this.t);
  }
};
function currentBrand(){ return App.project?.brandId ? App.data.brands[App.project.brandId] : null; }

function reindex(){ App.project.images.forEach((im,i)=>im.order=i); }

async function addImages(files){
  const p=App.project;
  const imgs=files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length){ toast("Inga bildfiler hittades."); return; }
  App.snapshot("lägg till bilder");
  for(const f of imgs){
    const id="img_"+uid(), blobKey=`${p.id}/${id}`;
    await Blobs.put(blobKey,f);
    const url=URL.createObjectURL(f);
    const im={id, name:f.name.replace(/\.[a-z0-9]+$/i,""), blobKey, url, order:p.images.length,
      include:true, room:"ANNAT", importance:"NORMAL", motion:"SUBTLE_DRIFT",
      roomAuto:true, importanceAuto:true, lockDuration:false};
    im.el=await loadImg(url);
    p.images.push(im);
  }
  p.images.forEach((im,i)=>{
    if(im.roomAuto){ const g=guessRoom(im.name,i,p.images.length);
      im.room=g.room; im.roomConf=g.conf; im.roomWhy=g.why; im.motion=ROOMS[g.room].motion; }
    if(im.importanceAuto) im.importance=guessImportance(im.room,i,p.images.length);
    im.order=i;
  });
  App.replan(); render();
  toast(`${imgs.length} bild${imgs.length===1?"":"er"} tillagd${imgs.length===1?"":"a"}`);
}

/* Suggests a stronger sequence — hero first, strong close, detail shots spread
   out — but only ever as a proposal. The user's order is never changed silently. */
function suggestOrder(){
  const p=App.project;
  const inc=p.images.filter(i=>i.include);
  if(inc.length<3){ toast("För få bilder för ett förslag."); return; }
  const score=im=>{ let s=IMPORTANCE[im.importance].w*10;
    if(ROOMS[im.room]?.hero) s+=6; if(im.room==="DETALJ") s-=6; if(im.room==="HALL") s-=4;
    if(im.room==="VARDAGSRUM"||im.room==="KOK") s+=3; return s; };
  const sorted=[...inc].sort((a,b)=>score(b)-score(a));
  const open=sorted[0], close=sorted.find(x=>x!==open && ROOMS[x.room]?.hero) || sorted[1];
  const middle=inc.filter(x=>x!==open&&x!==close);
  const proposal=[open,...middle,close];
  const same = proposal.every((x,i)=>x.id===inc[i].id);
  if(same){ toast("Ordningen ser redan bra ut."); return; }
  const list=proposal.map((x,i)=>`${i+1}. ${x.name} (${ROOMS[x.room].sv})`).join("\n");
  if(!confirm(`Förslag på ordning:\n\n${list}\n\nTillämpa?`)) return;
  App.snapshot("föreslagen ordning");
  const rest=p.images.filter(i=>!i.include);
  p.images=[...proposal,...rest]; reindex(); App.replan(); render();
}

/* ==========================================================================
   16. STEP 3 — MUSIC
   The library is real: tracks live in IndexedDB, their analysis is persisted,
   and they are shared across every project. Style, energy and editability are
   first-class metadata because a beautiful track can still be a bad cut track.
   ========================================================================== */

const STYLES = ["QUIET LUXURY","MODERN EDITORIAL","WARM SCANDINAVIAN","ARCHITECTURAL",
  "CINEMATIC","UPBEAT PREMIUM","SOFT PIANO","AMBIENT ELECTRONIC"];

App.data.tracks ||= [];

function viewMusic(){
  const p=App.project;
  const w=work("Musik",
    "Musiken väljs före timingen — aldrig efter. Vid uppladdning körs en riktig analys: spektralflöde för onsets, autokorrelation för tempo, energinovelty för sektioner. Resultatet blir en event-karta som klipp, övergångar och grafik alla läser.",
    [nextBtn("Timing","timing", !!p.music?.analysis)]);
  const b=w.querySelector(".workbody");

  const dz=el(`<div class="dropzone" tabindex="0" role="button">
    <div style="font-size:13px;color:var(--text-2)">Släpp ett spår här för att lägga till det i biblioteket</div>
    <div style="margin-top:5px;font-size:11.5px">MP3, WAV, M4A · analysen körs lokalt i webbläsaren</div></div>`);
  const input=el(`<input type="file" accept="audio/*" multiple hidden>`);
  dz.onclick=()=>input.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add("hot");};
  dz.ondragleave=()=>dz.classList.remove("hot");
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("hot");addTracks([...e.dataTransfer.files]);};
  input.onchange=()=>addTracks([...input.files]);
  b.append(dz,input);

  if(!App.data.tracks.length){
    b.appendChild(el(`<div style="margin-top:18px" class="note info">
      <b>Biblioteket är tomt.</b> Kvalitet slår kvantitet — 20–40 riktigt bra spår räcker.
      Lägg till dem här en gång, så delas de mellan alla projekt. Varje spår analyseras
      och får ett <i>editability</i>-värde: hur väl det faktiskt går att klippa på.
    </div>`));

async function addTracks(files){
  const auds=files.filter(f=>/^audio\//.test(f.type)||/\.(mp3|wav|m4a|aac|ogg)$/i.test(f.name));
  if(!auds.length){ toast("Inga ljudfiler hittades."); return; }
  for(const f of auds){
    const id="trk_"+uid(), blobKey=`track/${id}`;
    await Blobs.put(blobKey,f);
    const t={id, blobKey, title:f.name.replace(/\.[a-z0-9]+$/i,""), style:STYLES[0],
      instrumentation:"", analysis:null, addedAt:Date.now()};
    App.data.tracks.push(t); Store.write(App.data);
    render(); toast(`Analyserar ${t.title}…`);
    try{
      const buf=await decodeBlob(f);
      t.analysis=analyseBuffer(buf);
      t.instrumentation = t.analysis.bpm<95 ? "Långsam · få transienter"
        : t.analysis.bpm<125 ? "Medeltempo · tydlig puls" : "Snabb · tät rytm";
      Store.write(App.data); render();
      toast(`${t.title}: ${fmt(t.analysis.bpm,0)} BPM · ${t.analysis.counts.strong} starka events`);
    }catch(err){
      toast(`Kunde inte avkoda ${t.title}. Filen kan vara skadad eller ett format webbläsaren inte stöder.`);
      App.data.tracks=App.data.tracks.filter(x=>x.id!==t.id); Store.write(App.data); render();
    }
  }
}
async function decodeBlob(blob){
  const ac=Playback.ac();
  const ab=await blob.arrayBuffer();
  return await ac.decodeAudioData(ab);
}

async function selectTrack(t){
  const p=App.project;
  if(!t.analysis){ toast("Spåret analyseras fortfarande."); return; }
  App.snapshot("välj musik");
  const blob=await Blobs.get(t.blobKey);
  p.music={trackId:t.id, blobKey:t.blobKey, title:t.title, style:t.style, analysis:t.analysis,
    url: blob?URL.createObjectURL(blob):null};
  App.audio.buffer = blob ? await decodeBlob(blob) : null;
  App.replan(); render();
  toast(`${t.title} vald — ${p.plan.alignedCuts} av ${p.plan.shots.length-1} klipp låg på musiken`);
}
async function previewTrack(t){
  const blob=await Blobs.get(t.blobKey); if(!blob) return;
  const ac=Playback.ac(); if(ac.state==="suspended") ac.resume();
  Playback.pause();
  if(App.previewSrc){ try{App.previewSrc.stop();}catch{} App.previewSrc=null; toast("Stoppad"); return; }
  const buf=await decodeBlob(blob);
  const s=ac.createBufferSource(); s.buffer=buf; s.connect(ac.destination);
  s.start(0, Math.min(buf.duration*0.18, 12));      // drop into the track, not the fade-in
  App.previewSrc=s; s.onended=()=>{App.previewSrc=null;};
  toast(`Spelar ${t.title}`);
}

/* Waveform + event markers. Beats are deliberately not drawn — a wall of
   ticks is visual noise; only events strong enough to be cut on are shown. */
function drawWave(cv, a, {events=true, cuts=null, playT=null}={}){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=cv.clientWidth||cv.parentElement.clientWidth||800, h=cv.height/ (cv._dpr||1) || 150;
  cv.width=w*dpr; cv.height=(cv.getAttribute("height")||150)*dpr; cv._dpr=dpr;
  const H=cv.height, W=cv.width, ctx=cv.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const mid=H*.52;
  ctx.fillStyle="#2C3438";
  const n=a.peaks.length, bw=W/n;
  for(let i=0;i<n;i++){ const p=a.peaks[i]*H*.40;
    ctx.fillRect(i*bw, mid-p, Math.max(bw*.8,1), p*2); }
  if(a.energyCurve?.length){
    ctx.strokeStyle="rgba(147,183,206,.45)"; ctx.lineWidth=1*dpr; ctx.beginPath();
    a.energyCurve.forEach((v,i)=>{ const x=i/(a.energyCurve.length-1)*W, y=H-6*dpr-v*H*.2;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
  }
  if(events){
    for(const e of a.events){
      if(e.type==="BEAT") continue;
      const x=e.t/a.duration*W;
      const strong=e.type==="SECTION_START", phrase=e.type==="PHRASE_ACCENT";
      ctx.fillStyle = strong?"#C2A25E" : phrase?"#93B7CE" : "rgba(139,149,153,.5)";
      const hh = strong?H*.9 : phrase?H*.46 : H*.2;
      ctx.fillRect(x, mid-hh/2, (strong?1.6:1)*dpr, hh);
    }
  }
  if(cuts){
    ctx.strokeStyle="#E9EBE7"; ctx.lineWidth=1*dpr; ctx.setLineDash([3*dpr,3*dpr]);
    for(const c of cuts){ const x=c/a.duration*W; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  if(playT!=null){ const x=playT/a.duration*W;
    ctx.fillStyle="#93B7CE"; ctx.fillRect(x-dpr/2,0,dpr,H); }
}

function previewSize(aspect, cap=720){

}

function applyImport(raw){
  const r=normaliseImport(raw);
  const p=App.project;
  App.snapshot("import");
  p.property={...p.property,...r.property};
  p.broker={...p.broker,...r.broker};
  if(r.brand){
    const ex=App.data.brands[r.brand.brand_id];
    App.data.brands[r.brand.brand_id]= ex ? {...ex,...r.brand, importedAt:ex.importedAt} : r.brand;
    p.brandId=r.brand.brand_id;
  }
  if(p.name==="Namnlöst objekt" && r.property.address) p.name=r.property.address;
  syncGraphicContent(); loadBrandAssets(); App.save(); render();
  toast(r.warnings.length ? `Importerad med ${r.warnings.length} anmärkning${r.warnings.length===1?"":"ar"}` : "Importerad");
  if(r.warnings.length){
    const m=el(`<div class="modal"><div class="modalbox">
      <div class="h-page">Importen gick igenom</div>
      <div class="stack" style="gap:8px">${r.warnings.map(x=>`<div class="note warn">${esc(x)}</div>`).join("")}</div>
      <div class="row"><div class="sp"></div><button class="btn primary">Förstått</button></div></div></div>`);
    m.querySelector("button").onclick=()=>m.remove(); m.onclick=e=>{if(e.target===m)m.remove();};
    document.body.appendChild(m);
  }
}
function syncGraphicContent(){
  const p=App.project, b=currentBrand();

/* The semantic request. The adapter that turns this into an MCP call lives
   server-side; nothing above this line knows a Higgsfield payload exists. */
function buildSpec(){
  const p=App.project, plan=p.plan;
  return {
    projectId:p.id, model:p.output.model, aspect:p.output.aspect,
    mode:p.output.mode, sound:p.output.sound, resolution:p.output.resolution,
    shots: plan.shots.map(s=>{
      const im=p.images.find(x=>x.id===s.imageId);
      return {
        shotId:s.shotId, index:s.index,
        imageRef:{ localId:im?.id, name:im?.name },   // server resolves to a media_id
        cameraMotion:s.motion, prompt:MOTIONS[s.motion].prompt,
        plannedDuration:s.duration, duration:billedSeconds(p.output.model,s.duration),
        trimTo:s.duration
      };
    })
  };
}
function showSpec(spec){
  const m=el(`<div class="modal"><div class="modalbox">
    <div class="h-page">Production spec</div>
    <p class="dim" style="font-size:12px;margin:0">Detta skickas till <code style="font-family:var(--mono);color:var(--sel)">POST /api/motion/production</code>.
    Servern laddar upp bilderna med <code style="font-family:var(--mono);color:var(--sel)">media_upload</code> och mappar varje shot till ett
    <code style="font-family:var(--mono);color:var(--sel)">generate_video_batch</code>-request.</p>
    <pre class="mono" style="font-size:10.5px;line-height:1.55;background:var(--sunken);padding:13px;border-radius:3px;overflow-x:auto;margin:0">${esc(JSON.stringify(spec,null,2))}</pre>
    <div class="row"><div class="sp"></div><button class="btn primary">Stäng</button></div></div></div>`);
  m.querySelector("button").onclick=()=>m.remove(); m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

let pollTimer=null;

async function startProduction(){
  const p=App.project, spec=buildSpec();
  const cost=await MotionAPI.cost(spec);
  try{
    const run=await MotionAPI.createProduction(spec);
    p.production={ id:run.productionId, spec, estimate:cost, snapshot:run, startedAt:Date.now() };
    App.save(); goto("produce"); pollProduction();
    toast(`${spec.shots.length} jobb skapade`);
  }catch(e){
    toast("Kunde inte starta produktionen: "+e.message);
  }
}
function pollProduction(){
  clearInterval(pollTimer);
  pollTimer=setInterval(async ()=>{
    const p=App.project;
    if(!p?.production){ clearInterval(pollTimer); return; }
    try{
      const run=await MotionAPI.getProduction(p.production.id);
      p.production.snapshot=run; App.save();
      if(App.project.step==="produce") renderJobs();
      if(run.status!=="running"){ clearInterval(pollTimer); if(App.project.step==="produce") render(); }
    }catch(e){ clearInterval(pollTimer); }
  }, 900);
}

function viewProduce(){
  const p=App.project;
  const run=p.production?.snapshot;
  const w=work("Produktion",
    "Varje shot är ett eget jobb. Ett misslyckat jobb blockerar inte filmen — du kör om just det.",

      <div class="credits" style="font-size:22px">${fmt(est.total,2)}</div>

  </div>`));
  b.appendChild(el(`<div class="joblist" id="joblist"></div>`));
  b.appendChild(el(`<div class="note info" style="margin-top:16px">
    <b>Vad som är mockat och vad som inte är det.</b> Jobbens livscykel, felfall, retry, kostnadsrapportering

    <code>generate_video_batch</code> + <code>jobs_wait</code> och returnerar <code>resultUrl</code> per jobb.
    Tills dess renderar editorn stillbilden med sin planerade kamerarörelse och märker varje shot SIMULERAD —
    hellre det än en påhittad videofil.</div>`));
  if(App.project.step==="produce") requestAnimationFrame(renderJobs);
