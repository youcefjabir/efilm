function renderJobs(){
  const host=document.getElementById("joblist"); if(!host) return;
  const p=App.project, run=p.production.snapshot;
  host.innerHTML="";
  run.jobs.forEach(j=>{
    const shot=p.production.spec.shots.find(s=>s.shotId===j.shotId);
    const im=p.images.find(x=>x.id===shot?.imageRef.localId);
    const st={queued:["","I kö"],generating:["run","Genererar"],completed:["ok","Klar"],failed:["crit","Misslyckades"]}[j.status];
    const row=el(`<div class="job">
      ${im?.url?`<img class="thumbmini" src="${im.url}" alt="">`:'<span class="thumbmini"></span>'}
      <span><span class="jt"><span class="jn">${String(j.index+1).padStart(2,"0")}</span>
        <b style="font-weight:500">${esc(im?.name||j.shotId)}</b></span>
        ${j.status==="failed"?`<div style="color:var(--crit);font-size:11px;margin-top:3px">${esc(j.error||"Okänt fel")}</div>`:""}
        ${j.status==="generating"?`<div class="prog" style="margin-top:6px"><i style="width:${Math.round((j.progress||0)*100)}%"></i></div>`:""}
      </span>
      <span class="row" style="gap:7px"><span class="dot ${st[0]}"></span><span style="color:var(--${
        j.status==="failed"?"crit":j.status==="completed"?"text-2":"muted"})">${st[1]}</span>
        ${j.retried?`<span class="faint" style="font-size:10.5px">(${j.retried}×)</span>`:""}</span>
      <span class="mono faint" style="font-size:11px">${MOTIONS[shot?.cameraMotion]?.label||""}</span>
      <span class="mono" style="font-size:11px">${shot?.duration||"—"} s</span>
      <span class="row" style="gap:8px;justify-content:flex-end">
        ${j.actualCredits!=null?`<span class="credits" style="font-size:11.5px">${fmt(j.actualCredits,2)}</span>`:'<span class="faint mono" style="font-size:11px">—</span>'}
        ${j.status==="failed"?'<button class="btn xs" data-a="retry">Kör om</button>':""}
        ${j.status==="completed"?'<button class="btn xs" data-a="view">Visa</button>':""}
      </span></div>`);
    row.querySelector("[data-a=retry]")?.addEventListener("click", async ()=>{
      const run2=await MotionAPI.retryShot(p.production.id, j.shotId);
      p.production.snapshot=run2; App.save(); renderJobs(); pollProduction();
      toast(`Kör om shot ${j.index+1}`);
    });
    row.querySelector("[data-a=view]")?.addEventListener("click", ()=>showShot(j, shot, im));
    host.appendChild(row);
  });
}

/* Nothing is ever hidden: if a shot is completed, its output is inspectable. */
function showShot(job, shot, im){
  const p=App.project;
  const [cw,ch]=previewSize(p.output.aspect, 560);
  const m=el(`<div class="modal"><div class="modalbox" style="width:min(720px,100%)">
    <div class="row"><div><div class="h-page">Shot ${String(job.index+1).padStart(2,"0")}</div>
      <div class="dim" style="font-size:12px;margin-top:4px">${esc(im?.name||"")} · ${MOTIONS[shot.cameraMotion].label}</div></div>
      <div class="sp"></div>${job.simulated?'<span class="chip" style="color:var(--warn);border-color:var(--warn)">Simulerad</span>':""}</div>
    <div style="display:grid;place-items:center;background:var(--sunken);padding:14px;border-radius:3px">
      ${job.resultUrl
        ? `<video src="${esc(job.resultUrl)}" controls autoplay loop style="max-width:100%;max-height:52vh"></video>`
        : `<canvas width="${cw}" height="${ch}" style="max-width:100%;max-height:52vh;border:1px solid var(--line)"></canvas>`}
    </div>
    <dl class="kv"><dt>Job</dt><dd>${esc(job.jobId)}</dd>
      <dt>Prompt</dt><dd>"${esc(shot.prompt)}"</dd>
      <dt>Planerad längd</dt><dd>${fmt(shot.plannedDuration)} s</dd>
      <dt>Genererad längd</dt><dd>${shot.duration} s</dd>
      <dt>Debiterat</dt><dd style="color:var(--money)">${job.actualCredits!=null?fmt(job.actualCredits,2)+" credits":"—"}</dd></dl>
    ${job.resultUrl?"":'<div class="note warn" style="font-size:11.5px">Ingen videofil ännu — backend-routen är inte kopplad. Detta är stillbilden animerad med den planerade rörelsen, inte Kling-output.</div>'}
    <div class="row"><div class="sp"></div><button class="btn primary" data-a="close">Stäng</button></div>
  </div></div>`);
  m.querySelector("[data-a=close]").onclick=()=>{ cancelAnimationFrame(raf); m.remove(); };
  m.onclick=e=>{ if(e.target===m){ cancelAnimationFrame(raf); m.remove(); } };
  document.body.appendChild(m);
  let raf;
  const cv=m.querySelector("canvas");
  if(cv){
    const ctx=cv.getContext("2d"); const t0=performance.now();
    const loop=()=>{ const t=((performance.now()-t0)/1000 % shot.plannedDuration)/shot.plannedDuration;
      drawShot(ctx,cv.width,cv.height,im?.el,shot.cameraMotion,t,
        {intensity:DIRECTIONS[p.direction].motionIntensity});
      raf=requestAnimationFrame(loop); };
    loop();
  }
}

function drawGfxThumb(cv, id){
  const p=App.project, brand=currentBrand();
  const ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  const fake={...p, graphics:[{...newGraphic(id,0,p,brand), scale:0.42,
    anchor:defaultAnchor(id)==="CENTER"?"CENTER":"MIDDLE_LEFT", dx:0, dy:0}]};
  const anim=()=>{
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#0A0D0F"; ctx.fillRect(0,0,W,H);
    const t=(performance.now()/1000 % 4);
    drawGraphics(ctx,W,H,clamp(t,0,3.2),fake,brand,{logo:App.logoImg,broker:App.brokerImg});
    if(cv.isConnected) requestAnimationFrame(anim);
  };
  anim();
}

function addGraphic(componentId){
  const p=App.project;
  App.snapshot("lägg till grafik");
  let t=Playback.t;
  if(App.snapOn && p.music?.analysis) t=snapToEvent(t);
  const g=newGraphic(componentId,clamp(t,0,Math.max(p.plan.total-0.5,0)),p,currentBrand());
  g.duration=Math.min(g.duration, p.plan.total-g.start);
  p.graphics.push(g); App.sel.graphic=g.id; App.sel.shot=null;
  App.save(); render();
}
function snapToEvent(t, win=0.45){
  const a=App.project.music?.analysis; if(!a) return t;
  const c=a.events.filter(e=>Math.abs(e.t-t)<=win && e.strength>=.38);
  if(!c.length) return t;
  return c.reduce((x,y)=> Math.abs(y.t-t)<Math.abs(x.t-t)?y:x).t;
}

/* ---- timeline ------------------------------------------------------------ */
function timeline(){
  const p=App.project, plan=p.plan, a=p.music?.analysis;
  const W=Math.max(plan.total*TL.pxs, 200);
  const box=el(`<div style="width:${W}px;position:relative;height:100%">
    <div class="tlruler"></div>
    <div class="tltrack" data-t="video"></div>
    <div class="tltrack" data-t="gfx"></div>
    <div class="tltrack" data-t="music"></div>
    <div class="tlplay" style="left:${Playback.t*TL.pxs}px"></div>
  </div>`);

  const ruler=box.querySelector(".tlruler");
  const stepSec = TL.pxs>110?0.5 : TL.pxs>52?1 : TL.pxs>26?2 : 5;
  for(let t=0;t<=plan.total;t+=stepSec)
    ruler.appendChild(el(`<div class="tk" style="left:${t*TL.pxs}px">${t%1===0?t:fmt(t,1)}</div>`));
  ruler.onclick=e=>{ const r=ruler.getBoundingClientRect(); Playback.seek((e.clientX-r.left)/TL.pxs); render(); };

  // video track
  const vt=box.querySelector('[data-t=video]');
  plan.shots.forEach(s=>{
    const im=p.images.find(x=>x.id===s.imageId);
    const c=el(`<div class="clip" data-sel="${App.sel.shot===s.shotId}"
      style="left:${s.start*TL.pxs}px;width:${Math.max(s.duration*TL.pxs-2,3)}px">
      ${im?.url?`<img src="${im.url}" alt="">`:""}
      <span class="cl"><span>${String(s.index+1).padStart(2,"0")}</span>
      <span>${fmt(s.duration,2)}s</span></span>
      <span class="hnd r"></span></div>`);
    c.onclick=e=>{ if(e.target.classList.contains("hnd")) return;
      App.sel.shot=s.shotId; App.sel.graphic=null; Playback.seek(s.start); render(); };
    c.querySelector(".hnd.r").onpointerdown=e=>startShotTrim(e,s);
    vt.appendChild(c);
  });

  // graphics track
  const gt=box.querySelector('[data-t=gfx]');
  p.graphics.forEach(g=>{
    const comp=GFX[g.componentId];
    const c=el(`<div class="clip gfx" data-sel="${App.sel.graphic===g.id}"
      style="left:${g.start*TL.pxs}px;width:${Math.max(g.duration*TL.pxs-2,8)}px">
      <span class="cl"><span>${esc(comp?.name||g.componentId)}</span><span>${fmt(g.duration,1)}s</span></span>
      <span class="hnd l"></span><span class="hnd r"></span></div>`);
    c.onpointerdown=e=>{
      App.sel.graphic=g.id; App.sel.shot=null;
      if(e.target.classList.contains("hnd")) startGfxTrim(e,g,e.target.classList.contains("l")?"l":"r");
      else startGfxMove(e,g);
    };
    gt.appendChild(c);
  });

  // music track
  const mt=box.querySelector('[data-t=music]');
  if(a){
    const cv=el(`<canvas style="position:absolute;inset:4px 0;width:${W}px;height:44px"></canvas>`);
    mt.appendChild(cv);
    requestAnimationFrame(()=>{
      const dpr=Math.min(devicePixelRatio||1,2);
      cv.width=W*dpr; cv.height=44*dpr;
      const ctx=cv.getContext("2d"), H=cv.height;
      ctx.fillStyle="#2C3438";
      const n=Math.min(a.peaks.length, Math.round(W/1.5));
      for(let i=0;i<n;i++){
        const t=i/n*plan.total; if(t>a.duration) break;
        const pk=a.peaks[Math.floor(t/a.duration*a.peaks.length)]||0;
        const x=t*TL.pxs*dpr, hh=pk*H*.42;
        ctx.fillRect(x,H/2-hh,Math.max(dpr,1),hh*2);
      }
      for(const e of a.events){
        if(e.strength<.6||e.type==="BEAT") continue;
        if(e.t>plan.total) break;
        ctx.fillStyle = e.type==="SECTION_START"?"#C2A25E":"rgba(147,183,206,.7)";
        ctx.fillRect(e.t*TL.pxs*dpr, H*.62, dpr, H*.38);
      }
    });
  } else mt.appendChild(el(`<div class="empty" style="padding:14px 12px;text-align:left">Ingen musik vald.</div>`));
  return box;
}

function startGfxMove(e,g){
  e.preventDefault();
  const p=App.project, x0=e.clientX, s0=g.start;
  App.snapshot("flytta grafik");
  const move=ev=>{
    let t=s0+(ev.clientX-x0)/TL.pxs;
    if(App.snapOn) t=snapToEvent(t,0.3);
    g.start=clamp(+t.toFixed(3),0,Math.max(p.plan.total-g.duration,0));
    const c=ev.target.closest(".clip")||document.querySelector('.clip.gfx[data-sel=true]');
    if(c) c.style.left=(g.start*TL.pxs)+"px";
    Playback.draw();
  };
  const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
    App.save(); render(); };
  document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
}
function startGfxTrim(e,g,side){
  e.preventDefault(); e.stopPropagation();
  const p=App.project, x0=e.clientX, s0=g.start, d0=g.duration;
  App.snapshot("trimma grafik");
  const move=ev=>{
    const dx=(ev.clientX-x0)/TL.pxs;
    if(side==="r") g.duration=clamp(+(d0+dx).toFixed(3), g.enter+g.exit+0.3, p.plan.total-g.start);
    else { const ns=clamp(+(s0+dx).toFixed(3),0,s0+d0-(g.enter+g.exit+0.3));
      g.duration=+(d0+(s0-ns)).toFixed(3); g.start=ns; }
    Playback.draw();
  };
  const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
    App.save(); render(); };
  document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
}
/* Trimming a shot ripples the rest of the film — the timeline stays contiguous
   and the graphics keep their absolute positions against the music. */
function startShotTrim(e,s){
  e.preventDefault(); e.stopPropagation();
  const p=App.project, x0=e.clientX, d0=s.duration;
  App.snapshot("trimma shot");
  const move=ev=>{
    let d=clamp(+(d0+(ev.clientX-x0)/TL.pxs).toFixed(3), 1.0, 15);
    if(App.snapOn && p.music?.analysis){
      const snapped=snapToEvent(s.start+d,0.35); d=+(snapped-s.start).toFixed(3);
      d=clamp(d,1.0,15);
    }
    s.duration=d; rippleShots();
    const c=document.querySelector(`.clip[data-sel="true"]`);
    if(c) c.style.width=Math.max(d*TL.pxs-2,3)+"px";
    Playback.draw();
  };
  const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
    App.save(); render(); };
  document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
}
function rippleShots(){
  const plan=App.project.plan; let t=0;
  plan.shots.forEach(s=>{ s.start=+t.toFixed(3); s.end=+(t+s.duration).toFixed(3); t=s.end; });
  plan.total=+t.toFixed(3);
}

/* ==========================================================================
   23. RENDER / EXPORT
   The render spec is the durable artefact — a server-side renderer replays
   exactly these draw calls. In the browser we also record the real canvas,
   so what you export is literally what you previewed.
   ========================================================================== */

function buildRenderSpec(){
  const p=App.project, plan=p.plan;
  const [W,H]=ASPECTS[p.output.aspect];
  return {
    schema:"viewly.motion.render.v1", projectId:p.id,
    output:{width:W,height:H,fps:30,duration:plan.total,aspect:p.output.aspect},
    audio: p.music ? {trackId:p.music.trackId, title:p.music.title, offset:0} : null,
    video: plan.shots.map(s=>({shotId:s.shotId, start:s.start, duration:s.duration,
      source:{kind: p.production?.snapshot?.jobs.find(j=>j.shotId===s.shotId)?.resultUrl ? "generated":"still",
        url: p.production?.snapshot?.jobs.find(j=>j.shotId===s.shotId)?.resultUrl || null,
        imageId:s.imageId},
      cameraMotion:s.motion, trimIn:s.trimIn||0})),
    graphics: p.graphics.map(g=>({...g})),
    brand:{brandId:p.brandId, lock:p.brandLock, family:p.graphicFamily, density:p.graphicDensity}
  };
}

async function exportRender(){
  const p=App.project, spec=buildRenderSpec();
  const m=el(`<div class="modal"><div class="modalbox">
    <div class="h-page">Exportera</div>
    <div class="row" style="gap:8px">
      <button class="btn primary" data-a="rec">Rendera i webbläsaren</button>
      <button class="btn" data-a="spec">Visa render spec</button>
    </div>
    <div class="note info" style="font-size:11.5px">Renderingen ritar exakt samma anrop som previewen —
    samma koordinater, typsnitt, easing och radbrytningar — och spelar in canvasen plus musiken till en WebM-fil.
    För leverans i H.264 kör samma <code>render spec</code> server-side.
    Nedladdningslänken fungerar på en egen domän; i en sandboxad förhandsvisning blockerar
    webbläsaren nedladdningar, men filen går att spela upp direkt här.</div>
    <div data-r="status" class="mono" style="font-size:11.5px;color:var(--muted)"></div>
    <div class="row"><div class="sp"></div><button class="btn ghost" data-a="close">Stäng</button></div>
  </div></div>`);
  m.querySelector("[data-a=close]").onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove();};
  m.querySelector("[data-a=spec]").onclick=()=>{ m.remove(); showSpec(spec); };
  m.querySelector("[data-a=rec]").onclick=()=>recordFilm(m.querySelector("[data-r=status]"));
  document.body.appendChild(m);
}

async function recordFilm(status){
  const p=App.project, plan=p.plan;
  const [W,H]=previewSize(p.output.aspect, 1080);
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");
  const fps=30, brand=currentBrand();
  const stream=cv.captureStream(fps);
  const ac=Playback.ac();
  let srcNode=null;
  if(App.audio.buffer){
    const dest=ac.createMediaStreamDestination();
    srcNode=ac.createBufferSource(); srcNode.buffer=App.audio.buffer;
    srcNode.connect(dest); srcNode.connect(ac.destination);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }
  const mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"]
    .find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){ status.textContent="Webbläsaren stöder inte MediaRecorder."; return; }
  const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:9_000_000});
  const chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    status.innerHTML=`Klar · ${(blob.size/1e6).toFixed(1)} MB`;
    const a=document.createElement("a");
    a.href=url; a.download=`${(p.property.address||p.name).replace(/\s+/g,"-").toLowerCase()}-motion.webm`;
    a.textContent="Ladda ner filmen"; a.className="btn primary"; a.style.marginTop="8px";
    a.style.display="inline-flex"; a.style.textDecoration="none";
    status.appendChild(document.createElement("br")); status.appendChild(a);
    const v=document.createElement("video"); v.src=url; v.controls=true;
    v.style.cssText="width:100%;margin-top:10px;border:1px solid var(--line);border-radius:3px";
    status.appendChild(v);
  };

  status.textContent="Renderar…";
  rec.start();
  try{ srcNode?.start(); }catch{}
  const t0=performance.now();
  const frame=()=>{
    const t=(performance.now()-t0)/1000;
    if(t>=plan.total){ rec.stop(); try{srcNode?.stop();}catch{} return; }
    const s=plan.shots.find(x=>t>=x.start&&t<x.end) || plan.shots[plan.shots.length-1];
    const im=p.images.find(i=>i.id===s.imageId);
    drawShot(ctx,W,H,im?.el,s.motion,clamp((t-s.start)/s.duration,0,1),
      {intensity:DIRECTIONS[p.direction].motionIntensity});
    drawGraphics(ctx,W,H,t,p,brand,{logo:App.logoImg,broker:App.brokerImg});
    status.textContent=`Renderar… ${Math.round(t/plan.total*100)} %`;
    requestAnimationFrame(frame);
  };
  frame();
}

document.addEventListener("keydown",e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  if(e.code==="Space" && App.project && ["timing","editor"].includes(App.project.step)){
    e.preventDefault(); Playback.toggle(); }
  if((e.metaKey||e.ctrlKey) && e.key==="z"){ e.preventDefault();
    e.shiftKey ? App.restore(App.redo,App.undo) : App.restore(App.undo,App.redo); }
});
window.addEventListener("resize",()=>{ if(App.view!=="projects") render(); });

(async function boot(){
  App.data.tracks ||= [];
  App.data.brands ||= {};

  // Auto-discover and load music files from /music/ folder
  try {
    const manifest = [
      { name: "Luxury Real Estate 1", file: "f38fa16a-andriihluxuryrealestatemusic575826.mp3" },
      { name: "Luxury Real Estate 2", file: "1a938918-andriihluxuryrealestatemusic580081.mp3" },
      { name: "Real Estate Beats", file: "e888a811-apalonbeatsrealestateluxurymusic540589.mp3" },
      { name: "Piano Luxe 1", file: "d0713554-leberchpiano580522.mp3" },
      { name: "Piano Luxe 2", file: "9171c754-maksymmalkopianopianomusic594917.mp3" }
    ];

    for (const meta of manifest) {
      const exists = App.data.tracks.some(t => t.title === meta.name);
      if (!exists) {
        try {
          const resp = await fetch(`./music/${meta.file}`);
          if (resp.ok) {
            const blob = await resp.blob();
            const id = "trk_" + uid();
            const blobKey = `track/${id}`;
            await Blobs.put(blobKey, blob);

            const t = {
              id, blobKey, title: meta.name, style: STYLES[0],
              instrumentation: "", analysis: null, addedAt: Date.now()
            };
            App.data.tracks.push(t);

            // Analyze in background
            decodeBlob(blob).then(buf => {
              t.analysis = analyseBuffer(buf);
              t.instrumentation = t.analysis.bpm < 95 ? "Långsam · få transienter"
                : t.analysis.bpm < 125 ? "Medeltempo · tydlig puls" : "Snabb · tät rytm";
              Store.write(App.data);
            }).catch(err => console.error("Music analysis failed:", meta.name, err));
          }
        } catch (err) {
          console.error("Music load error:", meta.name, err);
        }
      }
    }
    Store.write(App.data);
  } catch (err) {
    console.error("Music discovery error:", err);
  }

  render();
})();
</script>
